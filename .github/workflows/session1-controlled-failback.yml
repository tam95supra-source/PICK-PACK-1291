name: Session1 Controlled Failback
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session1-failback-trigger.txt]
permissions:
  contents: read
concurrency:
  group: session1-controlled-failback
  cancel-in-progress: false
env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  D1_NAME: pick-pack-1291-service-prod
  GENERATION: m2-prod-20260819-001
jobs:
  failback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner lock, secrets and derived recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'confirmation=OWNER_LOCKED_M2_FAILBACK' ops/session1-failback-trigger.txt
          grep -qx 'expected_service_epoch=6' ops/session1-failback-trigger.txt
          grep -qx 'expected_fallback_epoch=7' ops/session1-failback-trigger.txt
          grep -qx 'expected_pending=3' ops/session1-failback-trigger.txt
          grep -qx 'target_epoch=8' ops/session1-failback-trigger.txt
          grep -qx 'stable=FORBIDDEN' ops/session1-failback-trigger.txt
          grep -qx 'merge_pr38=FORBIDDEN' ops/session1-failback-trigger.txt
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_STORE_PASSWORD; do [[ -n "${!v:-}" ]] || { echo "MISSING:$v"; exit 1; }; done
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$ADMIN"
          echo "BRIDGE=$BRIDGE" >> "$GITHUB_ENV"; echo "ADMIN=$ADMIN" >> "$GITHUB_ENV"
          RESP=$(curl -fsS --max-time 25 https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP"); [[ -n "$TOKEN" ]] || exit 1; echo "::add-mask::$TOKEN"; echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Strict pre-recovery topology and data checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$SERVICE_URL/health" >/tmp/h.json
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$SERVICE_URL/v1/capabilities" >/tmp/c.json
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$SERVICE_URL/v1/authority" >/tmp/a.json
          node -e 'const h=require("/tmp/h.json"),c=require("/tmp/c.json"),j=require("/tmp/a.json"),a=j.authority||j;if(!h.ok||h.environment!=="production"||h.generation!==process.env.GENERATION||String(h.replication?.state||"").toUpperCase()==="FAILED"||!c.ok||Number(c.business_window)!==7||!c.mutation_batch||!c.import_engine||!j.ok||a.mode!=="SERVICE_PRIMARY"||Number(a.authority_epoch)!==6||a.scope!=="PRODUCTION"||a.service_generation!==process.env.GENERATION)throw new Error("SERVICE_PRE_RECOVERY_UNEXPECTED");console.log("SERVICE_PRE="+JSON.stringify({authority:{mode:a.mode,epoch:a.authority_epoch,seq:a.authority_seq},replication:h.replication}))'
          OK=0; for i in $(seq 1 8); do : >/tmp/g.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/g.json || true; if node -e 'try{const j=require("/tmp/g.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&j.service_generation===process.env.GENERATION&&j.service_url===process.env.SERVICE_URL?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 2; done; [[ "$OK" == 1 ]] || { echo GAS_PRE_RECOVERY_UNEXPECTED; exit 1; }
          node -e 'const j=require("/tmp/g.json"),a=j.authority||{};console.log("GAS_PRE="+JSON.stringify({mode:j.authority_mode,epoch:a.authority_epoch,seq:a.authority_seq,generation:j.service_generation,url:j.service_url}))'
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")'); curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/f.json
          node -e 'const rows=(require("/tmp/f.json").values||[]).slice(1),p=rows.filter(r=>Number(r[1])===7&&String(r[12]||"")==="PENDING"),seq=p.map(r=>Number(r[2]));if(p.length!==3||JSON.stringify(seq)!==JSON.stringify([1,2,3]))throw new Error("FALLBACK_PRE_RECOVERY_UNEXPECTED");console.log("FALLBACK_PRE="+JSON.stringify({pending:p.length,seq}))'
      - name: Deploy bridge-secret adapter for existing GAS recovery state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/session1_patch_gas_internal_recovery.py
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/live.json
          node -e 'const fs=require("fs"),j=require("/tmp/live.json"),files=j.files||[],map={SERVICE_MIGRATION_M2:fs.readFileSync("google-apps-script/SERVICE_MIGRATION_M2.gs","utf8"),PICK_PACK_API:fs.readFileSync("google-apps-script/PICK_PACK_API.gs","utf8")};for(const f of files)if(f.type==="SERVER_JS"&&map[f.name])f.source=map[f.name];for(const k of Object.keys(map))if(!files.some(f=>f.name===k))throw new Error("LIVE_GAS_FILE_MISSING:"+k);fs.writeFileSync("/tmp/patched.json",JSON.stringify({files}))'
          [[ "$(curl -sS --max-time 25 -o /tmp/put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patched.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")" == 200 ]] || exit 1
          [[ "$(curl -sS --max-time 25 -o /tmp/ver.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Session1 fenced M2 recovery adapter"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")" == 200 ]] || exit 1
          V=$(node -e 'const j=require("/tmp/ver.json");process.stdout.write(String(j.versionNumber||""))'); [[ -n "$V" ]] || exit 1
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/deploy.json",JSON.stringify({deploymentConfig:{scriptId:process.argv[1],versionNumber:Number(process.argv[2]),manifestFileName:"appsscript",description:"Session1 fenced M2 recovery adapter"}}))' "$SCRIPT_ID" "$V"
          [[ "$(curl -sS --max-time 25 -o /tmp/dep.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")" == 200 ]] || exit 1
          OK=0; for i in $(seq 1 15); do : >/tmp/s.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_status\",\"_bridge_secret\":\"$BRIDGE\"}" >/tmp/s.json || true; if node -e 'try{const j=require("/tmp/s.json");process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(j.authority_epoch)===7&&Number(j.pending)===3?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 3; done; [[ "$OK" == 1 ]] || { echo INTERNAL_RECOVERY_ADAPTER_NOT_READY; exit 1; }
          node -e 'const j=require("/tmp/s.json");console.log("RECOVERY_ADAPTER="+JSON.stringify({mode:j.authority_mode,epoch:j.authority_epoch,pending:j.pending,ingested:j.ingested}))'
      - name: Reconcile begin and flush, auto-revert if flush cannot account all events
        shell: bash
        run: |
          set -euo pipefail
          revert(){ curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_revert\",\"_bridge_secret\":\"$BRIDGE\",\"confirmation\":\"OWNER_LOCKED_M2_FAILBACK\"}" || true; }
          trap revert ERR
          curl -fsSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_begin\",\"_bridge_secret\":\"$BRIDGE\",\"confirmation\":\"OWNER_LOCKED_M2_FAILBACK\"}" >/tmp/begin.json
          node -e 'const j=require("/tmp/begin.json");if(!j.ok||j.authority_mode!=="RECONCILING"||Number(j.authority_epoch)!==7||Number(j.fallback_seq)!==3)throw new Error("RECONCILE_BEGIN_FAILED");console.log("RECONCILE_BEGIN="+JSON.stringify(j))'
          OK=0; for i in $(seq 1 6); do curl -sSL --max-time 40 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_flush\",\"_bridge_secret\":\"$BRIDGE\"}" >/tmp/flush.json || true; if node -e 'try{const j=require("/tmp/flush.json");process.exit(j.ok&&Number(j.authority_epoch)===7&&Number(j.pending)===0?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 3; done; [[ "$OK" == 1 ]] || { echo RECONCILE_FLUSH_INCOMPLETE; exit 1; }
          trap - ERR
          node -e 'const j=require("/tmp/flush.json");console.log("RECONCILE_FLUSH="+JSON.stringify(j))'
      - name: Verify Service inbox then replay epoch 7 and promote Service to epoch 8
        shell: bash
        run: |
          set -euo pipefail
          cd service
          npm install --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json); ID=$(node -e 'const a=JSON.parse(process.argv[1]),x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST"); [[ -n "$ID" ]] || exit 1; export ID
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8").replace("__M1_D1_DATABASE_ID__",process.env.ID).replace("\"database_name\": \"pick-pack-1291-m1-staging\"",`\"database_name\": \"${process.env.D1_NAME}\"`);fs.writeFileSync("wrangler.recovery.jsonc",s)'
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.recovery.jsonc --command "SELECT COUNT(*) n FROM fallback_event_inbox WHERE authority_epoch=7; SELECT ingest_status,COUNT(*) n FROM fallback_event_inbox WHERE authority_epoch=7 GROUP BY ingest_status;" --json >/tmp/inbox.json
          node -e 'const x=require("/tmp/inbox.json"),r=x.flatMap(g=>g.results||[]),n=r.find(v=>Object.hasOwn(v,"n")&&!v.ingest_status),p=r.find(v=>v.ingest_status==="PENDING");if(Number(n?.n)!==3||Number(p?.n)!==3)throw new Error("SERVICE_INBOX_NOT_EXACT_3_PENDING");console.log("SERVICE_INBOX_PRE_REPLAY="+JSON.stringify({total:n.n,pending:p.n}))'
          cd ..
          HTTP=$(curl -sS --max-time 90 -o /tmp/failback.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-m1-admin-token: $ADMIN" "$SERVICE_URL/internal/recovery/failback" -d '{"fallback_epoch":7,"expected_service_epoch":6,"confirmation":"OWNER_LOCKED_M2_FAILBACK","initiated_by":"SESSION1_CONTROLLED_FAILBACK"}' || true)
          if [[ "$HTTP" =~ ^2 ]]; then
            node -e 'const j=require("/tmp/failback.json");if(!j.ok)throw new Error("FAILBACK_BODY_NOT_OK");console.log("SERVICE_FAILBACK="+JSON.stringify(j))'
          else
            echo "FAILBACK_HTTP=$HTTP inspecting bounded resume state"
            curl -fsS --max-time 25 "$SERVICE_URL/v1/authority" >/tmp/after-fail.json
            STATE=$(node -e 'const j=require("/tmp/after-fail.json"),a=j.authority||j;if(a.mode==="RECONCILING"&&Number(a.authority_epoch)===7)process.stdout.write("RESUME");else if(a.mode==="SERVICE_PRIMARY"&&Number(a.authority_epoch)===6)process.stdout.write("REVERT");else process.stdout.write("STOP")')
            if [[ "$STATE" == RESUME ]]; then
              curl -fsS --max-time 90 -X POST -H 'content-type: application/json' -H "x-m1-admin-token: $ADMIN" "$SERVICE_URL/internal/recovery/failback-resume" -d '{"fallback_epoch":7,"confirmation":"OWNER_LOCKED_M2_FAILBACK_RESUME","initiated_by":"SESSION1_CONTROLLED_FAILBACK_RESUME"}' >/tmp/resume.json
              node -e 'const j=require("/tmp/resume.json");if(!j.ok)throw new Error("FAILBACK_RESUME_FAILED");console.log("SERVICE_FAILBACK_RESUME="+JSON.stringify(j))'
            elif [[ "$STATE" == REVERT ]]; then
              curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_revert\",\"_bridge_secret\":\"$BRIDGE\",\"confirmation\":\"OWNER_LOCKED_M2_FAILBACK\"}" >/tmp/revert.json || true
              echo SERVICE_FAILBACK_FAILED_BEFORE_D1_TRANSITION_REVERTED_GAS
              cat /tmp/failback.json
              exit 1
            else
              echo SERVICE_FAILBACK_UNEXPECTED_STATE
              cat /tmp/after-fail.json
              exit 1
            fi
          fi
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$SERVICE_URL/v1/authority" >/tmp/sa.json
          node -e 'const j=require("/tmp/sa.json"),a=j.authority||j;if(!j.ok||a.mode!=="SERVICE_PRIMARY"||Number(a.authority_epoch)!==8||a.scope!=="PRODUCTION"||a.service_generation!==process.env.GENERATION)throw new Error("SERVICE_NOT_PRIMARY_EPOCH8");console.log("SERVICE_AFTER_REPLAY="+JSON.stringify({mode:a.mode,epoch:a.authority_epoch,seq:a.authority_seq,generation:a.service_generation}))'
      - name: Complete GAS failback to Service Primary epoch 8
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(node -e 'process.stdout.write(JSON.stringify({action:"m2_internal_reconcile_complete",_bridge_secret:process.env.BRIDGE,confirmation:"OWNER_LOCKED_M2_FAILBACK",authority_epoch:8,service_generation:process.env.GENERATION,service_url:process.env.SERVICE_URL}))')
          OK=0; for i in $(seq 1 8); do : >/tmp/complete.json; curl -sSL --max-time 30 -H 'content-type: application/json' "$GAS_URL" -d "$BODY" >/tmp/complete.json || true; if node -e 'try{const j=require("/tmp/complete.json");process.exit(j.ok&&j.authority_mode==="SERVICE_PRIMARY"&&Number(j.authority_epoch)===8?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 3; done; [[ "$OK" == 1 ]] || { echo GAS_FAILBACK_COMPLETE_FAILED_AFTER_SERVICE_PROMOTION; cat /tmp/complete.json; exit 1; }
          node -e 'const j=require("/tmp/complete.json");console.log("GAS_COMPLETE="+JSON.stringify({mode:j.authority_mode,epoch:j.authority_epoch,generation:j.service_generation,url:j.service_url}))'
      - name: Final convergence proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$SERVICE_URL/v1/authority" >/tmp/a8.json
          OK=0; for i in $(seq 1 8); do : >/tmp/g8.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/g8.json || true; if node -e 'try{const j=require("/tmp/g8.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="SERVICE_PRIMARY"&&Number(a.authority_epoch)===8&&j.service_generation===process.env.GENERATION&&j.service_url===process.env.SERVICE_URL?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 2; done; [[ "$OK" == 1 ]] || exit 1
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")'); curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/f8.json
          node -e 'const s=require("/tmp/a8.json"),sa=s.authority||s,g=require("/tmp/g8.json"),ga=g.authority||{},rows=(require("/tmp/f8.json").values||[]).slice(1),p=rows.filter(r=>Number(r[1])===7&&String(r[12]||"")==="PENDING"),ing=rows.filter(r=>Number(r[1])===7&&String(r[12]||"")==="INGESTED");if(sa.mode!=="SERVICE_PRIMARY"||Number(sa.authority_epoch)!==8||g.authority_mode!=="SERVICE_PRIMARY"||Number(ga.authority_epoch)!==8||p.length!==0||ing.length!==3)throw new Error("FINAL_CONVERGENCE_FAILED");console.log("FINAL_CONVERGENCE="+JSON.stringify({service:{mode:sa.mode,epoch:sa.authority_epoch,seq:sa.authority_seq},gas:{mode:g.authority_mode,epoch:ga.authority_epoch,seq:ga.authority_seq},fallback:{pending:p.length,ingested:ing.length}}))'
          echo SESSION1_CONTROLLED_FAILBACK=PASS_SERVICE8_GAS8
