name: Session17 S44 Android Generated Inspect
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session17-s44-android-generated-inspect-trigger.txt]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Generate only and capture S44 files
        shell: bash
        run: |
          set +e
          OUT=/tmp/r;echo "checked_at=$(date -u +%FT%TZ)" >"$OUT";echo "head_sha=$GITHUB_SHA" >>"$OUT"
          gradle --no-daemon :app:generateS10Operations >/tmp/g.log 2>&1;RC=$?;echo "generate_rc=$RC" >>"$OUT";tail -80 /tmp/g.log >>"$OUT"
          if [[ $RC -eq 0 ]]; then
            echo '--- TRANSPORT TAIL ---' >>"$OUT";nl -ba app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt|tail -150 >>"$OUT"
            echo '--- SESSION MANAGER ---' >>"$OUT";nl -ba app/src/main/java/vn/pickpack1291/app/beta/M2ServiceSessionManager.kt|sed -n '1,220p' >>"$OUT"
            echo '--- BETA API 120-230 ---' >>"$OUT";nl -ba app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt|sed -n '120,230p' >>"$OUT"
          fi
          echo verdict=$([[ $RC -eq 0 ]]&&echo PASS||echo FAIL) >>"$OUT"
      - name: Record
        if: always()
        shell: bash
        run: |
          test -f /tmp/r||echo verdict=FAILED >/tmp/r;cp /tmp/r /tmp/c;git reset --hard HEAD >/dev/null;git pull --rebase origin agent/service-migration-m2||true;cp /tmp/c ops/session17-s44-android-generated-inspect-result.txt;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops/session17-s44-android-generated-inspect-result.txt;git diff --cached --quiet||git commit -m 'ops: record S44 Android generated inspect';git push origin HEAD:agent/service-migration-m2