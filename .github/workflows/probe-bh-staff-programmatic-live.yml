name: Probe BH staff programmatic live
on:
  push:
    branches: [main]
    paths:
      - 'ops/probe-bh-staff-programmatic-live.trigger'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare isolated probe source
        shell: bash
        run: |
          set -euo pipefail
          echo PREPARE > /tmp/probe-stage
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$TOKEN"
          printf '%s' "$TOKEN" > /tmp/google-token
          chmod 600 /tmp/google-token
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          test -n "$SCRIPT_ID"; test -n "$DEPLOYMENT_ID"
          printf '%s' "$SCRIPT_ID" > /tmp/script-id
          printf '%s' "$DEPLOYMENT_ID" > /tmp/deployment-id
          echo "::add-mask::$TOKEN"; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"
          PROBE_TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$PROBE_TOKEN"
          printf '%s' "$PROBE_TOKEN" > /tmp/probe-token
          chmod 600 /tmp/probe-token
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          b=Path('google-apps-script')
          canonical=[]
          for p in sorted(b.glob('*.gs')):
              canonical.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          canonical.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/canonical.json').write_text(json.dumps({'files':canonical},ensure_ascii=False))
          token=Path('/tmp/probe-token').read_text()
          temp=json.loads(Path('/tmp/canonical.json').read_text())
          main=[f for f in temp['files'] if f.get('name')=='PICK_PACK_API' and f.get('type')=='SERVER_JS']
          assert len(main)==1
          src=main[0]['source']
          anchor="    const action = String(body.action || '').trim();\n"
          assert anchor in src
          route=f'''\n    if (action === '__ci_bh_staff_bridge_probe__' && String(body.probe_token || '') === '{token}') {{\n      const probeName = String(body.full_name || '');\n      if (probeName !== '1111q [BH-BRIDGE-PROBE]' && probeName !== '1111q') return ppJson_({{ok:false,error:'PROBE_NAME_INVALID'}});\n      return ppJson_(ppWithLock_(function(){{ return ppStaffUpsert_({{role:'ADMIN',login_id:'ci-bh-bridge-probe'}},{{\n        event_id:String(body.event_id || Utilities.getUuid()),\n        mnv:'909090',full_name:probeName,phone:'0366089392',main_position:'Trưởng kho',supplier:'Nguồn Lực Việt',department:'Pick Pack',site:'1291',warehouse:'HY1',start_date:'12/12/2024',note:''\n      }}); }}));\n    }}\n'''
          main[0]['source']=src.replace(anchor,anchor+route,1)
          Path('/tmp/probe-content.json').write_text(json.dumps(temp,ensure_ascii=False))
          PY

      - name: Deploy temporary probe version
        shell: bash
        run: |
          set -euo pipefail
          echo DEPLOY_PROBE > /tmp/probe-stage
          TOKEN=$(cat /tmp/google-token); SCRIPT_ID=$(cat /tmp/script-id); DEPLOYMENT_ID=$(cat /tmp/deployment-id)
          H=$(curl -sS -o /tmp/update-probe.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/probe-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { cat /tmp/update-probe.out; exit 21; }
          H=$(curl -sS -o /tmp/probe-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Temporary isolated Bao Hang staff bridge probe"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { cat /tmp/probe-version.json; exit 22; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/probe-version.json"))["versionNumber"])')
          printf '%s' "$V" > /tmp/probe-version
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/probe-deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 temporary staff bridge probe'}}))
          PY
          H=$(curl -sS -o /tmp/probe-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/probe-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          [[ "$H" == 200 ]] || { cat /tmp/probe-deploy.out; exit 23; }
          sleep 4
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/deployment-live.json
          python3 - <<'PY' > /tmp/web-url
          import json
          d=json.load(open('/tmp/deployment-live.json'))
          web=[e.get('webApp',{}) for e in d.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']
          assert web and web[0].get('url')
          print(web[0]['url'])
          PY

      - name: Exercise service upsert bridge and restore business fields
        shell: bash
        run: |
          set -euo pipefail
          echo EXERCISE > /tmp/probe-stage
          URL=$(cat /tmp/web-url); PROBE_TOKEN=$(cat /tmp/probe-token)
          ID1="ci-bh-marker-$(date +%s)-$RANDOM"
          ID2="ci-bh-restore-$(date +%s)-$RANDOM"
          curl -fsSL --retry 3 --retry-all-errors -H 'content-type: text/plain;charset=UTF-8' "$URL" \
            -d "{\"action\":\"__ci_bh_staff_bridge_probe__\",\"probe_token\":\"$PROBE_TOKEN\",\"event_id\":\"$ID1\",\"full_name\":\"1111q [BH-BRIDGE-PROBE]\"}" > /tmp/marker.json
          jq -e '.ok==true and .result.bao_hang_bridge=="SENT"' /tmp/marker.json >/dev/null
          sleep 3
          curl -fsSL --retry 3 --retry-all-errors -H 'content-type: text/plain;charset=UTF-8' "$URL" \
            -d "{\"action\":\"__ci_bh_staff_bridge_probe__\",\"probe_token\":\"$PROBE_TOKEN\",\"event_id\":\"$ID2\",\"full_name\":\"1111q\"}" > /tmp/restore.json
          jq -e '.ok==true and .result.bao_hang_bridge=="SENT"' /tmp/restore.json >/dev/null
          printf '%s' "$ID1" > /tmp/event-id-1
          printf '%s' "$ID2" > /tmp/event-id-2

      - name: Restore canonical GAS source and deployment
        if: always()
        shell: bash
        run: |
          set +e
          echo RESTORE_CANONICAL > /tmp/probe-stage-restore
          TOKEN=$(cat /tmp/google-token 2>/dev/null); SCRIPT_ID=$(cat /tmp/script-id 2>/dev/null); DEPLOYMENT_ID=$(cat /tmp/deployment-id 2>/dev/null)
          if [[ -z "$TOKEN" || -z "$SCRIPT_ID" || -z "$DEPLOYMENT_ID" || ! -s /tmp/canonical.json ]]; then echo RESTORE_SKIPPED > /tmp/restore-result; exit 0; fi
          H=$(curl -sS -o /tmp/restore-source.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/canonical.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          if [[ "$H" != 200 ]]; then echo "RESTORE_SOURCE_HTTP_$H" > /tmp/restore-result; exit 0; fi
          H=$(curl -sS -o /tmp/final-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Restore Pick Pack canonical source after isolated staff bridge probe"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          if [[ "$H" != 200 ]]; then echo "RESTORE_VERSION_HTTP_$H" > /tmp/restore-result; exit 0; fi
          V=$(python3 -c 'import json;print(json.load(open("/tmp/final-version.json"))["versionNumber"])')
          printf '%s' "$V" > /tmp/final-version
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/final-deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API'}}))
          PY
          H=$(curl -sS -o /tmp/final-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/final-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          if [[ "$H" != 200 ]]; then echo "RESTORE_DEPLOY_HTTP_$H" > /tmp/restore-result; exit 0; fi
          sleep 3
          URL=$(cat /tmp/web-url 2>/dev/null)
          if [[ -n "$URL" ]]; then curl -fsSL --retry 3 --retry-all-errors "$URL" -o /tmp/final-health.json; fi
          if [[ -s /tmp/final-health.json ]] && jq -e '.ok==true and .service=="pick-pack-gsheet-api"' /tmp/final-health.json >/dev/null; then echo PASS > /tmp/restore-result; else echo HEALTH_FAIL > /tmp/restore-result; fi

      - name: Record sanitized probe proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=FAIL
          [[ -s /tmp/marker.json && -s /tmp/restore.json ]] && jq -e '.ok==true and .result.bao_hang_bridge=="SENT"' /tmp/marker.json >/dev/null 2>&1 && jq -e '.ok==true and .result.bao_hang_bridge=="SENT"' /tmp/restore.json >/dev/null 2>&1 && STATUS=PASS
          RESTORE=$(cat /tmp/restore-result 2>/dev/null || echo UNKNOWN)
          STAGE=$(cat /tmp/probe-stage 2>/dev/null || echo UNKNOWN)
          PV=$(cat /tmp/probe-version 2>/dev/null || echo 0)
          FV=$(cat /tmp/final-version 2>/dev/null || echo 0)
          python3 - "$STATUS" "$RESTORE" "$STAGE" "$PV" "$FV" <<'PY'
          import datetime,json,sys
          proof={
            'status':sys.argv[1],
            'canonical_restore':sys.argv[2],
            'last_stage':sys.argv[3],
            'probe_gas_version':int(sys.argv[4] or 0),
            'final_gas_version':int(sys.argv[5] or 0),
            'employee_code':'909090',
            'marker_bridge':'SENT' if sys.argv[1]=='PASS' else 'UNKNOWN',
            'restore_bridge':'SENT' if sys.argv[1]=='PASS' else 'UNKNOWN',
            'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('ops/bh-staff-programmatic-runtime-proof.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
          cat ops/bh-staff-programmatic-runtime-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bh-staff-programmatic-runtime-proof.json
          git diff --cached --quiet || git commit -m 'chore(gas): record staff bridge runtime probe'
          git pull --rebase origin main
          git push origin HEAD:main
