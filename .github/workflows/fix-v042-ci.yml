name: fix-v042-ci
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-v042-ci.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align v0.4.2 metadata
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/beta-preview.yml
          sed -i 's/versionCode='"'"'6'"'"'/versionCode='"'"'7'"'"'/g' "$F"
          sed -i 's/0\.4\.1-beta\.1/0.4.2-beta.1/g' "$F"
          sed -i 's/v0\.4\.1/v0.4.2/g' "$F"
          sed -i 's/v0.4.1 adds local\/static master caching, revision-based master refresh, shift-aware Pack mapping, corrected log routing, hardware-scanner Enter support, edge swipe-back navigation, launcher adaptive icon and operational layout\/status redesign./v0.4.2 adds indexed local staff cache, instant staff search, owner artwork launcher icon, compact operational UI, shift\/supplier manpower reports, tenure reports, labor support\/deduction reporting and beta OTA preparation./g' "$F"
          grep -q "versionCode='7'" "$F"
          grep -q "versionName='0.4.2-beta.1'" "$F"
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/beta-preview.yml
          git commit -m 'ci: build v0.4.2 beta metadata'
          git push origin main
