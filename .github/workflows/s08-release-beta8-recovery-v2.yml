name: S08 Release Beta8 Recovery V2

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s08-release-v2-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      ARTIFACT_ID: '9309679507'
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      VERSION: 0.4.2-beta.8
      VERSION_CODE: '14'
      APK_NAME: pick-pack-1291-public-beta-v0.4.2-beta.8.apk
      TEMP_PEM_NAME: pp-s08-beta8-recovery-private-temp.pem
      LIVE_API: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve encrypted recovery backup and Beta folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,subprocess,os
          hist=subprocess.check_output(['git','show','24ffa3192b806b64fad4bdfc2914d421e1bcc3e5:.github/workflows/release-beta3-recovery-v2.yml'],text=True)
          gas=open('google-apps-script/PICK_PACK_API.gs',encoding='utf-8').read()
          m=re.search(r'^\s*SIGNING_BACKUP_FILE_ID:\s*([^\s]+)',hist,re.M); assert m
          backup=m.group(1).strip()
          m=re.search(r"OTA_BETA_FOLDER_ID:\s*'([^']+)'",gas); assert m
          folder=m.group(1)
          print('::add-mask::'+backup); print('::add-mask::'+folder)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIGNING_BACKUP_FILE_ID='+backup+'\nBETA_FOLDER_ID='+folder+'\n')
          PY

      - name: OAuth and isolated raw-PEM recovery bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          [[ -n "$SCRIPT_ID" && -n "$TOKEN" ]]; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$TOKEN"
          NONCE=$(python3 -c 'import secrets;print(secrets.token_urlsafe(40))'); export NONCE; echo "::add-mask::$NONCE"
          export SCRIPT_ID TOKEN
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/original-content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          src=(b/'PICK_PACK_API.gs').read_text(); needle="    if (action === 'login') return ppJson_(ppLogin_(body));"; assert needle in src
          n=os.environ['NONCE']; backup=os.environ['SIGNING_BACKUP_FILE_ID']; folder=os.environ['BETA_FOLDER_ID']; pemname=os.environ['TEMP_PEM_NAME']
          x=f'''\n    if (action === '__ci_signing_probe' && String(body._ci_nonce||'') === '{n}') {{ const it=DriveApp.getFilesByName('{pemname}'); if(!it.hasNext())return ppJson_({{ok:false,error:'PEM_NOT_FOUND'}}); const a=DriveApp.getFileById('{backup}'),p=it.next(),t=p.getBlob().getDataAsString(); return ppJson_({{ok:true,backup_size:a.getSize(),pem_ok:t.indexOf('BEGIN PRIVATE KEY')>=0,pem_len:t.length}}); }}\n    if (action === '__ci_signing_material' && String(body._ci_nonce||'') === '{n}') {{ const it=DriveApp.getFilesByName('{pemname}'); if(!it.hasNext())return ppJson_({{ok:false,error:'PEM_NOT_FOUND'}}); const p=it.next(),z=DriveApp.getFileById('{backup}').getBlob().getBytes(),t=p.getBlob().getDataAsString(); if(t.indexOf('BEGIN PRIVATE KEY')<0)return ppJson_({{ok:false,error:'PEM_INVALID'}}); p.setTrashed(true); return ppJson_({{ok:true,backup_b64:Utilities.base64Encode(z),private_pem:t}}); }}\n    if (action === '__ci_beta_upload' && String(body._ci_nonce||'') === '{n}') {{ const name=String(body.name||''),want=String(body.sha256||'').toLowerCase(),raw=Utilities.base64Decode(String(body.data_b64||'')); if(name!=='pick-pack-1291-public-beta-v0.4.2-beta.8.apk')return ppJson_({{ok:false,error:'NAME_REJECTED'}}); const got=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,raw).map(function(b){{return ('0'+((b+256)%256).toString(16)).slice(-2);}}).join(''); if(got!==want)return ppJson_({{ok:false,error:'SHA_MISMATCH'}}); const fldr=DriveApp.getFolderById('{folder}'),old=fldr.getFilesByName(name); while(old.hasNext())old.next().setTrashed(true); const f=fldr.createFile(Utilities.newBlob(raw,'application/vnd.android.package-archive',name)); f.setDescription('Beta 0.4.2-beta.8 | approved UI system | SHA-256 '+got); return ppJson_({{ok:true,file_id:f.getId(),sha256:got,size:f.getSize()}}); }}\n    if (action === '__ci_beta_delete' && String(body._ci_nonce||'') === '{n}') {{ const id=String(body.file_id||''); if(!id)return ppJson_({{ok:false,error:'ID_REQUIRED'}}); const f=DriveApp.getFileById(id); if(f.getName()!=='pick-pack-1291-public-beta-v0.4.2-beta.8.apk')return ppJson_({{ok:false,error:'NAME_REJECTED'}}); f.setTrashed(true); return ppJson_({{ok:true}}); }}'''
          temp=src.replace(needle,needle+x,1); out=[dict(q,source=temp) if q['name']=='PICK_PACK_API' else q for q in files]
          Path('/tmp/temp-content.json').write_text(json.dumps({'files':out},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/temp-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"temporary beta8 recovery v2"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" > /tmp/v.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/v.json"))["versionNumber"])')
          python3 - "$V" <<'PY'
          import json,sys
          open('/tmp/d.json','w').write(json.dumps({'versionNumber':int(sys.argv[1]),'manifestFileName':'appsscript','description':'temporary beta8 recovery v2'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/d.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > /tmp/dep.json
          DEP=$(python3 -c 'import json;print(json.load(open("/tmp/dep.json"))["deploymentId"])'); echo "::add-mask::$DEP"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEP" > /tmp/get.json
          URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/get.json')); w=[e['webApp']['url'] for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert w; print(w[0])
          PY
          ); echo "::add-mask::$URL"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"; echo "token=$TOKEN" >> "$GITHUB_OUTPUT"; echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"; echo "deployment=$DEP" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for bridge and recover official signing bundle
        id: signing
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          NONCE: ${{ steps.bridge.outputs.nonce }}
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p /tmp/secret /tmp/recovery /tmp/signing
          OK=false
          for i in $(seq 1 30); do
            curl -fsSL -H 'content-type: application/json' "$BRIDGE_URL" -d "{\"action\":\"__ci_signing_probe\",\"_ci_nonce\":\"$NONCE\"}" > /tmp/probe.json || true
            if python3 -c 'import json;j=json.load(open("/tmp/probe.json"));assert j.get("ok") and j.get("pem_ok") and j.get("backup_size",0)>0' 2>/dev/null; then OK=true; break; fi
            sleep 4
          done
          if [[ "$OK" != true ]]; then python3 - <<'PY'
          import json
          try:
            j=json.load(open('/tmp/probe.json')); print('Bridge probe failed:',{k:j.get(k) for k in ('ok','error','backup_size','pem_ok','pem_len')})
          except Exception: print('Bridge probe failed without JSON')
          PY
            exit 1
          fi
          curl -fsSL -H 'content-type: application/json' "$BRIDGE_URL" -d "{\"action\":\"__ci_signing_material\",\"_ci_nonce\":\"$NONCE\"}" > /tmp/material.json
          python3 - <<'PY'
          import json,base64
          j=json.load(open('/tmp/material.json')); assert j.get('ok') is True
          open('/tmp/secret/backup.zip','wb').write(base64.b64decode(j['backup_b64'])); open('/tmp/secret/recovery-private.pem','w').write(j['private_pem'])
          PY
          rm -f /tmp/material.json /tmp/probe.json
          unzip -q /tmp/secret/backup.zip -d /tmp/recovery
          ROOT=$(find /tmp/recovery -type f -name aes-key.enc -printf '%h\n'|head -1); [[ -n "$ROOT" ]]
          openssl pkeyutl -decrypt -inkey /tmp/secret/recovery-private.pem -in "$ROOT/aes-key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/secret/aes-key.bin
          [[ $(stat -c %s /tmp/secret/aes-key.bin) -eq 32 ]]
          KEYHEX=$(od -An -tx1 /tmp/secret/aes-key.bin|tr -d ' \n'); IVHEX=$(base64 -d "$ROOT/iv.b64"|od -An -tx1|tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in "$ROOT/signing-bundle.enc" -out /tmp/secret/signing-bundle.tar.gz
          tar -xzf /tmp/secret/signing-bundle.tar.gz -C /tmp/signing
          BUNDLE=$(find /tmp/signing -type f -name release.jks -printf '%h\n'|head -1); test -s "$BUNDLE/release.jks"; test -s "$BUNDLE/key.alias"; test -s "$BUNDLE/store.pass"; test -s "$BUNDLE/key.pass"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"; echo 'Signing recovery bundle: PASS'

      - name: Download exact Beta8 candidate and resolve Android tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/candidate.zip
          mkdir /tmp/candidate; unzip -q /tmp/candidate.zip -d /tmp/candidate
          UNSIGNED=$(find /tmp/candidate -type f -name app-beta-release-unsigned.apk|head -1); test -s "$UNSIGNED"; echo "UNSIGNED=$UNSIGNED" >> "$GITHUB_ENV"
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" && -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]]; then echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0; fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"; curl -fsSL 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP"|sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes|"$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Sign and verify fixed identity
        id: signed
        env:
          BUNDLE: ${{ steps.signing.outputs.bundle }}
        shell: bash
        run: |
          set -euo pipefail; BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging "$UNSIGNED" > /tmp/badge; grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badge; grep -q "versionCode='$VERSION_CODE'" /tmp/badge; grep -q "versionName='$VERSION'" /tmp/badge
          "$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$BUNDLE/release.jks" --ks-key-alias "$(cat "$BUNDLE/key.alias")" --ks-pass "file:$BUNDLE/store.pass" --key-pass "file:$BUNDLE/key.pass" --out "/tmp/$APK_NAME" /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "/tmp/$APK_NAME" > /tmp/verify
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/verify|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]'); [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          SHA=$(sha256sum "/tmp/$APK_NAME"|awk '{print $1}'); echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "Fixed signer PASS; APK_SHA256=$SHA"

      - name: Upload signed Beta8 to BẢN THỬ NGHIỆM
        id: upload
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          NONCE: ${{ steps.bridge.outputs.nonce }}
          APK_SHA: ${{ steps.signed.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64
          body={'action':'__ci_beta_upload','_ci_nonce':os.environ['NONCE'],'name':os.environ['APK_NAME'],'sha256':os.environ['APK_SHA'],'data_b64':base64.b64encode(open('/tmp/'+os.environ['APK_NAME'],'rb').read()).decode()}; json.dump(body,open('/tmp/upload.json','w'),separators=(',',':'))
          PY
          curl -fsSL -H 'content-type: application/json' --data-binary @/tmp/upload.json "$BRIDGE_URL" > /tmp/upload-result.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          j=json.load(open('/tmp/upload-result.json')); assert j.get('ok') is True,j; assert j.get('sha256')==os.environ['APK_SHA'],j; print('file_id='+j['file_id']); print('size='+str(j['size']))
          PY
          rm -f /tmp/upload.json /tmp/upload-result.json

      - name: Verify live Beta6 to Beta8 OTA E2E
        env:
          EXPECTED_SHA: ${{ steps.signed.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          post(){ curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$LIVE_API" -d "$1"; }
          OK=false
          for i in $(seq 1 12); do
            post '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.6"}' > /tmp/from6.json || true
            if python3 - <<'PY' 2>/dev/null
          import json,os
          j=json.load(open('/tmp/from6.json')); assert j.get('ok') is True and j.get('source')=='GOOGLE_DRIVE' and j.get('channel')=='BETA'; assert j.get('available') is True and j.get('version_name')==os.environ['VERSION'] and j.get('sha256')==os.environ['EXPECTED_SHA'] and j.get('apk_url')
          PY
            then OK=true; break; fi
            sleep 5
          done
          [[ "$OK" == true ]] || { cat /tmp/from6.json; exit 1; }
          python3 - <<'PY'
          import json
          open('/tmp/url.txt','w').write(json.load(open('/tmp/from6.json'))['apk_url'])
          PY
          curl -fL --retry 4 --retry-delay 2 "$(cat /tmp/url.txt)" -o /tmp/ota-beta8.apk
          [[ "$(sha256sum /tmp/ota-beta8.apk|awk '{print $1}')" == "$EXPECTED_SHA" ]]
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"; "$BT/apksigner" verify --verbose --print-certs /tmp/ota-beta8.apk > /tmp/ota-cert
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/ota-cert|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]'); [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          "$BT/aapt" dump badging /tmp/ota-beta8.apk > /tmp/ota-badge; grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/ota-badge; grep -q "versionCode='$VERSION_CODE'" /tmp/ota-badge; grep -q "versionName='$VERSION'" /tmp/ota-badge
          post '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.8"}' > /tmp/self.json; post '{"action":"update_check","channel":"STABLE","current_version":"0.0.0"}' > /tmp/stable.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/self.json')); s=json.load(open('/tmp/stable.json')); assert a.get('ok') is True and a.get('channel')=='BETA' and a.get('version_name')==os.environ['VERSION'] and a.get('available') is False,a; assert s.get('ok') is True and s.get('channel')=='STABLE' and s.get('version_name')!=os.environ['VERSION'],s
          PY
          echo 'OTA E2E PASS: beta6 -> beta8, download SHA/signer/package, self-update false, Stable isolated.'

      - name: Create release receipt artifact
        env:
          APK_SHA: ${{ steps.signed.outputs.sha }}
          DRIVE_FILE_ID: ${{ steps.upload.outputs.file_id }}
          DRIVE_SIZE: ${{ steps.upload.outputs.size }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          json.dump({'ok':True,'version':os.environ['VERSION'],'version_code':int(os.environ['VERSION_CODE']),'sha256':os.environ['APK_SHA'],'drive_file_id':os.environ['DRIVE_FILE_ID'],'size':int(os.environ['DRIVE_SIZE']),'signer_sha256':os.environ['EXPECTED_SIGNER_SHA256'],'beta6_to_beta8':True,'download_sha_match':True,'download_signer_match':True,'self_update':False,'stable_isolated':True,'source':'GOOGLE_DRIVE'},open('/tmp/beta8-release-result.json','w'),separators=(',',':'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: beta8-ota-release-result-v2
          path: /tmp/beta8-release-result.json
          retention-days: 14

      - name: Roll back Beta8 on any release-gate failure
        if: failure() && steps.upload.outputs.file_id != ''
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          NONCE: ${{ steps.bridge.outputs.nonce }}
          FILE_ID: ${{ steps.upload.outputs.file_id }}
        shell: bash
        run: |
          set +e
          curl -fsSL -H 'content-type: application/json' "$BRIDGE_URL" -d "{\"action\":\"__ci_beta_delete\",\"_ci_nonce\":\"$NONCE\",\"file_id\":\"$FILE_ID\"}" > /tmp/rollback.json
          python3 -c 'import json;assert json.load(open("/tmp/rollback.json")).get("ok") is True'

      - name: Cleanup temporary deployment and signing material
        if: always()
        env:
          ACCESS_TOKEN: ${{ steps.bridge.outputs.token }}
          SCRIPT_ID: ${{ steps.bridge.outputs.script_id }}
          TEMP_DEPLOYMENT: ${{ steps.bridge.outputs.deployment }}
        shell: bash
        run: |
          set +e
          if [[ -n "$TEMP_DEPLOYMENT" && -n "$ACCESS_TOKEN" ]]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$TEMP_DEPLOYMENT"; fi
          if [[ -f /tmp/original-content.json && -n "$ACCESS_TOKEN" ]]; then curl -sS -o /dev/null -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/original-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"; fi
          find /tmp/secret /tmp/signing -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf /tmp/secret /tmp/signing /tmp/recovery /tmp/candidate /tmp/candidate.zip /tmp/aligned.apk /tmp/ota-beta8.apk
          echo 'Temporary bridge removed; signing material cleaned.'
