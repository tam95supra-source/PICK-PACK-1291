name: Session2 Product Deploy V5 Observable

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths: [ 'ops/session2-product-deploy-v5-trigger.txt' ]

permissions:
  contents: write
concurrency:
  group: session2-product-deploy-v5-production
  cancel-in-progress: false

env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  PROD_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  FALLBACK_RANGE: __PP_M2_FALLBACK_EVENTS!A:O
  SERVICE_GENERATION: m2-prod-20260819-001

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Guarded observable deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/session2-product-deploy-v5-result.txt
          : > "$OUT"
          echo "checked_at=$(date -u +%FT%TZ)" >> "$OUT"
          echo "head_sha=$GITHUB_SHA" >> "$OUT"
          PHASE=START
          trap 'rc=$?; echo "failed_phase=$PHASE" >> "$OUT"; echo "failed_rc=$rc" >> "$OUT"; exit $rc' ERR

          PHASE=SOURCE_GATE
          node --check service/public/app.js >/dev/null
          node --check service/public/history-admin.js >/dev/null
          node --check service/public/admin-extension.js >/dev/null
          grep -q 'entry_product.ts' service/wrangler.jsonc
          grep -q 'INVALIDATION_V1' app/src/main/java/vn/pickpack1291/app/beta/M2RealtimeClient.kt
          grep -q 'LOCAL_PENDING' app/src/main/java/vn/pickpack1291/app/beta/PdaLocalProjection.kt
          grep -q 'IMPORT_TEMPLATE_VERSION_STALE' service/src/import_xlsx.ts
          cd service
          npm install --no-audit --no-fund >/dev/null
          npm run check >/dev/null
          echo source_gate=PASS >> "$OUT"

          PHASE=CREDENTIAL_GATE
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do [[ -n "${!v:-}" ]]; done
          echo credential_gate=PASS >> "$OUT"

          PHASE=D1_RESOLVE
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node -e "const r=require('/tmp/d1-list.json');const x=r.find(v=>v.name==='pick-pack-1291-service-prod');if(!x)process.exit(2);process.stdout.write(String(x.uuid||x.id||''))")
          [[ -n "$D1_ID" ]]
          export D1_ID
          node - <<'NODE'
          const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='pick-pack-1291-service';cfg.main='src/entry_product.ts';cfg.keep_vars=true;
          cfg.vars={SERVICE_GENERATION:'m2-prod-20260819-001',GOOGLE_SOURCE_SHEET_ID:'1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'};
          cfg.d1_databases[0].database_name='pick-pack-1291-service-prod';cfg.d1_databases[0].database_id=process.env.D1_ID;delete cfg.secrets;
          fs.writeFileSync('/tmp/wrangler-prod-v5.jsonc',JSON.stringify(cfg,null,2));
          NODE
          echo d1_resolve=PASS >> "$OUT"

          PHASE=AUTHORITY_GATE
          cd ..
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/health" > /tmp/service-before.json
          SERVICE_EPOCH=$(jq -r '.authority.authority_epoch' /tmp/service-before.json); SERVICE_SEQ=$(jq -r '.authority.authority_seq' /tmp/service-before.json)
          jq -e --arg g "$SERVICE_GENERATION" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/service-before.json >/dev/null
          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' > /tmp/gas-before.json
          FALLBACK_EPOCH=$(python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/gas-before.json'));a=j.get('authority') or {};mode=j.get('authority_mode') or a.get('mode');epoch=int(j.get('authority_epoch') or a.get('authority_epoch') or 0);gen=j.get('service_generation') or a.get('service_generation');se=int(json.load(open('/tmp/service-before.json'))['authority']['authority_epoch']);assert j.get('ok') is True and mode=='GOOGLE_FALLBACK' and epoch==se+1 and gen==os.environ['SERVICE_GENERATION'];print(epoch)
          PY
          )
          export SERVICE_EPOCH SERVICE_SEQ FALLBACK_EPOCH
          echo authority_gate=PASS >> "$OUT"

          PHASE=FALLBACK_GATE
          TOKEN=$(curl -fsSL https://oauth2.googleapis.com/token --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token' | jq -r '.access_token')
          [[ -n "$TOKEN" && "$TOKEN" != null ]]
          export TOKEN
          ENC_RANGE=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["FALLBACK_RANGE"],safe=""))')
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$PROD_SHEET_ID/values/$ENC_RANGE?majorDimension=ROWS" > /tmp/fallback-before.json
          python3 - <<'PY'
          import json,os,hashlib
          raw=json.load(open('/tmp/fallback-before.json')).get('values',[]);assert raw
          idx={v:i for i,v in enumerate(raw[0])};req=['authority_epoch','authority_seq','service_generation','event_id','action','status'];assert all(k in idx for k in req)
          rows=[]
          for r in raw[1:]:
            g=lambda k: str(r[idx[k]]) if idx[k]<len(r) else ''
            if g('authority_epoch')==os.environ['FALLBACK_EPOCH'] and g('service_generation')==os.environ['SERVICE_GENERATION']:rows.append({'seq':int(g('authority_seq')),'event_id':g('event_id'),'action':g('action'),'status':g('status')})
          rows.sort(key=lambda x:x['seq']);assert rows and [x['seq'] for x in rows]==list(range(1,rows[-1]['seq']+1)) and all(x['status']=='PENDING' for x in rows)
          safe=json.dumps(rows,separators=(',',':'),sort_keys=True);open('/tmp/fallback-bind.sha','w').write(hashlib.sha256(safe.encode()).hexdigest());open('/tmp/fallback-bind.count','w').write(str(len(rows)));open('/tmp/fallback-bind.max','w').write(str(rows[-1]['seq']))
          PY
          echo fallback_gate=PASS >> "$OUT"

          PHASE=D1_GATE
          cd service
          npx wrangler d1 execute pick-pack-1291-service-prod --remote --config /tmp/wrangler-prod-v5.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT value AS reconciling FROM system_meta WHERE key='m2_reconciling'; SELECT authority_epoch,authority_seq,ingest_status FROM fallback_event_inbox WHERE authority_epoch=$FALLBACK_EPOCH ORDER BY authority_seq; SELECT recovery_type,status FROM recovery_runs ORDER BY started_at DESC LIMIT 5; SELECT state,pending_count,retry_count,last_error_class FROM replication_status WHERE singleton_id=1; SELECT id,name FROM d1_migrations ORDER BY id;" --json > /tmp/d1-before.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/d1-before.json'));s=[b.get('results',[]) for b in x if isinstance(b,dict) and isinstance(b.get('results'),list)];assert len(s)>=6,len(s)
          a=s[0][0];assert a['mode']=='SERVICE_PRIMARY' and a['scope']=='PRODUCTION' and a['service_generation']==os.environ['SERVICE_GENERATION'] and int(a['authority_epoch'])==int(os.environ['SERVICE_EPOCH'])
          assert str(s[1][0].get('reconciling') if s[1] else '0')!='1';assert len(s[2])==0;assert not any(r.get('status') in ('RUNNING','VALIDATING') for r in s[3]);assert s[4][0].get('state')=='HEALTHY' and int(s[4][0].get('pending_count') or 0)==0;assert '0004_session1_foundation.sql' in [r.get('name') for r in s[5]]
          PY
          echo d1_gate=PASS >> "$OUT"

          PHASE=DEPLOY
          npx wrangler deploy --config /tmp/wrangler-prod-v5.jsonc --keep-vars >/tmp/deploy.log
          echo deploy=PASS >> "$OUT"

          PHASE=LIVE_VERIFY
          cd ..
          for i in 1 2 3 4 5; do curl -fsSL "$SERVICE_URL/health" > /tmp/service-after.json && jq -e --arg g "$SERVICE_GENERATION" --argjson e "$SERVICE_EPOCH" '.ok==true and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.authority_epoch==$e' /tmp/service-after.json >/dev/null && break; sleep 3; done
          jq -e --argjson s "$SERVICE_SEQ" '.authority.authority_seq >= $s' /tmp/service-after.json >/dev/null
          curl -fsSL "$SERVICE_URL/v1/capabilities" | jq -e '.ok==true and .business_window==7 and .mutation_batch==true and .fcm_wake==true and .import_engine==true and .realtime_protocol=="INVALIDATION_V1"' >/dev/null
          curl -fsSL "$SERVICE_URL/" > /tmp/index.html; curl -fsSL "$SERVICE_URL/app.js" > /tmp/app.js; curl -fsSL "$SERVICE_URL/history-admin.html" > /tmp/history.html; curl -fsSL "$SERVICE_URL/history-admin.js" > /tmp/history.js
          grep -q 'Import dữ liệu' /tmp/index.html; grep -q 'DAY_CHANGED' /tmp/app.js; grep -q 'MASTER_CHANGED' /tmp/app.js; grep -q 'Lịch sử toàn phần' /tmp/history.html; grep -q '/v1/admin/business-dates' /tmp/history.js
          [[ "$(curl -sS -o /tmp/a -w '%{http_code}' "$SERVICE_URL/v1/admin/business-dates?limit=1")" == 401 ]]; [[ "$(curl -sS -o /tmp/b -w '%{http_code}' "$SERVICE_URL/v1/import/template?dataset=employees")" == 401 ]]
          echo live_verify=PASS >> "$OUT"

          PHASE=FALLBACK_RECHECK
          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' > /tmp/gas-after.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/gas-after.json'));a=j.get('authority') or {};mode=j.get('authority_mode') or a.get('mode');epoch=int(j.get('authority_epoch') or a.get('authority_epoch') or 0);assert mode=='GOOGLE_FALLBACK' and epoch==int(os.environ['FALLBACK_EPOCH'])
          PY
          ENC_RANGE=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["FALLBACK_RANGE"],safe=""))')
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$PROD_SHEET_ID/values/$ENC_RANGE?majorDimension=ROWS" > /tmp/fallback-after.json
          python3 - <<'PY'
          import json,os,hashlib
          raw=json.load(open('/tmp/fallback-after.json')).get('values',[]);idx={v:i for i,v in enumerate(raw[0])};rows=[]
          for r in raw[1:]:
            g=lambda k: str(r[idx[k]]) if idx[k]<len(r) else ''
            if g('authority_epoch')==os.environ['FALLBACK_EPOCH'] and g('service_generation')==os.environ['SERVICE_GENERATION']:rows.append({'seq':int(g('authority_seq')),'event_id':g('event_id'),'action':g('action'),'status':g('status')})
          rows.sort(key=lambda x:x['seq']);safe=json.dumps(rows,separators=(',',':'),sort_keys=True);assert hashlib.sha256(safe.encode()).hexdigest()==open('/tmp/fallback-bind.sha').read();assert len(rows)==int(open('/tmp/fallback-bind.count').read()) and rows[-1]['seq']==int(open('/tmp/fallback-bind.max').read())
          PY
          echo fallback_recheck=PASS >> "$OUT"
          echo verdict=PASS >> "$OUT"

      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          test -f /tmp/session2-product-deploy-v5-result.txt || echo 'diagnostic_failed_before_output=true' >/tmp/session2-product-deploy-v5-result.txt
          cp /tmp/session2-product-deploy-v5-result.txt ops/session2-product-deploy-v5-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session2-product-deploy-v5-result.txt
          git diff --cached --quiet && exit 0
          git commit -m 'ops: record Session2 product deploy V5 result'
          git push
