name: Session1 Deploy Observer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_DEPLOY_SHA: e19980933bfb2399c651ee7148c62296b4acacf7
    steps:
      - name: Observe exact bounded deploy run
        shell: bash
        run: |
          set -euo pipefail
          FOUND=''
          for i in $(seq 1 90); do
            JSON=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/session1-service-deploy.yml/runs?branch=agent%2Fservice-migration-m2&event=push&per_page=10")
            FOUND=$(node -e 'const j=JSON.parse(process.argv[1]);const x=(j.workflow_runs||[]).find(r=>r.head_sha===process.env.EXPECTED_DEPLOY_SHA);if(x)process.stdout.write(JSON.stringify({id:x.id,status:x.status,conclusion:x.conclusion,head_sha:x.head_sha,created_at:x.created_at,updated_at:x.updated_at,html_url:x.html_url}))' "$JSON")
            if [[ -n "$FOUND" ]]; then echo "DEPLOY_RUN=$FOUND"; STATUS=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$FOUND"); if [[ "$STATUS" == completed ]]; then break; fi; fi
            sleep 10
          done
          [[ -n "$FOUND" ]] || { echo SESSION1_DEPLOY_RUN_NOT_FOUND; exit 1; }
          ID=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).id))' "$FOUND"); STATUS=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$FOUND"); CONCLUSION=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).conclusion||""))' "$FOUND")
          [[ "$STATUS" == completed ]] || { echo "SESSION1_DEPLOY_NOT_COMPLETED:$STATUS"; exit 1; }
          JOBS=$(gh api -X GET "repos/${{ github.repository }}/actions/runs/$ID/jobs?per_page=100")
          node -e 'const j=JSON.parse(process.argv[1]);for(const x of j.jobs||[])console.log("DEPLOY_JOB="+JSON.stringify({id:x.id,name:x.name,status:x.status,conclusion:x.conclusion,started_at:x.started_at,completed_at:x.completed_at,steps:(x.steps||[]).map(s=>({name:s.name,status:s.status,conclusion:s.conclusion,number:s.number}))}))' "$JOBS"
          [[ "$CONCLUSION" == success ]] || { echo "SESSION1_DEPLOY_CONCLUSION=$CONCLUSION"; exit 1; }
          echo SESSION1_DEPLOY_OBSERVED=SUCCESS
