name: Session3 Beta26 Compile Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session3-beta26-compile-diagnostic-trigger.txt]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Compile and capture sanitized errors
        shell: bash
        run: |
          set +e
          FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' app/google-services.json);FIREBASE_GCM_SENDER_ID=$(jq -r '.project_info.project_number' app/google-services.json);P='vn.pickpack1291.app.beta.publicbeta';FIREBASE_GOOGLE_APP_ID=$(jq -r --arg p "$P" '.client[]|select(.client_info.android_client_info.package_name==$p)|.client_info.mobilesdk_app_id' app/google-services.json);FIREBASE_API_KEY=$(jq -r --arg p "$P" '.client[]|select(.client_info.android_client_info.package_name==$p)|.api_key[0].current_key' app/google-services.json)
          gradle --no-daemon :app:compileBetaReleaseKotlin -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" -PFIREBASE_GOOGLE_APP_ID="$FIREBASE_GOOGLE_APP_ID" -PFIREBASE_API_KEY="$FIREBASE_API_KEY" -PFIREBASE_GCM_SENDER_ID="$FIREBASE_GCM_SENDER_ID" > /tmp/g.log 2>&1
          RC=$?
          { echo "compile_exit=$RC"; grep -E '(^e:| error: |FAILED|Exception|S29|S30|anchor missing|Traceback)' /tmp/g.log | tail -120; } > /tmp/r
          grep -q 'S29_OWNER_LOCALFIRST_HISTORY' app/src/main/java/vn/pickpack1291/app/beta/PdaLocalProjection.kt && echo s29_applied=YES >> /tmp/r || echo s29_applied=NO >> /tmp/r
          grep -q 'S30_DURABLE_ADMIN_AUDIT' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt && echo s30_applied=YES >> /tmp/r || echo s30_applied=NO >> /tmp/r
          exit 0
      - name: Record
        shell: bash
        run: |
          cp /tmp/r ops/session3-beta26-compile-diagnostic-result.txt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session3-beta26-compile-diagnostic-result.txt;git diff --cached --quiet || git commit -m 'ops: record Beta26 compile diagnostic'
          git pull --rebase origin agent/service-migration-m2;git push origin HEAD:agent/service-migration-m2
