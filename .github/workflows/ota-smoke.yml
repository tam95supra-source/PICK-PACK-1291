name: OTA Metadata Smoke

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ota-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Beta1 must discover Beta2; Beta2 must be current
        shell: bash
        env:
          API_URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-beta-api
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --retry-delay 1 \
            -X POST "$API_URL" \
            -H 'content-type: application/json' \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.3.0-beta.1"}' > /tmp/beta1.json
          jq -e '
            .ok == true and
            .channel == "BETA" and
            .available == true and
            .version_name == "0.3.0-beta.2" and
            .tag == "v0.3.0-beta.2-publicbeta" and
            (.apk_url | endswith("pick-pack-1291-public-beta-v0.3.0-beta.2.apk")) and
            (.sha256 | length == 64)
          ' /tmp/beta1.json >/dev/null

          curl -fsS --retry 3 --retry-all-errors --retry-delay 1 \
            -X POST "$API_URL" \
            -H 'content-type: application/json' \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.3.0-beta.2"}' > /tmp/beta2.json
          jq -e '
            .ok == true and
            .channel == "BETA" and
            .available == false and
            .version_name == "0.3.0-beta.2" and
            .tag == "v0.3.0-beta.2-publicbeta"
          ' /tmp/beta2.json >/dev/null

          echo 'OTA_BETA1_TO_BETA2=PASS'
          echo 'OTA_BETA2_CURRENT=PASS'
