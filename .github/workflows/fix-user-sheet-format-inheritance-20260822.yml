name: Fix User Sheet Format Inheritance 20260822

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths: [ '.github/workflows/fix-user-sheet-format-inheritance-20260822.yml' ]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fix-user-sheet-format-inheritance-production
  cancel-in-progress: false

env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  SERVICE_GENERATION: m2-prod-20260819-001
  WORKFLOW_PATH: .github/workflows/fix-user-sheet-format-inheritance-20260822.yml

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Patch projection append mode
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('service/src/beta47_projection.ts')
          s=p.read_text()
          a='async function appendRows(env:Env,token:string,sheet:string,range:string,values:unknown[][]):Promise<void>{'
          b='async function appendRows(env:Env,token:string,sheet:string,range:string,values:unknown[][],insertMode:"INSERT_ROWS"|"OVERWRITE"="INSERT_ROWS"):Promise<void>{'
          c='insertDataOption=INSERT_ROWS'
          d='insertDataOption=${insertMode}'
          e='await appendRows(env,token,"THÔNG TIN USER CỦA NLĐ","A:K",userRows);'
          f='await appendRows(env,token,"THÔNG TIN USER CỦA NLĐ","A:K",userRows,"OVERWRITE");'
          assert s.count(a)==1, s.count(a)
          assert s.count(c)==1, s.count(c)
          assert s.count(e)==1, s.count(e)
          s=s.replace(a,b).replace(c,d).replace(e,f)
          p.write_text(s)
          PY
          grep -Fq 'userRows,"OVERWRITE"' service/src/beta47_projection.ts
          grep -Fq 'insertDataOption=${insertMode}' service/src/beta47_projection.ts
          cd service
          npm install --no-audit --no-fund >/dev/null
          npm run check >/dev/null
          cd ..
          git diff --check
          echo patch_typecheck=PASS >/tmp/format-fix-result.txt

      - name: Commit canonical source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/beta47_projection.ts
          git commit -m 'fix(service): avoid user-sheet header format inheritance'
          git push
          PATCH_SHA=$(git rev-parse HEAD)
          echo "$PATCH_SHA" >/tmp/patch-sha
          echo "source_sha=$PATCH_SHA" >>/tmp/format-fix-result.txt
          echo canonical_commit=PASS >>/tmp/format-fix-result.txt

      - name: Guard production authority and deploy exact patched source
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [[ -n "${!v:-}" ]]; done
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/health" >/tmp/health-before.json
          jq -e --arg g "$SERVICE_GENERATION" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/health-before.json >/dev/null
          BEFORE_EPOCH=$(jq -r '.authority.authority_epoch' /tmp/health-before.json)
          BEFORE_SEQ=$(jq -r '.authority.authority_seq' /tmp/health-before.json)
          cd service
          npx wrangler d1 list --json >/tmp/d1-list.json
          D1_ID=$(node -e "const r=require('/tmp/d1-list.json');const x=r.find(v=>v.name==='pick-pack-1291-service-prod');if(!x)process.exit(2);process.stdout.write(String(x.uuid||x.id||''))")
          [[ -n "$D1_ID" ]]; export D1_ID
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name='pick-pack-1291-service';c.main='src/entry_product.ts';c.keep_vars=true;
          c.vars={SERVICE_GENERATION:'m2-prod-20260819-001',GOOGLE_SOURCE_SHEET_ID:'1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'};
          c.d1_databases[0].database_name='pick-pack-1291-service-prod';c.d1_databases[0].database_id=process.env.D1_ID;delete c.secrets;
          fs.writeFileSync('.wrangler-format-fix-runtime.jsonc',JSON.stringify(c,null,2));
          NODE
          npx wrangler d1 execute pick-pack-1291-service-prod --remote --config .wrangler-format-fix-runtime.jsonc --command "SELECT mode,scope,service_generation,authority_epoch,authority_seq FROM authority_state WHERE singleton_id=1;SELECT COUNT(*) AS attendance FROM attendance_sessions;SELECT COUNT(*) AS labor FROM labor_sessions;SELECT COUNT(*) AS events FROM events;SELECT COUNT(*) AS daily_users FROM resource_daily_consumption;SELECT pending_count FROM replication_status WHERE singleton_id=1;" --json >/tmp/predeploy-d1.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/predeploy-d1.json'));s=[b.get('results',[]) for b in x if isinstance(b,dict) and isinstance(b.get('results'),list)]
          assert len(s)>=6
          a=s[0][0];assert a['mode']=='SERVICE_PRIMARY' and a['scope']=='PRODUCTION' and a['service_generation']=='m2-prod-20260819-001'
          assert all(int(s[i][0][k])==0 for i,k in [(1,'attendance'),(2,'labor'),(3,'events'),(4,'daily_users')])
          assert int(s[5][0]['pending_count'])==0
          PY
          npx wrangler deploy --config .wrangler-format-fix-runtime.jsonc --keep-vars >/tmp/deploy.out 2>/tmp/deploy.err
          rm -f .wrangler-format-fix-runtime.jsonc
          cd ..
          echo "authority_epoch=$BEFORE_EPOCH" >>/tmp/format-fix-result.txt
          echo "authority_seq=$BEFORE_SEQ" >>/tmp/format-fix-result.txt
          echo authority_and_zero_state_gate=PASS >>/tmp/format-fix-result.txt
          echo deploy=PASS >>/tmp/format-fix-result.txt

      - name: Verify live service and report
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/health" >/tmp/health-after.json
          jq -e --arg g "$SERVICE_GENERATION" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/health-after.json >/dev/null
          echo live_health=PASS >>/tmp/format-fix-result.txt
          echo user_sheet_append_mode=OVERWRITE >>/tmp/format-fix-result.txt
          echo history_append_mode=INSERT_ROWS_UNCHANGED >>/tmp/format-fix-result.txt
          echo stable=UNTOUCHED >>/tmp/format-fix-result.txt
          echo verdict=PASS >>/tmp/format-fix-result.txt
          BODY=$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/format-fix-result.txt)
          gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="USER_SHEET_FORMAT_INHERITANCE_FIX run=${GITHUB_RUN_ID}%0A${BODY}"

      - name: Retire one-time workflow
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git pull --rebase
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm "$WORKFLOW_PATH"
          git commit -m 'ci: retire one-time user sheet format fix workflow'
          git push
