name: S07 Non-UI Refactor Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s07-trigger.txt'

permissions:
  contents: write

jobs:
  refactor-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply non-UI global refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/s07_nonui_refactor.py
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.7"' app/build.gradle.kts
          ! grep -q 'TransitionManager.beginDelayedTransition' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'Đồng bộ / dữ liệu' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'private fun businessHome()' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" \
             && -f "$ANDROID_HOME/platforms/android-36/android.jar" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "Using preinstalled Android SDK: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Beta and Stable release candidates
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleBetaRelease :app:assembleStableRelease
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"
          test -s "$STABLE"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$BETA" > /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='13'" /tmp/beta.txt
          grep -q "versionName='0.4.2-beta.7'" /tmp/beta.txt

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git commit -m 'refactor: use one persistent tab shell and user-facing copy rules'
          git pull --rebase origin main
          git push origin HEAD:main
