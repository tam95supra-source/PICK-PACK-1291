name: Temp classify Bao Hang Google OAuth

on:
  push:
    branches: ['temp/bh-gas-deploy-20260819']
    paths: ['.github/workflows/temp-deploy-baohang-gas.yml']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect OAuth capability without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bhgas"
          STATUS="$RUNNER_TEMP/bhgas/status.txt"
          node <<'NODE'
          const fs=require('fs');
          const out=[]; const add=(k,v)=>out.push(`${k}=${String(v).replace(/[\r\n]+/g,' ').slice(0,300)}`);
          const done=()=>fs.writeFileSync(process.env.RUNNER_TEMP+'/bhgas/status.txt',out.join('\n')+'\n');
          async function json(url,opt={}){const r=await fetch(url,opt);const t=await r.text();let j={};try{j=JSON.parse(t)}catch{j={raw:t}};return {r,j,t}}
          (async()=>{
            const x=await json('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:process.env.GOOGLE_OAUTH_CLIENT_ID||'',client_secret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||'',refresh_token:process.env.GOOGLE_OAUTH_REFRESH_TOKEN||'',grant_type:'refresh_token'})});
            if(!x.r.ok||!x.j.access_token){add('oauth','FAIL_'+x.r.status);done();return}
            const token=x.j.access_token; add('oauth','PASS');
            const ti=await json('https://oauth2.googleapis.com/tokeninfo?access_token='+encodeURIComponent(token));
            const scopes=String(ti.j.scope||'').split(/\s+/).filter(Boolean).sort();
            add('has_script_projects',scopes.some(s=>s.includes('/auth/script.projects'))?'YES':'NO');
            add('has_script_deployments',scopes.some(s=>s.includes('/auth/script.deployments'))?'YES':'NO');
            add('has_drive',scopes.some(s=>s==="https://www.googleapis.com/auth/drive"||s.startsWith('https://www.googleapis.com/auth/drive.'))?'YES':'NO');
            add('scope_count',scopes.length);
            const d=await json("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("mimeType='application/vnd.google-apps.script' and trashed=false")+"&pageSize=10&fields=files(id,name)",{headers:{Authorization:'Bearer '+token}});
            add('drive_http',d.r.status);
            add('drive_reason',d.j?.error?.errors?.[0]?.reason||d.j?.error?.status||'');
            add('drive_message_class',String(d.j?.error?.message||'').replace(/[^A-Za-z0-9 _.-]/g,'').slice(0,120));
            done();
          })().catch(e=>{add('fatal',e.message);done()});
          NODE
      - name: Record sanitized capability result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          cp "$RUNNER_TEMP/bhgas/status.txt" ops/temp-baohang-gas-deploy-status.txt
          cat ops/temp-baohang-gas-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/temp-baohang-gas-deploy-status.txt
          git diff --cached --quiet || git commit -m 'chore(temp): record Bao Hang Google OAuth capability'
          git push origin HEAD:temp/bh-gas-deploy-20260819
