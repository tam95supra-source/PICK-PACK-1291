name: Temp deploy exact Bao Hang GAS

on:
  push:
    branches: ['temp/bh-gas-deploy-20260819']
    paths: ['.github/workflows/temp-deploy-baohang-gas.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      BH_SCRIPT_ID: 19sORZBxocd2cHccG7nEAuqbpEiu4nl8Ka6vXvPz5_SoTB9WtJRRHmTxN
      BH_DEPLOYMENT_ID: AKfycbxJzYNRJuvkYRlS8djWwZSPmXEUXmcvoW9dA8DZwxmVk410Smg77d--tuDKghQjoZa55Q
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and normalize canonical Bao Hang worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bhgas"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/tam95supra-source/bao-hang-1291/main/google-apps-script/DEPLOY_NEON.gs \
            -o "$RUNNER_TEMP/bhgas/DEPLOY_NEON.gs"
          python3 - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'bhgas'/'DEPLOY_NEON.gs'
          s=p.read_text(encoding='utf-8')
          # Normalize the new staff source role contract even if Bao repo patch workflow has not landed yet.
          s=s.replace("const variants = [\"select A,B,D,E where G = 1291 and H = 'HY1'\",\"select A,B,D,E where G = '1291' and H = 'HY1'\"];", "const variants = [\"select A,B,D,E,F where G = 1291 and H = 'HY1'\",\"select A,B,D,E,F where G = '1291' and H = 'HY1'\"];", 1)
          s=s.replace("const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim();\n        byCode[code.toLowerCase()]={employee_code:code,full_name:name,contractor:contractor,source_position:position,role:staffRole_(position,code)};", "const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim(),department=String(row[4]||'').trim();\n        byCode[code.toLowerCase()]={employee_code:code,full_name:name,contractor:contractor,source_position:position,role:staffRole_(position,department,code)};", 1)
          old="""function staffRole_(position,code) {
  if(String(code)===BH_PROTECTED_ADMIN_CODE)return 'ADMIN';
  const p=String(position||'').toUpperCase();
  if(p.indexOf('INVENT')>=0)return 'INVENT';
  return 'PICKER';
}"""
          new="""function staffRole_(position,department,code) {
  if(String(code)===BH_PROTECTED_ADMIN_CODE)return 'ADMIN';
  const p=String(position||'').toUpperCase();
  const d=String(department||'').toUpperCase();
  if(p.indexOf('ĐIỀU PHỐI')>=0 || p.indexOf('DIEU PHOI')>=0)return 'ADMIN_INVENT';
  if(d.indexOf('INVENT')>=0 || p.indexOf('INVENT')>=0)return 'INVENT';
  return 'PICKER';
}"""
          if old in s: s=s.replace(old,new,1)
          s=s.replace("if(caller.profile.role==='ADMIN_INVENT' && role!=='PICKER')throw new Error('FORBIDDEN');", "if(caller.profile.role==='ADMIN_INVENT' && ['INVENT','PICKER'].indexOf(role)<0)throw new Error('FORBIDDEN');", 1)
          s=s.replace("if(caller.profile.role==='ADMIN_INVENT'&&target.role!=='PICKER')throw new Error('FORBIDDEN');", "if(caller.profile.role==='ADMIN_INVENT'&&['INVENT','PICKER'].indexOf(String(target.role||''))<0)throw new Error('FORBIDDEN');", 1)
          required=[
            "const BH_PROJECT = 'bao-hang-1291';",
            "const BH_STAFF_SHEET_ID = '1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78';",
            "const BH_STAFF_SHEET_NAME = 'DANH SÁCH NHÂN SỰ';",
            "select A,B,D,E,F where G = 1291 and H = 'HY1'",
            "staffRole_(position,department,code)",
            "['INVENT','PICKER'].indexOf(role)<0",
          ]
          for x in required:
              if x not in s: raise SystemExit('NORMALIZE_MISSING:'+x)
          p.write_text(s,encoding='utf-8')
          PY
          cp "$RUNNER_TEMP/bhgas/DEPLOY_NEON.gs" "$RUNNER_TEMP/bhgas/DEPLOY_NEON.js"
          node --check "$RUNNER_TEMP/bhgas/DEPLOY_NEON.js"

      - name: Verify exact existing project and update deployment in place
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=process.env.RUNNER_TEMP+'/bhgas/status.txt';
          const out=[]; const add=(k,v)=>out.push(`${k}=${String(v).replace(/[\r\n]+/g,' ').slice(0,260)}`); const done=()=>fs.writeFileSync(path,out.join('\n')+'\n');
          async function req(url,opt={}){const r=await fetch(url,opt);const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{j={raw:t}};if(!r.ok){const e=new Error(`HTTP_${r.status}:${String(j?.error?.message||j?.error||j?.raw||'').slice(0,160)}`);e.status=r.status;throw e}return j}
          (async()=>{
            const tok=await req('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:process.env.GOOGLE_OAUTH_CLIENT_ID||'',client_secret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||'',refresh_token:process.env.GOOGLE_OAUTH_REFRESH_TOKEN||'',grant_type:'refresh_token'})});
            const access=tok.access_token;if(!access)throw new Error('NO_ACCESS_TOKEN'); add('oauth','PASS');
            const auth={Authorization:`Bearer ${access}`};
            const scriptId=process.env.BH_SCRIPT_ID, deploymentId=process.env.BH_DEPLOYMENT_ID;
            const current=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/content`,{headers:auth});
            const joined=(current.files||[]).map(x=>String(x.source||'')).join('\n');
            if(!joined.includes("const BH_PROJECT = 'bao-hang-1291'")||!joined.includes("const BH_NEON_PROJECT = 'tiny-boat-19315489'"))throw new Error('EXACT_SCRIPT_SCOPE_MISMATCH');
            add('script_scope','PASS');
            const dep=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/deployments/${encodeURIComponent(deploymentId)}`,{headers:auth});
            const web=(dep.entryPoints||[]).map(e=>e.webApp).find(Boolean); if(!web?.url)throw new Error('WEB_APP_ENTRY_MISSING');
            const before=await req(web.url,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})});
            if(!(before.ok===true&&before.project==='bao-hang-1291'&&before.provider==='NEON_FIREBASE_GOOGLE'))throw new Error('LIVE_SCOPE_MISMATCH');
            add('live_scope','PASS');
            const canonical=fs.readFileSync(process.env.RUNNER_TEMP+'/bhgas/DEPLOY_NEON.gs','utf8');
            let code=(current.files||[]).find(x=>x.type==='SERVER_JS'&&String(x.source||'').includes("const BH_PROJECT = 'bao-hang-1291'"));
            if(!code)code=(current.files||[]).find(x=>x.type==='SERVER_JS'&&String(x.source||'').includes('function doPost'));
            if(!code)throw new Error('SERVER_JS_NOT_FOUND');
            code.source=canonical;
            await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/content`,{method:'PUT',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({files:current.files})}); add('source_update','PASS');
            const ver=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/versions`,{method:'POST',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({description:'Bao Hang 1291 staff source DANH SÁCH NHÂN SỰ + account permission fix'})});
            await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/deployments/${encodeURIComponent(deploymentId)}`,{method:'PUT',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({deploymentConfig:{scriptId,versionNumber:Number(ver.versionNumber),manifestFileName:'appsscript',description:'Bao Hang 1291 production worker'}})}); add('deployment_update','PASS'); add('version',ver.versionNumber);
            let ok=false,last='';
            for(let i=0;i<20;i++){
              try{const p=await req(web.url,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})});last=JSON.stringify(p);if(p.ok===true&&p.project==='bao-hang-1291'&&p.staff_sheet_id==='1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'&&p.staff_sheet_name==='DANH SÁCH NHÂN SỰ'){ok=true;break}}catch(e){last=e.message}
              await new Promise(r=>setTimeout(r,3000));
            }
            add('live_staff_source',ok?'PASS':'FAIL'); if(!ok)add('live_detail',last); done();
          })().catch(e=>{add('fatal',e.message);done()});
          NODE

      - name: Record sanitized result on temp branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          test -s "$RUNNER_TEMP/bhgas/status.txt" || printf 'fatal=workflow_failed_before_status\n' > "$RUNNER_TEMP/bhgas/status.txt"
          cp "$RUNNER_TEMP/bhgas/status.txt" ops/temp-baohang-gas-deploy-status.txt
          cat ops/temp-baohang-gas-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/temp-baohang-gas-deploy-status.txt
          git diff --cached --quiet || git commit -m 'chore(temp): record exact Bao Hang GAS deployment result'
          git pull --rebase origin temp/bh-gas-deploy-20260819
          git push origin HEAD:temp/bh-gas-deploy-20260819
