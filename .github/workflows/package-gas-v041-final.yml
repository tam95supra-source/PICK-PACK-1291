name: Package Final GSheet API v0.4.1
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/package-gas-v041-final.yml' ]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp google-apps-script/PICK_PACK_API.gs dist/pkg/
          cp google-apps-script/appsscript.json dist/pkg/
          cp DEPLOY_GSHEET_API.md dist/pkg/
          cat > dist/pkg/DEPLOY_V0.4.1.txt <<'EOF'
          PICK PACK 1291 — GSHEET API v0.4.1 FINAL
          Mở DỮ LIỆU THEO NGÀY > Extensions > Apps Script.
          Thay PICK_PACK_API.gs và manifest bằng file trong gói.
          Deploy > Manage deployments > Edit > New version > Deploy.
          Giữ Execute as: Me và access hiện tại.
          Sau deploy, POST health phải trả api_version=0.4.1 và master_revision.
          Kiến trúc: Android App <-> Google Apps Script <-> Google Sheets. Không thêm service khác.
          EOF
          (cd dist/pkg && zip -q ../pick-pack-1291-gsheet-api-v0.4.1-deploy.zip *)
          sha256sum dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip > dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-gsheet-api-v0.4.1-final
          path: |
            dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip
            dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip.sha256
          retention-days: 2
