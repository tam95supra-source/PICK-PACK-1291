name: Verify Beta4 Drive OTA Final

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-ota-beta4-final.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      EXPECTED_SHA: e6bff0cc81f82cb6e8365f9fff3abd3e4c76dcfcfa65d85fe54789d131485084
    steps:
      - name: Verify beta3 sees beta4 and download hash matches
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$WEB_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.3"}' > /tmp/u.json
          python3 - <<'PY' > /tmp/url
          import json
          j=json.load(open('/tmp/u.json'))
          assert j.get('ok') is True, j
          assert j.get('available') is True, j
          assert j.get('channel') == 'BETA', j
          assert j.get('version_name') == '0.4.2-beta.4', j
          assert j.get('sha256') == 'e6bff0cc81f82cb6e8365f9fff3abd3e4c76dcfcfa65d85fe54789d131485084', j
          print(j['apk_url'])
          PY
          curl -fsSL "$(cat /tmp/url)" -o /tmp/beta4.apk
          echo "$EXPECTED_SHA  /tmp/beta4.apk" | sha256sum -c -
          echo 'beta3 -> beta4 + Drive download SHA: PASS'

      - name: Verify beta4 current and Stable isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$WEB_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.4"}' > /tmp/current.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/current.json'))
          assert j.get('ok') is True and j.get('channel')=='BETA'
          assert j.get('available') is False, j
          print('beta4 self-update suppression: PASS')
          PY
          curl -fsSL -H 'content-type: application/json' "$WEB_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/stable.json'))
          assert j.get('ok') is True and j.get('channel')=='STABLE', j
          assert j.get('version_name') != '0.4.2-beta.4', j
          print('Stable channel isolation: PASS')
          PY
