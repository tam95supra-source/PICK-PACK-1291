name: Session11 Beta33 OTA Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session11-beta33-ota-diagnostic-trigger.txt]
permissions:
  contents: write
concurrency:
  group: session11-beta33-ota-diagnostic
  cancel-in-progress: false
env:
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - name: Read OTA metadata and public bytes
        shell: bash
        run: |
          set -u
          OUT=/tmp/r; echo "checked_at=$(date -u +%FT%TZ)" >"$OUT"; echo "head_sha=$GITHUB_SHA" >>"$OUT"
          HTTP=$(curl -sS -o /tmp/ota.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.32"}' || true)
          echo "beta_http=$HTTP" >>"$OUT"
          node - <<'NODE' >>"$OUT"
          const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/ota.json','utf8'))}catch(e){console.log('beta_json_parse=false');process.exit(0)}
          console.log(`beta_ok=${j.ok}`);console.log(`beta_available=${j.available??j.update_available}`);console.log(`beta_version=${j.version_name??j.version??''}`);console.log(`beta_size=${j.size??''}`);console.log(`beta_sha=${String(j.sha256??'').toLowerCase()}`);console.log(`beta_url_present=${String(j.apk_url??j.download_url??j.url??'').length>20}`);console.log(`beta_error=${j.error??''}`);
          NODE
          URL=$(jq -r '.apk_url // .download_url // .url // empty' /tmp/ota.json 2>/dev/null)
          if [[ -n "$URL" ]]; then
            DHTTP=$(curl -sS -L -o /tmp/public.apk -w '%{http_code}' "$URL" || true); echo "download_http=$DHTTP" >>"$OUT"
            if [[ -s /tmp/public.apk ]]; then echo "download_size=$(stat -c%s /tmp/public.apk)" >>"$OUT"; echo "download_sha=$(sha256sum /tmp/public.apk|awk '{print $1}')" >>"$OUT"; fi
          fi
          SHTTP=$(curl -sS -o /tmp/self.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.33"}' || true); echo "self_http=$SHTTP" >>"$OUT"
          node - <<'NODE' >>"$OUT"
          const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('/tmp/self.json','utf8'))}catch{};console.log(`self_ok=${j.ok}`);console.log(`self_available=${j.available??j.update_available}`);console.log(`self_version=${j.version_name??j.version??''}`);console.log(`self_error=${j.error??''}`);
          NODE
          echo verdict=DIAGNOSTIC_COMPLETE >>"$OUT"
      - name: Record result
        if: always()
        shell: bash
        run: |
          test -f /tmp/r || echo verdict=DIAGNOSTIC_FAILED >/tmp/r; cp /tmp/r /tmp/c; git reset --hard HEAD >/dev/null; git pull --rebase origin agent/service-migration-m2 || true; cp /tmp/c ops/session11-beta33-ota-diagnostic-result.txt
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session11-beta33-ota-diagnostic-result.txt; git diff --cached --quiet || git commit -m 'ops: record Beta33 OTA diagnostic'; git push origin HEAD:agent/service-migration-m2
