name: Build Beta Preview APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/beta-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-beta-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble Beta Preview
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/pick-pack-1291-beta-v0.1.0-beta.1-preview.apk
          sha256sum dist/pick-pack-1291-beta-v0.1.0-beta.1-preview.apk | tee dist/SHA256SUMS.txt

      - name: Verify APK
        shell: bash
        run: |
          APK=dist/pick-pack-1291-beta-v0.1.0-beta.1-preview.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -20

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-beta-v0.1.0-beta.1-preview
          path: dist/*
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.1-preview
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/pick-pack-1291-beta-v0.1.0-beta.1-preview.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/pick-pack-1291-beta-v0.1.0-beta.1-preview.apk \
              dist/SHA256SUMS.txt \
              --prerelease \
              --title "Pick Pack 1291 Beta UI Preview 0.1.0-beta.1" \
              --notes "First installable UI/UX preview using approved Interface Sample 3. This build is intentionally backend-disconnected and uses debug signing for visual/interaction review only. Do not treat it as the permanent OTA signing baseline."
          fi
