name: Build Public Beta APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/beta-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-public-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Public Beta API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            -X POST 'https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-beta-api' \
            -H 'content-type: application/json' \
            -d '{"action":"health"}' | tee /tmp/pick-pack-health.json
          grep -q '"ok":true' /tmp/pick-pack-health.json
          grep -q '"sheet_read":true' /tmp/pick-pack-health.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble Public Beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/pick-pack-1291-public-beta-v0.2.0-beta.1.apk
          sha256sum dist/pick-pack-1291-public-beta-v0.2.0-beta.1.apk | tee dist/SHA256SUMS.txt

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/pick-pack-1291-public-beta-v0.2.0-beta.1.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'"
          echo "$BADGING" | grep -q "versionCode='2'"
          echo "$BADGING" | grep -q "versionName='0.2.0-beta.1-publicbeta'"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-v0.2.0-beta.1
          path: dist/*
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-beta.1-publicbeta
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Connected Public Beta for field testing. UI switches to approved Interface Sample 1, applies system-bar insets and a smaller bottom-pinned copyright. VÀO/RA are merged into QUÉT QR NHÂN SỰ. Login, personnel lookup, live master-resource lookup, ENTER and EXIT use the real authoritative Beta API with idempotent transactional state. Google Sheet projection is durably queued and reports pending ACK until the dedicated Sheet writer is activated. This separate public-beta package is debug-signed for pilot testing and is not the permanent OTA signing baseline.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/pick-pack-1291-public-beta-v0.2.0-beta.1.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/pick-pack-1291-public-beta-v0.2.0-beta.1.apk \
              dist/SHA256SUMS.txt \
              --prerelease \
              --title "Pick Pack 1291 Public Beta 0.2.0-beta.1" \
              --notes "$NOTES"
          fi
