name: Build Full Beta and Stable Channel APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/beta-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Full Beta API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            -X POST 'https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-beta-api' \
            -H 'content-type: application/json' \
            -d '{"action":"health"}' | tee /tmp/pick-pack-health.json
          grep -q '"ok":true' /tmp/pick-pack-health.json
          grep -q '"sheet_read":true' /tmp/pick-pack-health.json
          grep -q '"mode":"FULL_BETA"' /tmp/pick-pack-health.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble Beta and Stable channels
        run: gradle --no-daemon :app:assembleBetaDebug :app:assembleStableDebug

      - name: Prepare named APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/beta dist/stable
          cp app/build/outputs/apk/beta/debug/app-beta-debug.apk dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.1.apk
          cp app/build/outputs/apk/stable/debug/app-stable-debug.apk dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk
          (cd dist/beta && sha256sum pick-pack-1291-public-beta-v0.3.0-beta.1.apk > SHA256SUMS.txt)
          (cd dist/stable && sha256sum pick-pack-1291-stable-channel-v0.1.0.apk > SHA256SUMS.txt)

      - name: Verify Beta APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.1.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'"
          echo "$BADGING" | grep -q "versionCode='3'"
          echo "$BADGING" | grep -q "versionName='0.3.0-beta.1'"

      - name: Verify Stable channel APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='vn.pickpack1291.app.stable'"
          echo "$BADGING" | grep -q "versionCode='1'"
          echo "$BADGING" | grep -q "versionName='0.1.0-stable'"

      - name: Upload Beta workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-v0.3.0-beta.1
          path: dist/beta/*
          retention-days: 30

      - name: Upload Stable channel verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-stable-channel-v0.1.0
          path: dist/stable/*
          retention-days: 14

      - name: Publish Full Public Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-beta.1-publicbeta
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Full-function Public Beta. Enables QUÉT QR NHÂN SỰ/VÀO/RA, CÔNG NHẬT start-finish, atomic TÀI NGUYÊN changes, DANH SÁCH, BÁO CÁO, đổi mật khẩu, diagnostic ACK and ADMIN/SUPERADMIN account management. Beta and Stable now share an automatic foreground OTA checker: when a newer channel release exists the app shows the update prompt automatically, downloads through Android DownloadManager, verifies SHA-256 and opens the Android package installer. [OTA signing note] Long-lived in-place updates still require a fixed signing key stored outside this public repository; the current CI debug identity is pilot-only.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.1.apk dist/beta/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.1.apk \
              dist/beta/SHA256SUMS.txt \
              --prerelease \
              --title "Pick Pack 1291 Full Public Beta 0.3.0-beta.1" \
              --notes "$NOTES"
          fi
