name: Build App-GSheet Beta and Stable APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'google-apps-script/**'
      - 'ARCHITECTURE_GUARDRAILS.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/beta-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce approved architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f ARCHITECTURE_GUARDRAILS.md
          test -f google-apps-script/PICK_PACK_API.gs
          test ! -d supabase
          if grep -RniE 'supabase[.]co|supabase/functions|io[.]supabase|supabase-js' app google-apps-script; then
            echo 'Forbidden external backend runtime reference found.' >&2
            exit 1
          fi
          grep -q 'Google Apps Script' README.md
          grep -q 'Google Sheets' README.md

      - name: Probe deployed Google Sheet API
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GSHEET_API_URL" == https://script.google.com/* ]]
          curl -fsSL --retry 3 --retry-delay 2 \
            -H 'content-type: application/json' \
            "$GSHEET_API_URL" \
            -d '{"action":"health"}' | tee /tmp/pick-pack-health.json
          grep -q '"ok":true' /tmp/pick-pack-health.json
          grep -q '"mode":"APP_GSHEET"' /tmp/pick-pack-health.json
          grep -q '"sheet_read":true' /tmp/pick-pack-health.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Normalize Kotlin lexical whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Assemble Beta and Stable channels
        run: gradle --no-daemon :app:assembleBetaRelease :app:assembleStableRelease

      - name: Verify compiled package metadata
        shell: bash
        run: |
          set -euo pipefail
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"
          test -s "$STABLE"
          B=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$BETA")
          S=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$STABLE")
          echo "$B" | grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'"
          echo "$B" | grep -q "versionCode='6'"
          echo "$B" | grep -q "versionName='0.4.1-beta.1'"
          echo "$S" | grep -q "package: name='vn.pickpack1291.app.stable'"
          echo "$S" | grep -q "versionName='0.1.0-stable'"

      - name: Upload unsigned Beta signing toolkit
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-beta-v0.4.1-signing-toolkit
          path: |
            app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0/lib/apksigner.jar
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0/zipalign
          retention-days: 2

      - name: Detect automated release readiness
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          READY=true
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do
            if [[ -z "${!v:-}" ]]; then READY=false; fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" != true ]]; then
            echo 'Automated CI publication awaits GitHub Actions signing secrets; build/toolkit remains available for controlled signing.'
          fi

      - name: Sign fixed-identity Beta and Stable APKs
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/pick-pack-1291-release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          mkdir -p dist/beta dist/stable
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" \
            --out dist/beta/pick-pack-1291-public-beta-v0.4.1-beta.1.apk \
            app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" \
            --out dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk \
            app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          (cd dist/beta && sha256sum pick-pack-1291-public-beta-v0.4.1-beta.1.apk > SHA256SUMS.txt)
          (cd dist/stable && sha256sum pick-pack-1291-stable-channel-v0.1.0.apk > SHA256SUMS.txt)

      - name: Verify fixed signing identity
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/beta/pick-pack-1291-public-beta-v0.4.1-beta.1.apk | tee /tmp/beta-cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED" /tmp/beta-cert.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk | tee /tmp/stable-cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED" /tmp/stable-cert.txt

      - name: Upload signed Beta artifact
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-v0.4.1-beta.1
          path: dist/beta/*
          retention-days: 30

      - name: Publish corrected Full Public Beta
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.1-beta.1-publicbeta
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Full-function beta on Android App ↔ Google Apps Script ↔ Google Sheets. v0.4.1 adds local/static master caching, revision-based master refresh, shift-aware Pack mapping, corrected log routing, hardware-scanner Enter support, edge swipe-back navigation, launcher adaptive icon and operational layout/status redesign.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/beta/pick-pack-1291-public-beta-v0.4.1-beta.1.apk dist/beta/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/beta/pick-pack-1291-public-beta-v0.4.1-beta.1.apk \
              dist/beta/SHA256SUMS.txt \
              --prerelease \
              --title "Pick Pack 1291 Full Public Beta 0.4.1-beta.1" \
              --notes "$NOTES"
          fi

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pick-pack-1291-release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
