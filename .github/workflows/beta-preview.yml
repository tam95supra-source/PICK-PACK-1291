name: Build Full Beta and Stable Channel APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/beta-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Full Beta API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            -X POST 'https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-beta-api' \
            -H 'content-type: application/json' \
            -d '{"action":"health"}' | tee /tmp/pick-pack-health.json
          grep -q '"ok":true' /tmp/pick-pack-health.json
          grep -q '"sheet_read":true' /tmp/pick-pack-health.json
          grep -q '"mode":"FULL_BETA"' /tmp/pick-pack-health.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch fixed Android signing key via GitHub OIDC
        shell: bash
        env:
          SIGNING_BROKER_URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-ci-signing
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          OIDC_JSON="$RUNNER_TEMP/oidc.json"
          BUNDLE="$RUNNER_TEMP/signing-bundle.json"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 1 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pick-pack-1291-signing" > "$OIDC_JSON"
          OIDC_TOKEN="$(jq -er '.value' "$OIDC_JSON")"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 1 -X POST "$SIGNING_BROKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" > "$BUNDLE"
          jq -e '.ok == true and .repository == "tam95supra-source/pick-pack-1291" and .alias == "pickpack1291"' "$BUNDLE" >/dev/null
          jq -er '.keystore_b64' "$BUNDLE" | base64 -d > "$RUNNER_TEMP/pick-pack-1291-release.jks"
          jq -er '.store_password' "$BUNDLE" > "$RUNNER_TEMP/store.pass"
          jq -er '.key_password' "$BUNDLE" > "$RUNNER_TEMP/key.pass"
          jq -er '.alias' "$BUNDLE" > "$RUNNER_TEMP/key.alias"
          chmod 600 "$RUNNER_TEMP/pick-pack-1291-release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass" "$RUNNER_TEMP/key.alias"
          rm -f "$OIDC_JSON" "$BUNDLE"

      - name: Normalize Kotlin lexical whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Assemble Beta and Stable channels
        run: gradle --no-daemon :app:assembleBetaRelease :app:assembleStableRelease

      - name: Sign fixed-identity Beta and Stable APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/beta dist/stable
          KS="$RUNNER_TEMP/pick-pack-1291-release.jks"
          STORE_PASS="$RUNNER_TEMP/store.pass"
          KEY_PASS="$RUNNER_TEMP/key.pass"
          ALIAS="$(cat "$RUNNER_TEMP/key.alias")"
          BETA_UNSIGNED=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE_UNSIGNED=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA_UNSIGNED"
          test -s "$STABLE_UNSIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "file:$STORE_PASS" --key-pass "file:$KEY_PASS" --out dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.2.apk "$BETA_UNSIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "file:$STORE_PASS" --key-pass "file:$KEY_PASS" --out dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk "$STABLE_UNSIGNED"
          (cd dist/beta && sha256sum pick-pack-1291-public-beta-v0.3.0-beta.2.apk > SHA256SUMS.txt)
          (cd dist/stable && sha256sum pick-pack-1291-stable-channel-v0.1.0.apk > SHA256SUMS.txt)

      - name: Verify Beta APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.2.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/beta-cert.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e' /tmp/beta-cert.txt
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'"
          echo "$BADGING" | grep -q "versionCode='4'"
          echo "$BADGING" | grep -q "versionName='0.3.0-beta.2'"

      - name: Verify Stable channel APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/stable/pick-pack-1291-stable-channel-v0.1.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/stable-cert.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e' /tmp/stable-cert.txt
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='vn.pickpack1291.app.stable'"
          echo "$BADGING" | grep -q "versionCode='1'"
          echo "$BADGING" | grep -q "versionName='0.1.0-stable'"

      - name: Upload Beta workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-v0.3.0-beta.2
          path: dist/beta/*
          retention-days: 30

      - name: Upload Stable channel verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-stable-channel-v0.1.0
          path: dist/stable/*
          retention-days: 14

      - name: Publish Full Public Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-beta.2-publicbeta
        shell: bash
        run: |
          set -euo pipefail
          NOTES='S02 full-function Public Beta. Adds adaptive foreground realtime sync using authoritative server_seq with ACTIVE/DRAINING/SUSPENDED lifecycle, keeps QUÉT QR NHÂN SỰ/VÀO/RA, CÔNG NHẬT, atomic TÀI NGUYÊN, DANH SÁCH, BÁO CÁO and role controls, and switches CI to a fixed Android release signing identity delivered only to the trusted main-branch release workflow through GitHub OIDC. OTA still verifies APK SHA-256 before opening Android package installer. Google Sheet projection writer is isolated and fail-closed until its dedicated Apps Script deployment is commissioned.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.2.apk dist/beta/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/beta/pick-pack-1291-public-beta-v0.3.0-beta.2.apk \
              dist/beta/SHA256SUMS.txt \
              --prerelease \
              --title "Pick Pack 1291 Full Public Beta 0.3.0-beta.2" \
              --notes "$NOTES"
          fi

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pick-pack-1291-release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass" "$RUNNER_TEMP/key.alias" "$RUNNER_TEMP/oidc.json" "$RUNNER_TEMP/signing-bundle.json"
