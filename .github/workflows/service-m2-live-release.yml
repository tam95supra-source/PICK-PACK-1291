name: Service M2 Live Web and Beta OTA

on:
  workflow_dispatch:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/m2-live-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: service-m2-live-release
  cancel-in-progress: false

env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_GENERATION: m2-prod-20260819-001
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  BETA_VERSION: 0.4.2-beta.19
  BETA_VERSION_CODE: '25'
  PREVIOUS_BETA_VERSION: 0.4.2-beta.18
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 0

      - name: Owner cutover trigger and secret preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            test -f ops/m2-live-release-trigger.txt
            grep -qx 'confirmation=OWNER_LOCKED_M2_CUTOVER' ops/m2-live-release-trigger.txt
            grep -qx "target_version=$BETA_VERSION" ops/m2-live-release-trigger.txt
          fi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do
            if [[ -z "${!v:-}" ]]; then echo "MISSING_REQUIRED_SECRET:$v" >&2; exit 1; fi
          done
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.19"' app/build.gradle.kts
          echo 'Secret-name preflight and Beta19 source version: PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive stable runtime-only secrets
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          SERVICE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-service-token-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$SERVICE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "SERVICE_TOKEN_SECRET=$SERVICE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Typecheck Service and PWA
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          node --check public/app.js
          node --check public/sw.js

      - name: Resolve clean production D1 and apply migrations
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          if [[ -z "$ID" ]]; then
            npx wrangler d1 create "$D1_NAME" --location apac >/tmp/d1-create.log
            LIST=$(npx wrangler d1 list --json)
            ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          fi
          test -n "$ID"
          echo "PROD_D1_ID=$ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"name": "pick-pack-1291-service-m1-staging"', '"name": "'+os.environ['WORKER_NAME']+'"')
          s=s.replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"', '"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"')
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"', '"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__', os.environ['PROD_D1_ID'])
          Path('wrangler.live.jsonc').write_text(s)
          PY
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.live.jsonc
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "SELECT name FROM d1_migrations ORDER BY id;" --json)
          node -e 'const x=JSON.parse(process.argv[1]);const r=x?.[0]?.results||[];if(r.length<2)throw new Error("M2 migrations missing")' "$OUT"

      - name: Deploy Service Worker and PWA in shadow mode
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('/tmp/m2-worker-secrets.json',JSON.stringify({
            SERVICE_TOKEN_SECRET:process.env.SERVICE_TOKEN_SECRET,
            M1_ADMIN_TOKEN:process.env.M2_ADMIN_TOKEN,
            GAS_BRIDGE_SHARED_SECRET:process.env.GAS_BRIDGE_SHARED_SECRET,
            GOOGLE_OAUTH_CLIENT_ID:process.env.GOOGLE_OAUTH_CLIENT_ID,
            GOOGLE_OAUTH_CLIENT_SECRET:process.env.GOOGLE_OAUTH_CLIENT_SECRET,
            GOOGLE_OAUTH_REFRESH_TOKEN:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,
            GOOGLE_STAGING_SHEET_ID:process.env.STAGING_SHEET_ID
          }));
          NODE
          chmod 600 /tmp/m2-worker-secrets.json
          npx wrangler deploy --config wrangler.live.jsonc --secrets-file /tmp/m2-worker-secrets.json 2>&1 | tee /tmp/m2-deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/m2-deploy.log | tail -1 || true)
          test -n "$URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          curl -fsS --retry 5 --retry-delay 2 "$URL/health" > /tmp/service-shadow-health.json
          grep -q '"ok":true' /tmp/service-shadow-health.json
          grep -q '"environment":"staging-shadow"' /tmp/service-shadow-health.json
          curl -fsS --retry 5 --retry-delay 2 "$URL/" > /tmp/pwa.html
          grep -qi '<html' /tmp/pwa.html
          curl -fsS "$URL/manifest.webmanifest" >/tmp/pwa-manifest.json
          echo "PWA shadow URL: $URL"

      - name: Bootstrap current production workbook twice while still shadow
        shell: bash
        run: |
          set -euo pipefail
          for n in a b; do
            curl -fsS --retry 3 --retry-delay 2 -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" "$SERVICE_URL/internal/bootstrap-google" > "/tmp/bootstrap-$n.json"
            node -e 'const j=require(process.argv[1]);if(!j.ok)throw new Error(JSON.stringify(j))' "/tmp/bootstrap-$n.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const a=JSON.parse(fs.readFileSync('/tmp/bootstrap-a.json')),b=JSON.parse(fs.readFileSync('/tmp/bootstrap-b.json'));
          const pick=x=>JSON.stringify({sheets:x.sheets||x.sheet_report||x.report?.sheets,projection_counts:x.projection_counts||x.report?.projection_counts,business_date_min:x.business_date_min||x.report?.business_date_min,business_date_max:x.business_date_max||x.report?.business_date_max});
          if(pick(a)!==pick(b))throw new Error('REBOOTSTRAP_CHANGED');
          NODE

      - name: Exchange Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP")
          test -n "$TOKEN"; echo "::add-mask::$TOKEN"; echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy GAS M2 control plane in RECONCILING fence
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(curl -fsS "$SERVICE_URL/v1/authority")
          CURRENT_EPOCH=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.authority.authority_epoch))' "$AUTH")
          TARGET_EPOCH=$((CURRENT_EPOCH+1))
          echo "TARGET_EPOCH=$TARGET_EPOCH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('google-apps-script/PICK_PACK_API.gs');s=p.read_text();needle="function doPost(e) {\n  try {"
          if needle not in s: raise SystemExit('doPost anchor missing')
          s=s.replace(needle,needle+"\n    ppM2ApplyLiveConfig_();",1);p.write_text(s)
          cfg={
            'marker':'m2-reconciling-'+os.environ['GITHUB_SHA'],'service_url':os.environ['SERVICE_URL'],'bridge_secret':os.environ['GAS_BRIDGE_SHARED_SECRET'],
            'mode':'RECONCILING','epoch':int(os.environ['TARGET_EPOCH']),'generation':os.environ['SERVICE_GENERATION'],'scope':'PRODUCTION'
          }
          js='const PP_M2_LIVE_CONFIG=Object.freeze('+json.dumps(cfg,separators=(',',':'))+');\n'
          js+="function ppM2ApplyLiveConfig_(){const p=PropertiesService.getScriptProperties(),c=PP_M2_LIVE_CONFIG;if(p.getProperty('PP_M2_CONFIG_VERSION')===c.marker)return;p.setProperties({PP_M2_CONFIG_VERSION:c.marker,PP_M2_SERVICE_URL:c.service_url,PP_M2_GAS_BRIDGE_SECRET:c.bridge_secret,PP_M2_AUTHORITY_MODE:c.mode,PP_M2_AUTHORITY_EPOCH:String(c.epoch),PP_M2_FALLBACK_SEQ:'0',PP_M2_SERVICE_GENERATION:c.generation,PP_M2_AUTHORITY_SCOPE:c.scope},false);}\n"
          Path('google-apps-script/M2_LIVE_CONFIG.gs').write_text(js)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script');files=[{'name':p.stem,'type':'SERVER_JS','source':p.read_text()} for p in sorted(b.glob('*.gs'))]
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()});Path('/tmp/gas-content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          echo "GAS_SCRIPT_CLEAN=$SCRIPT_ID" >> "$GITHUB_ENV"; echo "GAS_DEPLOYMENT_CLEAN=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          H=$(curl -sS -o /tmp/gas-put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"); [[ "$H" == 200 ]] || { cat /tmp/gas-put.out; exit 1; }
          H=$(curl -sS -o /tmp/gas-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Pick Pack 1291 M2 RECONCILING fence"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions"); [[ "$H" == 200 ]] || { cat /tmp/gas-version.json; exit 1; }
          V=$(node -e 'const j=require("/tmp/gas-version.json");process.stdout.write(String(j.versionNumber))')
          node - <<'NODE' "$SCRIPT_ID" "$V"
          const fs=require('fs');fs.writeFileSync('/tmp/gas-deploy.json',JSON.stringify({deploymentConfig:{scriptId:process.argv[2],versionNumber:Number(process.argv[3]),manifestFileName:'appsscript',description:'Pick Pack 1291 M2 RECONCILING fence'}}));
          NODE
          H=$(curl -sS -o /tmp/gas-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID"); [[ "$H" == 200 ]] || { cat /tmp/gas-deploy.out; exit 1; }
          OK=false; for i in $(seq 1 15); do curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/discovery-fence.json || true; if grep -q '"authority_mode":"RECONCILING"' /tmp/discovery-fence.json; then OK=true;break;fi;sleep 3;done; [[ "$OK" == true ]] || { cat /tmp/discovery-fence.json; exit 1; }

      - name: Promote Service D1 to production authority
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(curl -fsS "$SERVICE_URL/v1/authority")
          EPOCH=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.authority.authority_epoch))' "$AUTH")
          BODY=$(node -e 'process.stdout.write(JSON.stringify({expected_epoch:Number(process.argv[1]),mode:"SERVICE_PRIMARY",scope:"PRODUCTION",service_generation:process.env.SERVICE_GENERATION,increment_epoch:true,reason:"OWNER_APPROVED_M2_CUTOVER",initiated_by:"github-actions",confirmation:"OWNER_LOCKED_M2_CUTOVER"}))' "$EPOCH")
          curl -fsS -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" -H 'content-type: application/json' "$SERVICE_URL/internal/authority/transition" -d "$BODY" > /tmp/promote.json
          node - <<'NODE'
          const j=require('/tmp/promote.json');if(!j.ok||j.authority.scope!=='PRODUCTION'||j.authority.mode!=='SERVICE_PRIMARY'||j.authority.authority_epoch!==Number(process.env.TARGET_EPOCH))throw new Error(JSON.stringify(j));
          NODE
          curl -fsS "$SERVICE_URL/health" >/tmp/service-prod-health.json
          grep -q '"environment":"production"' /tmp/service-prod-health.json

      - name: Activate GAS SERVICE_PRIMARY config at promoted epoch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('google-apps-script/M2_LIVE_CONFIG.gs')
          cfg={'marker':'m2-primary-'+os.environ['GITHUB_SHA'],'service_url':os.environ['SERVICE_URL'],'bridge_secret':os.environ['GAS_BRIDGE_SHARED_SECRET'],'mode':'SERVICE_PRIMARY','epoch':int(os.environ['TARGET_EPOCH']),'generation':os.environ['SERVICE_GENERATION'],'scope':'PRODUCTION'}
          js='const PP_M2_LIVE_CONFIG=Object.freeze('+json.dumps(cfg,separators=(',',':'))+');\n';js+="function ppM2ApplyLiveConfig_(){const p=PropertiesService.getScriptProperties(),c=PP_M2_LIVE_CONFIG;if(p.getProperty('PP_M2_CONFIG_VERSION')===c.marker)return;p.setProperties({PP_M2_CONFIG_VERSION:c.marker,PP_M2_SERVICE_URL:c.service_url,PP_M2_GAS_BRIDGE_SECRET:c.bridge_secret,PP_M2_AUTHORITY_MODE:c.mode,PP_M2_AUTHORITY_EPOCH:String(c.epoch),PP_M2_FALLBACK_SEQ:'0',PP_M2_SERVICE_GENERATION:c.generation,PP_M2_AUTHORITY_SCOPE:c.scope},false);}\n";p.write_text(js)
          b=Path('google-apps-script');files=[{'name':x.stem,'type':'SERVER_JS','source':x.read_text()} for x in sorted(b.glob('*.gs'))];files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()});Path('/tmp/gas-content-primary.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          H=$(curl -sS -o /tmp/gas-put2.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-content-primary.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/content"); [[ "$H" == 200 ]] || { cat /tmp/gas-put2.out; exit 1; }
          H=$(curl -sS -o /tmp/gas-version2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Pick Pack 1291 M2 SERVICE PRIMARY"}' "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/versions"); [[ "$H" == 200 ]] || { cat /tmp/gas-version2.json; exit 1; }
          V=$(node -e 'const j=require("/tmp/gas-version2.json");process.stdout.write(String(j.versionNumber))')
          node - <<'NODE' "$GAS_SCRIPT_CLEAN" "$V"
          const fs=require('fs');fs.writeFileSync('/tmp/gas-deploy2.json',JSON.stringify({deploymentConfig:{scriptId:process.argv[2],versionNumber:Number(process.argv[3]),manifestFileName:'appsscript',description:'Pick Pack 1291 M2 SERVICE PRIMARY'}}));
          NODE
          H=$(curl -sS -o /tmp/gas-deploy2.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy2.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/deployments/$GAS_DEPLOYMENT_CLEAN"); [[ "$H" == 200 ]] || { cat /tmp/gas-deploy2.out; exit 1; }
          OK=false; for i in $(seq 1 15); do curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/discovery-primary.json || true; if node -e 'const j=require("/tmp/discovery-primary.json");process.exit(j.ok&&j.authority_mode==="SERVICE_PRIMARY"&&j.service_url===process.env.SERVICE_URL&&j.authority?.authority_epoch===Number(process.env.TARGET_EPOCH)?0:1)' ; then OK=true;break;fi;sleep 3;done; [[ "$OK" == true ]] || { cat /tmp/discovery-primary.json; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and sign Beta19 with fixed signer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; else echo 'Android SDK 36 build-tools missing' >&2; exit 1; fi
          gradle --no-daemon --build-cache :app:assembleBetaRelease
          UNSIGNED=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk; test -s "$UNSIGNED"
          KS="$RUNNER_TEMP/release.jks"; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"; printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"; printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta; OUT="dist/beta/pick-pack-1291-public-beta-$BETA_VERSION.apk"; BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" >/tmp/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]'); [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          "$BT/aapt" dump badging "$OUT" >/tmp/badge.txt; grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badge.txt; grep -q "versionCode='$BETA_VERSION_CODE'" /tmp/badge.txt; grep -q "versionName='$BETA_VERSION'" /tmp/badge.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}'); echo "BETA_APK=$OUT" >> "$GITHUB_ENV"; echo "BETA_SHA256=$SHA" >> "$GITHUB_ENV"
          rm -f "$KS" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"

      - name: Publish signed Beta19 to Google Drive OTA folder
        shell: bash
        run: |
          set -euo pipefail
          META=$(node -e 'process.stdout.write(JSON.stringify({name:`pick-pack-1291-public-beta-${process.env.BETA_VERSION}.apk`,parents:[process.env.BETA_FOLDER_ID],description:"M2 Service-first Beta19; automatic OTA; mandatory"}))')
          RESP=$(curl -fsS -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -F "metadata=$META;type=application/json" -F "file=@$BETA_APK;type=application/vnd.android.package-archive" 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,modifiedTime')
          FILE_ID=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.id||"")' "$RESP"); test -n "$FILE_ID"; echo "BETA_DRIVE_FILE_ID=$FILE_ID" >> "$GITHUB_ENV"
          curl -fsS -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"role":"reader","type":"anyone"}' "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions?fields=id" >/tmp/permission.json

      - name: Verify live OTA discovery download package version and signer
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 12); do
            curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$PREVIOUS_BETA_VERSION\"}" >/tmp/ota.json || true
            if node -e 'const j=require("/tmp/ota.json");process.exit(j.ok&&j.available===true&&j.version_name===process.env.BETA_VERSION&&String(j.sha256||"").toLowerCase()===process.env.BETA_SHA256?0:1)' ; then OK=true;break;fi
            sleep 5
          done
          [[ "$OK" == true ]] || { cat /tmp/ota.json; exit 1; }
          URL=$(node -e 'const j=require("/tmp/ota.json");process.stdout.write(j.apk_url||"")'); test -n "$URL"; curl -fL --retry 4 --retry-delay 2 "$URL" -o /tmp/ota-live.apk
          [[ "$(sha256sum /tmp/ota-live.apk | awk '{print $1}')" == "$BETA_SHA256" ]]
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"; "$BT/aapt" dump badging /tmp/ota-live.apk >/tmp/live-badge.txt; grep -q "versionName='$BETA_VERSION'" /tmp/live-badge.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota-live.apk >/tmp/live-cert.txt; CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/live-cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]'); [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$BETA_VERSION\"}" >/tmp/self.json
          node -e 'const j=require("/tmp/self.json");if(!j.ok||j.available!==false)throw new Error(JSON.stringify(j))'

      - name: Build M2 completion evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m2-release-evidence
          cp /tmp/service-prod-health.json m2-release-evidence/service-health.json
          cp /tmp/discovery-primary.json m2-release-evidence/gas-discovery.json
          cp /tmp/ota.json m2-release-evidence/ota-discovery.json
          node - <<'NODE'
          const fs=require('fs');const out={source_commit:process.env.GITHUB_SHA,service_url:process.env.SERVICE_URL,worker_name:process.env.WORKER_NAME,d1_name:process.env.D1_NAME,d1_id:process.env.PROD_D1_ID,authority_epoch:Number(process.env.TARGET_EPOCH),service_generation:process.env.SERVICE_GENERATION,google_source_sheet_id:process.env.SOURCE_SHEET_ID,google_staging_sheet_id:process.env.STAGING_SHEET_ID,gas_url:process.env.GSHEET_API_URL,beta_version:process.env.BETA_VERSION,beta_version_code:Number(process.env.BETA_VERSION_CODE),beta_sha256:process.env.BETA_SHA256,beta_drive_file_id:process.env.BETA_DRIVE_FILE_ID,signer_sha256:process.env.EXPECTED_SIGNER_SHA256,web_pwa_live:true,ota_live:true,stable_published:false};fs.writeFileSync('m2-release-evidence/release-state.json',JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: m2-live-release-evidence-${{ github.run_id }}
          path: |
            m2-release-evidence/
            dist/beta/*
          retention-days: 30

      - name: Release result
        run: |
          echo "PASS - Service/PWA production, GAS SERVICE_PRIMARY and Beta19 OTA are live. Stable remains unpublished."
