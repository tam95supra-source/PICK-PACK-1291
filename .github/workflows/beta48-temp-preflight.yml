name: Beta48 Temp Preflight

on:
  push:
    branches: [ agent/beta48-owner-10-fixes-20260822 ]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate patch scripts and materialize Android
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_s54_beta48_owner_10_fixes.py tools/apply_m2_android_transport_patch.py
          python3 tools/apply_m2_android_transport_patch.py
      - name: Assert Beta48 materialized owner contracts
        shell: bash
        run: |
          set -euo pipefail
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          TR=app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          ST=app/src/main/java/vn/pickpack1291/app/beta/OperationalDataStore.kt
          grep -q 'S54_BETA48_OWNER_10_FIXES' "$OPS"
          grep -q 'Không dùng User hy1.outbound' "$OPS"
          ! grep -q 'Không dùng User Pick' "$OPS"
          ! grep -q 'Quản trị cao nhất có thể chọn nhiều lịch sử' "$OPS"
          grep -q 'SERI PDA ĐÃ CHỌN' "$OPS"
          grep -q 'Dung lượng cache' "$OPS"
          grep -q 'Tên thiết bị' "$OPS"
          grep -q 'LocalLogManager.summary' "$OPS"
          grep -q 'historyWindowDates' "$OPS"
          ! grep -q 'optString("shift")!=selectedShift' "$OPS"
          ! grep -q 'optString("shift")!=s.optString("shift")' "$OPS"
          grep -q 'service_connections' "$TR"
          grep -q '/v1/service/connections' "$TR"
          grep -q 'retryDateWindowRejects' "$TR"
          grep -q 'fun historyWindowDates' "$ST"
          grep -q 'fun storageBytes' "$ST"
          grep -q 'BUSINESS_DATE_OUTSIDE_PDA_7_DAY_WINDOW' "$ST"
          grep -q 'versionCode = 54' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.48"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
      - name: Build Beta and Stable debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
      - name: Service check
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
      - name: Result
        run: echo 'PASS - Beta48 owner 10-fix temp preflight.'
