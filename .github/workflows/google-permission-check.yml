name: Verify Google Apps Script Credentials

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/google-permission-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-google:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - name: Verify required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required secret: $v" >&2
              exit 1
            fi
          done
          echo "All five Google deployment secrets are present."

      - name: Exchange refresh token
        id: oauth
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<<"$RESP")
          if [[ -z "$TOKEN" ]]; then
            echo 'OAuth refresh did not return an access token.' >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "OAuth refresh token exchange: PASS"

      - name: Verify Apps Script project access
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.token }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_ID")
          if [[ "$HTTP" != "200" ]]; then
            echo "Apps Script project lookup failed with HTTP $HTTP" >&2
            python3 - <<'PY'
import json
try:
  j=json.load(open('/tmp/project.json'))
  print(j.get('error',{}).get('status','UNKNOWN'))
  print(j.get('error',{}).get('message',''))
except Exception:
  pass
PY
            exit 1
          fi
          python3 - <<'PY'
import json
j=json.load(open('/tmp/project.json'))
print('Apps Script project access: PASS')
print('Project title:', j.get('title','(unknown)'))
PY

      - name: Verify deployment access
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.oauth.outputs.token }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/deployment.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_ID/deployments/$GAS_DEPLOYMENT_ID")
          if [[ "$HTTP" != "200" ]]; then
            echo "Apps Script deployment lookup failed with HTTP $HTTP" >&2
            python3 - <<'PY'
import json
try:
  j=json.load(open('/tmp/deployment.json'))
  print(j.get('error',{}).get('status','UNKNOWN'))
  print(j.get('error',{}).get('message',''))
except Exception:
  pass
PY
            exit 1
          fi
          python3 - <<'PY'
import json
j=json.load(open('/tmp/deployment.json'))
cfg=j.get('deploymentConfig',{})
print('Deployment access: PASS')
print('Deployment manifest:', cfg.get('manifestFileName','appsscript'))
print('Deployment version:', cfg.get('versionNumber','(head/dev)'))
PY

      - name: Verification summary
        run: |
          echo 'Google Apps Script credential verification: PASS'
          echo 'No deployment or source mutation was performed.'
