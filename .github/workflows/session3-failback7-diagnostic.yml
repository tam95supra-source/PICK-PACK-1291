name: Session3 Failback7 Diagnostic

on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session3-failback7-diagnostic-trigger.txt]

permissions:
  contents: write

env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  D1_NAME: pick-pack-1291-service-prod
  GENERATION: m2-prod-20260819-001

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Read-only failback gates
        shell: bash
        run: |
          set +e
          OUT=/tmp/result.txt
          printf 'checked_at=%s\nmode=READ_ONLY\n' "$(date -u +%FT%TZ)" > "$OUT"
          fail(){ echo "failed_phase=$1" >> "$OUT"; echo verdict=DIAGNOSTIC_COMPLETE >> "$OUT"; exit 0; }
          missing=''
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN SIGNING_STORE_PASSWORD; do [[ -n "${!v:-}" ]] || missing="$missing,$v"; done
          if [[ -n "$missing" ]]; then echo secret_gate=FAIL >> "$OUT"; echo missing_count=$(awk -F, '{print NF-1}' <<<"$missing") >> "$OUT"; fail SECRET_GATE; fi
          echo secret_gate=PASS >> "$OUT"
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$ADMIN"
          RESP=$(curl -sS --max-time 25 https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")}catch{}' "$RESP"); [[ -n "$TOKEN" ]] || fail OAUTH_TOKEN
          echo "::add-mask::$TOKEN"; echo oauth=PASS >> "$OUT"
          curl -sS --max-time 25 "$SERVICE_URL/health" >/tmp/h.json || fail SERVICE_HEALTH_HTTP
          curl -sS --max-time 25 "$SERVICE_URL/v1/authority" >/tmp/a.json || fail SERVICE_AUTH_HTTP
          node -e 'const h=require("/tmp/h.json"),j=require("/tmp/a.json"),a=j.authority||j;process.exit(h.ok&&h.environment==="production"&&h.generation===process.env.GENERATION&&j.ok&&a.mode==="SERVICE_PRIMARY"&&Number(a.authority_epoch)===6&&Number(a.authority_seq)===4&&a.scope==="PRODUCTION"?0:1)' || fail SERVICE_PRECHECK
          echo service=PASS\|SERVICE_PRIMARY\|6\|4 >> "$OUT"
          curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/g.json || fail GAS_DISCOVERY_HTTP
          node -e 'const j=require("/tmp/g.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&Number(a.authority_seq)===7?0:1)' || fail GAS_PRECHECK
          echo gas=PASS\|GOOGLE_FALLBACK\|7\|7 >> "$OUT"
          curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"m2_internal_reconcile_status\",\"_bridge_secret\":\"$BRIDGE\"}" >/tmp/status.json || fail ADAPTER_HTTP
          node -e 'const j=require("/tmp/status.json");process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(j.authority_epoch)===7&&Number(j.fallback_seq)===7&&Number(j.pending)===7?0:1)' || fail ADAPTER_STATUS
          echo adapter=PASS\|pending7 >> "$OUT"
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")')
          curl -sS --max-time 25 -H "Authorization: Bearer $TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/f.json || fail SHEETS_HTTP
          node - <<'NODE' || exit 21
          const rows=(require('/tmp/f.json').values||[]).slice(1),e=rows.filter(r=>Number(r[1])===7),p=e.filter(r=>String(r[12]||'')==='PENDING'),seq=p.map(r=>Number(r[2]));
          if(e.length!==7||p.length!==7||JSON.stringify(seq)!==JSON.stringify([1,2,3,4,5,6,7])) process.exit(1)
          NODE
          if [[ $? -ne 0 ]]; then fail LEDGER_PRECHECK; fi
          echo ledger=PASS\|7_pending >> "$OUT"
          cd service
          npm install --no-audit --no-fund >/dev/null 2>&1 || { cd ..; fail NPM_INSTALL; }
          LIST=$(npx wrangler d1 list --json 2>/tmp/werr); RC=$?; [[ $RC -eq 0 ]] || { cd ..; fail D1_LIST; }
          ID=$(node -e 'try{const a=JSON.parse(process.argv[1]),x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")}catch{}' "$LIST"); [[ -n "$ID" ]] || { cd ..; fail D1_RESOLVE; }; export ID
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8").replace("__M1_D1_DATABASE_ID__",process.env.ID).replace("\"database_name\": \"pick-pack-1291-m1-staging\"",`\"database_name\": \"${process.env.D1_NAME}\"`);fs.writeFileSync("wrangler.recovery.jsonc",s)' || { cd ..; fail D1_CONFIG; }
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.recovery.jsonc --command "SELECT COUNT(*) n FROM fallback_event_inbox WHERE authority_epoch=7; SELECT state,pending_count,retry_count,last_error FROM replication_state WHERE singleton_id=1; SELECT value FROM system_meta WHERE key='m2_reconciling';" --json >/tmp/d1.json 2>/tmp/d1err; RC=$?; cd ..; [[ $RC -eq 0 ]] || fail D1_QUERY
          node - <<'NODE' || exit 22
          const r=require('/tmp/d1.json').flatMap(x=>x.results||[]),count=r.find(x=>Object.hasOwn(x,'n')),rep=r.find(x=>Object.hasOwn(x,'state')),lock=r.find(x=>Object.hasOwn(x,'value'));
          if(Number(count?.n)!==0||!rep||rep.state!=='HEALTHY'||Number(rep.pending_count)!==0||(lock&&String(lock.value)==='1'))process.exit(1)
          NODE
          if [[ $? -ne 0 ]]; then fail D1_PRECHECK; fi
          echo d1=PASS\|inbox0\|replication_healthy\|no_lock >> "$OUT"
          echo admin_token_derivation=PASS >> "$OUT"
          echo failed_phase=NONE >> "$OUT"
          echo verdict=PASS >> "$OUT"
      - name: Record diagnostic
        if: always()
        shell: bash
        run: |
          test -f /tmp/result.txt || printf 'checked_at=%s\nmode=READ_ONLY\nfailed_phase=BOOTSTRAP\nverdict=DIAGNOSTIC_COMPLETE\n' "$(date -u +%FT%TZ)" >/tmp/result.txt
          cp /tmp/result.txt /tmp/result.copy
          git reset --hard HEAD >/dev/null
          cp /tmp/result.copy ops/session3-failback7-diagnostic-result.txt
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session3-failback7-diagnostic-result.txt
          git diff --cached --quiet || (git commit -m 'ops: record failback7 read-only diagnostic' && git push)
