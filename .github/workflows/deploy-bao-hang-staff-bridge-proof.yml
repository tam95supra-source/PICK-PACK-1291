name: Deploy Bao Hang staff bridge proof

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/deploy-bao-hang-staff-bridge-proof.request'

permissions:
  contents: write

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bridge source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/pick-pack-1291'
          grep -q "function setupBaoHangStaffBridge" google-apps-script/BAO_HANG_STAFF_BRIDGE.gs
          grep -q "SOURCE_DRIVEN_DELTA_V1" google-apps-script/BAO_HANG_STAFF_BRIDGE.gs
          grep -q "AKfycbwb8Hcdg7tp0jqHLZU6kW5hkEclDC9d29DGvPuwcxvZbR9t9xnrWzaIYe8UZET-D_yI" google-apps-script/BAO_HANG_STAFF_BRIDGE.gs
          grep -q "script.external_request" google-apps-script/appsscript.json
          grep -q "script.scriptapp" google-apps-script/appsscript.json
          cp google-apps-script/BAO_HANG_STAFF_BRIDGE.gs /tmp/bridge.js
          node --check /tmp/bridge.js
          echo 'BRIDGE_SOURCE=PASS'
      - name: Exchange Google OAuth
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_OAUTH_CLIENT_ID:-}"
          test -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
          test -n "${GOOGLE_OAUTH_REFRESH_TOKEN:-}"
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          [[ -n "$SCRIPT_ID" && -n "$DEPLOYMENT_ID" && -n "$TOKEN" ]]
          echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"; echo "::add-mask::$TOKEN"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy exact current GAS source
        id: deploy
        shell: bash
        env:
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')):
              files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          assert any(f['name']=='BAO_HANG_STAFF_BRIDGE' for f in files)
          Path('/tmp/content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          H=$(curl -sS -o /tmp/content.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { cat /tmp/content.out; exit 1; }
          H=$(curl -sS -o /tmp/version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Pick Pack source-driven Bao Hang staff bridge"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { cat /tmp/version.json; exit 1; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/version.json"))["versionNumber"])')
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API + Bao Hang staff bridge'}}))
          PY
          H=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          [[ "$H" == 200 ]] || { cat /tmp/deploy.out; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "GAS_DEPLOY_VERSION=$V"
      - name: Verify live health
        id: verify
        shell: bash
        env:
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/deployment.json
          URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/deployment.json'))
          web=[e.get('webApp',{}) for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']
          assert web and web[0].get('url')
          print(web[0]['url'])
          PY
          )
          OK=false
          for i in $(seq 1 15); do
            curl -fsSL -H 'content-type: application/json' "$URL" -d '{"action":"health"}' > /tmp/health.json || true
            if grep -q '"ok":true' /tmp/health.json && grep -q '"service":"pick-pack-gsheet-api"' /tmp/health.json; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/health.json; exit 1; }
          echo 'LIVE_PICK_PACK_GAS=PASS'
      - name: Record sanitized proof
        shell: bash
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,datetime
          out={'status':'PASS','bridge':'SOURCE_DRIVEN_DELTA_V1','gas_version':int(os.environ['VERSION']),'source_commit':os.environ['GITHUB_SHA'],'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('ops/bao-hang-staff-bridge-deploy-proof.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bao-hang-staff-bridge-deploy-proof.json
          git commit -m 'chore(gas): record Bao Hang staff bridge deploy proof'
          git pull --rebase origin main
          git push origin HEAD:main
