name: S09 Finalize Documentation
on:
  push:
    branches: [ main ]
    paths: ['ops/s09-finalize-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply final docs
        run: |
          set -euo pipefail
          python3 ops/s09_finalize_docs.py
          grep -q 'Published Beta — `0.4.2-beta.9`' docs/HANDOVER_CURRENT.md
          grep -q 'no `Tài khoản:` prefix' docs/HANDOVER_CURRENT.md
          grep -q '`superadmin`' docs/ADMIN_ACCOUNT_RULES.md
          grep -q '`admin`' docs/ADMIN_ACCOUNT_RULES.md
          grep -q '`user`' docs/ADMIN_ACCOUNT_RULES.md
          grep -q 'Only an explicit owner instruction can change' docs/ADMIN_ACCOUNT_RULES.md
          grep -q 'do not add one-shot jobs that assume `./gradlew` exists' docs/BUILD_RELEASE_PLAYBOOK.md
      - name: Commit authoritative docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOVER_CURRENT.md docs/UI_UX_SYSTEM.md docs/BUILD_RELEASE_PLAYBOOK.md
          git commit -m 'docs: record S09 beta9 release and actual-device rules'
          git pull --rebase origin main
          git push origin HEAD:main
