name: S06 Sample1 Smooth Navigation Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s06-trigger.txt'

permissions:
  contents: write

env:
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Sample 1 and smooth navigation patch
        run: |
          set -euo pipefail
          python3 ops/s06_sample1_smooth_patch.py
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'versionCode = 12' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.6"' app/build.gradle.kts
          grep -q 'TransitionManager.beginDelayedTransition' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'private val accent:Int get() = ThemeManager.accent(this)' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Beta and Stable release candidates
        id: compile
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleBetaRelease :app:assembleStableRelease > /tmp/s06-build.log 2>&1
          RC=$?
          set -e
          if [[ $RC -ne 0 ]]; then
            tail -n 220 /tmp/s06-build.log > /tmp/s06-status.txt
            git reset --hard HEAD
            cp /tmp/s06-status.txt ops/s06-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ops/s06-status.txt
            git commit -m 'chore: record S06 compile failure' || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
            exit $RC
          fi
          echo 'PASS: Sample 1 UI + smooth tab navigation compile for Beta and Stable.' > ops/s06-status.txt
          test -s app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          test -s app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk > /tmp/beta-badge.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta-badge.txt
          grep -q "versionCode='12'" /tmp/beta-badge.txt
          grep -q "versionName='0.4.2-beta.6'" /tmp/beta-badge.txt

      - name: Upload unsigned Beta 6 candidate
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-0.4.2-beta.6-unsigned
          path: app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          retention-days: 3

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/ThemeManager.kt \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            ops/s06-status.txt
          git commit -m 'feat: apply Sample 1 UI and smooth tab navigation'
          git pull --rebase origin main
          git push origin HEAD:main
