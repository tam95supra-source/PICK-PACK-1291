name: Package GAS v0.4.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-gas-v042.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "api_version:'0.4.2'" google-apps-script/PICK_PACK_API.gs
          grep -q "Khấu trừ nhân sự" google-apps-script/PICK_PACK_API.gs
          grep -q "ppTenureMatrix_" google-apps-script/PICK_PACK_API.gs
          cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js
          node --check /tmp/PICK_PACK_API.js
      - name: Prepare deploy bundle
        shell: bash
        run: |
          mkdir -p deploy
          cp google-apps-script/PICK_PACK_API.gs deploy/PICK_PACK_API.gs
          cp google-apps-script/appsscript.json deploy/appsscript.json
          cat > deploy/DEPLOY_V0.4.2.txt <<'EOF'
          PICK PACK 1291 - Google Sheet API v0.4.2
          1. Mở DỮ LIỆU THEO NGÀY -> Extensions -> Apps Script.
          2. Thay nội dung PICK_PACK_API.gs bằng file trong gói này.
          3. Giữ appsscript.json theo file trong gói.
          4. Deploy -> Manage deployments -> Edit -> New version -> Deploy.
          5. Giữ nguyên Web App URL hiện tại, Execute as Me và quyền truy cập hiện tại.
          6. Health sau deploy phải trả api_version 0.4.2.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-gsheet-api-v0.4.2-deploy
          path: deploy/*
          retention-days: 7
