name: Finalize Pick Pack 1291 v0.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v042-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Apply final patch
        run: python3 tools/finalize_v042.py

      - name: Validate Apps Script
        shell: bash
        run: |
          set -euo pipefail
          cp google-apps-script/PICK_PACK_API.gs /tmp/api.js
          node --check /tmp/api.js
          grep -q "api_version:'0.4.2'" google-apps-script/PICK_PACK_API.gs
          grep -q 'PP_SESS_V42_' google-apps-script/PICK_PACK_API.gs
          grep -q 'PP_LABOR_V42_' google-apps-script/PICK_PACK_API.gs
          grep -q 'Khấu trừ nhân sự' google-apps-script/PICK_PACK_API.gs
          grep -q 'Ca 1 + Ca HC' google-apps-script/PICK_PACK_API.gs
          grep -q 'Nhân sự mới' google-apps-script/PICK_PACK_API.gs
          grep -q 'DANH SÁCH NHÂN SỰ' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'syncApi = BetaApiClient' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'cacheApi = BetaApiClient' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q '@drawable/app_icon' app/src/main/res/drawable/app_icon_foreground.xml

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build beta
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleBetaRelease
          APK=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          B=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$B" | grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'"
          echo "$B" | grep -q "versionCode='7'"
          echo "$B" | grep -q "versionName='0.4.2-beta.1'"

      - name: Package GAS deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gas
          cp google-apps-script/PICK_PACK_API.gs google-apps-script/appsscript.json /tmp/gas/
          printf '%s\n' 'PICK PACK 1291 GSheet API v0.4.2' 'Replace PICK_PACK_API.gs in the bound script.' 'Deploy > Manage deployments > Edit > New version > Deploy.' 'Keep the same Web App URL. Health must show api_version 0.4.2.' > /tmp/gas/DEPLOY_V0.4.2.txt
          (cd /tmp/gas && zip -q -r "$GITHUB_WORKSPACE/pick-pack-1291-gsheet-api-v0.4.2-deploy.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-beta-v0.4.2-unsigned
          path: app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-gsheet-api-v0.4.2-deploy
          path: pick-pack-1291-gsheet-api-v0.4.2-deploy.zip
          retention-days: 7

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf tools/v042-payload
          rm -f tools/finalize_v042.py .github/workflows/app-v042-implement.yml .github/workflows/v042-finalize.yml
          git add -A
          git commit -m 'fix: finalize v0.4.2 cache reports and deduction'
          git push origin HEAD:main
