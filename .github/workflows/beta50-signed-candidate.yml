name: Beta50 Signed Candidate

on:
  push:
    branches:
      - stabilization/beta48-golden-reset-beta50-20260822
    paths:
      - '.github/workflows/beta50-signed-candidate.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: beta50-signed-candidate
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 39efa0a6bf1f7d1b3d93d104e3a2395a3ddb2440
      EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
      EXPECTED_VERSION: 0.4.2-beta.50
      EXPECTED_CODE: '56'
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - name: Announce signed-candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_SIGNED_RUN start run=${GITHUB_RUN_ID} trigger_sha=${GITHUB_SHA} source_sha=${SOURCE_SHA}"
      - name: Checkout exact verified Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Resolve Firebase client build config without logging values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p='app/google-services.json'
          j=json.load(open(p,encoding='utf-8'))
          pi=j.get('project_info') or {}; clients=j.get('client') or []
          c=clients[0] if clients else {}; ci=c.get('client_info') or {}; keys=c.get('api_key') or []
          vals={
            'FIREBASE_PROJECT_ID':str(pi.get('project_id') or '').strip(),
            'FIREBASE_GOOGLE_APP_ID':str(ci.get('mobilesdk_app_id') or '').strip(),
            'FIREBASE_API_KEY':str((keys[0] if keys else {}).get('current_key') or '').strip(),
            'FIREBASE_GCM_SENDER_ID':str(pi.get('project_number') or '').strip(),
          }
          if not all(vals.values()): raise SystemExit('FIREBASE_CLIENT_CONFIG_INCOMPLETE')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
            for k,v in vals.items():
              print(f'::add-mask::{v}')
              f.write(f'{k}={v}\n')
          PY
      - name: Canonical source, Beta-only and OWNER contract gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'generateS10Operations' app/build.gradle.kts
          ! grep -q 'apply_m2_android_transport_patch.py' app/build.gradle.kts
          grep -q 'versionCode = 56' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.50"' app/build.gradle.kts
          grep -q 'Quản lý biên bản' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'NGƯỜI DÙNG ĐANG KẾT NỐI' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'service_connections' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -Fq 'Còn $pending mục' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN PDA' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN SERVICE' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN GOOGLE SHEET' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN ĐỒNG BỘ KHÁC' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN ỨNG DỤNG' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
      - name: Build Beta50 only with FCM client config
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleBetaRelease
          git diff --exit-code
      - name: Prove Firebase BuildConfig is non-empty without printing config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          hits=list(pathlib.Path('app/build/generated').rglob('BuildConfig.java'))+list(pathlib.Path('app/build/generated').rglob('BuildConfig.kt'))
          text='\n'.join(p.read_text(errors='ignore') for p in hits)
          for k in ('FIREBASE_PROJECT_ID','FIREBASE_GOOGLE_APP_ID','FIREBASE_API_KEY','FIREBASE_GCM_SENDER_ID'):
            m=re.search(r'\b'+re.escape(k)+r'\b[^\n]*?[= ]+\s*"([^"]*)"',text)
            if not m or not m.group(1).strip(): raise SystemExit('FIREBASE_BUILDCONFIG_EMPTY:'+k)
          print('firebase_buildconfig=CONFIGURED')
          PY
      - name: Resolve Android build tools
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0"
          if [[ ! -x "$BT/aapt" || ! -x "$BT/apksigner" ]]; then
            BT=$(dirname "$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)")
          fi
          test -x "$BT/aapt"; test -x "$BT/apksigner"
          echo "BT=$BT" >> "$GITHUB_ENV"
      - name: Verify package/version before signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          test -s "$APK"
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badging.txt
          grep -q "versionCode='$EXPECTED_CODE'" /tmp/badging.txt
          grep -q "versionName='$EXPECTED_VERSION'" /tmp/badging.txt
      - name: Sign exact Beta50 and verify locked signer
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]] || { echo "MISSING_SIGNING_SECRET:$v"; exit 41; }; done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta50
          OUT="dist/beta50/pick-pack-1291-public-beta-${EXPECTED_VERSION}.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/certs.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/certs.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}'); SIZE=$(stat -c '%s' "$OUT"); NAME=$(basename "$OUT")
          printf '%s  %s\n' "$SHA" "$NAME" > "dist/beta50/SHA256SUMS-${EXPECTED_VERSION}.txt"
          cat > dist/beta50/CANDIDATE_MANIFEST.txt <<EOF
          source_sha=$SOURCE_SHA
          verify_run=32566368576
          verify_artifact=9474202908
          version=$EXPECTED_VERSION
          version_code=$EXPECTED_CODE
          package=$EXPECTED_PACKAGE
          signer_sha256=$EXPECTED_SIGNER_SHA256
          apk_name=$NAME
          apk_sha256=$SHA
          apk_size=$SIZE
          stable=UNTOUCHED
          beta49=ABANDONED
          verdict=PASS
          EOF
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload immutable signed candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-0.4.2-beta.50-signed-candidate
          path: dist/beta50/*
          if-no-files-found: error
          retention-days: 14
      - name: Report signed-candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA: ${{ steps.sign.outputs.sha }}
          APK_SIZE: ${{ steps.sign.outputs.size }}
          APK_NAME: ${{ steps.sign.outputs.name }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_SIGNED_RUN finish run=${GITHUB_RUN_ID} source_sha=${SOURCE_SHA} job=${{ job.status }} artifact=${ARTIFACT_ID:-NONE} apk=${APK_NAME:-NONE} sha256=${APK_SHA:-NONE} size=${APK_SIZE:-NONE}"
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
