name: Service M2 Replication Live Verify

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/m2-replication-live-verify-trigger.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'ops/m2-replication-live-verify-trigger.txt'
      - '.github/workflows/service-m2-replication-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-m2-replication-live-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  SERVICE_GENERATION: m2-prod-20260819-001
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recent double bootstrap evidence and resource reconciliation
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN SIGNING_STORE_PASSWORD; do [[ -n "${!v:-}" ]] || { echo "MISSING_REQUIRED_SECRET:$v" >&2; exit 1; }; done
          npm install --no-audit --no-fund
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST"); test -n "$ID"; export PROD_D1_ID="$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text().replace('"name": "pick-pack-1291-service-m1-staging"','"name": "'+os.environ['WORKER_NAME']+'"').replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"','"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"').replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"').replace('__M1_D1_DATABASE_ID__',os.environ['PROD_D1_ID'])
          Path('/tmp/wrangler.repverify.jsonc').write_text(s)
          PY
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.repverify.jsonc --command "SELECT run_id,completed_at,report_json,manifest_json FROM bootstrap_runs WHERE status='COMPLETE' ORDER BY completed_at DESC LIMIT 2;" --json)
          printf '%s' "$OUT" >/tmp/bootstrap-complete.json
          node - <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/bootstrap-complete.json','utf8')),rows=x?.[0]?.results||[];
          if(rows.length<2)throw new Error('TWO_COMPLETE_BOOTSTRAPS_REQUIRED');
          const now=Date.now();for(const r of rows){if(!r.completed_at||now-Date.parse(r.completed_at)>60*60*1000)throw new Error('BOOTSTRAP_EVIDENCE_STALE:'+JSON.stringify(r));}
          const stable=r=>{const j=JSON.parse(r.report_json);return JSON.stringify({source_sheet_id:j.source_sheet_id,sheets:j.sheets,projection_counts:j.projection_counts,business_date_min:j.business_date_min,business_date_max:j.business_date_max,business_date_count:j.business_date_count});};
          if(stable(rows[0])!==stable(rows[1]))throw new Error('DOUBLE_BOOTSTRAP_REPORT_MISMATCH');
          const state=JSON.parse(rows[0].manifest_json),warnings=state.warnings||[];
          if(!warnings.some(w=>w.code==='PACK_TABLE_REFERENCE_MISSING'&&w.pack_table==='D29'&&w.user_pack==='hy1.obpack18'))throw new Error('D29_ANOMALY_NOT_RECORDED');
          if(!warnings.some(w=>w.code==='DUPLICATE_RESOURCE_ID'&&w.resource_type==='USER_PACK'&&w.resource_id==='hy1.obpack18'))throw new Error('DUPLICATE_USER_PACK_NOT_RECORDED');
          fs.writeFileSync('/tmp/bootstrap-report-latest.json',rows[0].report_json);
          fs.writeFileSync('/tmp/bootstrap-warnings-latest.json',JSON.stringify(warnings,null,2));
          NODE
          R=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.repverify.jsonc --command "SELECT (SELECT COUNT(*) FROM resource_pack_map WHERE pack_table='HP' AND shift='Ca HC') AS hp_ca_hc, (SELECT COUNT(*) FROM resource_pack_map WHERE pack_table='D18' AND shift='Ca 1' AND user_pack='hy1.obpack18') AS d18_valid, (SELECT COUNT(*) FROM resource_pack_map WHERE pack_table='D29') AS d29_invalid;" --json)
          node -e 'const x=JSON.parse(process.argv[1]),r=x?.[0]?.results?.[0];if(Number(r?.hp_ca_hc)!==6||Number(r?.d18_valid)!==1||Number(r?.d29_invalid)!==0)throw new Error("RESOURCE_RECONCILIATION_INVALID:"+JSON.stringify(r))' "$R"
          H=$(curl -fsS --connect-timeout 5 --max-time 20 "$SERVICE_URL/health")
          node -e 'const j=JSON.parse(process.argv[1]);if(!j.ok||j.environment!=="staging-shadow"||j.authority?.scope!=="STAGING_SHADOW"||j.authority?.mode!=="SERVICE_PRIMARY")throw new Error(JSON.stringify(j))' "$H"
      - name: Inject harmless shadow event and replicate to Google staging
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$ADMIN"; export M2_ADMIN_TOKEN="$ADMIN"
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP"); test -n "$TOKEN"; echo "::add-mask::$TOKEN"; export GOOGLE_ACCESS_TOKEN="$TOKEN"
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST"); test -n "$ID"; export PROD_D1_ID="$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text().replace('"name": "pick-pack-1291-service-m1-staging"','"name": "'+os.environ['WORKER_NAME']+'"').replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"','"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"').replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"').replace('__M1_D1_DATABASE_ID__',os.environ['PROD_D1_ID'])
          Path('/tmp/wrangler.repverify.jsonc').write_text(s)
          PY
          TS=$(date -u +%Y-%m-%dT%H:%M:%S.000Z); EVENT="m2-replication-shadow-${GITHUB_RUN_ID}"; export EVENT
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.repverify.jsonc --command "UPDATE authority_state SET authority_seq=authority_seq+1,updated_at='$TS' WHERE singleton_id=1 AND scope='STAGING_SHADOW';" >/tmp/rep-update.txt
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.repverify.jsonc --command "INSERT INTO events(event_id,event_type,entity_type,entity_id,business_date,authority_epoch,authority_seq,service_generation,base_version,new_version,actor_id,actor_role,device_id,occurred_at,committed_at,payload_json,idempotency_key,origin,schema_version,checksum) SELECT '$EVENT','M1_SHADOW_PROBE','TEST','$EVENT',(SELECT business_date FROM business_dates ORDER BY sequence_no DESC LIMIT 1),authority_epoch,authority_seq,service_generation,0,1,'M2_PREFLIGHT','SUPERADMIN','github-actions','$TS','$TS','{}','idem:$EVENT','SERVICE',1,'preflight' FROM authority_state WHERE singleton_id=1;" >/tmp/rep-event.txt
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.repverify.jsonc --command "INSERT INTO sheet_replication_outbox(event_id,status,next_attempt_at) VALUES('$EVENT','PENDING','$TS');" >/tmp/rep-outbox.txt
          curl -fsS --connect-timeout 5 --max-time 180 -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" "$SERVICE_URL/internal/replicate" >/tmp/replicate.json
          node -e 'const j=require("/tmp/replicate.json");if(!j.ok||j.processed<1||j.pending!==0)throw new Error(JSON.stringify(j))'
          RANGE=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'__M1_SERVICE_REPLICA'!A2:A"))
          PY
          )
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$STAGING_SHEET_ID/values/$RANGE" >/tmp/replica-ids.json
          node -e 'const j=require("/tmp/replica-ids.json"),e=process.env.EVENT;if(!(j.values||[]).some(r=>r[0]===e))throw new Error("STAGING_PROBE_NOT_REPLICATED")'
          curl -fsS "$SERVICE_URL/health" >/tmp/health-after.json
          node -e 'const j=require("/tmp/health-after.json");if(!j.ok||j.replication?.state!=="HEALTHY"||Number(j.replication?.pending_count||0)!==0)throw new Error("REPLICATION_NOT_HEALTHY:"+JSON.stringify(j))'
      - name: Emit replication evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m2-replication-live-evidence
          cp /tmp/bootstrap-report-latest.json m2-replication-live-evidence/bootstrap-report-latest.json
          cp /tmp/bootstrap-warnings-latest.json m2-replication-live-evidence/bootstrap-warnings-latest.json
          cp /tmp/replicate.json m2-replication-live-evidence/replication.json
          cp /tmp/health-after.json m2-replication-live-evidence/health-after.json
          cp /tmp/replica-ids.json m2-replication-live-evidence/staging-replica-ids.json
      - uses: actions/upload-artifact@v4
        with:
          name: m2-replication-live-evidence-${{ github.run_id }}
          path: m2-replication-live-evidence/
          retention-days: 30
