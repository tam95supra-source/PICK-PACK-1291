name: S08 Finalize Beta8 Handover
on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s08-handover-trigger.txt'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize cumulative handover
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/s08_finalize_handover.py
          grep -q 'Published Beta — `0.4.2-beta.8`' docs/HANDOVER_CURRENT.md
          grep -q 'dbb86e8d3edcadc4ce4138410427f97d93279cb047cce45fb7e41d68578a7d5e' docs/HANDOVER_CURRENT.md
          grep -q 'S08 visual implementation — RELEASED IN BETA8' docs/HANDOVER_CURRENT.md
      - name: Commit authoritative handover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOVER_CURRENT.md
          git commit -m 'docs: record beta8 visual OTA release'
          git pull --rebase origin main
          git push origin HEAD:main
