name: S08 Apply Approved Visual Beta8

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s08-trigger.txt'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved visual system
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/s08_apply_visual_beta8.py')
          s=p.read_text()
          fixes=[
            ("ops=between(ops,'    private fun appBar(title:String)=','    private fun navigateTab(target:String){\\n',header_nav+'    private fun navigateTab(target:String){\\n','header nav')", "ops=between(ops,'    private fun appBar(title:String)=','    private fun navigateTab(target:String)',header_nav,'header nav')"),
            ("business_helpers+'    private fun employeeCard(e:JSONObject)='", "business_helpers"),
            ("new_host+'    private fun jsonStrings(a:JSONArray?)'", "new_host"),
          ]
          for old,new in fixes:
              if old not in s:
                  raise SystemExit('S08 mechanical fix target not found: '+old[:60])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 ops/s08_apply_visual_beta8.py
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.8"' app/build.gradle.kts
          grep -q 'businessCard(R.drawable.ic_pp_scan' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Triple(R.drawable.ic_pp_task,"Nghiệp vụ","BUSINESS")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          test -f app/src/main/res/drawable/ic_pp_settings.xml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt').read_text()
          assert s.count('private fun employeeCard(e:JSONObject)=') == 1
          assert s.count('private fun jsonStrings(a:JSONArray?)') == 1
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile both channels
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleBetaDebug :app:assembleStableDebug

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/res/drawable
          git commit -m 'feat: apply approved visual system for beta8'
          git restore ops/s08_apply_visual_beta8.py
          git pull --rebase origin main
          git push origin HEAD:main
