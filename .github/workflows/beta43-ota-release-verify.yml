name: Beta43 OTA Release Verify Observable

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/beta43-ota-release-verify-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta43-ota-release-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      FROM_VERSION: 0.4.2-beta.42
      TARGET_VERSION: 0.4.2-beta.43
      EXPECTED_SHA: 3f03e81a2ffd9f4b91ca0bbe9c32042b31a84e915e2dd4f10e796d299bd07f7e
      EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify live Beta43 discovery and exact download
        id: discovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          good=false
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sSL --connect-timeout 20 --max-time 90 -o /tmp/from.json -w '%{http_code}' \
              -H 'content-type: application/json' "$GSHEET_API_URL" \
              -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" || true)
            if [[ "$status" == 200 ]] && python3 - <<'PY'
          import json,os
          try:
              j=json.load(open('/tmp/from.json'))
              available=j.get('available',j.get('update_available'))
              version=j.get('version_name',j.get('version',''))
              url=j.get('apk_url') or j.get('download_url') or j.get('url') or ''
              good=(j.get('ok') is True and available is True and str(version)==os.environ['TARGET_VERSION'] and str(j.get('sha256','')).lower()==os.environ['EXPECTED_SHA'].lower() and str(j.get('source',''))=='GOOGLE_DRIVE' and str(j.get('channel',''))=='BETA' and bool(url))
              raise SystemExit(0 if good else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then good=true; break; fi
            echo "Discovery retry $attempt/6 HTTP=$status"
            sleep 2
          done
          [[ "$good" == true ]]
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/from.json'))
          url=j.get('apk_url') or j.get('download_url') or j.get('url') or ''
          open('/tmp/url.txt','w').write(url)
          PY
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/url.txt)" -o /tmp/ota.apk
          ACTUAL=$(sha256sum /tmp/ota.apk | awk '{print $1}')
          [[ "$ACTUAL" == "$EXPECTED_SHA" ]]
          echo "download_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "download_size=$(stat -c '%s' /tmp/ota.apk)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.discovery.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android build tools
        id: tools
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - name: Verify package version and fixed signer
        id: identity
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/ota.apk > /tmp/badge.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badge.txt
          grep -q "versionCode='49'" /tmp/badge.txt
          grep -q "versionName='$TARGET_VERSION'" /tmp/badge.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota.apk > /tmp/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]

      - name: Verify self-update false and Stable isolation
        id: isolation
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          post_contract() {
            local channel="$1" version="$2" out="$3"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sSL --connect-timeout 20 --max-time 90 -o "$out" -w '%{http_code}' \
                -H 'content-type: application/json' "$GSHEET_API_URL" \
                -d "{\"action\":\"update_check\",\"channel\":\"$channel\",\"current_version\":\"$version\"}" || true)
              if [[ "$status" == 200 ]] && python3 - "$out" "$channel" <<'PY'
          import json,sys
          try:
              j=json.load(open(sys.argv[1]))
              good=(j.get('ok') is True and str(j.get('channel',''))==sys.argv[2] and ('available' in j or 'update_available' in j))
              raise SystemExit(0 if good else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then return 0; fi
              echo "Contract retry $attempt/6 for $channel HTTP=$status"
              sleep 2
            done
            return 1
          }
          post_contract BETA "$TARGET_VERSION" /tmp/self.json
          post_contract STABLE '999.999.999' /tmp/stable.json
          python3 - <<'PY'
          import json,os
          s=json.load(open('/tmp/self.json')); t=json.load(open('/tmp/stable.json'))
          sa=s.get('available',s.get('update_available')); ta=t.get('available',t.get('update_available'))
          assert s.get('ok') is True and str(s.get('channel'))=='BETA' and sa is False, s
          assert t.get('ok') is True and str(t.get('channel'))=='STABLE' and ta is False, t
          version=t.get('version_name',t.get('version',''))
          assert str(version) != os.environ['TARGET_VERSION'], t
          PY

      - name: Persist OTA release receipt
        if: always()
        shell: bash
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          ISOLATION_OUTCOME: ${{ steps.isolation.outcome }}
          DOWNLOAD_SHA: ${{ steps.discovery.outputs.download_sha }}
          DOWNLOAD_SIZE: ${{ steps.discovery.outputs.download_size }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [[ "$DISCOVERY_OUTCOME" == success && "$TOOLS_OUTCOME" == success && "$IDENTITY_OUTCOME" == success && "$ISOLATION_OUTCOME" == success ]]; then verdict=PASS; fi
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "from_version=$FROM_VERSION"
            echo "target_version=$TARGET_VERSION"
            echo "expected_sha256=$EXPECTED_SHA"
            echo "download_sha256=${DOWNLOAD_SHA:-}"
            echo "download_size=${DOWNLOAD_SIZE:-}"
            echo "discovery=$DISCOVERY_OUTCOME"
            echo "tools=$TOOLS_OUTCOME"
            echo "identity=$IDENTITY_OUTCOME"
            echo "isolation=$ISOLATION_OUTCOME"
            echo "stable_publish=FORBIDDEN"
            echo "pr38_merge=FORBIDDEN"
            echo "verdict=$verdict"
          } > ops/beta43-ota-release-verify-result.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- ops/beta43-ota-release-verify-result.txt
          git commit -m 'ops: record Beta43 OTA release verification'
          git push origin HEAD:agent/service-migration-m2
          [[ "$verdict" == PASS ]]
