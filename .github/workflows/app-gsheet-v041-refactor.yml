name: Apply App-GSheet v0.4.1 Refactor
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/app-gsheet-v041-refactor.yml' ]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compile compatibility fixes
        run: python3 tools/fix_v041_compile.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app google-apps-script
          git diff --cached --check
          git commit -m 'fix: complete scanner helpers and API capability marker'
          git push origin HEAD:main
