name: Service M2 Beta19 OTA Publish

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/m2-beta19-ota-publish-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: service-m2-beta19-ota-publish
  cancel-in-progress: false

env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  SERVICE_GENERATION: m2-prod-20260819-001
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  BETA_VERSION: 0.4.2-beta.19
  BETA_VERSION_CODE: '25'
  BETA_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  PREVIOUS_BETA_VERSION: 0.4.2-beta.18
  STABLE_VERSION: 0.4.2-stable.0
  EXPECTED_BETA_SHA256: 6dc47edba684249af0655a30573824911ee4a96482f86acf7f3995d6842c3103
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  CANDIDATE_ARTIFACT_ID: '9342883750'

jobs:
  publish-beta19:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - name: Verify owner OTA lock and production authority
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'confirmation=OWNER_LOCKED_M2_BETA19_OTA_PUBLISH' ops/m2-beta19-ota-publish-trigger.txt
          grep -qx "target_version=$BETA_VERSION" ops/m2-beta19-ota-publish-trigger.txt
          for v in CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_STORE_PASSWORD; do [[ -n "${!v:-}" ]] || { echo "MISSING_REQUIRED_SECRET:$v" >&2; exit 1; }; done
          H=$(curl -fsS --connect-timeout 5 --max-time 20 "$SERVICE_URL/health")
          printf '%s' "$H" >/tmp/service-before.json
          node -e 'const j=JSON.parse(process.argv[1]);if(!j.ok||j.environment!=="production"||j.authority?.scope!=="PRODUCTION"||j.authority?.mode!=="SERVICE_PRIMARY"||j.generation!==process.env.SERVICE_GENERATION||j.replication?.state!=="HEALTHY"||Number(j.replication?.pending_count||0)!==0)throw new Error(JSON.stringify(j));console.log("authority_epoch="+j.authority.authority_epoch)' "$H"
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/discovery-before.json
          node -e 'const s=require("/tmp/service-before.json"),g=require("/tmp/discovery-before.json");if(!g.ok||g.authority_mode!=="SERVICE_PRIMARY"||g.service_url!==process.env.SERVICE_URL||g.cutover_configured!==true||Number(g.authority?.authority_epoch)!==Number(s.authority?.authority_epoch))throw new Error(JSON.stringify(g))'
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"STABLE\",\"current_version\":\"$STABLE_VERSION\"}" >/tmp/stable-before.json
          node -e 'const j=require("/tmp/stable-before.json");if(!j.ok||j.available!==false)throw new Error("STABLE_PRECONDITION_CHANGED:"+JSON.stringify(j))'
      - name: Download exact signed Beta19 candidate and verify immutable identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/beta-candidate
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d /tmp/beta-candidate
          APK=$(find /tmp/beta-candidate -type f -name '*.apk' | head -1)
          test -s "$APK"
          [[ "$(sha256sum "$APK" | awk '{print $1}')" == "$EXPECTED_BETA_SHA256" ]]
          BT="$ANDROID_HOME/build-tools/36.0.0"; test -x "$BT/aapt"; test -x "$BT/apksigner"
          "$BT/aapt" dump badging "$APK" >/tmp/badge-before.txt
          grep -q "package: name='$BETA_PACKAGE'" /tmp/badge-before.txt
          grep -q "versionCode='$BETA_VERSION_CODE'" /tmp/badge-before.txt
          grep -q "versionName='$BETA_VERSION'" /tmp/badge-before.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" >/tmp/cert-before.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert-before.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          cp "$APK" /tmp/beta19.apk
          echo "BETA19_SIZE=$(stat -c%s /tmp/beta19.apk)" >> "$GITHUB_ENV"
      - name: Exchange Google token and stage temporary secured GAS publisher
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP"); test -n "$TOKEN"; echo "::add-mask::$TOKEN"; echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          PUB=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-ota-publish-v1" | sha256sum | awk '{print $1}')
          PUBHASH=$(printf '%s' "$PUB" | sha256sum | awk '{print $1}')
          echo "::add-mask::$PUB"; echo "OTA_PUBLISH_TOKEN=$PUB" >> "$GITHUB_ENV"; echo "OTA_PUBLISH_TOKEN_HASH=$PUBHASH" >> "$GITHUB_ENV"
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+) ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          echo "SCRIPT_ID=$SCRIPT_ID" >> "$GITHUB_ENV"; echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          H=$(curl -sS -o /tmp/gas-content-current.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"); [[ "$H" == 200 ]] || { cat /tmp/gas-content-current.json; exit 1; }
          H=$(curl -sS -o /tmp/gas-deployment-current.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID"); [[ "$H" == 200 ]] || { cat /tmp/gas-deployment-current.json; exit 1; }
          node - <<'NODE'
          const fs=require('fs'),j=require('/tmp/gas-deployment-current.json');
          if(!j.deploymentConfig?.versionNumber)throw new Error('GAS_DEPLOYMENT_VERSION_MISSING');
          fs.writeFileSync('/tmp/gas-restore.json',JSON.stringify({deploymentConfig:{scriptId:j.deploymentConfig.scriptId,versionNumber:j.deploymentConfig.versionNumber,manifestFileName:j.deploymentConfig.manifestFileName||'appsscript',description:j.deploymentConfig.description||'M2 production primary'}}));
          NODE
          python3 - <<'PY'
          import json,os
          p='/tmp/gas-content-current.json'; doc=json.load(open(p)); files=doc.get('files') or []
          main=next((f for f in files if f.get('name')=='PICK_PACK_API'),None)
          if not main: raise SystemExit('PICK_PACK_API_NOT_FOUND_IN_LIVE_PROJECT')
          src=main.get('source','')
          anchor="    if (action === 'update_check') return ppJson_(ppUpdateCheck_(body));"
          routes="\n    if (action === 'm2_ota_publish_chunk') return ppJson_(ppM2OtaPublishChunk_(body));\n    if (action === 'm2_ota_publish_finalize') return ppJson_(ppM2OtaPublishFinalize_(body));\n    if (action === 'm2_ota_publish_abort') return ppJson_(ppM2OtaPublishAbort_(body));"
          if 'm2_ota_publish_chunk' not in src:
              if anchor not in src: raise SystemExit('UPDATE_CHECK_ROUTE_ANCHOR_MISSING')
              src=src.replace(anchor,anchor+routes,1)
          main['source']=src
          files=[f for f in files if f.get('name')!='M2_OTA_PUBLISH']
          h=os.environ['OTA_PUBLISH_TOKEN_HASH']; folder=os.environ['BETA_FOLDER_ID']; version=os.environ['BETA_VERSION']; sha=os.environ['EXPECTED_BETA_SHA256']; name='pick-pack-1291-public-beta-v'+version+'.apk'
          pub=f'''const PP_M2_OTA_PUBLISH = Object.freeze({{TOKEN_SHA256:{json.dumps(h)},BETA_FOLDER_ID:{json.dumps(folder)},VERSION:{json.dumps(version)},SHA256:{json.dumps(sha)},FILE_NAME:{json.dumps(name)}}});
function ppM2OtaHex_(bytes){{return bytes.map(function(b){{return ('0'+((b+256)%256).toString(16)).slice(-2);}}).join('');}}
function ppM2OtaTokenHash_(v){{return ppM2OtaHex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,String(v||''),Utilities.Charset.UTF_8));}}
function ppM2OtaAuthorized_(body){{return !!body&&ppM2OtaTokenHash_(body.publish_token)===PP_M2_OTA_PUBLISH.TOKEN_SHA256;}}
function ppM2OtaUploadId_(body){{const id=String(body.upload_id||'');if(!/^[A-Za-z0-9_-]{{8,80}}$/.test(id))throw new Error('OTA_UPLOAD_ID_INVALID');return id;}}
function ppM2OtaPartName_(id,i){{return '.__m2_beta19_'+id+'_'+('000'+i).slice(-3)+'.part';}}
function ppM2OtaDeleteNamed_(folder,name){{const it=folder.getFilesByName(name);while(it.hasNext())it.next().setTrashed(true);}}
function ppM2OtaPublishChunk_(body){{if(!ppM2OtaAuthorized_(body))return {{ok:false,error:'OTA_PUBLISH_UNAUTHORIZED'}};if(String(body.version||'')!==PP_M2_OTA_PUBLISH.VERSION)return {{ok:false,error:'OTA_VERSION_LOCK'}};const id=ppM2OtaUploadId_(body),idx=Number(body.chunk_index),total=Number(body.total_chunks);if(!Number.isInteger(idx)||!Number.isInteger(total)||idx<0||idx>=total||total<1||total>64)return {{ok:false,error:'OTA_CHUNK_RANGE'}};const b64=String(body.data_b64||'');if(!b64||b64.length>1000000)return {{ok:false,error:'OTA_CHUNK_SIZE'}};const bytes=Utilities.base64Decode(b64),folder=DriveApp.getFolderById(PP_M2_OTA_PUBLISH.BETA_FOLDER_ID),n=ppM2OtaPartName_(id,idx);ppM2OtaDeleteNamed_(folder,n);const f=folder.createFile(Utilities.newBlob(bytes,'application/octet-stream',n));f.setDescription(JSON.stringify({{upload_id:id,index:idx,total:total,version:PP_M2_OTA_PUBLISH.VERSION}}));return {{ok:true,upload_id:id,chunk_index:idx,total_chunks:total,size:bytes.length}};}}
function ppM2OtaPublishAbort_(body){{if(!ppM2OtaAuthorized_(body))return {{ok:false,error:'OTA_PUBLISH_UNAUTHORIZED'}};const id=ppM2OtaUploadId_(body),folder=DriveApp.getFolderById(PP_M2_OTA_PUBLISH.BETA_FOLDER_ID),files=folder.getFiles();let n=0;while(files.hasNext()){{const f=files.next();if(f.getName().indexOf('.__m2_beta19_'+id+'_')===0){{f.setTrashed(true);n++;}}}}return {{ok:true,aborted:true,deleted_parts:n}};}}
function ppM2OtaPublishFinalize_(body){{if(!ppM2OtaAuthorized_(body))return {{ok:false,error:'OTA_PUBLISH_UNAUTHORIZED'}};if(String(body.version||'')!==PP_M2_OTA_PUBLISH.VERSION)return {{ok:false,error:'OTA_VERSION_LOCK'}};const id=ppM2OtaUploadId_(body),total=Number(body.total_chunks);if(!Number.isInteger(total)||total<1||total>64)return {{ok:false,error:'OTA_TOTAL_INVALID'}};const folder=DriveApp.getFolderById(PP_M2_OTA_PUBLISH.BETA_FOLDER_ID),all=[];for(let i=0;i<total;i++){{const it=folder.getFilesByName(ppM2OtaPartName_(id,i));if(!it.hasNext())return {{ok:false,error:'OTA_PART_MISSING',chunk_index:i}};const bytes=it.next().getBlob().getBytes();for(let k=0;k<bytes.length;k++)all.push(bytes[k]);}}const got=ppM2OtaHex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,all));if(got!==PP_M2_OTA_PUBLISH.SHA256)return {{ok:false,error:'OTA_SHA256_MISMATCH',sha256:got}};ppM2OtaDeleteNamed_(folder,PP_M2_OTA_PUBLISH.FILE_NAME);const file=folder.createFile(Utilities.newBlob(all,'application/vnd.android.package-archive',PP_M2_OTA_PUBLISH.FILE_NAME));file.setDescription('Pick Pack 1291 Beta '+PP_M2_OTA_PUBLISH.VERSION+' | Service-first M2');file.setSharing(DriveApp.Access.ANYONE_WITH_LINK,DriveApp.Permission.VIEW);for(let i=0;i<total;i++)ppM2OtaDeleteNamed_(folder,ppM2OtaPartName_(id,i));return {{ok:true,published:true,file_id:file.getId(),file_name:file.getName(),version:PP_M2_OTA_PUBLISH.VERSION,size:file.getSize(),sha256:got}};}}
'''
          files.append({'name':'M2_OTA_PUBLISH','type':'SERVER_JS','source':pub})
          json.dump({'files':files},open('/tmp/gas-content-publisher.json','w'),ensure_ascii=False)
          PY
          H=$(curl -sS -o /tmp/gas-put-publisher.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-content-publisher.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"); [[ "$H" == 200 ]] || { cat /tmp/gas-put-publisher.out; exit 1; }
          H=$(curl -sS -o /tmp/gas-version-publisher.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Temporary guarded Beta19 OTA publisher"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions"); [[ "$H" == 200 ]] || { cat /tmp/gas-version-publisher.json; exit 1; }
          V=$(node -e 'const j=require("/tmp/gas-version-publisher.json");process.stdout.write(String(j.versionNumber))')
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/gas-deploy-publisher.json",JSON.stringify({deploymentConfig:{scriptId:process.argv[1],versionNumber:Number(process.argv[2]),manifestFileName:"appsscript",description:"Temporary guarded Beta19 OTA publisher"}}))' "$SCRIPT_ID" "$V"
          H=$(curl -sS -o /tmp/gas-deploy-publisher.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy-publisher.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID"); [[ "$H" == 200 ]] || { cat /tmp/gas-deploy-publisher.out; exit 1; }
      - name: Upload exact Beta19 candidate through temporary GAS DriveApp publisher
        shell: bash
        run: |
          set -euo pipefail
          RESTORED=0
          restore_deployment(){
            if [[ "$RESTORED" == 0 ]]; then
              curl -sS -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-restore.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/tmp/gas-restore.out || true
              RESTORED=1
            fi
          }
          cleanup(){
            rc=$?
            if [[ $rc -ne 0 ]]; then
              if [[ -n "${UPLOAD_ID:-}" ]]; then
                python3 - <<'PY'
          import json,os
          json.dump({'action':'m2_ota_publish_abort','publish_token':os.environ.get('OTA_PUBLISH_TOKEN',''),'upload_id':os.environ.get('UPLOAD_ID','')},open('/tmp/abort.json','w'))
          PY
                curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" --data-binary @/tmp/abort.json >/tmp/abort.out 2>/dev/null || true
              fi
              restore_deployment
            fi
            exit $rc
          }
          trap cleanup EXIT
          # Wait until the temporary publisher deployment is live, while ensuring discovery remains production-primary.
          READY=false
          for i in $(seq 1 30); do
            python3 - <<'PY'
          import json,os
          json.dump({'action':'m2_ota_publish_abort','publish_token':os.environ['OTA_PUBLISH_TOKEN'],'upload_id':'readiness_probe'},open('/tmp/probe.json','w'))
          PY
            if curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" --data-binary @/tmp/probe.json >/tmp/probe.out 2>/dev/null && node -e 'const j=require("/tmp/probe.out");process.exit(j.ok===true?0:1)'; then READY=true; break; fi
            sleep 3
          done
          [[ "$READY" == true ]] || { cat /tmp/probe.out || true; exit 1; }
          UPLOAD_ID="beta19-${GITHUB_RUN_ID}"; export UPLOAD_ID
          CHUNK=524288
          python3 - <<'PY'
          import base64,json,math,os
          data=open('/tmp/beta19.apk','rb').read(); chunk=524288; total=math.ceil(len(data)/chunk); token=os.environ['OTA_PUBLISH_TOKEN']; uid=os.environ['UPLOAD_ID']; version=os.environ['BETA_VERSION']
          if total>64: raise SystemExit('APK_TOO_LARGE_FOR_GUARDED_PUBLISHER')
          open('/tmp/total_chunks','w').write(str(total))
          for i in range(total):
              part=data[i*chunk:(i+1)*chunk]
              with open(f'/tmp/chunk-{i:03d}.json','w') as f: json.dump({'action':'m2_ota_publish_chunk','publish_token':token,'upload_id':uid,'version':version,'chunk_index':i,'total_chunks':total,'data_b64':base64.b64encode(part).decode()},f,separators=(',',':'))
          PY
          TOTAL=$(cat /tmp/total_chunks); export TOTAL
          for i in $(seq 0 $((TOTAL-1))); do
            F=$(printf '/tmp/chunk-%03d.json' "$i")
            curl -fsSL --connect-timeout 5 --max-time 90 --retry 3 --retry-delay 2 --retry-all-errors -H 'content-type: application/json' "$GSHEET_API_URL" --data-binary @"$F" > /tmp/chunk-response.json
            node -e 'const j=require("/tmp/chunk-response.json");if(!j.ok||Number(j.chunk_index)!==Number(process.argv[1]))throw new Error(JSON.stringify(j))' "$i"
            rm -f "$F"
          done
          python3 - <<'PY'
          import json,os
          json.dump({'action':'m2_ota_publish_finalize','publish_token':os.environ['OTA_PUBLISH_TOKEN'],'upload_id':os.environ['UPLOAD_ID'],'version':os.environ['BETA_VERSION'],'total_chunks':int(os.environ['TOTAL'])},open('/tmp/finalize.json','w'),separators=(',',':'))
          PY
          curl -fsSL --connect-timeout 5 --max-time 240 --retry 2 --retry-delay 3 --retry-all-errors -H 'content-type: application/json' "$GSHEET_API_URL" --data-binary @/tmp/finalize.json >/tmp/publish-result.json
          node -e 'const j=require("/tmp/publish-result.json");if(!j.ok||!j.published||j.version!==process.env.BETA_VERSION||String(j.sha256||"").toLowerCase()!==process.env.EXPECTED_BETA_SHA256||Number(j.size)!==Number(process.env.BETA19_SIZE))throw new Error(JSON.stringify(j))'
          restore_deployment
          trap - EXIT
      - name: Verify restored production GAS and OTA end-to-end
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 30); do
            curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/discovery-after.json || true
            if node -e 'const s=require("/tmp/service-before.json"),g=require("/tmp/discovery-after.json");process.exit(g.ok&&g.authority_mode==="SERVICE_PRIMARY"&&g.service_url===process.env.SERVICE_URL&&g.cutover_configured===true&&Number(g.authority?.authority_epoch)===Number(s.authority?.authority_epoch)?0:1)'; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/discovery-after.json; exit 1; }
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$PREVIOUS_BETA_VERSION\"}" >/tmp/ota-beta18.json
          node -e 'const j=require("/tmp/ota-beta18.json");if(!j.ok||j.available!==true||j.version_name!==process.env.BETA_VERSION||String(j.sha256||"").toLowerCase()!==process.env.EXPECTED_BETA_SHA256||!j.apk_url)throw new Error(JSON.stringify(j))'
          URL=$(node -e 'const j=require("/tmp/ota-beta18.json");process.stdout.write(j.apk_url)')
          curl -fL --connect-timeout 10 --max-time 180 --retry 5 --retry-delay 2 --retry-all-errors "$URL" -o /tmp/ota-downloaded.apk
          [[ "$(sha256sum /tmp/ota-downloaded.apk | awk '{print $1}')" == "$EXPECTED_BETA_SHA256" ]]
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/ota-downloaded.apk >/tmp/badge-after.txt
          grep -q "package: name='$BETA_PACKAGE'" /tmp/badge-after.txt
          grep -q "versionCode='$BETA_VERSION_CODE'" /tmp/badge-after.txt
          grep -q "versionName='$BETA_VERSION'" /tmp/badge-after.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota-downloaded.apk >/tmp/cert-after.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert-after.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$BETA_VERSION\"}" >/tmp/ota-self.json
          node -e 'const j=require("/tmp/ota-self.json");if(!j.ok||j.available!==false||j.version_name!==process.env.BETA_VERSION)throw new Error(JSON.stringify(j))'
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d "{\"action\":\"update_check\",\"channel\":\"STABLE\",\"current_version\":\"$STABLE_VERSION\"}" >/tmp/stable-after.json
          node -e 'const before=require("/tmp/stable-before.json"),after=require("/tmp/stable-after.json");if(!after.ok||after.available!==false||JSON.stringify(before)!==JSON.stringify(after))throw new Error("STABLE_CHANGED:"+JSON.stringify({before,after}))'
          H=$(curl -fsS "$SERVICE_URL/health"); printf '%s' "$H" >/tmp/service-after.json
          node -e 'const before=require("/tmp/service-before.json"),after=require("/tmp/service-after.json");if(!after.ok||after.environment!=="production"||after.authority?.scope!=="PRODUCTION"||after.authority?.mode!=="SERVICE_PRIMARY"||Number(after.authority?.authority_epoch)!==Number(before.authority?.authority_epoch)||after.replication?.state!=="HEALTHY")throw new Error(JSON.stringify(after))'
      - name: Emit OTA publication evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m2-beta19-ota-publish-evidence
          cp /tmp/publish-result.json m2-beta19-ota-publish-evidence/publish-result.json
          cp /tmp/ota-beta18.json m2-beta19-ota-publish-evidence/beta18-update-check.json
          cp /tmp/ota-self.json m2-beta19-ota-publish-evidence/beta19-self-check.json
          cp /tmp/stable-before.json m2-beta19-ota-publish-evidence/stable-before.json
          cp /tmp/stable-after.json m2-beta19-ota-publish-evidence/stable-after.json
          cp /tmp/service-before.json m2-beta19-ota-publish-evidence/service-before.json
          cp /tmp/service-after.json m2-beta19-ota-publish-evidence/service-after.json
          cp /tmp/discovery-after.json m2-beta19-ota-publish-evidence/discovery-after.json
          cp /tmp/badge-after.txt m2-beta19-ota-publish-evidence/package-badging.txt
          cp /tmp/cert-after.txt m2-beta19-ota-publish-evidence/signer.txt
          sha256sum /tmp/ota-downloaded.apk > m2-beta19-ota-publish-evidence/downloaded-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m2-beta19-ota-publish-evidence-${{ github.run_id }}
          path: m2-beta19-ota-publish-evidence/
          retention-days: 30
