name: S07 Observer
on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s07-observe.txt'
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record S07 workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow s07-nonui-refactor.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle > ops/s07-runs.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/s07-runs.json
          git commit -m 'chore: record S07 run status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
