name: One-shot Beta OTA Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/ota-beta-trigger.txt'

permissions:
  contents: read
  id-token: write

jobs:
  release-beta-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OTA_BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
      EXPECTED_CERT_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Beta version from source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n '/create("beta")/,/create("stable")/p' app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -1)
          CODE=$(sed -n '/create("beta")/,/create("stable")/p' app/build.gradle.kts | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)
          [[ "$VERSION" =~ ^0\.4\.2-beta\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[0-9]+$ ]]
          APK="pick-pack-1291-public-beta-v${VERSION}.apk"
          SUM="SHA256SUMS-v${VERSION}-publicbeta.txt"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"
          echo "Beta $VERSION / versionCode $CODE"

      - name: Exchange Google OAuth token and ensure version is not already on Drive
        id: google
        shell: bash
        env:
          APK_NAME: ${{ steps.meta.outputs.apk }}
          SUM_NAME: ${{ steps.meta.outputs.sum }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          Q="'${OTA_BETA_FOLDER_ID}' in parents and trashed=false and (name='${APK_NAME}' or name='${SUM_NAME}')"
          curl -fsS -G -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "q=$Q" --data-urlencode 'fields=files(id,name)' \
            'https://www.googleapis.com/drive/v3/files' > /tmp/existing.json
          COUNT=$(python3 -c 'import json; print(len(json.load(open("/tmp/existing.json")).get("files",[])))')
          test "$COUNT" = 0 || { cat /tmp/existing.json; echo 'Beta version already exists on Drive' >&2; exit 1; }
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/tools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/cmd"; mv "$RUNNER_TEMP/cmd/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Fetch fixed signing identity via GitHub OIDC
        shell: bash
        env:
          SIGNING_BROKER_URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/pick-pack-ci-signing
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"; test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pick-pack-1291-signing" > "$RUNNER_TEMP/oidc.json"
          OIDC_TOKEN=$(jq -er '.value' "$RUNNER_TEMP/oidc.json")
          curl -fsS --retry 3 --retry-all-errors -X POST "$SIGNING_BROKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" > "$RUNNER_TEMP/signing.json"
          jq -e '.ok == true and .repository == "tam95supra-source/pick-pack-1291" and .alias == "pickpack1291"' "$RUNNER_TEMP/signing.json" >/dev/null
          jq -er '.keystore_b64' "$RUNNER_TEMP/signing.json" | base64 -d > "$RUNNER_TEMP/release.jks"
          jq -er '.store_password' "$RUNNER_TEMP/signing.json" > "$RUNNER_TEMP/store.pass"
          jq -er '.key_password' "$RUNNER_TEMP/signing.json" > "$RUNNER_TEMP/key.pass"
          jq -er '.alias' "$RUNNER_TEMP/signing.json" > "$RUNNER_TEMP/key.alias"
          chmod 600 "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass" "$RUNNER_TEMP/key.alias"
          rm -f "$RUNNER_TEMP/oidc.json" "$RUNNER_TEMP/signing.json"

      - name: Build, sign and verify Beta
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          SUM_NAME: ${{ steps.meta.outputs.sum }}
        run: |
          set -euo pipefail
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          gradle --no-daemon :app:assembleBetaRelease
          UNSIGNED=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          test -s "$UNSIGNED"
          mkdir -p dist
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$(cat "$RUNNER_TEMP/key.alias")" \
            --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" \
            --out "dist/$APK_NAME" "$UNSIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/$APK_NAME" | tee /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/cert.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "dist/$APK_NAME" > /tmp/badge.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badge.txt
          grep -q "versionCode='$CODE'" /tmp/badge.txt
          grep -q "versionName='$VERSION'" /tmp/badge.txt
          (cd dist && sha256sum "$APK_NAME" > "$SUM_NAME")

      - name: Upload signed Beta and checksum to Drive OTA folder
        id: upload
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google.outputs.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          SUM_NAME: ${{ steps.meta.outputs.sum }}
        run: |
          set -euo pipefail
          upload_file() {
            local NAME="$1" MIME="$2" PATHNAME="$3" OUT="$4"
            python3 - "$NAME" "$OTA_BETA_FOLDER_ID" "$VERSION" <<'PY' > /tmp/meta.json
import json,sys
print(json.dumps({'name':sys.argv[1],'parents':[sys.argv[2]],'description':'Pick Pack 1291 Beta OTA '+sys.argv[3]+' - full function validation build'},ensure_ascii=False))
PY
            curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" \
              -F "metadata=@/tmp/meta.json;type=application/json;charset=UTF-8" \
              -F "file=@${PATHNAME};type=${MIME}" \
              'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,md5Checksum' > "$OUT"
            python3 - "$OUT" <<'PY'
import json,sys
j=json.load(open(sys.argv[1])); assert j.get('id') and j.get('name') and int(j.get('size',0))>0, j
PY
          }
          upload_file "$APK_NAME" 'application/vnd.android.package-archive' "dist/$APK_NAME" /tmp/apk.json
          upload_file "$SUM_NAME" 'text/plain' "dist/$SUM_NAME" /tmp/sum.json
          APK_ID=$(python3 -c 'import json; print(json.load(open("/tmp/apk.json"))["id"])')
          SUM_ID=$(python3 -c 'import json; print(json.load(open("/tmp/sum.json"))["id"])')
          curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d '{"role":"reader","type":"anyone"}' \
            "https://www.googleapis.com/drive/v3/files/$APK_ID/permissions?fields=id" > /tmp/perm.json
          echo "apk_id=$APK_ID" >> "$GITHUB_OUTPUT"
          echo "sum_id=$SUM_ID" >> "$GITHUB_OUTPUT"

      - name: Verify Drive bytes and live OTA discovery
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google.outputs.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          APK_ID: ${{ steps.upload.outputs.apk_id }}
        run: |
          set -euo pipefail
          LOCAL_SHA=$(sha256sum "dist/$APK_NAME" | awk '{print $1}')
          curl -fsSL -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$APK_ID?alt=media" -o /tmp/drive.apk
          DRIVE_SHA=$(sha256sum /tmp/drive.apk | awk '{print $1}')
          test "$LOCAL_SHA" = "$DRIVE_SHA"
          API='https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec'
          curl -fsSL -H 'content-type: application/json' "$API" \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.0.0"}' > /tmp/ota.json
          python3 - "$VERSION" "$LOCAL_SHA" <<'PY'
import json,sys
j=json.load(open('/tmp/ota.json'))
assert j.get('ok') is True, j
assert j.get('available') is True, j
assert j.get('channel')=='BETA', j
assert j.get('version_name')==sys.argv[1], j
assert j.get('sha256','').lower()==sys.argv[2].lower(), j
assert j.get('apk_url'), j
print(json.dumps({'version':j['version_name'],'size':j.get('size'),'source':j.get('source'),'published_at':j.get('published_at')},ensure_ascii=False))
PY

      - uses: actions/upload-artifact@v4
        with:
          name: beta-ota-${{ steps.meta.outputs.version }}
          path: dist/*
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass" "$RUNNER_TEMP/key.alias" "$RUNNER_TEMP/oidc.json" "$RUNNER_TEMP/signing.json"
