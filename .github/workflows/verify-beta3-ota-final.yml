name: Verify Beta3 Drive OTA Final

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-beta3-ota-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      API: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      EXPECTED_SHA: 9ecc9caa7c87e4c200809b17bc7ea480f78a39989a3eb28e1ce0024071ce0a1a
      EXPECTED_FILE_ID: 1ECnRQyaS9OVXkk11aMa-L4jkvk6IGRK4
    steps:
      - name: Live backend health/session model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$API" -d '{"action":"health"}' > /tmp/health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json'))
          assert j.get('ok') and j.get('sheet_read') is True
          assert j.get('api_version')=='0.4.2'
          assert j.get('auth_session_model')=='SINGLE_ACTIVE_DEVICE_V1'
          print('Health + persistent session backend: PASS')
          PY

      - name: Beta2 sees Beta3 and download SHA matches
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$API" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.2"}' > /tmp/update.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/update.json'))
          assert j.get('ok') and j.get('source')=='GOOGLE_DRIVE' and j.get('channel')=='BETA'
          assert j.get('available') is True
          assert j.get('version_name')=='0.4.2-beta.3'
          assert j.get('sha256')==os.environ['EXPECTED_SHA']
          assert os.environ['EXPECTED_FILE_ID'] in j.get('apk_url','')
          open('/tmp/url','w').write(j['apk_url'])
          print('Beta2 -> Beta3 metadata: PASS')
          PY
          URL=$(cat /tmp/url)
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/beta3.apk
          echo "$EXPECTED_SHA  /tmp/beta3.apk" | sha256sum -c -
          echo 'Drive APK download + SHA-256: PASS'

      - name: Beta3 does not update itself
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$API" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.3"}' > /tmp/self.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/self.json'))
          assert j.get('ok') and j.get('channel')=='BETA' and j.get('version_name')=='0.4.2-beta.3'
          assert j.get('available') is False
          print('Beta3 self-update guard: PASS')
          PY

      - name: Stable channel is isolated from Beta3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'content-type: application/json' "$API" -d '{"action":"update_check","channel":"STABLE","current_version":"0.0.0"}' > /tmp/stable.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/stable.json'))
          assert j.get('ok') and j.get('channel')=='STABLE' and j.get('source')=='GOOGLE_DRIVE'
          assert j.get('version_name')!='0.4.2-beta.3'
          assert '1ECnRQyaS9OVXkk11aMa-L4jkvk6IGRK4' not in j.get('apk_url','')
          print('Stable/Beta folder isolation: PASS')
          PY