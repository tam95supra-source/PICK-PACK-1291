name: Apply S04 Layout 2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-s04-layout2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply S04 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def p(path): return Path(path)
          def read(path): return p(path).read_text(encoding='utf-8')
          def write(path, value): p(path).write_text(value, encoding='utf-8')
          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'MISSING REPLACEMENT: {label}')
              return text.replace(old, new, 1)
          def between(text, start, end, new, label):
              a=text.find(start)
              b=text.find(end, a+len(start)) if a>=0 else -1
              if a<0 or b<0:
                  raise SystemExit(f'MISSING RANGE: {label}')
              return text[:a]+new+text[b:]

