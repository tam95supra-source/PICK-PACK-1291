name: Beta51 Service Resource Logic V4
on:
  push:
    branches: [agent/service-migration-m2]
    paths: ['.github/workflows/beta51-service-resource-fix-v4.yml']
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/service-migration-m2, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 tools/apply_beta51_service_resource_logic_v3.py >/tmp/p.log 2>&1
          c=$?; cat /tmp/p.log; echo "code=$c" >> "$GITHUB_OUTPUT"; exit $c
      - name: Install and typecheck
        id: typecheck
        working-directory: service
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund >/tmp/t.log 2>&1 && npm run check >>/tmp/t.log 2>&1
          c=$?; tail -n 120 /tmp/t.log; echo "code=$c" >> "$GITHUB_OUTPUT"; exit $c
      - name: Contract gates
        run: |
          set -euo pipefail
          grep -q 'user_picks_reissue' service/src/mobile_hotfix.ts
          grep -q 'pack_tables_reissue' service/src/mobile_hotfix.ts
          grep -q 'ensureDailyUserReuseAllowed' service/src/core.ts
          grep -q 'allowDailyReplay' service/src/core.ts
          grep -q 'duplicate_user:duplicateUser' service/src/session_hotfix.ts
          ! grep -q 'user_pack=?2 AND shift=?3' service/src/session_hotfix.ts
      - name: Commit canonical service source
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json
          rm -f tools/apply_beta51_service_resource_logic.py tools/apply_beta51_service_resource_logic_v3.py
          rm -f .github/workflows/beta51-service-resource-fix.yml .github/workflows/beta51-service-resource-fix-v2.yml .github/workflows/beta51-service-resource-fix-v3.yml .github/workflows/beta51-service-resource-fix-v4.yml
          git add -A && git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(beta51): explicit user reissue and cross-shift pack mapping'
          git push origin HEAD:agent/service-migration-m2
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          msg="BETA51_SERVICE_RESOURCE_FIX_V4 run=${GITHUB_RUN_ID} status=${{ job.status }} patch=${{ steps.patch.outputs.code }} typecheck=${{ steps.typecheck.outputs.code }}"
          [ -f /tmp/p.log ] && msg="$msg patch_tail=$(tail -n 6 /tmp/p.log | tr '\n' ' ' | cut -c1-700)"
          [ -f /tmp/t.log ] && msg="$msg type_tail=$(tail -n 10 /tmp/t.log | tr '\n' ' ' | cut -c1-1000)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="$msg"
