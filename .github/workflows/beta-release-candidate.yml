name: Beta Release Candidate

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/beta-release-candidate-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release-candidate
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read and enforce release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text=Path('app/build.gradle.kts').read_text()
          beta=re.search(r'create\("beta"\)\s*\{(.*?)\n\s*\}',text,re.S).group(1)
          stable=re.search(r'create\("stable"\)\s*\{(.*?)\n\s*\}',text,re.S).group(1)
          def one(block,p): return re.search(p,block).group(1)
          print('beta_code='+one(beta,r'versionCode\s*=\s*(\d+)'))
          print('beta_name='+one(beta,r'versionName\s*=\s*"([^"]+)"'))
          print('stable_code='+one(stable,r'versionCode\s*=\s*(\d+)'))
          print('stable_name='+one(stable,r'versionName\s*=\s*"([^"]+)"'))
          PY
          grep -q 'versionCode = 49' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.43"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -q 'S49_BETA43_SESSION_ADMIN_CORRECTIONS' tools/apply_s49_beta43_session_admin_corrections.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Beta and Stable validation candidates exactly once
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease
      - name: Verify package metadata
        id: package
        shell: bash
        env:
          BETA_CODE: ${{ steps.meta.outputs.beta_code }}
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
          STABLE_CODE: ${{ steps.meta.outputs.stable_code }}
          STABLE_NAME: ${{ steps.meta.outputs.stable_name }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          "$BT/aapt" dump badging "$BETA" > /tmp/beta.txt; "$BT/aapt" dump badging "$STABLE" > /tmp/stable.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='$BETA_CODE'" /tmp/beta.txt; grep -q "versionName='$BETA_NAME'" /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.txt
          grep -q "versionCode='$STABLE_CODE'" /tmp/stable.txt; grep -q "versionName='$STABLE_NAME'" /tmp/stable.txt
      - name: Sign Beta and verify locked signer
        id: sign
        shell: bash
        env:
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"; printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta
          OUT="dist/beta/pick-pack-1291-public-beta-${BETA_NAME}.apk"; BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          sha=$(sha256sum "$OUT" | awk '{print $1}'); size=$(stat -c '%s' "$OUT"); file=$(basename "$OUT")
          printf '%s  %s\n' "$sha" "$file" > dist/beta/SHA256SUMS-beta43.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "size=$size" >> "$GITHUB_OUTPUT"; echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload signed Beta candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-${{ steps.meta.outputs.beta_name }}-signed-validation
          path: dist/beta/*
          retention-days: 7
      - name: Persist candidate receipt
        if: always()
        shell: bash
        env:
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
          BETA_CODE: ${{ steps.meta.outputs.beta_code }}
          STABLE_NAME: ${{ steps.meta.outputs.stable_name }}
          STABLE_CODE: ${{ steps.meta.outputs.stable_code }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          APK_SHA: ${{ steps.sign.outputs.sha }}
          APK_SIZE: ${{ steps.sign.outputs.size }}
          APK_FILE: ${{ steps.sign.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p ops
          verdict=FAIL
          if [[ "$BUILD_OUTCOME" == success && "$PACKAGE_OUTCOME" == success && "$SIGN_OUTCOME" == success && -n "${ARTIFACT_ID:-}" ]]; then verdict=PASS; fi
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "beta_name=$BETA_NAME"
            echo "beta_code=$BETA_CODE"
            echo "stable_name=$STABLE_NAME"
            echo "stable_code=$STABLE_CODE"
            echo "build=$BUILD_OUTCOME"
            echo "package=$PACKAGE_OUTCOME"
            echo "sign=$SIGN_OUTCOME"
            echo "artifact_id=${ARTIFACT_ID:-}"
            echo "apk_file=${APK_FILE:-}"
            echo "apk_sha256=${APK_SHA:-}"
            echo "apk_size=${APK_SIZE:-}"
            echo "signer_sha256=$EXPECTED_SIGNER_SHA256"
            echo "stable_publish=FORBIDDEN"
            echo "verdict=$verdict"
          } > ops/beta-release-candidate-result.txt
          git config user.name github-actions; git config user.email github-actions@github.com
          git add -- ops/beta-release-candidate-result.txt
          git commit -m 'ops: record Beta release candidate receipt'
          git push origin HEAD:agent/service-migration-m2
          [[ "$verdict" == PASS ]]
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
