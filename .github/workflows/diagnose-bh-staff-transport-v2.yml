name: Diagnose BH staff transport v2
on:
  push:
    branches: [main]
    paths:
      - 'ops/diagnose-bh-staff-transport-v2.trigger'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prepare temp source and Google token
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID"|tr -d '\r\n\t ')
          test -n "$TOKEN"; test -n "$SCRIPT_ID"; printf '%s' "$TOKEN" >/tmp/google-token; printf '%s' "$SCRIPT_ID" >/tmp/script-id; chmod 600 /tmp/google-token
          echo "::add-mask::$TOKEN"; echo "::add-mask::$SCRIPT_ID"
          P=$(openssl rand -hex 24); printf '%s' "$P" >/tmp/probe-token; chmod 600 /tmp/probe-token; echo "::add-mask::$P"
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/canonical.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          token=Path('/tmp/probe-token').read_text(); temp=json.loads(Path('/tmp/canonical.json').read_text())
          main=[f for f in temp['files'] if f.get('name')=='PICK_PACK_API' and f.get('type')=='SERVER_JS']; assert len(main)==1
          anchor="    const action = String(body.action || '').trim();\n"; assert anchor in main[0]['source']
          route=f'''\n    if (action === '__ci_bh_transport_probe_v2__' && String(body.probe_token || '') === '{token}') {{\n      try {{\n        const oauth = ScriptApp.getOAuthToken();\n        const out = ppBaoHangBridgePost_({{action:'staff-source-ping',event_id:'ci-transport-v2-'+Utilities.getUuid(),source_id:PP_BH_STAFF_BRIDGE.SOURCE_ID,source_tab:PP_BH_STAFF_BRIDGE.SOURCE_TAB,change_type:'TRANSPORT_PROBE_V2',row_start:404,row_end:404,col_start:1,col_end:6,old_codes:{{'404':'909090'}},at:new Date().toISOString()}});\n        return ppJson_({{ok:true,oauth_present:!!oauth,bridge:out}});\n      }} catch(err) {{ return ppJson_({{ok:false,error:String(err && err.message || err).slice(0,220)}}); }}\n    }}\n'''
          main[0]['source']=main[0]['source'].replace(anchor,anchor+route,1)
          Path('/tmp/temp.json').write_text(json.dumps(temp,ensure_ascii=False))
          PY
      - name: Create isolated temporary deployment
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/google-token); SCRIPT_ID=$(cat /tmp/script-id)
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/temp.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/update.out
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Isolated staff transport v2 diagnostic"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" >/tmp/version.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/version.json"))["versionNumber"])'); printf '%s' "$V" >/tmp/version
          python3 - "$V" <<'PY'
          import json,sys
          open('/tmp/new-deploy.json','w').write(json.dumps({'versionNumber':int(sys.argv[1]),'manifestFileName':'appsscript','description':'TEMP DELETE ME staff transport v2'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/new-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" >/tmp/deployment.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/deployment.json')); print(j['deploymentId'],file=open('/tmp/temp-deployment-id','w')); web=[e.get('webApp',{}) for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert web and web[0].get('url'); print(web[0]['url'],file=open('/tmp/temp-web-url','w'))
          PY
          echo "::add-mask::$(cat /tmp/temp-deployment-id)"
      - name: Poll temporary diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/temp-web-url); P=$(cat /tmp/probe-token)
          echo '{"ok":false,"error":"NO_RESPONSE"}' >/tmp/response.json
          for i in $(seq 1 30); do
            curl -fsSL -H 'content-type: text/plain;charset=UTF-8' "$URL" -d "{\"action\":\"__ci_bh_transport_probe_v2__\",\"probe_token\":\"$P\"}" >/tmp/response.json || true
            if jq -e '(.oauth_present==true) or ((.error // "") != "UNKNOWN_ACTION")' /tmp/response.json >/dev/null 2>&1; then break; fi
            sleep 3
          done
          jq -e 'has("ok")' /tmp/response.json >/dev/null
      - name: Delete temp deployment and restore editor source
        if: always()
        shell: bash
        run: |
          set +e
          TOKEN=$(cat /tmp/google-token 2>/dev/null); SCRIPT_ID=$(cat /tmp/script-id 2>/dev/null); D=$(cat /tmp/temp-deployment-id 2>/dev/null)
          CLEAN=PASS
          if [[ -n "$TOKEN" && -n "$SCRIPT_ID" && -n "$D" ]]; then curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$D" >/tmp/delete.out || CLEAN=DELETE_FAIL; fi
          if [[ -n "$TOKEN" && -n "$SCRIPT_ID" && -s /tmp/canonical.json ]]; then curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/canonical.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/restore.out || CLEAN=SOURCE_RESTORE_FAIL; fi
          echo "$CLEAN" >/tmp/cleanup
      - name: Record sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CLEAN=$(cat /tmp/cleanup 2>/dev/null || echo UNKNOWN); V=$(cat /tmp/version 2>/dev/null || echo 0)
          python3 - "$CLEAN" "$V" <<'PY'
          import datetime,json,re,sys
          try:r=json.load(open('/tmp/response.json'))
          except:r={}
          raw=str(r.get('error',''))
          if r.get('ok') is True: outcome='PASS'
          elif raw=='UNKNOWN_ACTION': outcome='ROUTE_NOT_PROPAGATED'
          elif 'STAFF_BRIDGE_OAUTH_REQUIRED' in raw: outcome='OAUTH_REQUIRED'
          elif 'STAFF_BRIDGE_SENDER_DENIED' in raw: outcome='SENDER_DENIED'
          elif 'BH_BRIDGE_HTTP_' in raw: outcome='BRIDGE_HTTP_ERROR'
          elif 'permission' in raw.lower() and 'OAuth' in raw: outcome='OAUTH_PERMISSION_ERROR'
          elif 'permission' in raw.lower(): outcome='PERMISSION_ERROR'
          elif 'UrlFetch' in raw: outcome='URLFETCH_ERROR'
          elif 'OAuth' in raw or 'oauth' in raw: outcome='OAUTH_OTHER_ERROR'
          elif raw: outcome='OTHER_ERROR'
          else: outcome='NO_RESPONSE'
          bridge=r.get('bridge') if isinstance(r.get('bridge'),dict) else {}
          proof={'status':'PASS' if outcome=='PASS' and sys.argv[1]=='PASS' else 'DIAGNOSED','transport_outcome':outcome,'oauth_present':r.get('oauth_present') is True,'receiver_ok':bridge.get('ok') is True,'receiver_changed':bridge.get('changed'),'cleanup':sys.argv[1],'diagnostic_version':int(sys.argv[2] or 0),'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('ops/bh-staff-transport-v2-proof.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
          cat ops/bh-staff-transport-v2-proof.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bh-staff-transport-v2-proof.json
          git diff --cached --quiet || git commit -m 'chore(gas): record isolated transport v2 proof'
          git pull --rebase origin main; git push origin HEAD:main
