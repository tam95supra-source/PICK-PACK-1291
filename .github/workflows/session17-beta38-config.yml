name: Session17 Beta38 Config
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session17-beta38-config-trigger.txt]
permissions:
  contents: write
jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - name: Update Beta only and register S44 transform input
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts');s=p.read_text()
          s=s.replace('versionCode = 43\n            versionName = "0.4.2-beta.37"','versionCode = 44\n            versionName = "0.4.2-beta.38"',1)
          anchor='    inputs.file(rootProject.file("tools/apply_s43_foreground_outbox_wake.py"))\n'
          add=anchor+'    inputs.file(rootProject.file("tools/apply_s44_session_singleflight_observability.py"))\n'
          if 'apply_s44_session_singleflight_observability.py' not in s:
              assert anchor in s
              s=s.replace(anchor,add,1)
          s=s.replace('S38 + S39 + S40 + S43 in the ephemeral build workspace.','S38 + S39 + S40 + S43 + S44 in the ephemeral build workspace.')
          p.write_text(s)
          PY
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.38"' app/build.gradle.kts
          grep -q 'apply_s44_session_singleflight_observability.py' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          git diff -- app/build.gradle.kts > /tmp/config.patch
      - name: Persist config
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD >/dev/null
          git pull --rebase origin agent/service-migration-m2
          git apply /tmp/config.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts
          git diff --cached --quiet || git commit -m 'chore(beta): configure 0.4.2-beta.38 S44'
          git push origin HEAD:agent/service-migration-m2
          OUT=/tmp/r; echo "checked_at=$(date -u +%FT%TZ)" >"$OUT"; echo "head=$(git rev-parse HEAD)" >>"$OUT"; echo beta_version_code=44 >>"$OUT"; echo beta_version_name=0.4.2-beta.38 >>"$OUT"; echo s44_transform_registered=PASS >>"$OUT"; echo stable=UNTOUCHED >>"$OUT"; echo merge_pr38=UNTOUCHED >>"$OUT"; echo verdict=PASS >>"$OUT"
      - name: Record
        if: always()
        shell: bash
        run: |
          test -f /tmp/r || echo verdict=FAILED_OR_STOPPED >/tmp/r
          cp /tmp/r /tmp/c; git reset --hard HEAD >/dev/null; git pull --rebase origin agent/service-migration-m2 || true; cp /tmp/c ops/session17-beta38-config-result.txt; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add ops/session17-beta38-config-result.txt; git diff --cached --quiet || git commit -m 'ops: record Beta38 config'; git push origin HEAD:agent/service-migration-m2