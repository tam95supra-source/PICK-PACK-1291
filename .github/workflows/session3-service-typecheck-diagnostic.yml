name: Session3 Service Typecheck Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session3-service-typecheck-trigger.txt]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check recovery source
        shell: bash
        run: |
          set +e
          python3 tools/apply_s28d_compat_resume_reflected.py >/tmp/patch.log 2>&1
          P=$?
          cd service
          npm install --no-audit --no-fund >/tmp/install.log 2>&1
          I=$?
          npm run check >/tmp/check.log 2>&1
          C=$?
          cd ..
          {
            echo "patch_exit=$P"
            echo "install_exit=$I"
            echo "check_exit=$C"
            echo "--- patch ---"
            tail -40 /tmp/patch.log
            echo "--- check ---"
            tail -160 /tmp/check.log
          } > ops/session3-service-typecheck-result.txt
      - name: Record result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session3-service-typecheck-result.txt
          git diff --cached --quiet || git commit -m 'ops: record service typecheck diagnostic'
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2
