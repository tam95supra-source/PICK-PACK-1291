name: Session3 S28 Runtime Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session3-s28-runtime-diagnostic-trigger.txt]
permissions:
  contents: write
env:
  D1_NAME: pick-pack-1291-service-prod
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Query sanitized S28 state
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/list.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --get "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" --data-urlencode "name=$D1_NAME" --data-urlencode 'per_page=100'); [[ "$HTTP" == 200 ]]
          ID=$(jq -r --arg n "$D1_NAME" '.result[]|select(.name==$n)|(.uuid // .id // empty)' /tmp/list.json|head -1); [[ -n "$ID" ]]
          cd service; npm install --no-audit --no-fund >/dev/null
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));c.name='pick-pack-1291-service';c.main='src/entry_product.ts';c.vars={SERVICE_GENERATION:'m2-prod-20260819-001',GOOGLE_SOURCE_SHEET_ID:'1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'};c.d1_databases[0].database_name='pick-pack-1291-service-prod';c.d1_databases[0].database_id=process.argv[1];delete c.secrets;fs.writeFileSync('/tmp/w.jsonc',JSON.stringify(c,null,2))" "$ID"
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/w.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope FROM authority_state WHERE singleton_id=1; SELECT authority_seq,ingest_status,event_id FROM fallback_event_inbox WHERE authority_epoch=7 ORDER BY authority_seq; SELECT authority_seq,event_type,origin,event_id FROM events WHERE authority_epoch=7 ORDER BY authority_seq; SELECT status,started_at,completed_at,error FROM recovery_runs WHERE recovery_type='FAILBACK' ORDER BY started_at DESC LIMIT 5; SELECT COUNT(*) n FROM mutation_assertions WHERE event_id=(SELECT event_id FROM fallback_event_inbox WHERE authority_epoch=7 AND authority_seq=1); SELECT COUNT(*) n FROM events WHERE event_id=(SELECT event_id FROM fallback_event_inbox WHERE authority_epoch=7 AND authority_seq=1)" --json >/tmp/q.json
          cd ..
          node - <<'NODE'
          const fs=require('fs'),x=require('/tmp/q.json'),sets=x.filter(v=>Array.isArray(v.results)).map(v=>v.results),a=sets[0][0]||{},i=sets[1]||[],e=sets[2]||[],r=sets[3]||[],ma=sets[4]?.[0]?.n??-1,ev=sets[5]?.[0]?.n??-1;const safe=s=>String(s||'').replace(/[A-Za-z0-9_\-]{40,}/g,'[LONG]').slice(0,180);const lines=[`checked_at=${new Date().toISOString()}`,`authority=${a.mode||''}|${a.authority_epoch||0}|${a.authority_seq||0}|${a.scope||''}`,`inbox=${i.map(v=>v.authority_seq+':'+v.ingest_status).join(',')}`,`epoch7_events=${e.map(v=>v.authority_seq+':'+v.event_type+':'+v.origin).join(',')||'NONE'}`,`seq1_assertion_count=${ma}`,`seq1_event_count=${ev}`];r.forEach((v,n)=>{lines.push(`recovery${n+1}=${v.status||''}|${v.started_at||''}|${safe(v.error)}`)});lines.push('payload_logged=NO','verdict=DIAGNOSTIC_COMPLETE','');fs.writeFileSync('/tmp/result.txt',lines.join('\n'));
          NODE
      - name: Record
        if: always()
        shell: bash
        run: |
          test -f /tmp/result.txt || printf 'checked_at=%s\nverdict=DIAGNOSTIC_FAILED\npayload_logged=NO\n' "$(date -u +%FT%TZ)" >/tmp/result.txt
          cp /tmp/result.txt /tmp/r; git reset --hard HEAD >/dev/null; cp /tmp/r ops/session3-s28-runtime-diagnostic-result.txt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session3-s28-runtime-diagnostic-result.txt;git diff --cached --quiet || (git commit -m 'ops: record S28 runtime diagnostic' && git push)
