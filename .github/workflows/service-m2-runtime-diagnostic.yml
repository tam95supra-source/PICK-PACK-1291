name: Service M2 Runtime Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-runtime-diagnostic.yml'
      - 'tools/s13_recovery_diag.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s13-recovery-diag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - name: Read current D1 failback diagnostics
        shell: bash
        run: python3 tools/s13_recovery_diag.py
