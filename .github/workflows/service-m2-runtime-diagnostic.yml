name: Service M2 Runtime Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-runtime-diagnostic.yml'
      - 'service/src/business_date.ts'
      - 'service/src/recovery.ts'
      - 'service/src/entry_recovery_hotfix.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s13-recovery-resume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_GENERATION: m2-prod-20260819-001
  GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck rollover and resumable recovery
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          grep -q 'SERVICE_DAILY_ROLLOVER' src/business_date.ts
          grep -q 'FAILBACK_RESUME_CONFIRMATION_REQUIRED' src/recovery.ts
          grep -q '/internal/recovery/failback-resume' src/entry_recovery_hotfix.ts

      - name: Derive existing production runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN SIGNING_STORE_PASSWORD; do test -n "${!v:-}" || { echo "MISSING:$v"; exit 1; }; done
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          SERVICE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-service-token-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$SERVICE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "SERVICE_TOKEN_SECRET=$SERVICE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Build production Worker config without migration or authority mutation
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"
          python3 - "$ID" <<'PY'
          from pathlib import Path
          import os,sys
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"main": "src/entry.ts"','"main": "src/entry_recovery_hotfix.ts"')
          s=s.replace('"name": "pick-pack-1291-service-m1-staging"','"name": "'+os.environ['WORKER_NAME']+'"')
          s=s.replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"','"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"')
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__',sys.argv[1])
          Path('wrangler.recovery.jsonc').write_text(s)
          PY

      - name: Deploy code-only fix to existing production Worker
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');fs.writeFileSync('/tmp/s13-secrets.json',JSON.stringify({
            SERVICE_TOKEN_SECRET:process.env.SERVICE_TOKEN_SECRET,
            M1_ADMIN_TOKEN:process.env.M2_ADMIN_TOKEN,
            GAS_BRIDGE_SHARED_SECRET:process.env.GAS_BRIDGE_SHARED_SECRET,
            GOOGLE_OAUTH_CLIENT_ID:process.env.GOOGLE_OAUTH_CLIENT_ID,
            GOOGLE_OAUTH_CLIENT_SECRET:process.env.GOOGLE_OAUTH_CLIENT_SECRET,
            GOOGLE_OAUTH_REFRESH_TOKEN:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,
            GOOGLE_STAGING_SHEET_ID:process.env.STAGING_SHEET_ID
          }));
          NODE
          chmod 600 /tmp/s13-secrets.json
          npx wrangler deploy --config wrangler.recovery.jsonc --secrets-file /tmp/s13-secrets.json >/tmp/deploy.log 2>&1 || { cat /tmp/deploy.log; rm -f /tmp/s13-secrets.json; exit 1; }
          rm -f /tmp/s13-secrets.json
          curl -fsS --retry 6 --retry-delay 2 "$SERVICE_URL/health" >/tmp/health-before.json
          grep -q '"generation":"m2-prod-20260819-001"' /tmp/health-before.json

      - name: Resume epoch 3 replay with public writes still fenced
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/resume.json <<'JSON'
          {"fallback_epoch":3,"confirmation":"OWNER_LOCKED_M2_FAILBACK_RESUME","initiated_by":"S13_BUSINESS_DATE_ROLLOVER_RECOVERY"}
          JSON
          CODE=$(curl -sS -o /tmp/resume.out -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-m1-admin-token: $M2_ADMIN_TOKEN" --data-binary @/tmp/resume.json "$SERVICE_URL/internal/recovery/failback-resume")
          rm -f /tmp/resume.json
          cat /tmp/resume.out
          [[ "$CODE" == 200 ]]
          grep -q '"ok":true' /tmp/resume.out
          grep -q '"final_epoch":4' /tmp/resume.out
          echo "NEW_EPOCH=4" >> "$GITHUB_ENV"

      - name: Complete GAS failback to exact recovered Service epoch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          open('/tmp/complete.json','w').write(json.dumps({
            'action':'m2_recovery_internal','phase':'complete','confirmation':'OWNER_LOCKED_M2_FAILBACK',
            'bridge_secret':os.environ['GAS_BRIDGE_SHARED_SECRET'],'authority_epoch':int(os.environ['NEW_EPOCH']),
            'service_generation':os.environ['SERVICE_GENERATION'],'service_url':os.environ['SERVICE_URL']
          }))
          PY
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" --data-binary @/tmp/complete.json >/tmp/complete.out
          rm -f /tmp/complete.json
          cat /tmp/complete.out
          grep -q '"ok":true' /tmp/complete.out
          grep -q '"authority_mode":"SERVICE_PRIMARY"' /tmp/complete.out
          grep -q '"authority_epoch":4' /tmp/complete.out

      - name: Verify business-date rollover, four replayed events, and authority convergence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SERVICE_URL/v1/authority" >/tmp/service-authority.json
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' >/tmp/gas.json
          grep -q '"mode":"SERVICE_PRIMARY"' /tmp/service-authority.json
          grep -q '"authority_epoch":4' /tmp/service-authority.json
          grep -q '"authority_mode":"SERVICE_PRIMARY"' /tmp/gas.json
          grep -q '"authority_epoch":4' /tmp/gas.json
          LIST=$(npx --yes wrangler@4 d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          QUERY(){ curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary "$1" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$ID/query"; }
          QUERY '{"sql":"SELECT business_date,sequence_no,source FROM business_dates ORDER BY sequence_no DESC LIMIT 2","params":[]}' >/tmp/dates.json
          QUERY '{"sql":"SELECT COUNT(*) AS n FROM events WHERE authority_epoch=3","params":[]}' >/tmp/events.json
          QUERY '{"sql":"SELECT COUNT(*) AS n FROM fallback_event_inbox WHERE authority_epoch=3 AND ingest_status=\"APPLIED\"","params":[]}' >/tmp/applied.json
          grep -q '"business_date":"2026-08-19"' /tmp/dates.json
          grep -q '"source":"SERVICE_DAILY_ROLLOVER"' /tmp/dates.json
          grep -q '"n":4' /tmp/events.json
          grep -q '"n":4' /tmp/applied.json
          echo 'S13_AUTHORITY_RECOVERY=PASS'
