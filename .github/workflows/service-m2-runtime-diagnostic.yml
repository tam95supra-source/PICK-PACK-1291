name: Service M2 Runtime Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-runtime-diagnostic.yml'
      - 'tools/apply_s13_bridge_probe_gas_patch.py'
      - 'tools/apply_s13_service_url_gas_patch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s13-bridge-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SERVICE_URL_OLD: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  SERVICE_URL_NEW: https://pick-pack-1291-service.pp1291.workers.dev
  GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_GENERATION: m2-prod-20260819-001
  WORKER_NAME: pick-pack-1291-service
  TARGET_SUBDOMAIN: pp1291

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require converged Service-primary epoch before domain work
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SERVICE_URL_OLD/v1/authority" >/tmp/service.json
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' >/tmp/gas.json
          S_MODE=$(jq -r '.authority.mode' /tmp/service.json); S_EPOCH=$(jq -r '.authority.authority_epoch' /tmp/service.json)
          G_MODE=$(jq -r '.authority_mode' /tmp/gas.json); G_EPOCH=$(jq -r '.authority.authority_epoch' /tmp/gas.json)
          echo "SERVICE=$S_MODE/$S_EPOCH GAS=$G_MODE/$G_EPOCH"
          [[ "$S_MODE" == SERVICE_PRIMARY && "$G_MODE" == SERVICE_PRIMARY && "$S_EPOCH" == "$G_EPOCH" ]]
          [[ "$(jq -r '.authority.service_generation' /tmp/service.json)" == "$SERVICE_GENERATION" ]]
          [[ "$(jq -r '.service_generation' /tmp/gas.json)" == "$SERVICE_GENERATION" ]]
          echo "EPOCH=$S_EPOCH" >> "$GITHUB_ENV"

      - name: Prepare safe GAS bridge/domain source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_s13_service_url_gas_patch.py
          python3 tools/apply_s13_bridge_probe_gas_patch.py
          cp google-apps-script/PICK_PACK_API.gs /tmp/api.js
          cp google-apps-script/SERVICE_MIGRATION_M2.gs /tmp/m2.js
          node --check /tmp/api.js
          node --check /tmp/m2.js

      - name: Deploy safe GAS source to existing deployment
        shell: bash
        run: |
          set -euo pipefail
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID; do test -n "${!v:-}" || { echo "MISSING:$v"; exit 1; }; done
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          OAUTH=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$OAUTH"); test -n "$ACCESS_TOKEN"; echo "::add-mask::$ACCESS_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/content.out
          curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"S13 bridge proof and workers.dev hostname fence"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" >/tmp/version.json
          V=$(jq -r '.versionNumber' /tmp/version.json); test -n "$V"
          jq -n --arg s "$SCRIPT_ID" --argjson v "$V" '{deploymentConfig:{scriptId:$s,versionNumber:$v,manifestFileName:"appsscript",description:"Pick Pack 1291 live API S13 bridge/domain"}}' >/tmp/deploy.json
          curl -fsS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/tmp/deploy.out
          echo "GAS_VERSION=$V"

      - name: Wait for GAS bridge probe route
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 120); do
            curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"m2_bridge_probe_internal","confirmation":"invalid"}' >/tmp/route.json || true
            if grep -q 'BRIDGE_PROBE_CONFIRMATION_REQUIRED' /tmp/route.json; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/route.json; exit 1; }

      - name: Prove bridge stored in GAS authenticates to Worker
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          jq -n --arg b "$BRIDGE" '{action:"m2_bridge_probe_internal",confirmation:"OWNER_LOCKED_M2_BRIDGE_PROBE",bridge_secret:$b}' >/tmp/probe-request.json
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" --data-binary @/tmp/probe-request.json >/tmp/probe.json
          rm -f /tmp/probe-request.json
          cat /tmp/probe.json
          [[ "$(jq -r '.ok' /tmp/probe.json)" == true ]]
          [[ "$(jq -r '.service_http_code' /tmp/probe.json)" == 200 ]]
          [[ "$(jq -r '.service_authority_mode' /tmp/probe.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.service_authority_epoch' /tmp/probe.json)" == "$EPOCH" ]]
          [[ "$(jq -r '.service_generation' /tmp/probe.json)" == "$SERVICE_GENERATION" ]]
          echo 'GAS_TO_WORKER_BRIDGE=PASS'

      - name: Require Cloudflare account scope is exactly this Worker
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" >/tmp/scripts.json
          NAMES=$(jq -r '[.result[].id]|sort|join(",")' /tmp/scripts.json)
          [[ "$NAMES" == "$WORKER_NAME" ]] || { echo "UNSAFE_WORKER_SCOPE=$NAMES"; exit 1; }

      - name: Prepare dual URL fence and change workers.dev account subdomain
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" >/tmp/sub-before.json
          CURRENT=$(jq -r '.result.subdomain' /tmp/sub-before.json)
          if [[ "$CURRENT" != "$TARGET_SUBDOMAIN" ]]; then
            jq -n --arg b "$GAS_BRIDGE_SHARED_SECRET" --arg u "$SERVICE_URL_NEW" '{action:"m2_service_url_prepare_internal",confirmation:"OWNER_LOCKED_M2_SERVICE_URL_ONLY",bridge_secret:$b,service_url:$u}' >/tmp/prepare.json
            curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" --data-binary @/tmp/prepare.json >/tmp/prepare.out
            rm -f /tmp/prepare.json
            [[ "$(jq -r '.ok' /tmp/prepare.out)" == true ]]
            [[ "$(jq -r '.authority_mode' /tmp/prepare.out)" == SERVICE_PRIMARY ]]
            curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$TARGET_SUBDOMAIN\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" >/tmp/sub-set.json
            [[ "$(jq -r '.success' /tmp/sub-set.json)" == true ]]
          fi

      - name: Verify new hostname then finalize GAS discovery
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 90); do
            curl -fsS "$SERVICE_URL_NEW/health" >/tmp/new-health.json 2>/dev/null || true
            curl -fsS "$SERVICE_URL_NEW/v1/authority" >/tmp/new-authority.json 2>/dev/null || true
            if [[ "$(jq -r '.ok // false' /tmp/new-health.json 2>/dev/null || true)" == true ]] && [[ "$(jq -r '.authority.mode // empty' /tmp/new-authority.json 2>/dev/null || true)" == SERVICE_PRIMARY ]]; then OK=true; break; fi
            sleep 2
          done
          [[ "$OK" == true ]] || { cat /tmp/new-health.json || true; cat /tmp/new-authority.json || true; exit 1; }
          jq -n --arg b "$GAS_BRIDGE_SHARED_SECRET" --arg u "$SERVICE_URL_NEW" '{action:"m2_service_url_update_internal",confirmation:"OWNER_LOCKED_M2_SERVICE_URL_ONLY",bridge_secret:$b,service_url:$u}' >/tmp/finalize.json
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" --data-binary @/tmp/finalize.json >/tmp/finalize.out
          rm -f /tmp/finalize.json
          [[ "$(jq -r '.ok' /tmp/finalize.out)" == true ]]
          [[ "$(jq -r '.authority_mode' /tmp/finalize.out)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority_epoch' /tmp/finalize.out)" == "$EPOCH" ]]

      - name: Final URL and authority verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SERVICE_URL_NEW/health" >/tmp/health.json
          curl -fsS "$SERVICE_URL_NEW/v1/authority" >/tmp/service.json
          curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' >/tmp/gas.json
          [[ "$(jq -r '.generation' /tmp/health.json)" == "$SERVICE_GENERATION" ]]
          [[ "$(jq -r '.authority.mode' /tmp/service.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/service.json)" == "$EPOCH" ]]
          [[ "$(jq -r '.authority_mode' /tmp/gas.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/gas.json)" == "$EPOCH" ]]
          [[ "$(jq -r '.service_url' /tmp/gas.json)" == "$SERVICE_URL_NEW" ]]
          [[ "$(jq -r '.replication.state' /tmp/health.json)" == HEALTHY ]]
          echo "FINAL_SERVICE_URL=$SERVICE_URL_NEW"
          echo "FINAL_EPOCH=$EPOCH"
