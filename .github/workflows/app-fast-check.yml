name: App Fast Check

on:
  push:
    branches: [ main, stabilization/beta48-golden-reset-beta50-20260822 ]
    paths:
      - 'app/**'
      - 'tools/apply_s10_ui_patch.py'
      - 'tools/apply_s10_ui_patch_in_place.py'
      - 'tools/apply_s11_compact_report_patch.py'
      - 'tools/apply_s12_real_pda_patch.py'
      - 'tools/apply_s12_gas_patch.py'
      - 'tools/apply_s12_gas_health_patch.py'
      - 'tools/apply_s55_beta51_owner_refresh_history_fix.py'
      - 'ops/s55-owner-fix-trigger.txt'
      - 'google-apps-script/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/app-fast-check.yml'
  pull_request:
    branches: [ main, stabilization/beta48-golden-reset-beta50-20260822 ]
    paths:
      - 'app/**'
      - 'tools/apply_s10_ui_patch.py'
      - 'tools/apply_s10_ui_patch_in_place.py'
      - 'tools/apply_s11_compact_report_patch.py'
      - 'tools/apply_s12_real_pda_patch.py'
      - 'tools/apply_s12_gas_patch.py'
      - 'tools/apply_s12_gas_health_patch.py'
      - 'tools/apply_s55_beta51_owner_refresh_history_fix.py'
      - 'ops/s55-owner-fix-trigger.txt'
      - 'google-apps-script/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/app-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: app-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-owner-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply owner Beta51 fix on isolated fix branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'stabilization/beta48-golden-reset-beta50-20260822' && github.event.pull_request.head.ref == 'fix/beta51-owner-refresh-20260822'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_s55_beta51_owner_refresh_history_fix.py
          python3 tools/apply_s55_beta51_owner_refresh_history_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(beta): refresh, cross-device history and readable conflicts'
            git push origin HEAD:"$TARGET_BRANCH"
          fi
      - id: result
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  changes:
    needs: apply-owner-fix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      android: ${{ steps.scope.outputs.android }}
      gas: ${{ steps.scope.outputs.gas }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-owner-fix.outputs.sha }}
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            echo 'gas=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE='${{ github.event.before }}'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BEFORE='${{ github.event.pull_request.base.sha }}'
          fi
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "$BEFORE" "${{ needs.apply-owner-fix.outputs.sha }}")
          fi
          ANDROID=false
          GAS=false
          if grep -Eq '^(app/|tools/apply_s(10_ui_patch(_in_place)?|11_compact_report_patch|12_real_pda_patch|55_beta51_owner_refresh_history_fix)\.py$|ops/s55-owner-fix-trigger\.txt$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|\.github/workflows/app-fast-check\.yml$)' <<<"$FILES"; then ANDROID=true; fi
          if grep -Eq '^(google-apps-script/|tools/apply_s12_gas(_health)?_patch\.py$|\.github/workflows/app-fast-check\.yml$)' <<<"$FILES"; then GAS=true; fi
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "gas=$GAS" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\nAndroid build: %s | GAS syntax: %s\n' "$FILES" "$ANDROID" "$GAS"

  static-guards:
    needs: [apply-owner-fix, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_OWNER_ICON_SHA256: 371d0e5ad552e3cf63eef60a3da270896946458a506252a7fa132a67747c7a5d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-owner-fix.outputs.sha }}
      - name: Static project guards
        shell: bash
        run: |
          set -euo pipefail
          test -f ARCHITECTURE_GUARDRAILS.md
          test -f app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          test -f google-apps-script/PICK_PACK_API.gs
          test -f google-apps-script/SERVICE_MIGRATION_M2.gs
          echo "$EXPECTED_OWNER_ICON_SHA256  app/src/main/res/drawable-nodpi/owner_launcher.png" | sha256sum -c -
          grep -q 'put("action", "update_check")' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -q 'private fun businessHome()' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Triple(R.drawable.ic_pp_business,"Nghiệp vụ","BUSINESS")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Triple(R.drawable.ic_pp_history,"Lịch sử","HISTORY")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Triple(R.drawable.ic_pp_sync,"Đồng bộ","SYNC")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Triple(R.drawable.ic_pp_settings,"Cài đặt","SETTINGS")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'S55_BETA51_OWNER_REFRESH_HISTORY_FIX' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'contentDescription="Đồng bộ lại dữ liệu"' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'private fun refreshHistoryCanonical(force:Boolean=false)' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'raw.contains("EXCLUSIVE_RESOURCE_CONFLICT")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'addView(txt("Mã nhân viên $id •' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'position=role.toLowerCase()' google-apps-script/PICK_PACK_API.gs
          grep -q 'val allowedPositions=if(isSuper())arrayOf("USER","ADMIN")else arrayOf("USER")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'catalogValues("DANH SÁCH ADMIN_Vị trí")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q "delivery:'ACCOUNT_EMAIL'" google-apps-script/PICK_PACK_API.gs
          grep -q "action === 'change_email'" google-apps-script/PICK_PACK_API.gs
          grep -q "action === 'staff_upsert'" google-apps-script/PICK_PACK_API.gs
          grep -q "action === 'staff_delete'" google-apps-script/PICK_PACK_API.gs
          python3 -m py_compile tools/apply_s55_beta51_owner_refresh_history_fix.py
          python3 tools/apply_s55_beta51_owner_refresh_history_fix.py
          if [[ "${{ needs.changes.outputs.gas }}" == "true" ]]; then
            cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js
            cp google-apps-script/SERVICE_MIGRATION_M2.gs /tmp/SERVICE_MIGRATION_M2.js
            node --check /tmp/PICK_PACK_API.js
            node --check /tmp/SERVICE_MIGRATION_M2.js
          fi
          echo 'PASS - Beta51 static guards.'

  android-debug:
    needs: [apply-owner-fix, changes, static-guards]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-owner-fix.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" \
             && -f "$ANDROID_HOME/platforms/android-36/android.jar" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "Using preinstalled Android SDK: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble Beta and Stable debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
      - name: Fast check result
        run: echo 'PASS - Beta Debug + Stable Debug.'
