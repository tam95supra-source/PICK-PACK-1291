name: Beta51 Service Production Deploy
on:
  push:
    branches: [agent/service-migration-m2]
    paths: ['.github/workflows/beta51-service-production-deploy.yml']
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: beta51-service-production-deploy
  cancel-in-progress: false
env:
  SOURCE_SHA: ff09c30511704ec68dbd123b00288e5d62292470
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  SERVICE_GENERATION: m2-prod-20260819-001
  PROD_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/service-migration-m2, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source and authority gate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" HEAD -- service/src/core.ts service/src/mobile_hotfix.ts service/src/session_hotfix.ts
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do test -n "${!v:-}"; done
          grep -q 'ensureDailyUserReuseAllowed' service/src/core.ts
          grep -q 'user_picks_reissue' service/src/mobile_hotfix.ts
          grep -q 'pack_tables_reissue' service/src/mobile_hotfix.ts
          ! grep -q 'user_pack=?2 AND shift=?3' service/src/session_hotfix.ts
          cd service
          npm install --no-audit --no-fund >/dev/null
          npm run check >/dev/null
          npx wrangler d1 list --json >/tmp/d1.json
          D1_ID=$(node -e "const r=require('/tmp/d1.json');const x=r.find(v=>v.name==='pick-pack-1291-service-prod');if(!x)process.exit(2);process.stdout.write(String(x.uuid||x.id||''))")
          test -n "$D1_ID"; export D1_ID
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name='pick-pack-1291-service';c.main='src/entry_product.ts';c.keep_vars=true;
          c.vars={SERVICE_GENERATION:'m2-prod-20260819-001',GOOGLE_SOURCE_SHEET_ID:'1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'};
          c.d1_databases[0].database_name='pick-pack-1291-service-prod';c.d1_databases[0].database_id=process.env.D1_ID;delete c.secrets;
          fs.writeFileSync('.beta51-prod.jsonc',JSON.stringify(c,null,2));
          NODE
          cd ..
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/health" >/tmp/before.json
          jq -e --arg g "$SERVICE_GENERATION" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/before.json >/dev/null
          jq -r '.authority.authority_epoch' /tmp/before.json >/tmp/epoch
          jq -r '.authority.authority_seq' /tmp/before.json >/tmp/seq
          cd service
          npx wrangler d1 execute pick-pack-1291-service-prod --remote --config .beta51-prod.jsonc --command "SELECT mode,scope,service_generation FROM authority_state WHERE singleton_id=1;SELECT state,pending_count FROM replication_status WHERE singleton_id=1;SELECT COUNT(*) AS reconciling FROM system_meta WHERE key='m2_reconciling' AND value='1';" --json >/tmp/dbgate.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/dbgate.json')); r=[b.get('results',[]) for b in x if isinstance(b,dict) and isinstance(b.get('results'),list)]
          assert len(r)>=3
          assert r[0] and r[0][0]['mode']=='SERVICE_PRIMARY' and r[0][0]['scope']=='PRODUCTION' and r[0][0]['service_generation']=='m2-prod-20260819-001'
          assert r[1] and r[1][0]['state']=='HEALTHY' and int(r[1][0].get('pending_count') or 0)==0
          assert int(r[2][0].get('reconciling') or 0)==0
          PY
      - name: Deploy exact Beta51 service source
        working-directory: service
        run: npx wrangler deploy --config .beta51-prod.jsonc --keep-vars
      - name: Live verify
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(cat /tmp/epoch); seq=$(cat /tmp/seq)
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$SERVICE_URL/health" >/tmp/after.json && jq -e --arg g "$SERVICE_GENERATION" --argjson e "$epoch" --argjson s "$seq" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION" and .authority.authority_epoch==$e and .authority.authority_seq >= $s' /tmp/after.json >/dev/null; then break; fi
            sleep 3
          done
          jq -e --arg g "$SERVICE_GENERATION" '.ok==true and .environment=="production" and .generation==$g and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/after.json >/dev/null
          test "$(curl -sS -o /tmp/auth -w '%{http_code}' -H 'content-type: application/json' "$SERVICE_URL/v1/mobile/read" -d '{"action":"runtime_status"}')" = 401
          echo "BETA51_SERVICE_DEPLOY=PASS source=$SOURCE_SHA generation=$SERVICE_GENERATION epoch=$(jq -r '.authority.authority_epoch' /tmp/after.json) seq=$(jq -r '.authority.authority_seq' /tmp/after.json)"
      - name: Cleanup and report
        if: always()
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          rm -rf service/node_modules service/package-lock.json service/.beta51-prod.jsonc service/worker-configuration.d.ts
          status='${{ job.status }}'
          gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="BETA51_SERVICE_PRODUCTION_DEPLOY run=${GITHUB_RUN_ID} status=${status} source=${SOURCE_SHA} stable=UNTOUCHED failback=NONE"
          if [ "$status" = success ]; then
            git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git rm -f .github/workflows/beta51-service-production-deploy.yml
            git commit -m 'ci(beta51): remove one-time service deploy workflow'
            git push origin HEAD:agent/service-migration-m2
          fi
