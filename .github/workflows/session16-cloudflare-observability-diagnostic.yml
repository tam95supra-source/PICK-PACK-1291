name: Session16 Cloudflare Observability Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session16-cloudflare-observability-diagnostic-trigger.txt]
permissions:
  contents: write
concurrency:
  group: session16-cloudflare-observability-diagnostic
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - name: Query Workers historical telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/r; echo "checked_at=$(date -u +%FT%TZ)" >"$OUT"; echo "head_sha=$GITHUB_SHA" >>"$OUT"
          FROM=$(date -u -d '2026-08-20 15:34:00' +%s000); TO=$(date -u -d '2026-08-20 15:47:00' +%s000)
          jq -n --argjson f "$FROM" --argjson t "$TO" '{queryId:"pp1291-session16-adhoc",timeframe:{from:$f,to:$t},view:"events",limit:2000,dry:true,parameters:{datasets:["cloudflare-workers"],filterCombination:"and",filters:[]}}' >/tmp/q.json
          CODE=$(curl -sS -o /tmp/cf.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/q.json)
          echo "query_http=$CODE" >>"$OUT"
          if [[ "$CODE" != 200 ]]; then jq -c '{success,errors,messages}' /tmp/cf.json >>"$OUT" || cat /tmp/cf.json >>"$OUT"; echo verdict=OBSERVABILITY_QUERY_UNAVAILABLE >>"$OUT"; exit 0; fi
          jq -c '[.result.events.events[]? | select((.["$workers"].scriptName//"")=="pick-pack-1291-service" or ((.url//"")|contains("pick-pack-1291-service"))) | {timestamp,url,source,meta:.["$metadata"],workers:.["$workers"]}]' /tmp/cf.json >/tmp/filtered.json
          node - <<'NODE' >>"$OUT"
          const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/filtered.json','utf8'));console.log(`worker_events=${rows.length}`);
          const relevant=rows.filter(x=>String(x.url||x.meta?.url||'').includes('/v1/legacy-mutations/batch')||String(x.url||x.meta?.url||'').includes('/v1/auth/gas-session')||String(x.url||x.meta?.url||'').includes('/v1/legacy-sync')||String(x.source||'').includes('legacy_mutation'));
          console.log(`relevant_events=${relevant.length}`);for(const x of relevant){const m=x.meta||{},w=x.workers||{};console.log(JSON.stringify({timestamp:x.timestamp,url:x.url||m.url||'',status:m.statusCode??w.event?.response?.status??null,duration:m.duration??w.wallTimeMs??null,outcome:w.outcome||'',requestId:w.requestId||'',source:x.source||''}).slice(0,1600));}
          console.log('verdict=PASS');
          NODE
      - name: Persist
        if: always()
        shell: bash
        run: |
          test -f /tmp/r||echo result_missing=true >/tmp/r;grep -q '^verdict=' /tmp/r||echo verdict=FAILED_OR_STOPPED >>/tmp/r;cp /tmp/r /tmp/c;git reset --hard HEAD >/dev/null;git pull --rebase origin agent/service-migration-m2 || true;cp /tmp/c ops/session16-cloudflare-observability-diagnostic-result.txt;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops/session16-cloudflare-observability-diagnostic-result.txt;git diff --cached --quiet||git commit -m 'ops: record Cloudflare observability diagnostic';git push origin HEAD:agent/service-migration-m2
