name: Temp Bao Hang deploy by marker
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  deploy:
    if: github.event.issue.number == 39 && github.event.comment.body == '/deploy-bao-hang-staff-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      BH_SCRIPT_ID: 19sORZBxocd2cHccG7nEAuqbpEiu4nl8Ka6vXvPz5_SoTB9WtJRRHmTxN
      BH_DEPLOYMENT_ID: AKfycbxJzYNRJuvkYRlS8djWwZSPmXEUXmcvoW9dA8DZwxmVk410Smg77d--tuDKghQjoZa55Q
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Deploy and verify Bao Hang Apps Script
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/bh"; mkdir -p "$work"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://raw.githubusercontent.com/tam95supra-source/bao-hang-1291/main/google-apps-script/DEPLOY_NEON.gs -o "$work/worker.gs"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'bh'/'worker.gs'; s=p.read_text(encoding='utf-8')
          s=s.replace("const variants = [\"select A,B,D,E where G = 1291 and H = 'HY1'\",\"select A,B,D,E where G = '1291' and H = 'HY1'\"];", "const variants = [\"select A,B,D,E,F where G = 1291 and H = 'HY1'\",\"select A,B,D,E,F where G = '1291' and H = 'HY1'\"];", 1)
          s=s.replace("const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim();\n        byCode[code.toLowerCase()]={employee_code:code,full_name:name,contractor:contractor,source_position:position,role:staffRole_(position,code)};", "const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim(),department=String(row[4]||'').trim();\n        byCode[code.toLowerCase()]={employee_code:code,full_name:name,contractor:contractor,source_position:position,role:staffRole_(position,department,code)};", 1)
          old="""function staffRole_(position,code) {
  if(String(code)===BH_PROTECTED_ADMIN_CODE)return 'ADMIN';
  const p=String(position||'').toUpperCase();
  if(p.indexOf('INVENT')>=0)return 'INVENT';
  return 'PICKER';
}"""
          new="""function staffRole_(position,department,code) {
  if(String(code)===BH_PROTECTED_ADMIN_CODE)return 'ADMIN';
  const p=String(position||'').toUpperCase();
  const d=String(department||'').toUpperCase();
  if(p.indexOf('ĐIỀU PHỐI')>=0 || p.indexOf('DIEU PHOI')>=0)return 'ADMIN_INVENT';
  if(d.indexOf('INVENT')>=0 || p.indexOf('INVENT')>=0)return 'INVENT';
  return 'PICKER';
}"""
          if old in s: s=s.replace(old,new,1)
          s=s.replace("if(caller.profile.role==='ADMIN_INVENT' && role!=='PICKER')throw new Error('FORBIDDEN');", "if(caller.profile.role==='ADMIN_INVENT' && ['INVENT','PICKER'].indexOf(role)<0)throw new Error('FORBIDDEN');", 1)
          s=s.replace("if(caller.profile.role==='ADMIN_INVENT'&&target.role!=='PICKER')throw new Error('FORBIDDEN');", "if(caller.profile.role==='ADMIN_INVENT'&&['INVENT','PICKER'].indexOf(String(target.role||''))<0)throw new Error('FORBIDDEN');", 1)
          gates=["const BH_PROJECT = 'bao-hang-1291';","const BH_STAFF_SHEET_ID = '1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78';","const BH_STAFF_SHEET_NAME = 'DANH SÁCH NHÂN SỰ';","select A,B,D,E,F where G = 1291 and H = 'HY1'","staffRole_(position,department,code)","['INVENT','PICKER'].indexOf(role)<0"]
          for g in gates:
              if g not in s: raise SystemExit('SOURCE_GATE:'+g)
          p.write_text(s,encoding='utf-8')
          PY
          cp "$work/worker.gs" "$work/worker.js"; node --check "$work/worker.js"
          node <<'NODE'
          const fs=require('fs'),result={};const file=process.env.RUNNER_TEMP+'/bh/result.json';const save=()=>fs.writeFileSync(file,JSON.stringify(result));
          async function req(url,opt={}){const r=await fetch(url,opt),t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{j={raw:t}};if(!r.ok)throw new Error(`HTTP_${r.status}:${String(j?.error?.message||j?.error||j?.raw||'').slice(0,160)}`);return j}
          (async()=>{
            const tok=await req('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:process.env.GOOGLE_OAUTH_CLIENT_ID||'',client_secret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||'',refresh_token:process.env.GOOGLE_OAUTH_REFRESH_TOKEN||'',grant_type:'refresh_token'})});if(!tok.access_token)throw new Error('OAUTH_NO_TOKEN');result.oauth='PASS';
            const auth={Authorization:`Bearer ${tok.access_token}`},sid=process.env.BH_SCRIPT_ID,did=process.env.BH_DEPLOYMENT_ID;
            const current=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(sid)}/content`,{headers:auth});const joined=(current.files||[]).map(x=>String(x.source||'')).join('\n');
            if(!joined.includes("const BH_PROJECT = 'bao-hang-1291'")||!joined.includes("const BH_NEON_PROJECT = 'tiny-boat-19315489'"))throw new Error('SCRIPT_SCOPE_MISMATCH');result.script_scope='PASS';
            const dep=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(sid)}/deployments/${encodeURIComponent(did)}`,{headers:auth});const web=(dep.entryPoints||[]).map(e=>e.webApp).find(Boolean);if(!web?.url)throw new Error('WEBAPP_MISSING');
            const before=await req(web.url,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})});if(!(before.ok===true&&before.project==='bao-hang-1291'&&before.provider==='NEON_FIREBASE_GOOGLE'))throw new Error('LIVE_SCOPE_MISMATCH');result.live_scope='PASS';
            const canonical=fs.readFileSync(process.env.RUNNER_TEMP+'/bh/worker.gs','utf8');let code=(current.files||[]).find(x=>x.type==='SERVER_JS'&&String(x.source||'').includes("const BH_PROJECT = 'bao-hang-1291'"));if(!code)code=(current.files||[]).find(x=>x.type==='SERVER_JS'&&String(x.source||'').includes('function doPost'));if(!code)throw new Error('SERVER_JS_MISSING');code.source=canonical;
            await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(sid)}/content`,{method:'PUT',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({files:current.files})});result.source_update='PASS';
            const ver=await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(sid)}/versions`,{method:'POST',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({description:'Bao Hang 1291 staff source + account permission fix'})});
            await req(`https://script.googleapis.com/v1/projects/${encodeURIComponent(sid)}/deployments/${encodeURIComponent(did)}`,{method:'PUT',headers:{...auth,'content-type':'application/json'},body:JSON.stringify({deploymentConfig:{scriptId:sid,versionNumber:Number(ver.versionNumber),manifestFileName:'appsscript',description:'Bao Hang 1291 production worker'}})});result.deployment_update='PASS';result.version=String(ver.versionNumber||'');
            let ok=false;for(let i=0;i<20;i++){try{const p=await req(web.url,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})});if(p.ok===true&&p.staff_sheet_id==='1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'&&p.staff_sheet_name==='DANH SÁCH NHÂN SỰ'){ok=true;break}}catch{}await new Promise(r=>setTimeout(r,3000))}if(!ok)throw new Error('LIVE_STAFF_SOURCE_NOT_UPDATED');result.live_staff_source='PASS';save();
          })().catch(e=>{result.error=String(e.message).replace(/[\r\n]+/g,' ').slice(0,220);save();process.exit(1)});
          NODE
      - name: Record result on main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/bh";test -s "$RUNNER_TEMP/bh/result.json" || printf '{"error":"workflow_failed_before_result"}' > "$RUNNER_TEMP/bh/result.json"
          cp "$RUNNER_TEMP/bh/result.json" ops/temp-bh-issue-deploy-status.json;cat ops/temp-bh-issue-deploy-status.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/temp-bh-issue-deploy-status.json;git diff --cached --quiet || git commit -m 'chore(temp): record comment-triggered Bao Hang deploy';git pull --rebase origin main;git push origin HEAD:main
