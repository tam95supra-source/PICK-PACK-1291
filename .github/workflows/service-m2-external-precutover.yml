name: Service M2 External Precutover

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/m2-external-precutover-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-m2-external-precutover
  cancel-in-progress: false

env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_GENERATION: m2-prod-20260819-001
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI
  ROLLBACK_FOLDER_ID: 1P7KM5b5D_P69OkyKdmLx0HbL3wRpg0yG
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e

jobs:
  external-precutover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 0

      - name: Verify owner trigger and required secret names
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            grep -qx 'confirmation=OWNER_LOCKED_M2_EXTERNAL_PREFLIGHT' ops/m2-external-precutover-trigger.txt
          fi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do
            [[ -n "${!v:-}" ]] || { echo "MISSING_REQUIRED_SECRET:$v" >&2; exit 1; }
          done
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.19"' app/build.gradle.kts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive runtime-only Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          SERVICE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-service-token-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$SERVICE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "SERVICE_TOKEN_SECRET=$SERVICE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Verify Cloudflare API authorization
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npx wrangler whoami >/tmp/whoami.txt
          grep -qi 'account' /tmp/whoami.txt
          npx wrangler d1 list --json >/tmp/d1-list.json
          node -e 'const j=require("/tmp/d1-list.json"); if(!Array.isArray(j)) throw new Error("D1_LIST_NOT_ARRAY")'

      - name: Exchange Google OAuth and verify Drive Sheets Apps Script scopes
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP")
          test -n "$TOKEN"; echo "::add-mask::$TOKEN"; echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          H=$(curl -sS -o /tmp/backup.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files/$ROLLBACK_FOLDER_ID?fields=id,name,mimeType,trashed"); [[ "$H" == 200 ]] || { echo "GOOGLE_DRIVE_SCOPE_OR_ACCESS:$H"; cat /tmp/backup.json; exit 1; }
          node -e 'const j=require("/tmp/backup.json");if(j.id!==process.env.ROLLBACK_FOLDER_ID||j.trashed||j.mimeType!=="application/vnd.google-apps.folder")throw new Error(JSON.stringify(j))'
          H=$(curl -sS -o /tmp/source-meta.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID?fields=spreadsheetId,properties.title"); [[ "$H" == 200 ]] || { echo "GOOGLE_SHEETS_SCOPE_OR_ACCESS:$H"; cat /tmp/source-meta.json; exit 1; }
          node -e 'const j=require("/tmp/source-meta.json");if(j.spreadsheetId!==process.env.SOURCE_SHEET_ID)throw new Error(JSON.stringify(j))'
          SCRIPT=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          H=$(curl -sS -o /tmp/gas-project.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT/content"); [[ "$H" == 200 ]] || { echo "GOOGLE_APPS_SCRIPT_SCOPE_OR_ACCESS:$H"; cat /tmp/gas-project.json; exit 1; }

      - name: Resolve production D1 and apply migrations
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          if [[ -z "$ID" ]]; then
            npx wrangler d1 create "$D1_NAME" --location apac >/tmp/d1-create.log
            LIST=$(npx wrangler d1 list --json)
            ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          fi
          test -n "$ID"; export PROD_D1_ID="$ID"; echo "PROD_D1_ID=$ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"name": "pick-pack-1291-service-m1-staging"','"name": "'+os.environ['WORKER_NAME']+'"')
          s=s.replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"','"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"')
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__',os.environ['PROD_D1_ID'])
          Path('wrangler.external.jsonc').write_text(s)
          PY
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.external.jsonc
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.external.jsonc --command 'SELECT name FROM d1_migrations ORDER BY id;' --json)
          node -e 'const x=JSON.parse(process.argv[1]);if((x?.[0]?.results||[]).length<2)throw new Error("M2_MIGRATIONS_MISSING")' "$OUT"

      - name: Deploy Service and PWA shadow with live bindings
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');fs.writeFileSync('/tmp/m2-secrets.json',JSON.stringify({SERVICE_TOKEN_SECRET:process.env.SERVICE_TOKEN_SECRET,M1_ADMIN_TOKEN:process.env.M2_ADMIN_TOKEN,GAS_BRIDGE_SHARED_SECRET:process.env.GAS_BRIDGE_SHARED_SECRET,GOOGLE_OAUTH_CLIENT_ID:process.env.GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET:process.env.GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REFRESH_TOKEN:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,GOOGLE_STAGING_SHEET_ID:process.env.STAGING_SHEET_ID}));
          NODE
          chmod 600 /tmp/m2-secrets.json
          npx wrangler deploy --config wrangler.external.jsonc --secrets-file /tmp/m2-secrets.json 2>&1 | tee /tmp/deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true); test -n "$URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          curl -fsS --retry 5 --retry-delay 2 "$URL/health" >/tmp/health.json
          node -e 'const j=require("/tmp/health.json");if(!j.ok||j.environment!=="staging-shadow"||j.authority?.scope!=="STAGING_SHADOW")throw new Error(JSON.stringify(j))'
          curl -fsS "$URL/" >/tmp/pwa.html; grep -qi '<html' /tmp/pwa.html
          curl -fsS "$URL/manifest.webmanifest" >/tmp/manifest.json

      - name: Bootstrap real source twice and prove idempotent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          for n in a b; do
            curl -fsS --retry 3 --retry-delay 2 -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" "$SERVICE_URL/internal/bootstrap-google" > "/tmp/bootstrap-$n.json"
            node -e 'const j=require(process.argv[1]);if(!j.ok)throw new Error(JSON.stringify(j))' "/tmp/bootstrap-$n.json"
          done
          node - <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/bootstrap-a.json')),b=JSON.parse(fs.readFileSync('/tmp/bootstrap-b.json'));
          const stable=x=>JSON.stringify({source:x.source||x.source_identity,sheets:x.sheets||x.report?.sheets||x.sheet_report,projections:x.projection_counts||x.report?.projection_counts,business_dates:x.business_dates||x.report?.business_dates});
          if(stable(a)!==stable(b))throw new Error('REBOOTSTRAP_RECONCILIATION_CHANGED');
          NODE

      - name: Prove D1 outbox to Google staging with harmless shadow probe
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%S.000Z); EVENT="m2-external-shadow-${GITHUB_RUN_ID}"
          SQL="BEGIN; UPDATE authority_state SET authority_seq=authority_seq+1,updated_at='$TS' WHERE singleton_id=1 AND scope='STAGING_SHADOW'; INSERT INTO events(event_id,event_type,entity_type,entity_id,business_date,authority_epoch,authority_seq,service_generation,base_version,new_version,actor_id,actor_role,device_id,occurred_at,committed_at,payload_json,idempotency_key,origin,schema_version,checksum) SELECT '$EVENT','M1_SHADOW_PROBE','TEST','$EVENT',(SELECT business_date FROM business_dates ORDER BY sequence_no DESC LIMIT 1),authority_epoch,authority_seq,service_generation,0,1,'M2_PREFLIGHT','SUPERADMIN','github-actions','$TS','$TS','{}','idem:$EVENT','SERVICE',1,'preflight' FROM authority_state WHERE singleton_id=1; INSERT INTO sheet_replication_outbox(event_id,status,next_attempt_at) VALUES('$EVENT','PENDING','$TS'); COMMIT;"
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.external.jsonc --command "$SQL" >/tmp/probe-sql.txt
          curl -fsS -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" "$SERVICE_URL/internal/replicate" >/tmp/replicate.json
          node -e 'const j=require("/tmp/replicate.json");if(!j.ok||j.processed<1||j.pending!==0)throw new Error(JSON.stringify(j))'
          RANGE=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'__M1_SERVICE_REPLICA'!A2:A"))
          PY
          )
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$STAGING_SHEET_ID/values/$RANGE" >/tmp/replica-ids.json
          node -e 'const j=require("/tmp/replica-ids.json"),e=process.argv[1];if(!(j.values||[]).some(r=>r[0]===e))throw new Error("STAGING_PROBE_NOT_REPLICATED")' "$EVENT"

      - name: Emit external precutover evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m2-external-evidence
          cp /tmp/health.json m2-external-evidence/service-health.json
          cp /tmp/bootstrap-a.json m2-external-evidence/bootstrap-a.json
          cp /tmp/bootstrap-b.json m2-external-evidence/bootstrap-b.json
          cp /tmp/replicate.json m2-external-evidence/replication.json
          node - <<'NODE'
          const fs=require('fs');fs.writeFileSync('m2-external-evidence/state.json',JSON.stringify({source_commit:process.env.GITHUB_SHA,service_url:process.env.SERVICE_URL,d1_name:process.env.D1_NAME,d1_id:process.env.PROD_D1_ID,generation:process.env.SERVICE_GENERATION,source_sheet_id:process.env.SOURCE_SHEET_ID,staging_sheet_id:process.env.STAGING_SHEET_ID,rollback_folder_id:process.env.ROLLBACK_FOLDER_ID,authority_scope:'STAGING_SHADOW',production_cutover:false},null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: m2-external-precutover-evidence-${{ github.run_id }}
          path: m2-external-evidence/
          retention-days: 30
