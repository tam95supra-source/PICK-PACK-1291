name: Session3 Beta26 Build Diagnostic V2
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session3-beta26-build-diagnostic-v2-trigger.txt]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]];then exit 0;fi
          SDK="$RUNNER_TEMP/android-sdk";ZIP="$RUNNER_TEMP/tools.zip";curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP";mkdir -p "$SDK/cmdline-tools";unzip -q "$ZIP" -d "$RUNNER_TEMP/cmd";mv "$RUNNER_TEMP/cmd/cmdline-tools" "$SDK/cmdline-tools/latest";echo "ANDROID_HOME=$SDK" >>$GITHUB_ENV;echo "ANDROID_SDK_ROOT=$SDK" >>$GITHUB_ENV;yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true;"$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Compile and capture exact failure
        shell: bash
        run: |
          set +e
          P='vn.pickpack1291.app.beta.publicbeta';FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' app/google-services.json);FIREBASE_GCM_SENDER_ID=$(jq -r '.project_info.project_number' app/google-services.json);FIREBASE_GOOGLE_APP_ID=$(jq -r --arg p "$P" '.client[]|select(.client_info.android_client_info.package_name==$p)|.client_info.mobilesdk_app_id' app/google-services.json);FIREBASE_API_KEY=$(jq -r --arg p "$P" '.client[]|select(.client_info.android_client_info.package_name==$p)|.api_key[0].current_key' app/google-services.json)
          gradle --no-daemon :app:assembleBetaRelease -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" -PFIREBASE_GOOGLE_APP_ID="$FIREBASE_GOOGLE_APP_ID" -PFIREBASE_API_KEY="$FIREBASE_API_KEY" -PFIREBASE_GCM_SENDER_ID="$FIREBASE_GCM_SENDER_ID" >/tmp/g.log 2>&1
          RC=$?
          { echo "checked_at=$(date -u +%FT%TZ)";echo "compile_exit=$RC";echo '--- relevant ---';grep -E '(^e:|^[[:space:]]*error:|FAILED|FAILURE:|Exception|anchor missing|Traceback|S29|S30|What went wrong|Execution failed)' /tmp/g.log | tail -180;echo '--- tail ---';tail -80 /tmp/g.log; } >/tmp/r
          grep -q 'S29_OWNER_LOCALFIRST_HISTORY' app/src/main/java/vn/pickpack1291/app/beta/PdaLocalProjection.kt && echo s29=APPLIED >>/tmp/r || echo s29=NOT_APPLIED >>/tmp/r
          grep -q 'S30_CANONICAL_ADMIN_AUDIT' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt && echo s30=APPLIED >>/tmp/r || echo s30=NOT_APPLIED >>/tmp/r
          echo verdict=DIAGNOSTIC >>/tmp/r
          exit 0
      - name: Record diagnostic
        shell: bash
        run: |
          cp /tmp/r ops/session3-beta26-build-diagnostic-v2-result.txt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops/session3-beta26-build-diagnostic-v2-result.txt;git diff --cached --quiet || git commit -m 'ops: record Beta26 build diagnostic V2';git pull --rebase origin agent/service-migration-m2;git push origin HEAD:agent/service-migration-m2
