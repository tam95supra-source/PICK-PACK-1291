name: Service M1 Source Sync

on:
  push:
    branches: [ agent/service-foundation-m1 ]
    paths:
      - '.github/workflows/service-m1-source-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-m1-source-sync
  cancel-in-progress: false

env:
  BUNDLE_FILE_ID: 1g7eZu7Vahp_pUyvrxYoIEmM_78tRwTRs
  BUNDLE_SHA256: 8082900892389b11333caa08b50cd37a02b2864391ff64d40d36e7d750f0e176

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-foundation-m1
          fetch-depth: 0

      - name: Verify Google credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!v:-}" ]]; then echo "Missing required secret: $v" >&2; exit 1; fi
          done

      - name: Download and verify exact M1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<<"$RESP")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$BUNDLE_FILE_ID?alt=media" \
            -o /tmp/m1-source.zip
          echo "$BUNDLE_SHA256  /tmp/m1-source.zip" | sha256sum -c -

      - name: Expand source without enabling deployment workflow yet
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/m1-source.zip -d .
          rm -f .github/workflows/service-m1-staging.yml
          rm -rf service/node_modules service/.wrangler service/m1-artifacts service/worker-configuration.d.ts
          git status --short

      - name: Commit exact M1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE_GUARDRAILS.md docs/SERVICE_MIGRATION_M1.md service
          if git diff --cached --quiet; then
            echo 'Source bundle already synchronized.'
            exit 0
          fi
          git commit -m 'feat: synchronize complete M1 service foundation source'
          git push origin HEAD:agent/service-foundation-m1
