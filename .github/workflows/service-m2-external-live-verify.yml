name: Service M2 External Live Verify

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-external-live-verify.yml'

permissions:
  contents: read

concurrency:
  group: service-m2-external-live-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Retired after M2 resumable bootstrap A/B and focused replication gate passed.'
