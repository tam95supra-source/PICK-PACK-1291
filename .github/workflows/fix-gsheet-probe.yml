name: Fix GSheet Probe Redirect
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/fix-gsheet-probe.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch redirect-safe POST probe
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*-X POST "\$GSHEET_API_URL"/d' .github/workflows/beta-preview.yml
          rm .github/workflows/fix-gsheet-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: follow Apps Script POST redirect correctly'
          git push origin HEAD:main
