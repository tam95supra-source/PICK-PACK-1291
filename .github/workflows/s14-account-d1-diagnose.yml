name: S14 Account D1 Diagnose

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s14-account-d1-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-accounts:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: pick-pack-1291-service-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read account role/status summary only
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"; export D1_ID="$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__',os.environ['D1_ID'])
          Path('/tmp/wrangler.diag.jsonc').write_text(s)
          PY
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.diag.jsonc --command "SELECT login_id,role,position,status,is_shadow_test FROM accounts ORDER BY login_id;" --json)
          node - <<'NODE' "$OUT"
          const j=JSON.parse(process.argv[2]); const rows=j?.[0]?.results||[];
          console.log('ACCOUNT_COUNT='+rows.length);
          for(const r of rows) console.log(`account=${r.login_id} role=${r.role} position=${r.position} status=${r.status} shadow=${r.is_shadow_test}`);
          NODE
