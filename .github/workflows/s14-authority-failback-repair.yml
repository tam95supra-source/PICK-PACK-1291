name: S14 Authority Failback Repair

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s14-authority-failback-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s14-authority-failback-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
      GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      SERVICE_GENERATION: m2-prod-20260819-001
      SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
      D1_NAME: pick-pack-1291-service-prod
      FALLBACK_EPOCH: '5'
      EXPECTED_SERVICE_EPOCH: '4'
      FINAL_SERVICE_EPOCH: '6'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive runtime-only recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_STORE_PASSWORD; do test -n "${!v:-}" || { echo "MISSING:$v"; exit 1; }; done
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"
          OAUTH=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          ACCESS=$(jq -r '.access_token // empty' <<<"$OAUTH"); test -n "$ACCESS"; echo "::add-mask::$ACCESS"; echo "GOOGLE_ACCESS_TOKEN=$ACCESS" >> "$GITHUB_ENV"
          SCRIPT=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOY="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOY="${BASH_REMATCH[1]}"; fi
          echo "::add-mask::$SCRIPT"; echo "::add-mask::$DEPLOY"
          echo "GAS_SCRIPT_CLEAN=$SCRIPT" >> "$GITHUB_ENV"; echo "GAS_DEPLOYMENT_CLEAN=$DEPLOY" >> "$GITHUB_ENV"

      - name: Require exact live split-brain precondition and recovery endpoints
        shell: bash
        run: |
          set -euo pipefail
          S=$(curl -fsS "$SERVICE_URL/v1/authority")
          G=$(curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}')
          echo "service=$(jq -r '.authority.mode' <<<"$S")/$(jq -r '.authority.authority_epoch' <<<"$S") gas=$(jq -r '.authority_mode' <<<"$G")/$(jq -r '.authority.authority_epoch' <<<"$G")"
          [[ "$(jq -r '.authority.mode' <<<"$S")" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' <<<"$S")" == "$EXPECTED_SERVICE_EPOCH" ]]
          [[ "$(jq -r '.authority_mode' <<<"$G")" == GOOGLE_FALLBACK ]]
          [[ "$(jq -r '.authority.authority_epoch' <<<"$G")" == "$FALLBACK_EPOCH" ]]
          [[ "$(jq -r '.service_url' <<<"$G")" == "$SERVICE_URL" ]]
          C=$(curl -sS -o /tmp/failback-route.json -w '%{http_code}' -X POST -H 'content-type: application/json' "$SERVICE_URL/internal/recovery/failback" -d '{}'); [[ "$C" == 401 ]]
          C=$(curl -sS -o /tmp/ingest-route.json -w '%{http_code}' -X POST -H 'content-type: application/json' "$SERVICE_URL/internal/fallback/ingest" -d '{}'); [[ "$C" == 401 ]]
          echo 'RECOVERY_ENDPOINTS=PASS'

      - name: Fence GAS in RECONCILING and install false-fallback guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_s14_authority_account_integrity_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          p=Path('google-apps-script/PICK_PACK_API.gs'); s=p.read_text(); anchor="function doPost(e) {\n  try {"
          call="\n    ppM2ApplyS14RecoveryConfig_();"
          if call.strip() not in s:
              if s.count(anchor)!=1: raise SystemExit('S14 GAS doPost anchor mismatch')
              s=s.replace(anchor,anchor+call,1); p.write_text(s)
          cfg={'marker':'s14-reconciling-epoch5','mode':'RECONCILING','epoch':int(os.environ['FALLBACK_EPOCH']),'generation':os.environ['SERVICE_GENERATION'],'service_url':os.environ['SERVICE_URL']}
          src='const PP_M2_S14_RECOVERY_CONFIG=Object.freeze('+json.dumps(cfg,separators=(',',':'))+');\n'
          src+="function ppM2ApplyS14RecoveryConfig_(){const p=PropertiesService.getScriptProperties(),c=PP_M2_S14_RECOVERY_CONFIG;if(p.getProperty('PP_M2_S14_RECOVERY_MARKER')===c.marker)return;p.setProperties({PP_M2_S14_RECOVERY_MARKER:c.marker,PP_M2_SERVICE_URL:c.service_url,PP_M2_AUTHORITY_MODE:c.mode,PP_M2_AUTHORITY_EPOCH:String(c.epoch),PP_M2_SERVICE_GENERATION:c.generation,PP_M2_AUTHORITY_SCOPE:'PRODUCTION'},false);}\n"
          Path('google-apps-script/M2_S14_RECOVERY_CONFIG.gs').write_text(src)
          b=Path('google-apps-script'); files=[{'name':x.stem,'type':'SERVER_JS','source':x.read_text()} for x in sorted(b.glob('*.gs'))]
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/gas-content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-content.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/content" >/tmp/gas-put.json
          curl -fsS -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"S14 fence fallback epoch5 for canonical reconciliation"}' "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/versions" >/tmp/gas-version.json
          V=$(jq -r '.versionNumber // empty' /tmp/gas-version.json); test -n "$V"
          jq -n --arg s "$GAS_SCRIPT_CLEAN" --argjson v "$V" '{deploymentConfig:{scriptId:$s,versionNumber:$v,manifestFileName:"appsscript",description:"Pick Pack 1291 S14 RECONCILING fence"}}' >/tmp/gas-deploy.json
          curl -fsS -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/deployments/$GAS_DEPLOYMENT_CLEAN" >/tmp/gas-deploy.out
          OK=0
          for i in $(seq 1 80); do
            G=$(curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery"}' || true)
            if [[ "$(jq -r '.authority_mode // ""' <<<"$G" 2>/dev/null)" == RECONCILING && "$(jq -r '.authority.authority_epoch // 0' <<<"$G" 2>/dev/null)" == "$FALLBACK_EPOCH" ]]; then OK=$((OK+1)); else OK=0; fi
            [[ "$OK" -ge 3 ]] && break
            sleep 2
          done
          [[ "$OK" -ge 3 ]] || { echo 'GAS_RECONCILING_FENCE_NOT_STABLE'; exit 1; }
          echo 'GAS_RECONCILING_FENCE=PASS'

      - name: Fence Service public writes before inbox staging
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"; export D1_ID="$ID"; echo "D1_ID=$ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text().replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"').replace('__M1_D1_DATABASE_ID__',os.environ['D1_ID'])
          Path('/tmp/wrangler.recovery.jsonc').write_text(s)
          PY
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.recovery.jsonc --command "INSERT INTO system_meta(key,value,updated_at) VALUES('m2_reconciling','1',datetime('now')) ON CONFLICT(key) DO UPDATE SET value='1',updated_at=datetime('now');" --json >/tmp/lock.json
          echo 'SERVICE_RECONCILIATION_LOCK=PASS'

      - name: Stage all epoch5 fallback events directly into D1 inbox and mark Sheet INGESTED
        shell: bash
        run: |
          set -euo pipefail
          ENC=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'__PP_M2_FALLBACK_EVENTS'!A1:M500",safe=''))
          PY
          )
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$ENC?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/fallback.json
          node - <<'NODE'
          const fs=require('fs'), cp=require('child_process');
          const rows=JSON.parse(fs.readFileSync('/tmp/fallback.json')).values||[]; if(rows.length<2)throw new Error('FALLBACK_LEDGER_EMPTY');
          const target=Number(process.env.FALLBACK_EPOCH), picked=[];
          for(let i=1;i<rows.length;i++){const r=rows[i];if(Number(r[1]||0)!==target)continue;picked.push({sheetRow:i+1,r});}
          picked.sort((a,b)=>Number(a.r[2])-Number(b.r[2])); if(!picked.length)throw new Error('FALLBACK_EPOCH_EMPTY');
          for(let i=0;i<picked.length;i++)if(Number(picked[i].r[2])!==i+1)throw new Error(`FALLBACK_SEQUENCE_GAP:${i+1}`);
          for(const x of picked){
            const r=x.r; const req={event_id:String(r[0]||''),authority_epoch:Number(r[1]),authority_seq:Number(r[2]),service_generation:String(r[3]||''),event:{action:String(r[4]||''),business_date:String(r[5]||''),actor:String(r[6]||''),role:String(r[7]||''),device_id:String(r[8]||''),occurred_at:String(r[9]||''),payload_json:String(r[10]||'')},checksum:String(r[11]||'')};
            const out=cp.execFileSync('curl',['-fsS','-X','POST','-H','content-type: application/json','-H','x-gas-bridge-secret: '+process.env.GAS_BRIDGE_SHARED_SECRET,process.env.SERVICE_URL+'/internal/fallback/ingest','--data-binary',JSON.stringify(req)],{encoding:'utf8'});
            const j=JSON.parse(out);if(!j.ok)throw new Error(`INGEST_FAILED_SEQ_${req.authority_seq}`);
          }
          fs.writeFileSync('/tmp/fallback-rows.json',JSON.stringify(picked.map(x=>x.sheetRow)));
          fs.writeFileSync('/tmp/fallback-count.txt',String(picked.length));
          console.log(`FALLBACK_STAGE=PASS epoch=${target} count=${picked.length}`);
          NODE
          python3 - <<'PY'
          import json,os,urllib.request
          rows=json.load(open('/tmp/fallback-rows.json'))
          data={'valueInputOption':'RAW','data':[{'range':"'__PP_M2_FALLBACK_EVENTS'!M%d"%r,'majorDimension':'ROWS','values':[['INGESTED']]} for r in rows]}
          req=urllib.request.Request('https://sheets.googleapis.com/v4/spreadsheets/'+os.environ['SOURCE_SHEET_ID']+'/values:batchUpdate',data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GOOGLE_ACCESS_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as resp:
              if resp.status!=200: raise SystemExit('SHEET_INGEST_STATUS_UPDATE_FAILED')
          print('FALLBACK_SHEET_INGESTED=PASS')
          PY

      - name: Canonically replay fallback epoch and promote Service to fresh epoch
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc --argjson f "$FALLBACK_EPOCH" --argjson e "$EXPECTED_SERVICE_EPOCH" '{fallback_epoch:$f,expected_service_epoch:$e,confirmation:"OWNER_LOCKED_M2_FAILBACK",initiated_by:"OWNER_S14_INTEGRITY_REPAIR"}')
          HTTP=$(curl -sS -o /tmp/failback.json -w '%{http_code}' -X POST -H "x-m1-admin-token: $M2_ADMIN_TOKEN" -H 'content-type: application/json' "$SERVICE_URL/internal/recovery/failback" --data-binary "$BODY")
          if [[ "$HTTP" != 200 ]]; then jq '{ok,error,detail}' /tmp/failback.json || true; exit 1; fi
          jq '{ok,validation,authority}' /tmp/failback.json
          [[ "$(jq -r '.ok' /tmp/failback.json)" == true ]]
          [[ "$(jq -r '.authority.mode' /tmp/failback.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/failback.json)" == "$FINAL_SERVICE_EPOCH" ]]
          [[ "$(jq -r '.validation.contiguous_sequence' /tmp/failback.json)" == true ]]
          [[ "$(jq -r '.validation.checksum_verified' /tmp/failback.json)" == true ]]
          echo 'SERVICE_FAILBACK_REPLAY=PASS'

      - name: Finalize GAS discovery to the same fresh Service epoch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          p=Path('google-apps-script/M2_S14_RECOVERY_CONFIG.gs')
          cfg={'marker':'s14-service-primary-epoch6','mode':'SERVICE_PRIMARY','epoch':int(os.environ['FINAL_SERVICE_EPOCH']),'generation':os.environ['SERVICE_GENERATION'],'service_url':os.environ['SERVICE_URL']}
          src='const PP_M2_S14_RECOVERY_CONFIG=Object.freeze('+json.dumps(cfg,separators=(',',':'))+');\n'
          src+="function ppM2ApplyS14RecoveryConfig_(){const p=PropertiesService.getScriptProperties(),c=PP_M2_S14_RECOVERY_CONFIG;if(p.getProperty('PP_M2_S14_RECOVERY_MARKER')===c.marker)return;p.setProperties({PP_M2_S14_RECOVERY_MARKER:c.marker,PP_M2_SERVICE_URL:c.service_url,PP_M2_AUTHORITY_MODE:c.mode,PP_M2_AUTHORITY_EPOCH:String(c.epoch),PP_M2_FALLBACK_SEQ:'0',PP_M2_SERVICE_GENERATION:c.generation,PP_M2_AUTHORITY_SCOPE:'PRODUCTION'},false);p.deleteProperty('PP_M2_SERVICE_FAIL');p.deleteProperty('PP_M2_SERVICE_FAIL_AT');}\n"
          p.write_text(src)
          b=Path('google-apps-script'); files=[{'name':x.stem,'type':'SERVER_JS','source':x.read_text()} for x in sorted(b.glob('*.gs'))]
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/gas-content-final.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-content-final.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/content" >/tmp/gas-put-final.json
          curl -fsS -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"S14 failback complete Service Primary epoch6"}' "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/versions" >/tmp/gas-version-final.json
          V=$(jq -r '.versionNumber // empty' /tmp/gas-version-final.json); test -n "$V"
          jq -n --arg s "$GAS_SCRIPT_CLEAN" --argjson v "$V" '{deploymentConfig:{scriptId:$s,versionNumber:$v,manifestFileName:"appsscript",description:"Pick Pack 1291 S14 Service Primary epoch6"}}' >/tmp/gas-deploy-final.json
          curl -fsS -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy-final.json "https://script.googleapis.com/v1/projects/$GAS_SCRIPT_CLEAN/deployments/$GAS_DEPLOYMENT_CLEAN" >/tmp/gas-deploy-final.out
          OK=0
          for i in $(seq 1 100); do
            G=$(curl -fsSL -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' || true)
            S=$(curl -fsS "$SERVICE_URL/health" || true)
            GM=$(jq -r '.authority_mode // ""' <<<"$G" 2>/dev/null); GE=$(jq -r '.authority.authority_epoch // 0' <<<"$G" 2>/dev/null)
            SM=$(jq -r '.authority.mode // ""' <<<"$S" 2>/dev/null); SE=$(jq -r '.authority.authority_epoch // 0' <<<"$S" 2>/dev/null)
            if [[ "$GM" == SERVICE_PRIMARY && "$GE" == "$FINAL_SERVICE_EPOCH" && "$SM" == SERVICE_PRIMARY && "$SE" == "$FINAL_SERVICE_EPOCH" ]]; then OK=$((OK+1)); else OK=0; fi
            [[ "$OK" -ge 6 ]] && break
            sleep 2
          done
          [[ "$OK" -ge 6 ]] || { echo "FINAL_AUTHORITY_NOT_CONVERGED gas=$GM/$GE service=$SM/$SE"; exit 1; }
          echo 'AUTHORITY_CONVERGENCE=PASS'

      - name: Verify inbox applied, no fallback pending, and Service healthy
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.recovery.jsonc --command "SELECT authority_epoch,authority_seq,mode,service_generation FROM authority_state WHERE singleton_id=1; SELECT authority_seq,ingest_status FROM fallback_event_inbox WHERE authority_epoch=5 ORDER BY authority_seq; SELECT value FROM system_meta WHERE key='m2_reconciling';" --json)
          node - <<'NODE' "$OUT"
          const j=JSON.parse(process.argv[2]);
          const a=j?.[0]?.results?.[0];if(!a||a.mode!=='SERVICE_PRIMARY'||Number(a.authority_epoch)!==6)throw new Error('FINAL_D1_AUTHORITY_INVALID');
          const inbox=j?.[1]?.results||[];if(!inbox.length||inbox.some(x=>x.ingest_status!=='APPLIED'))throw new Error('INBOX_NOT_APPLIED');
          const lock=j?.[2]?.results?.[0]?.value;if(lock!=='0')throw new Error('RECONCILIATION_LOCK_NOT_CLEARED');
          console.log(`D1_FINAL=PASS epoch=${a.authority_epoch} inbox_applied=${inbox.length}`);
          NODE
          ENC=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'__PP_M2_FALLBACK_EVENTS'!A1:M500",safe=''))
          PY
          )
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$ENC?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/final-ledger.json
          node - <<'NODE'
          const rows=JSON.parse(require('fs').readFileSync('/tmp/final-ledger.json')).values||[];const ep=Number(process.env.FALLBACK_EPOCH);const x=rows.slice(1).filter(r=>Number(r[1]||0)===ep);if(!x.length||x.some(r=>String(r[12]||'')==='PENDING'))throw new Error('FALLBACK_SHEET_PENDING_REMAINS');console.log(`FALLBACK_LEDGER_FINAL=PASS epoch=${ep} rows=${x.length}`);
          NODE
          H=$(curl -fsS "$SERVICE_URL/health")
          [[ "$(jq -r '.authority.mode' <<<"$H")" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' <<<"$H")" == "$FINAL_SERVICE_EPOCH" ]]
          echo 'S14_AUTHORITY_FAILBACK_REPAIR=PASS'
