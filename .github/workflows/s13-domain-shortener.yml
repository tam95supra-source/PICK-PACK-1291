name: S13 Workers Dev Hostname Shortener

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ops/s13-domain-shortener-trigger.txt'
      - '.github/workflows/s13-domain-shortener.yml'
      - 'tools/apply_s13_service_url_gas_patch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s13-workers-dev-hostname-shortener
  cancel-in-progress: false

env:
  TARGET_ACCOUNT_SUBDOMAIN: pp1291
  WORKER_NAME: pick-pack-1291-service
  TARGET_SERVICE_URL: https://pick-pack-1291-service.pp1291.workers.dev
  SERVICE_GENERATION: m2-prod-20260819-001

jobs:
  switch-hostname:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2

      - name: Validate provider credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID; do
            test -n "${!v:-}" || { echo "MISSING:$v"; exit 1; }
          done

      - name: Prepare current GAS source with dual-Service-URL fence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_s13_service_url_gas_patch.py
          grep -q "m2_service_url_prepare_internal" google-apps-script/PICK_PACK_API.gs
          grep -q "S13_DUAL_SERVICE_URL_BRIDGE" google-apps-script/SERVICE_MIGRATION_M2.gs
          grep -q "ppM2ServiceUrlUpdateInternal_" google-apps-script/SERVICE_MIGRATION_M2.gs
          cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js
          cp google-apps-script/SERVICE_MIGRATION_M2.gs /tmp/SERVICE_MIGRATION_M2.js
          node --check /tmp/PICK_PACK_API.js
          node --check /tmp/SERVICE_MIGRATION_M2.js

      - name: Exchange Google OAuth and normalize Apps Script IDs
        id: google
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$SCRIPT_ID"; test -n "$DEPLOYMENT_ID"; test -n "$TOKEN"
          echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"; echo "::add-mask::$TOKEN"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy fenced GAS source before hostname switch
        id: gasdeploy
        shell: bash
        env:
          SCRIPT_ID: ${{ steps.google.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.google.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.google.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          PY
          H=$(curl -sS -o /tmp/content.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { cat /tmp/content.out; exit 1; }
          H=$(curl -sS -o /tmp/version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"S13 dual Service URL hostname fence"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { cat /tmp/version.json; exit 1; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/version.json"))["versionNumber"])')
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API S13 hostname fence'}}))
          PY
          H=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          [[ "$H" == 200 ]] || { cat /tmp/deploy.out; exit 1; }
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/tmp/deployment.json
          python3 - <<'PY' >/tmp/weburl
          import json
          j=json.load(open('/tmp/deployment.json')); eps=j.get('entryPoints',[])
          web=[e.get('webApp',{}) for e in eps if e.get('entryPointType')=='WEB_APP']
          assert web and web[0].get('url')
          print(web[0]['url'])
          PY
          echo "web_url=$(cat /tmp/weburl)" >> "$GITHUB_OUTPUT"

      - name: Wait for GAS propagation and derive bridge secret
        id: ready
        shell: bash
        env:
          WEB_URL: ${{ steps.gasdeploy.outputs.web_url }}
        run: |
          set -euo pipefail
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          OK=false
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -H 'content-type: application/json' "$WEB_URL" -d '{"action":"m2_service_url_prepare_internal","confirmation":"invalid"}' || true)
            if [[ "$CODE" == 200 ]] && grep -q 'SERVICE_URL_CONFIRMATION_REQUIRED' /tmp/probe.json; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/probe.json; exit 1; }

      - name: Verify Cloudflare scope is exactly the Pick Pack Worker
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" >/tmp/subdomain-before.json
          curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" >/tmp/scripts.json
          node - "$WORKER_NAME" <<'NODE'
          const fs=require('fs'), expected=process.argv[2];
          const sub=JSON.parse(fs.readFileSync('/tmp/subdomain-before.json')), scripts=JSON.parse(fs.readFileSync('/tmp/scripts.json'));
          if(!sub.success||!scripts.success)throw new Error('Cloudflare API diagnostic failed');
          const names=(scripts.result||[]).map(x=>x.id).sort();
          if(names.length!==1||names[0]!==expected)throw new Error('Refusing account-wide subdomain change; unexpected Workers: '+names.join(','));
          console.log('OLD_ACCOUNT_SUBDOMAIN='+sub.result.subdomain);
          NODE

      - name: Prepare GAS dual URL before changing Cloudflare hostname
        shell: bash
        env:
          WEB_URL: ${{ steps.gasdeploy.outputs.web_url }}
          BRIDGE: ${{ steps.ready.outputs.bridge }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          open('/tmp/prepare.json','w').write(json.dumps({'action':'m2_service_url_prepare_internal','confirmation':'OWNER_LOCKED_M2_SERVICE_URL_ONLY','bridge_secret':os.environ['BRIDGE'],'service_url':os.environ['TARGET_SERVICE_URL']}))
          PY
          curl -fsS -H 'content-type: application/json' "$WEB_URL" --data-binary @/tmp/prepare.json >/tmp/prepare.out
          grep -q '"ok":true' /tmp/prepare.out
          grep -q '"prepared":true' /tmp/prepare.out
          grep -q '"authority_mode":"SERVICE_PRIMARY"' /tmp/prepare.out
          rm -f /tmp/prepare.json

      - name: Change account workers.dev subdomain to pp1291
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          H=$(curl -sS -o /tmp/subdomain-set.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -d "{\"subdomain\":\"$TARGET_ACCOUNT_SUBDOMAIN\"}")
          [[ "$H" == 200 ]] || { cat /tmp/subdomain-set.json; exit 1; }
          grep -q '"success":true' /tmp/subdomain-set.json
          grep -q '"subdomain":"pp1291"' /tmp/subdomain-set.json

      - name: Verify new Worker URL before GAS cutover
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 20); do
            curl -fsS "$TARGET_SERVICE_URL/health" >/tmp/new-health.json 2>/dev/null || true
            curl -fsS "$TARGET_SERVICE_URL/v1/authority" >/tmp/new-authority.json 2>/dev/null || true
            if grep -q '"ok":true' /tmp/new-health.json 2>/dev/null && grep -q '"mode":"SERVICE_PRIMARY"' /tmp/new-authority.json 2>/dev/null; then OK=true; break; fi
            sleep 2
          done
          [[ "$OK" == true ]] || { cat /tmp/new-health.json || true; cat /tmp/new-authority.json || true; exit 1; }

      - name: Finalize GAS discovery on new hostname without authority change
        shell: bash
        env:
          WEB_URL: ${{ steps.gasdeploy.outputs.web_url }}
          BRIDGE: ${{ steps.ready.outputs.bridge }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          open('/tmp/finalize.json','w').write(json.dumps({'action':'m2_service_url_update_internal','confirmation':'OWNER_LOCKED_M2_SERVICE_URL_ONLY','bridge_secret':os.environ['BRIDGE'],'service_url':os.environ['TARGET_SERVICE_URL']}))
          PY
          curl -fsS -H 'content-type: application/json' "$WEB_URL" --data-binary @/tmp/finalize.json >/tmp/finalize.out
          grep -q '"ok":true' /tmp/finalize.out
          grep -q '"authority_mode":"SERVICE_PRIMARY"' /tmp/finalize.out
          grep -q '"service_generation":"m2-prod-20260819-001"' /tmp/finalize.out
          rm -f /tmp/finalize.json
          curl -fsS -H 'content-type: application/json' "$WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' >/tmp/discovery.json
          grep -q '"service_url":"https://pick-pack-1291-service.pp1291.workers.dev"' /tmp/discovery.json
          grep -q '"authority_mode":"SERVICE_PRIMARY"' /tmp/discovery.json
          echo "NEW_SERVICE_URL=$TARGET_SERVICE_URL"
