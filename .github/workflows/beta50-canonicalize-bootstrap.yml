name: Beta50 Canonicalize Bootstrap

on:
  push:
    branches:
      - stabilization/beta48-golden-reset-beta50-20260822

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce run checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_CANONICALIZE_RUN start run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Materialize Beta48 chain exactly once
        run: |
          python3 tools/apply_m2_android_transport_patch.py
          git status --short
      - name: Capture complete canonicalized source delta
        run: |
          mkdir -p canonicalized
          { git diff --name-only --diff-filter=ACMRT; git ls-files --others --exclude-standard; } | sort -u > canonicalized/files.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "canonicalized/$(dirname "$f")"
            cp "$f" "canonicalized/$f"
          done < canonicalized/files.txt
          printf 'source_sha=%s\n' "${GITHUB_SHA}" > canonicalized/manifest.txt
          printf 'materializer=tools/apply_m2_android_transport_patch.py\n' >> canonicalized/manifest.txt
          printf 'beta_golden=0.4.2-beta.48/54\n' >> canonicalized/manifest.txt
          cat canonicalized/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beta48-canonicalized-source
          path: canonicalized
          if-no-files-found: error
          retention-days: 7
      - name: Compile materialized Beta source without re-running materializer
        run: gradle --no-daemon -x :app:generateS10Operations :app:compileBetaReleaseKotlin
      - name: Report run checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_CANONICALIZE_RUN finish run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} job=${{ job.status }}"
