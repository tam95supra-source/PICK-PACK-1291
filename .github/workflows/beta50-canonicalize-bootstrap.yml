name: Beta50 Canonical Source Verify

# Final canonical checkpoint: no build-time Sxx mutation.
on:
  push:
    branches:
      - stabilization/beta48-golden-reset-beta50-20260822

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: beta50-canonical-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce verify run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_VERIFY_RUN start run=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Canonical-source and OWNER UI contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'generateS10Operations' app/build.gradle.kts
          ! grep -q 'apply_m2_android_transport_patch.py' app/build.gradle.kts
          grep -q 'versionCode = 56' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.50"' app/build.gradle.kts
          grep -q 'Quản lý biên bản' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Quản lý biên bản đang chờ xây dựng.' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          test -s app/src/main/res/drawable/ic_pp_document.xml
          ! grep -q 'NGƯỜI DÙNG ĐANG KẾT NỐI' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'service_connections' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -Fq 'Còn $pending mục' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN PDA' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN SERVICE' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN TRÊN GOOGLE SHEET' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN ĐỒNG BỘ KHÁC' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'THÔNG TIN ỨNG DỤNG' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
      - name: Compile Beta50 committed source
        run: gradle --no-daemon :app:compileBetaReleaseKotlin
      - name: Build Beta50 only
        run: gradle --no-daemon :app:assembleBetaRelease
      - name: Prove build did not mutate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload unsigned verification APK
        uses: actions/upload-artifact@v4
        with:
          name: beta50-unsigned-verification
          path: app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Report verify run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_VERIFY_RUN finish run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} job=${{ job.status }}"
