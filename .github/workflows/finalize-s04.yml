name: Finalize S04 Verified Source

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s04-finalize-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate verified S04 source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          raw=Path('.github/workflows/apply-s04-layout2.yml').read_text(encoding='utf-8')
          marker="          python3 <<'PY'\n"
          a=raw.index(marker)+len(marker)
          b=raw.index("\n          PY\n",a)
          body=raw[a:b]
          Path('/tmp/apply_s04.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n',encoding='utf-8')
          PY
          sed -i "s/start='    private fun laborHome(){'/start='    private fun laborHome() {'/" /tmp/apply_s04.py
          python3 /tmp/apply_s04.py
          python3 ops/s04_repair.py
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Check GAS syntax
        run: cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js && node --check /tmp/PICK_PACK_API.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/tools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/cmd"; mv "$RUNNER_TEMP/cmd/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Beta and Stable
        run: gradle --no-daemon :app:assembleBetaDebug :app:assembleStableDebug

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-s04-layout2.yml .github/workflows/run-s04-direct.yml .github/workflows/trigger-s04.yml .github/workflows/finalize-s04.yml
          rm -f ops/s04-trigger.txt ops/s04-direct-trigger.txt ops/s04-finalize-trigger.txt ops/s04-dispatch-receipt.txt ops/s04-observer.json ops/s04_repair.py
          rmdir ops 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply S04 layout 2 navigation and account mail'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
