name: Session14 Beta35 Runtime Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session14-beta35-runtime-diag-trigger.txt]
permissions:
  contents: write
concurrency:
  group: session14-beta35-runtime-diag
  cancel-in-progress: false
env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  D1_NAME: pick-pack-1291-service-prod
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Read-only production checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/result; echo "checked_at=$(date -u +%FT%TZ)" >"$OUT"; echo "head_sha=$GITHUB_SHA" >>"$OUT"
          curl -fsSL "$SERVICE_URL/health" >/tmp/h.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/g.json
          node - <<'NODE' >>"$OUT"
          const h=require('/tmp/h.json'),g=require('/tmp/g.json'),a=h.authority||{};
          console.log(`service=${h.ok?'OK':'BAD'}`);console.log(`authority=${a.mode||''}_${a.authority_epoch||''}_${a.authority_seq||''}`);console.log(`replication=${h.replication?.state||''}_${Number(h.replication?.pending_count??-1)}`);console.log(`gas=${g.authority_mode||''}_${g.authority?.authority_epoch||''}`);
          NODE
          cd service
          npx wrangler d1 list --json >/tmp/list.json
          ID=$(node -e "const r=require('/tmp/list.json'),x=r.find(v=>v.name===process.env.D1_NAME);if(!x)process.exit(2);process.stdout.write(String(x.uuid||x.id||''))"); export ID
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));c.name='pick-pack-1291-service';c.main='src/entry_product.ts';c.keep_vars=true;c.d1_databases[0].database_name=process.env.D1_NAME;c.d1_databases[0].database_id=process.env.ID;delete c.secrets;fs.writeFileSync('.wrangler-diag.jsonc',JSON.stringify(c,null,2))"
          npx wrangler d1 execute "$D1_NAME" --remote --config .wrangler-diag.jsonc --command "SELECT login_id,role,status,CASE WHEN length(COALESCE(verifier_hash,''))>0 THEN 1 ELSE 0 END AS verifier_present FROM accounts WHERE login_id='dple'; SELECT login_id,device_id,issued_at FROM auth_sessions WHERE login_id='dple' ORDER BY issued_at DESC LIMIT 3; SELECT actor_id,event_type,business_date,committed_at,authority_seq FROM events WHERE actor_id='dple' ORDER BY authority_seq DESC LIMIT 10;" --json >/tmp/d1.json
          node - <<'NODE' >>"$OUT"
          const x=require('/tmp/d1.json');const sets=Array.isArray(x)?x:[];const rows=i=>(sets[i]?.results||[]);
          const a=rows(0)[0]||{};console.log(`account_present=${a.login_id?1:0}`);console.log(`account_role=${a.role||''}`);console.log(`account_status=${a.status||''}`);console.log(`account_verifier_present=${Number(a.verifier_present||0)}`);
          const s=rows(1);console.log(`auth_session_rows=${s.length}`);if(s[0]){console.log(`latest_auth_issued_at=${s[0].issued_at||''}`);console.log(`latest_auth_device_present=${s[0].device_id?1:0}`)}
          const e=rows(2);console.log(`recent_event_rows=${e.length}`);if(e[0]){console.log(`latest_event_type=${e[0].event_type||''}`);console.log(`latest_event_at=${e[0].committed_at||''}`);console.log(`latest_event_seq=${e[0].authority_seq||''}`)}
          console.log('stable=UNTOUCHED');console.log('merge_pr38=UNTOUCHED');console.log('verdict=PASS');
          NODE
      - name: Record result
        if: always()
        shell: bash
        run: |
          test -f /tmp/result || echo result_missing=true >/tmp/result
          grep -q '^verdict=' /tmp/result || { echo stable=UNTOUCHED >>/tmp/result; echo merge_pr38=UNTOUCHED >>/tmp/result; echo verdict=FAILED_OR_STOPPED >>/tmp/result; }
          cp /tmp/result /tmp/r;git reset --hard HEAD >/dev/null;git pull --rebase origin agent/service-migration-m2 || true;cp /tmp/r ops/session14-beta35-runtime-diag-result.txt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops/session14-beta35-runtime-diag-result.txt;git diff --cached --quiet || git commit -m 'ops: record Beta35 runtime diagnostic';git push origin HEAD:agent/service-migration-m2
