name: S14 Account Status Repair

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s14-account-status-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-account-status:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
      D1_NAME: pick-pack-1291-service-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve intended account statuses from authoritative Sheet
        shell: bash
        run: |
          set -euo pipefail
          OAUTH=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(jq -r '.access_token // empty' <<<"$OAUTH"); test -n "$TOKEN"; echo "::add-mask::$TOKEN"
          ENC=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("'Danh sách Admin'!A1:I100",safe=''))
          PY
          )
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$ENC?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/admin.json
          node - <<'NODE'
          const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('/tmp/admin.json')).values||[];
          if(!rows.length)throw new Error('ADMIN_SHEET_EMPTY');
          const h=rows[0].map(x=>String(x||'').trim());
          const ix=n=>h.indexOf(n), iLogin=ix('Số User'), iVerifier=ix('Password verifier'), iRole=ix('Vị trí'), iStatus=ix('Trạng thái tài khoản');
          if([iLogin,iVerifier,iRole,iStatus].some(x=>x<0))throw new Error('ADMIN_HEADERS_INVALID');
          const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
          const activeLabels=new Set(['ACTIVE','HOAT DONG','DANG HOAT DONG','KHA DUNG']);
          const out=[];
          for(const r of rows.slice(1)){
            const login=String(r[iLogin]||'').trim(), verifier=String(r[iVerifier]||'').trim(), role=fold(r[iRole]);
            if(!login||!verifier||!['SUPERADMIN','ADMIN','USER'].includes(role))continue;
            const explicit=String(r[iStatus]||'').trim();
            const status=!explicit?'ACTIVE':(activeLabels.has(fold(explicit))?'ACTIVE':'DISABLED');
            out.push({login,status});
          }
          if(!out.length)throw new Error('NO_ACCOUNTS_RESOLVED');
          fs.writeFileSync('/tmp/account-status.json',JSON.stringify(out));
          console.log(`resolved_accounts=${out.length} active=${out.filter(x=>x.status==='ACTIVE').length} disabled=${out.filter(x=>x.status==='DISABLED').length}`);
          NODE
      - name: Apply status-only repair to production D1
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"; export D1_ID="$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text().replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"').replace('__M1_D1_DATABASE_ID__',os.environ['D1_ID'])
          Path('/tmp/wrangler.account-repair.jsonc').write_text(s)
          PY
          SQL=$(node - <<'NODE'
          const rows=require('/tmp/account-status.json'); const q=s=>"'"+String(s).replace(/'/g,"''")+"'";
          process.stdout.write(rows.map(x=>`UPDATE accounts SET status=${q(x.status)} WHERE login_id=${q(x.login)} AND is_shadow_test=0;`).join(' '));
          NODE
          )
          npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.account-repair.jsonc --command "$SQL" --json >/tmp/update.json
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.account-repair.jsonc --command "SELECT login_id,role,position,status FROM accounts WHERE is_shadow_test=0 ORDER BY login_id;" --json)
          node - <<'NODE' "$OUT" /tmp/account-status.json
          const j=JSON.parse(process.argv[2]), want=require(process.argv[3]), rows=j?.[0]?.results||[], map=new Map(rows.map(x=>[x.login_id,x]));
          for(const x of want){const got=map.get(x.login);if(!got||got.status!==x.status)throw new Error(`ACCOUNT_STATUS_MISMATCH:${x.login}`);}
          console.log(`ACCOUNT_STATUS_REPAIR=PASS count=${want.length}`);
          for(const r of rows)console.log(`account=${r.login_id} role=${r.role} status=${r.status}`);
          NODE
