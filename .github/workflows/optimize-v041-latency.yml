name: Apply v0.4.1 Latency Optimization
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/optimize-v041-latency.yml' ]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/optimize_v041_latency.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app google-apps-script
          git diff --cached --check
          git commit -m 'perf: collapse employee scan to one API round trip'
          git push origin HEAD:main
