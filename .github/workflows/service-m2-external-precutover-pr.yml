name: Service M2 External Precutover PR

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-external-precutover-pr.yml'

permissions:
  contents: read

concurrency:
  group: service-m2-external-precutover-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-precutover:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Retired after M2 external deploy, bootstrap, and replication gates passed.'
