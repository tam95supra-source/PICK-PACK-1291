name: Package GSheet API v0.4.1
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/package-gas-v041.yml' ]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gsheet-api-v0.4.1
          cp google-apps-script/PICK_PACK_API.gs dist/gsheet-api-v0.4.1/
          cp google-apps-script/appsscript.json dist/gsheet-api-v0.4.1/
          cp DEPLOY_GSHEET_API.md dist/gsheet-api-v0.4.1/
          cat > dist/gsheet-api-v0.4.1/DEPLOY_V0.4.1.txt <<'EOF'
          PICK PACK 1291 — GSHEET API v0.4.1

          1. Mở workbook DỮ LIỆU THEO NGÀY.
          2. Extensions > Apps Script.
          3. Thay PICK_PACK_API.gs bằng file trong gói này.
          4. Giữ appsscript.json theo file trong gói.
          5. Deploy > Manage deployments > Edit > New version > Deploy.
          6. Giữ Execute as: Me và quyền truy cập của deployment hiện tại.
          7. Kiểm tra /exec: health phải có api_version=0.4.1 và master_revision.

          Không thêm service/database khác. Google Sheet là nguồn dữ liệu nghiệp vụ.
          EOF
          (cd dist/gsheet-api-v0.4.1 && zip -q ../pick-pack-1291-gsheet-api-v0.4.1-deploy.zip *)
          sha256sum dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip > dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-gsheet-api-v0.4.1-deploy
          path: |
            dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip
            dist/pick-pack-1291-gsheet-api-v0.4.1-deploy.zip.sha256
          retention-days: 2
