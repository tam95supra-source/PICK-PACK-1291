        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-icon-session-beta3.yml .github/workflows/verify-owner-icon.yml
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'fix: exact owner icon and persistent single-device login beta3'
          git push origin main
          echo 'Verified source committed: PASS'