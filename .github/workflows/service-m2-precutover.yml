name: Service M2 Precutover

on:
  push:
    branches: [ agent/service-migration-m2 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-m2-precutover
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PWA JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check service/public/app.js
          node --check service/public/sw.js
          test -s service/public/index.html
          test -s service/public/manifest.webmanifest
      - name: Install and type-check Worker
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
      - name: Prove D1 migrations from empty local database
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrangler.jsonc')
          Path('/tmp/wrangler.m2.jsonc').write_text(p.read_text().replace('__M1_D1_DATABASE_ID__','00000000-0000-0000-0000-000000000001'))
          PY
          rm -rf /tmp/pick-pack-m2-local
          npx wrangler d1 migrations apply pick-pack-1291-m1-staging --local --persist-to /tmp/pick-pack-m2-local --config /tmp/wrangler.m2.jsonc
          npx wrangler d1 execute pick-pack-1291-m1-staging --local --persist-to /tmp/pick-pack-m2-local --config /tmp/wrangler.m2.jsonc --command "SELECT version,checksum FROM schema_migrations ORDER BY version; SELECT mode,scope,authority_epoch,authority_seq FROM authority_state;" --json | tee /tmp/m2-db.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/m2-db.json','utf8'));const text=JSON.stringify(x);if(!text.includes('0001_m1_foundation')||!text.includes('0002_m2_authority_recovery'))throw new Error('migration markers missing');
          NODE
      - name: Architecture safety guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVICE_PRIMARY' service/src/core.ts
          grep -q 'GOOGLE_FALLBACK' service/migrations/0002_m2_authority_recovery.sql
          grep -q 'sheet_replication_outbox' service/src/replication.ts
          grep -q 'acceptWebSocket' service/src/realtime.ts
          grep -q 'IndexedDB\|indexedDB' service/public/app.js
          grep -q 'OFFLINE_PROVISIONAL' service/public/app.js
          ! grep -R -nE 'supabase\.co|firebaseio\.com|neon\.tech' service app google-apps-script 2>/dev/null
          echo 'M2 source-contract precutover PASS.'
