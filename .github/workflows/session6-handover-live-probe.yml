name: Session6 Handover Live Probe
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session6-handover-live-probe-trigger.txt]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: session6-handover-live-probe
  cancel-in-progress: false
env:
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  EXPECTED_BETA: 0.4.2-beta.29
  EXPECTED_SHA: c8a601f58f974dc4cffa038b892c5489a69e1160166684d4eb0d7c1e318f6ec4
  EXPECTED_SIZE: '12843347'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - name: Fresh read-only live snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          OUT=/tmp/r
          echo "checked_at=$(date -u +%FT%TZ)" > "$OUT"
          echo "head_sha=$GITHUB_SHA" >> "$OUT"
          HCODE=$(curl -sS --max-time 25 -o /tmp/h.json -w '%{http_code}' "$SERVICE_URL/health" || echo CURL_FAIL)
          ACODE=$(curl -sS --max-time 25 -o /tmp/a.json -w '%{http_code}' "$SERVICE_URL/v1/authority" || echo CURL_FAIL)
          RCODE=$(curl -sS --max-time 25 -o /tmp/rh.json -w '%{http_code}' "$SERVICE_URL/v1/replication/health" || echo CURL_FAIL)
          GCODE=$(curl -sS --max-time 25 -H 'content-type: application/json' -o /tmp/g.json -w '%{http_code}' "$GAS_URL" -d '{"action":"service_discovery"}' || echo CURL_FAIL)
          OCODE=$(curl -sS --max-time 25 -H 'content-type: application/json' -o /tmp/ota.json -w '%{http_code}' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.28"}' || echo CURL_FAIL)
          SCODE=$(curl -sS --max-time 25 -H 'content-type: application/json' -o /tmp/self.json -w '%{http_code}' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.29"}' || echo CURL_FAIL)
          TCODE=$(curl -sS --max-time 25 -H 'content-type: application/json' -o /tmp/stable.json -w '%{http_code}' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.0.0"}' || echo CURL_FAIL)
          PCODE=$(curl -sS --max-time 25 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o /tmp/pr.json -w '%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/38" || echo CURL_FAIL)
          node - <<'NODE' >> "$OUT"
          const fs=require('fs'); const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const h=read('/tmp/h.json'),a0=read('/tmp/a.json'),rh=read('/tmp/rh.json'),g=read('/tmp/g.json'),o=read('/tmp/ota.json'),s=read('/tmp/self.json'),t=read('/tmp/stable.json'),p=read('/tmp/pr.json');
          const a=h.authority||a0.authority||a0||{}; const ga=g.authority||{};
          const avail=x=>x.available??x.update_available; const ver=x=>String(x.version_name??x.version??'');
          const epoch=Number(a.authority_epoch), ge=Number(g.authority_epoch??ga.authority_epoch);
          const rep=h.replication||rh.replication||rh||{};
          console.log(`service_health_ok=${h.ok===true}`);
          console.log(`service_authority=${a.mode||''}|${a.authority_epoch??''}|${a.authority_seq??''}|${a.scope||''}|${a.service_generation||''}`);
          console.log(`replication=${rep.state||''}|pending=${rep.pending_count??''}|error=${String(rep.last_error||'').replace(/[\r\n]/g,' ').slice(0,160)}`);
          console.log(`gas_discovery=${g.ok===true}|${g.authority_mode||ga.mode||''}|${g.authority_epoch??ga.authority_epoch??''}|${g.authority_seq??ga.authority_seq??''}`);
          console.log(`beta_ota=${o.ok===true}|available=${avail(o)}|version=${ver(o)}|sha=${String(o.sha256||'').toLowerCase()}|size=${o.size??''}`);
          console.log(`beta_self=${s.ok===true}|available=${avail(s)}|version=${ver(s)}`);
          console.log(`stable_ota=${t.ok===true}|available=${avail(t)}|version=${ver(t)}`);
          console.log(`pr38=${p.state||''}|draft=${p.draft}|merged=${p.merged}`);
          let publicPass=false;
          const url=o.apk_url||o.download_url||o.url||'';
          fs.writeFileSync('/tmp/apkurl',url);
          const authorityPass=h.ok===true&&a.mode==='SERVICE_PRIMARY'&&a.scope==='PRODUCTION'&&Number.isInteger(epoch)&&g.ok===true&&g.authority_mode==='SERVICE_PRIMARY'&&ge===epoch;
          const otaPass=o.ok===true&&avail(o)===true&&ver(o)===process.env.EXPECTED_BETA&&String(o.sha256||'').toLowerCase()===process.env.EXPECTED_SHA&&String(o.size)===process.env.EXPECTED_SIZE;
          const selfPass=s.ok===true&&avail(s)===false;
          const stablePass=t.ok===true&&avail(t)===false&&ver(t)!==process.env.EXPECTED_BETA;
          const prPass=p.state==='open'&&p.draft===true&&p.merged!==true;
          console.log(`authority_gate=${authorityPass?'PASS':'FAIL'}`);
          console.log(`ota_metadata_gate=${otaPass?'PASS':'FAIL'}`);
          console.log(`self_update_gate=${selfPass?'PASS':'FAIL'}`);
          console.log(`stable_isolation_gate=${stablePass?'PASS':'FAIL'}`);
          console.log(`pr38_gate=${prPass?'PASS':'FAIL'}`);
          NODE
          URL=$(cat /tmp/apkurl)
          if [[ -n "$URL" ]]; then
            if curl -fsSL --max-time 90 --retry 3 --retry-delay 2 "$URL" -o /tmp/public.apk; then
              SHA=$(sha256sum /tmp/public.apk|awk '{print $1}'); SIZE=$(stat -c%s /tmp/public.apk)
              echo "public_apk_sha256=$SHA" >> "$OUT"; echo "public_apk_size=$SIZE" >> "$OUT"
              if [[ "$SHA" == "$EXPECTED_SHA" && "$SIZE" == "$EXPECTED_SIZE" ]]; then echo public_download_gate=PASS >> "$OUT"; else echo public_download_gate=FAIL >> "$OUT"; fi
            else echo public_download_gate=FAIL >> "$OUT"; fi
          else echo public_download_gate=FAIL >> "$OUT"; fi
          printf 'http_codes=service:%s|authority:%s|replication:%s|gas:%s|ota:%s|self:%s|stable:%s|pr:%s\n' "$HCODE" "$ACODE" "$RCODE" "$GCODE" "$OCODE" "$SCODE" "$TCODE" "$PCODE" >> "$OUT"
          echo 'replication_gate=OBSERVE_ONLY_OWNER_WAIVER_2026-08-20' >> "$OUT"
          echo 'verdict=READ_ONLY_LIVE_SNAPSHOT_COMPLETE' >> "$OUT"
      - name: Record result
        if: always()
        shell: bash
        run: |
          test -f /tmp/r || printf 'checked_at=%s\nverdict=PROBE_FAILED_BEFORE_RESULT\n' "$(date -u +%FT%TZ)" >/tmp/r
          cp /tmp/r /tmp/rcopy
          git reset --hard HEAD >/dev/null
          git pull --rebase origin agent/service-migration-m2 || true
          cp /tmp/rcopy ops/session6-handover-live-probe-result.txt
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session6-handover-live-probe-result.txt
          git diff --cached --quiet || git commit -m 'ops: record handover live snapshot'
          git push origin HEAD:agent/service-migration-m2
