name: Observe S04 Permanent Pipelines

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s04-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record GAS deploy and Beta CI status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"gas":' > ops/s04-observer.json
          gh run list --repo "${{ github.repository }}" --workflow beta4-deploy-gas.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle >> ops/s04-observer.json
          printf ',"beta_ci":' >> ops/s04-observer.json
          gh run list --repo "${{ github.repository }}" --workflow beta-preview.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle >> ops/s04-observer.json
          printf '}\n' >> ops/s04-observer.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/s04-observer.json
          git commit -m 'chore: record S04 permanent pipeline status' || true
          git push origin HEAD:main || true
