name: Trigger S04 Apply

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s04-trigger.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch S04 implementation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-s04-layout2.yml --repo "${{ github.repository }}" --ref main
