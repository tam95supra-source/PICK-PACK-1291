name: Session1 Failback Observer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 1acc3ae3877ab9005feb739648c13181a94da29e
    steps:
      - name: Observe exact controlled failback run
        shell: bash
        run: |
          set -euo pipefail
          FOUND=''
          for i in $(seq 1 100); do
            JSON=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/session1-controlled-failback.yml/runs?branch=agent%2Fservice-migration-m2&event=push&per_page=10")
            FOUND=$(node -e 'const j=JSON.parse(process.argv[1]),x=(j.workflow_runs||[]).find(r=>r.head_sha===process.env.EXPECTED_SHA);if(x)process.stdout.write(JSON.stringify({id:x.id,status:x.status,conclusion:x.conclusion,head_sha:x.head_sha,created_at:x.created_at,updated_at:x.updated_at}))' "$JSON")
            if [[ -n "$FOUND" ]]; then echo "FAILBACK_RUN=$FOUND"; STATUS=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$FOUND"); [[ "$STATUS" == completed ]] && break; fi
            sleep 10
          done
          [[ -n "$FOUND" ]] || { echo FAILBACK_RUN_NOT_FOUND; exit 1; }
          ID=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).id))' "$FOUND"); CONCLUSION=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).conclusion||""))' "$FOUND")
          JOBS=$(gh api -X GET "repos/${{ github.repository }}/actions/runs/$ID/jobs?per_page=100")
          node -e 'const j=JSON.parse(process.argv[1]);for(const x of j.jobs||[])console.log("FAILBACK_JOB="+JSON.stringify({id:x.id,name:x.name,status:x.status,conclusion:x.conclusion,steps:(x.steps||[]).map(s=>({name:s.name,status:s.status,conclusion:s.conclusion}))}))' "$JOBS"
          [[ "$CONCLUSION" == success ]] || { echo "FAILBACK_CONCLUSION=$CONCLUSION"; exit 1; }
          echo FAILBACK_OBSERVED=SUCCESS
