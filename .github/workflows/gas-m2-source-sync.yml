name: GAS M2 Source Sync

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - '.github/workflows/gas-m2-source-sync.yml'
      - 'tools/apply_m2_service_migration_gas_patch.py'
      - 'google-apps-script/SERVICE_MIGRATION_M2.gs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gas-m2-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 0
      - name: Apply existing runtime transforms and M2 routing
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "v0.4.2 S12 CURRENT-DAY CACHE / REPORT OVERRIDES" google-apps-script/PICK_PACK_API.gs; then python3 tools/apply_s12_gas_patch.py; fi
          if ! grep -q "report_engine:'S12_CURRENT_DAY'" google-apps-script/PICK_PACK_API.gs; then python3 tools/apply_s12_gas_health_patch.py; fi
          if ! grep -q "history_engine:'S13_SHARED_SESSION'" google-apps-script/PICK_PACK_API.gs; then python3 tools/apply_s13_shared_history_gas_patch.py; fi
          if ! grep -q "v0.4.2 S15 LOCAL-FIRST 45D SYNC" google-apps-script/PICK_PACK_API.gs; then python3 tools/apply_s15_local_first_gas_patch.py; fi
          if ! grep -q "v0.4.2 S17 SQLITE CRASH RECOVERY" google-apps-script/PICK_PACK_API.gs; then python3 tools/apply_s17_sqlite_recovery_gas_patch.py; fi
          python3 tools/apply_m2_service_migration_gas_patch.py
      - name: Patch OTA discovery to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('google-apps-script/PICK_PACK_API.gs'); s=p.read_text(); marker='PP_GITHUB_RELEASE_OTA_V1'
          if marker not in s:
              start=s.index('function ppUpdateCheck_(body) {')
              end=s.index('\n}\n\nfunction ppJson_',start)+2
              new=r'''// PP_GITHUB_RELEASE_OTA_V1: OTA binaries are public GitHub Release assets.
function ppOtaMetaLine_(body,key) {
  const lines=String(body||'').split(/\r?\n/),prefix=String(key||'')+'=';
  for(let i=0;i<lines.length;i++)if(lines[i].indexOf(prefix)===0)return lines[i].slice(prefix.length).trim();
  return '';
}
function ppOtaGithubReleases_() {
  const cache=CacheService.getScriptCache(),key='PP_GITHUB_RELEASES_OTA_V1',cached=cache.get(key);
  if(cached){try{return JSON.parse(cached);}catch(_){}}
  const r=UrlFetchApp.fetch(PP.RELEASES,{muteHttpExceptions:true,headers:{'Accept':'application/vnd.github+json','User-Agent':'pick-pack-1291-ota'}});
  if(r.getResponseCode()!==200)throw new Error('GITHUB_RELEASES_HTTP_'+r.getResponseCode());
  const rows=JSON.parse(r.getContentText()||'[]'); cache.put(key,JSON.stringify(rows),60); return rows;
}
function ppUpdateCheck_(body) {
  const channel=ppFold_(body.channel||body._app_channel)==='STABLE'?'STABLE':'BETA',current=String(body.current_version||body._app_version||'').trim();
  const releases=ppOtaGithubReleases_(); let best=null;
  releases.forEach(function(rel){
    if(!rel||rel.draft)return;
    const meta=String(rel.body||''); if(ppFold_(ppOtaMetaLine_(meta,'PP_CHANNEL'))!==channel)return;
    const version=ppOtaMetaLine_(meta,'PP_VERSION'),apkName=ppOtaMetaLine_(meta,'PP_APK_NAME'); if(!version||!apkName)return;
    const assets=Array.isArray(rel.assets)?rel.assets:[],asset=assets.find(function(a){return String(a&&a.name||'')===apkName;}); if(!asset||!asset.browser_download_url)return;
    if(!best||ppOtaCompare_(version,best.version)>0)best={rel:rel,asset:asset,version:version,meta:meta};
  });
  if(!best)return {ok:true,source:'GITHUB_RELEASE',channel:channel,available:false,reason:'NO_RELEASE'};
  const available=ppOtaCompare_(best.version,current)>0;
  const out={ok:true,source:'GITHUB_RELEASE',channel:channel,available:available,version_name:best.version,version_code:Number(ppOtaMetaLine_(best.meta,'PP_VERSION_CODE')||0),size:Number(ppOtaMetaLine_(best.meta,'PP_SIZE')||best.asset.size||0),published_at:String(best.rel.published_at||best.rel.created_at||''),notes:String(best.rel.name||('Pick Pack 1291 '+best.version)),mandatory:ppFold_(ppOtaMetaLine_(best.meta,'PP_MANDATORY'))==='TRUE'};
  if(!available)return out;
  out.sha256=String(ppOtaMetaLine_(best.meta,'PP_SHA256')||'').toLowerCase(); out.apk_url=String(best.asset.browser_download_url||'');
  if(!/^[0-9a-f]{64}$/.test(out.sha256)||!/^https:\/\/github\.com\//.test(out.apk_url))return {ok:false,error:'OTA_GITHUB_METADATA_INVALID',source:'GITHUB_RELEASE',channel:channel};
  return out;
}
'''
              s=s[:start]+new+s[end:]
              p.write_text(s)
          PY
      - name: Validate final GAS source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "action === 'service_discovery'" google-apps-script/PICK_PACK_API.gs
          grep -q "PP_GITHUB_RELEASE_OTA_V1" google-apps-script/PICK_PACK_API.gs
          grep -q "GITHUB_RELEASE" google-apps-script/PICK_PACK_API.gs
          grep -q "function ppM2Discovery_" google-apps-script/SERVICE_MIGRATION_M2.gs
          cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js
          cp google-apps-script/SERVICE_MIGRATION_M2.gs /tmp/SERVICE_MIGRATION_M2.js
          node --check /tmp/PICK_PACK_API.js
          node --check /tmp/SERVICE_MIGRATION_M2.js
      - name: Commit validated transformed GAS source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/PICK_PACK_API.gs
          if git diff --cached --quiet; then
            echo 'GAS source already synchronized.'
          else
            git commit -m 'feat: switch OTA discovery to GitHub Releases'
            git pull --rebase origin agent/service-migration-m2
            git push origin HEAD:agent/service-migration-m2
          fi
