name: Release Preflight - Beta and Stable

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ops/release-preflight-trigger.txt'

concurrency:
  group: beta41-observable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: 331b9b8a1cf84131aede63fe3d5588ab58f5fa34
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev

jobs:
  live-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify live authority and OTA isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$SERVICE_URL/health" > /tmp/service.json
          jq -e '.ok==true and .environment=="production" and .authority.mode=="SERVICE_PRIMARY"' /tmp/service.json >/dev/null
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"health"}' > /tmp/gas.json
          jq -e '.ok==true and .sheet_read==true and .auth_session_model=="SINGLE_ACTIVE_DEVICE_V1"' /tmp/gas.json >/dev/null
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"update_check","channel":"BETA","current_version":"999.999.999"}' > /tmp/beta.json
          curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"999.999.999"}' > /tmp/stable.json
          jq -e '.ok==true and .source=="GOOGLE_DRIVE" and .channel=="BETA"' /tmp/beta.json >/dev/null
          jq -e '.ok==true and .source=="GOOGLE_DRIVE" and .channel=="STABLE" and .available==false' /tmp/stable.json >/dev/null

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify Beta41 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 47' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.41"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -q 'apply_s47_beta41_owner_fixes.py' app/build.gradle.kts
          grep -q 'runpy.run_path.*apply_s47_beta41_owner_fixes.py' tools/apply_s44b_compile_hotfix.py
          grep -q 'S47_BETA41_OWNER_FIVE_FIXES' tools/apply_s47_beta41_owner_fixes.py
          grep -q 'horizontal swipe anywhere' app/src/main/java/vn/pickpack1291/app/beta/EdgeSwipeBackLayout.kt
          python3 -m py_compile tools/apply_s47_beta41_owner_fixes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          else
            SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
            mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Assemble Beta and Stable
        shell: bash
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease
      - name: Verify transformed S47 contracts
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'effectiveRole = role' "$F"
          grep -q 'roleModeScreen' "$F"
          grep -q 'enteredWithPda=pda.isNotBlank()&&initialStatus.isNotBlank()' "$F"
          grep -q 'progress.joinToString(" - ")' "$F"
          grep -q 'for(i in v.childCount-1 downTo 0)' "$F"
          grep -q 'navigateTab(previous,false)' "$F"
      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          "$BT/aapt" dump badging "$BETA" > /tmp/beta.txt; "$BT/aapt" dump badging "$STABLE" > /tmp/stable.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='47'" /tmp/beta.txt; grep -q "versionName='0.4.2-beta.41'" /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.txt
          grep -q "versionCode='1'" /tmp/stable.txt; grep -q "versionName='0.1.0-stable'" /tmp/stable.txt
      - name: Sign and verify fixed signer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64"; test -n "$SIGNING_STORE_PASSWORD"; test -n "$SIGNING_KEY_PASSWORD"; test -n "$SIGNING_ALIAS"
          KS="$RUNNER_TEMP/release.jks"; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"; printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta
          OUT=dist/beta/pick-pack-1291-public-beta-0.4.2-beta.41.apk; BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          sha256sum "$OUT" > dist/beta/SHA256SUMS.txt
      - name: Upload signed Beta41 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-0.4.2-beta.41-signed-validation
          path: dist/beta/*
          retention-days: 7
      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"

  preflight-pass:
    needs: [live-gates, android-release]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'PASS - Beta41 exact-source release preflight complete; no Drive publish performed.'
