name: Release Preflight - Beta and Stable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/release-preflight-trigger.txt'

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      OWNER_ICON_SHA256: 371d0e5ad552e3cf63eef60a3da270896946458a506252a7fa132a67747c7a5d
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4

      - name: Enforce architecture, UX and OTA invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f ARCHITECTURE_GUARDRAILS.md
          test -f google-apps-script/PICK_PACK_API.gs
          grep -q "OTA_BETA_FOLDER_ID: '1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg'" google-apps-script/PICK_PACK_API.gs
          grep -q "OTA_STABLE_FOLDER_ID: '1kxTd2rFfWutc2KWDwqgK8WYWDmSygIN4'" google-apps-script/PICK_PACK_API.gs
          grep -q 'put("action", "update_check")' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -q 'SINGLE_ACTIVE_DEVICE_V1' google-apps-script/PICK_PACK_API.gs
          grep -q 'android:icon="@drawable/owner_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/owner_launcher"' app/src/main/AndroidManifest.xml
          echo "$OWNER_ICON_SHA256  app/src/main/res/drawable-nodpi/owner_launcher.png" | sha256sum -c -
          ! grep -R 'BetaApiClient()' app/src/main/java/vn/pickpack1291/app/beta
          ! grep -R -n 'TransitionManager.beginDelayedTransition' app/src/main/java/vn/pickpack1291/app/beta
          ! grep -R -nE 'server ACK|Log local chờ ACK|nhận ACK|Server revision|Master revision|Master data tự làm mới|Màu giao diện được đổi|Đồng bộ / dữ liệu' app/src/main/java/vn/pickpack1291/app/beta
          ! grep -R -nE 'supabase\.co|firebaseio\.com|neon\.tech|cloudflareworkers\.com' app/src google-apps-script 2>/dev/null

      - name: Read version metadata from source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text=Path('app/build.gradle.kts').read_text()
          beta=re.search(r'create\("beta"\)\s*\{(.*?)\n\s*\}',text,re.S).group(1)
          stable=re.search(r'create\("stable"\)\s*\{(.*?)\n\s*\}',text,re.S).group(1)
          def one(block,pattern):
              m=re.search(pattern,block)
              assert m, pattern
              return m.group(1)
          print('beta_code='+one(beta,r'versionCode\s*=\s*(\d+)'))
          print('beta_name='+one(beta,r'versionName\s*=\s*"([^"]+)"'))
          print('stable_code='+one(stable,r'versionCode\s*=\s*(\d+)'))
          print('stable_name='+one(stable,r'versionName\s*=\s*"([^"]+)"'))
          PY

      - name: Probe live API and Drive OTA channels
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"health"}' > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"mode":"APP_GSHEET"' /tmp/health.json
          grep -q '"sheet_read":true' /tmp/health.json
          grep -q '"auth_session_model":"SINGLE_ACTIVE_DEVICE_V1"' /tmp/health.json
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"update_check","channel":"BETA","current_version":"999.999.999"}' > /tmp/beta-ota.json
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"999.999.999"}' > /tmp/stable-ota.json
          grep -q '"source":"GOOGLE_DRIVE"' /tmp/beta-ota.json
          grep -q '"channel":"BETA"' /tmp/beta-ota.json
          grep -q '"source":"GOOGLE_DRIVE"' /tmp/stable-ota.json
          grep -q '"channel":"STABLE"' /tmp/stable-ota.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" \
             && -f "$ANDROID_HOME/platforms/android-36/android.jar" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "Using preinstalled Android SDK: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble release candidates
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:assembleBetaRelease :app:assembleStableRelease

      - name: Verify package metadata from source
        shell: bash
        env:
          BETA_CODE: ${{ steps.meta.outputs.beta_code }}
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
          STABLE_CODE: ${{ steps.meta.outputs.stable_code }}
          STABLE_NAME: ${{ steps.meta.outputs.stable_name }}
        run: |
          set -euo pipefail
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$BETA" > /tmp/beta.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$STABLE" > /tmp/stable.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='$BETA_CODE'" /tmp/beta.txt
          grep -q "versionName='$BETA_NAME'" /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.txt
          grep -q "versionCode='$STABLE_CODE'" /tmp/stable.txt
          grep -q "versionName='$STABLE_NAME'" /tmp/stable.txt

      - name: Upload unsigned Beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-${{ steps.meta.outputs.beta_name }}-unsigned
          path: app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          retention-days: 3

      - name: Detect automated signing readiness
        id: signing
        shell: bash
        run: |
          READY=true
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do
            [[ -n "${!v:-}" ]] || READY=false
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "Signing secrets ready: $READY"

      - name: Sign and verify fixed identity
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist
          OUT="dist/pick-pack-1291-public-beta-${BETA_NAME}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          sha256sum "$OUT" > dist/SHA256SUMS.txt

      - name: Upload signed validation artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-${{ steps.meta.outputs.beta_name }}-signed-validation
          path: dist/*
          retention-days: 7

      - name: Preflight result
        shell: bash
        run: |
          echo 'PASS - release candidates validated.'
          echo 'No GitHub Release or Google Drive OTA publish is performed by this workflow.'
          echo 'OTA authority remains GAS update_check -> Google Drive channel folders.'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
