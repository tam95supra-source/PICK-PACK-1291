name: S08 Cancel Stuck Release Bridge
on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s08-cancel-trigger.txt'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete stuck V2 bridge run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/32095965015/cancel" || true
          echo 'Cancellation requested for obsolete bridge upload run.'
