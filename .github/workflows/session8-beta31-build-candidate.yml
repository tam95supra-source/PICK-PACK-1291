name: Session8 Beta31 Build Candidate
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session8-beta31-build-candidate-trigger.txt]
permissions:
  contents: write
  actions: read
concurrency:
  group: session8-beta31-build-candidate
  cancel-in-progress: false
env:
  EXPECTED_VERSION_NAME: 0.4.2-beta.31
  EXPECTED_VERSION_CODE: '37'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  EXPECTED_FIREBASE_PROJECT_ID: pick-pack-1291-fcm-20260819
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0; fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, S35 contract-check and sign Beta31
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/session8-beta31-build-candidate-result.txt
          echo "checked_at=$(date -u +%FT%TZ)" > "$OUT"; echo "head_sha=$GITHUB_SHA" >> "$OUT"
          PHASE=CONFIG
          trap 'rc=$?; echo "failed_phase=$PHASE" >> "$OUT"; echo "failed_rc=$rc" >> "$OUT"; echo "--- diagnostic tail ---" >> "$OUT"; tail -n 160 /tmp/gradle.log >> "$OUT" 2>/dev/null || true; exit $rc' ERR
          for v in ANDROID_SIGNING_KEY_B64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD; do [[ -n "${!v:-}" ]]; done
          test -s app/google-services.json
          jq -e --arg p "$EXPECTED_PACKAGE" --arg project "$EXPECTED_FIREBASE_PROJECT_ID" '.project_info.project_id==$project and ([.client[]|select(.client_info.android_client_info.package_name==$p)]|length)==1' app/google-services.json >/dev/null
          FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' app/google-services.json); FIREBASE_GCM_SENDER_ID=$(jq -r '.project_info.project_number' app/google-services.json); FIREBASE_GOOGLE_APP_ID=$(jq -r --arg p "$EXPECTED_PACKAGE" '.client[]|select(.client_info.android_client_info.package_name==$p)|.client_info.mobilesdk_app_id' app/google-services.json); FIREBASE_API_KEY=$(jq -r --arg p "$EXPECTED_PACKAGE" '.client[]|select(.client_info.android_client_info.package_name==$p)|.api_key[0].current_key' app/google-services.json)
          grep -q 'versionCode = 37' app/build.gradle.kts; grep -q 'versionName = "0.4.2-beta.31"' app/build.gradle.kts
          grep -q 'apply_s35_owner_ui_history_consistency.py' app/build.gradle.kts
          grep -q 'apply_s35_owner_ui_history_consistency_wrapper.py' app/build.gradle.kts
          grep -q 'apply_s35_owner_ui_history_consistency_wrapper.py' tools/apply_s31b_preserve_admin_audit.py
          test -s app/src/main/res/drawable/ic_pp_pda_exchange.xml; test -s app/src/main/res/drawable/ic_pp_drop_receive.xml; test -s app/src/main/res/drawable/ic_pp_ccdc.xml
          echo config=PASS >> "$OUT"
          PHASE=BUILD
          gradle --no-daemon --build-cache :app:assembleBetaRelease -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" -PFIREBASE_GOOGLE_APP_ID="$FIREBASE_GOOGLE_APP_ID" -PFIREBASE_API_KEY="$FIREBASE_API_KEY" -PFIREBASE_GCM_SENDER_ID="$FIREBASE_GCM_SENDER_ID" >/tmp/gradle.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          ops=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt').read_text()
          store=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationalDataStore.kt').read_text()
          m2=Path('app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt').read_text()
          login=Path('app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt').read_text()
          for x in [
              'S35_OWNER_UI_HISTORY_CONSISTENCY','R.drawable.ic_pp_pda_exchange','R.drawable.ic_pp_drop_receive','R.drawable.ic_pp_ccdc',
              'Quét nhân sự','Đổi / trả PDA','Nhận hàng Rớt','Báo cáo nhân sự','Công nhật','Tài nguyên','Quản lý CCDC',
              'alpha=if(enabled)1f else .38f','maxLines=3','val pinned=column(bg)','Tìm mã, họ tên hoặc số điện thoại',
              'refreshHistoryCanonical()','M2BackgroundSync.catchUp(applicationContext)','joinToString(" – ")','localHistoryAll()'
          ]: assert x in ops, x
          for x in ['Nghiệp vụ vận hành','Chọn nghiệp vụ cần xử lý trên PDA.','Dòng thời gian trong đúng phiên.','Mật khẩu mới (tối thiểu 8 ký tự)','Mật khẩu ban đầu (>=8 ký tự)']:
              assert x not in ops, x
          assert 'businessCard(R.drawable.ic_pp_report,"Báo cáo nhân sự","Báo cáo nhân sự Site 1291",isAdmin())' in ops
          assert 'businessCard(R.drawable.ic_pp_task,"Công nhật","Bắt đầu / hoàn thành công nhật",isAdmin())' in ops
          assert 'businessCard(R.drawable.ic_pp_resource,"Tài nguyên","Quản lý PDA • User Pick • Bàn Pack • User Pack",isAdmin())' in ops
          assert 'private const val DB_VERSION = 3' in store and 'CREATE TABLE IF NOT EXISTS local_history' in store
          assert 'fun audit(action:String,payload:JSONObject)' in m2
          assert 'clean solid rounded login card' in login and 'elevation = 0f' in login
          PY
          APK_UNSIGNED=$(find app/build/outputs/apk/beta/release -maxdepth 1 -type f -name '*.apk'|head -1); [[ -n "$APK_UNSIGNED" && -s "$APK_UNSIGNED" ]]
          echo build=PASS >> "$OUT"; echo s35_owner_contract=PASS >> "$OUT"; echo history_local_canonical_contract=PASS >> "$OUT"; echo role_gate_contract=PASS >> "$OUT"; echo text_overflow_contract=PASS >> "$OUT"
          PHASE=SIGN
          printf '%s' "$ANDROID_SIGNING_KEY_B64"|base64 -d >/tmp/release.jks
          mapfile -t ALIASES < <(keytool -list -v -keystore /tmp/release.jks -storepass "$ANDROID_SIGNING_STORE_PASSWORD" 2>/dev/null|sed -n 's/^Alias name: //p'); [[ ${#ALIASES[@]} -eq 1 ]]
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"; [[ -x "$BUILD_TOOLS/zipalign" && -x "$BUILD_TOOLS/apksigner" && -x "$BUILD_TOOLS/aapt" ]]
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_UNSIGNED" /tmp/beta31-aligned.apk
          mkdir -p /tmp/beta31-release; APK=/tmp/beta31-release/pick-pack-1291-public-beta-0.4.2-beta.31.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/release.jks --ks-key-alias "${ALIASES[0]}" --ks-pass "pass:$ANDROID_SIGNING_STORE_PASSWORD" --key-pass "pass:$ANDROID_SIGNING_KEY_PASSWORD" --out "$APK" /tmp/beta31-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" >/tmp/apksigner.txt
          SIGNER=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt|head -1|tr '[:upper:]' '[:lower:]'); [[ "$SIGNER" == "$EXPECTED_SIGNER_SHA256" ]]
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK"|head -1); [[ "$BADGING" == *"name='$EXPECTED_PACKAGE'"* && "$BADGING" == *"versionCode='$EXPECTED_VERSION_CODE'"* && "$BADGING" == *"versionName='$EXPECTED_VERSION_NAME'"* ]]
          SHA=$(sha256sum "$APK"|awk '{print $1}'); SIZE=$(stat -c%s "$APK"); printf '%s  %s\n' "$SHA" 'pick-pack-1291-public-beta-0.4.2-beta.31.apk' >/tmp/beta31-release/SHA256SUMS-beta31.txt
          echo sign=PASS >> "$OUT"; echo "apk_size=$SIZE" >> "$OUT"; echo "apk_sha256=$SHA" >> "$OUT"; echo "signer_sha256=$SIGNER" >> "$OUT"
      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: beta31-release-candidate
          path: /tmp/beta31-release/
          retention-days: 14
          if-no-files-found: error
      - name: Record artifact id
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" >/tmp/artifacts.json; ID=$(jq -r '.artifacts[]|select(.name=="beta31-release-candidate")|.id' /tmp/artifacts.json|head -1); [[ -n "$ID" && "$ID" != null ]]&&break; sleep 2; done
          [[ -n "$ID" && "$ID" != null ]]; echo "artifact_id=$ID" >> /tmp/session8-beta31-build-candidate-result.txt; echo "artifact_name=beta31-release-candidate" >> /tmp/session8-beta31-build-candidate-result.txt; echo verdict=PASS >> /tmp/session8-beta31-build-candidate-result.txt
      - name: Record sanitized result
        if: always()
        shell: bash
        run: |
          test -f /tmp/session8-beta31-build-candidate-result.txt || echo result_missing=true >/tmp/session8-beta31-build-candidate-result.txt
          cp /tmp/session8-beta31-build-candidate-result.txt /tmp/result.copy
          git reset --hard HEAD >/dev/null; git pull --rebase origin agent/service-migration-m2 || true
          cp /tmp/result.copy ops/session8-beta31-build-candidate-result.txt
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session8-beta31-build-candidate-result.txt; git diff --cached --quiet && exit 0; git commit -m 'ops: record Beta31 signed release candidate'; git push origin HEAD:agent/service-migration-m2
