name: S09 Status Once
on:
  push:
    branches: [ main ]
    paths: ['ops/s09-status-trigger.txt']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Record S09 result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow s09-apply-ui-catalog.yml --limit 3 --json databaseId,status,conclusion,headSha,displayTitle > ops/s09-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/s09-status.json
          git commit -m 'ops: record one-shot S09 status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
