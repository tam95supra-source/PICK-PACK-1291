name: Beta51 Service Resource Logic V2

on:
  push:
    branches: [agent/service-migration-m2]
    paths: ['.github/workflows/beta51-service-resource-fix-v2.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Patch canonical service source
        id: patch
        shell: bash
        run: |
          set +e
          python3 tools/apply_beta51_service_resource_logic.py > /tmp/beta51-patch.log 2>&1
          code=$?
          cat /tmp/beta51-patch.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Install and typecheck
        id: typecheck
        working-directory: service
        shell: bash
        run: |
          set +e
          npm ci > /tmp/beta51-type.log 2>&1 && npm run check >> /tmp/beta51-type.log 2>&1
          code=$?
          tail -n 120 /tmp/beta51-type.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Contract gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'user_picks_reissue' service/src/mobile_hotfix.ts
          grep -q 'pack_tables_reissue' service/src/mobile_hotfix.ts
          grep -q 'ensureDailyUserReuseAllowed' service/src/core.ts
          grep -q 'INSERT OR IGNORE INTO resource_daily_consumption' service/src/core.ts
          grep -q 'duplicate_user:duplicateUser' service/src/session_hotfix.ts
          ! grep -q 'user_pack=?2 AND shift=?3' service/src/session_hotfix.ts
      - name: Commit canonical source and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_beta51_service_resource_logic.py .github/workflows/beta51-service-resource-fix.yml .github/workflows/beta51-service-resource-fix-v2.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(beta51): explicit user reissue and cross-shift pack mapping'
          git push origin HEAD:agent/service-migration-m2
      - name: Diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          msg="BETA51_SERVICE_RESOURCE_FIX_V2 run=${GITHUB_RUN_ID} status=${{ job.status }} patch_code=${{ steps.patch.outputs.code }} typecheck_code=${{ steps.typecheck.outputs.code }}"
          if [ -f /tmp/beta51-patch.log ]; then msg="$msg patch_tail=$(tail -n 8 /tmp/beta51-patch.log | tr '\n' ' ' | cut -c1-800)"; fi
          if [ -f /tmp/beta51-type.log ]; then msg="$msg type_tail=$(tail -n 12 /tmp/beta51-type.log | tr '\n' ' ' | cut -c1-1200)"; fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="$msg"
