name: S09 Apply UI Catalog Fixes

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s09-trigger.txt'

permissions:
  contents: write

concurrency:
  group: s09-ui-catalog-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply S09 patch
        run: |
          set -euo pipefail
          python3 ops/s09_fix_ui_catalog.py
          grep -q 'versionName = "0.4.2-beta.9"' app/build.gradle.kts
          grep -q 'catalog_fields:catalogFields' google-apps-script/PICK_PACK_API.gs
          grep -q 'private fun headerStatusChip' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'DANH SÁCH NHÂN SỰ_Vị trí chính' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'Mạng: Đang nối' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Validate GAS syntax
        run: |
          set -euo pipefail
          cp google-apps-script/PICK_PACK_API.gs /tmp/PICK_PACK_API.js
          node --check /tmp/PICK_PACK_API.js

      - name: Resolve Android SDK
        run: |
          set -euo pipefail
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [[ -n "${d:-}" && -d "$d/platforms/android-36" && -d "$d/build-tools/36.0.0" ]]; then
              echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$d" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o "$ZIP"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Compile Beta and Stable debug
        env:
          GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --parallel --build-cache assembleBetaDebug assembleStableDebug

      - name: Commit verified source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt app/src/main/res/drawable/ic_pp_business.xml app/src/main/res/drawable/ic_pp_network.xml app/src/main/res/drawable/ic_pp_service.xml app/src/main/res/drawable/ic_pp_edit.xml app/src/main/res/drawable/ic_pp_delete.xml app/src/main/res/drawable/ic_pp_add.xml google-apps-script/PICK_PACK_API.gs docs/UI_UX_SYSTEM.md
          git commit -m 'ui: align beta9 with approved layout and catalog schema'
          git pull --rebase origin main
          git push origin HEAD:main
