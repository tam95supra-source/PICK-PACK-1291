name: Publish Beta 0.4.2-beta.2 OTA Bridge

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-beta-v042-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_URL: https://drive.usercontent.google.com/download?id=1S-dVGl5k1ePbQASIw8traRI9DJS7ZnnS&export=download&confirm=t
      EXPECTED_SHA: 2c413b036ed9b3a938a668cde149bf10162f0a09977382c3e2ac7fbfb7653e68
      APK_NAME: pick-pack-1291-public-beta-v0.4.2-beta.2.apk
      TAG: v0.4.2-beta.2-publicbeta
    steps:
      - name: Download signed APK from official Beta Drive folder
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o "$APK_NAME"
          ACTUAL=$(sha256sum "$APK_NAME" | awk '{print $1}')
          [[ "$ACTUAL" == "$EXPECTED_SHA" ]]
          printf '%s  %s\n' "$ACTUAL" "$APK_NAME" > SHA256SUMS.txt
          echo 'Signed Drive APK SHA-256: PASS'

      - name: Publish legacy-to-Drive OTA bridge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='OTA bridge release for existing Beta clients that still check GitHub Releases. Install/update to 0.4.2-beta.2 once; from this build onward, Beta update discovery is served by Google Apps Script from BẢN THỬ NGHIỆM and Stable uses BẢN ỔN ĐỊNH. Downloaded APKs are SHA-256 verified before installer launch.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --prerelease --title 'Pick Pack 1291 Full Public Beta 0.4.2-beta.2' --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" SHA256SUMS.txt \
              --prerelease \
              --title 'Pick Pack 1291 Full Public Beta 0.4.2-beta.2' \
              --notes "$NOTES"
          fi
          echo 'GitHub legacy OTA bridge prerelease: PASS'
