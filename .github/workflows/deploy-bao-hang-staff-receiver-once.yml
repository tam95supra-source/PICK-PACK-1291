name: Deploy Bao Hang staff receiver once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-bao-hang-staff-receiver-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      BH_SCRIPT_ID: 12zMDmEl7EXcHOV7skWy8XY95Uk3k3zwSlv2A_aokbRWkyUoc-ArOxu55
      BH_DEPLOYMENT_ID: AKfycbwb8Hcdg7tp0jqHLZU6kW5hkEclDC9d29DGvPuwcxvZbR9t9xnrWzaIYe8UZET-D_yI
      BH_WEB_URL: https://script.google.com/macros/s/AKfycbwb8Hcdg7tp0jqHLZU6kW5hkEclDC9d29DGvPuwcxvZbR9t9xnrWzaIYe8UZET-D_yI/exec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exchange Google OAuth
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify exact Bao Hang script and deployment
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$BH_SCRIPT_ID/content" > /tmp/live.json
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$BH_SCRIPT_ID/deployments/$BH_DEPLOYMENT_ID" > /tmp/deployment.json
          python3 - <<'PY'
          import json,os
          live=json.load(open('/tmp/live.json')); dep=json.load(open('/tmp/deployment.json'))
          assert dep.get('deploymentConfig',{}).get('scriptId')==os.environ['BH_SCRIPT_ID'],'DEPLOYMENT_SCRIPT_ID_MISMATCH'
          src=[f for f in live.get('files',[]) if f.get('type')=='SERVER_JS']
          matches=[f for f in src if "const BH_PROJECT = 'bao-hang-1291';" in f.get('source','') and 'function doPost(e)' in f.get('source','')]
          assert len(matches)==1,'BAO_HANG_SOURCE_SIGNATURE_MISMATCH:'+str(len(matches))
          assert 'tiny-boat-19315489' in matches[0].get('source',''),'NEON_SCOPE_MISMATCH'
          print('SCRIPT_AND_DEPLOYMENT_IDENTITY=PASS')
          PY

      - name: Patch receiver only and syntax check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/tam95supra-source/bao-hang-1291/main/google-apps-script/STAFF_SOURCE_BRIDGE_RECEIVER.gs -o /tmp/receiver.gs
          python3 - <<'PY'
          import json,pathlib
          live=json.load(open('/tmp/live.json')); receiver=pathlib.Path('/tmp/receiver.gs').read_text()
          files=live.get('files',[]); main=[]; old_receiver=[]
          for f in files:
              src=f.get('source','')
              if f.get('type')=='SERVER_JS' and "const BH_PROJECT = 'bao-hang-1291';" in src and 'function doPost(e)' in src: main.append(f)
              if f.get('type')=='SERVER_JS' and 'function staffSourceBridgeReceive_' in src: old_receiver.append(f)
          assert len(main)==1
          route="if (action === 'staff-source-ping' || action === 'staff-source-structure-ping') return json_(staffSourceBridgeReceive_(body));"
          if route not in main[0]['source']:
              needle="if (action === 'ping') return json_({ok:true,project:BH_PROJECT,provider:'NEON_FIREBASE_GOOGLE',staff_sheet_id:BH_STAFF_SHEET_ID,staff_sheet_name:BH_STAFF_SHEET_NAME});"
              assert needle in main[0]['source'],'PING_ROUTE_ANCHOR_NOT_FOUND'
              main[0]['source']=main[0]['source'].replace(needle,needle+'\n    '+route,1)
          out=[]; added=False
          for f in files:
              if f in old_receiver:
                  if not added:
                      g=dict(f); g['name']='STAFF_SOURCE_BRIDGE_RECEIVER'; g['source']=receiver; out.append(g); added=True
                  continue
              out.append(f)
          if not added: out.append({'name':'STAFF_SOURCE_BRIDGE_RECEIVER','type':'SERVER_JS','source':receiver})
          pathlib.Path('/tmp/patched.json').write_text(json.dumps({'files':out},ensure_ascii=False))
          for i,f in enumerate(out):
              if f.get('type')=='SERVER_JS': pathlib.Path('/tmp/check_'+str(i)+'.js').write_text(f.get('source',''))
          PY
          for f in /tmp/check_*.js; do node --check "$f" >/dev/null; done
          echo 'PATCH_SYNTAX=PASS'

      - name: Update Bao Hang project and existing deployment
        id: deploy
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          H=$(curl -sS -o /tmp/update.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patched.json "https://script.googleapis.com/v1/projects/$BH_SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { cat /tmp/update.out; exit 1; }
          H=$(curl -sS -o /tmp/version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Bao Hang source-driven staff receiver"}' "https://script.googleapis.com/v1/projects/$BH_SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { cat /tmp/version.json; exit 1; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/version.json"))["versionNumber"])')
          python3 - "$BH_SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Bao Hang 1291 live worker'}}))
          PY
          H=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$BH_SCRIPT_ID/deployments/$BH_DEPLOYMENT_ID")
          [[ "$H" == 200 ]] || { cat /tmp/deploy.out; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify live endpoint and save sanitized proof
        shell: bash
        env:
          GAS_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 15); do
            curl -fsSL -H 'content-type: application/json' "$BH_WEB_URL" -d '{"action":"ping"}' > /tmp/ping.json || true
            if jq -e '.ok==true and .project=="bao-hang-1291" and .provider=="NEON_FIREBASE_GOOGLE"' /tmp/ping.json >/dev/null 2>&1; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/ping.json; exit 1; }
          curl -fsSL -H 'content-type: application/json' "$BH_WEB_URL" -d '{"action":"staff-source-ping","event_id":"unauth-probe-20260820","source_id":"1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78","source_tab":"DANH SÁCH NHÂN SỰ","row_start":2,"row_end":2}' > /tmp/probe.json
          jq -e '.ok==false and .error=="STAFF_BRIDGE_OAUTH_REQUIRED"' /tmp/probe.json >/dev/null
          python3 - <<'PY'
          import datetime,hashlib,json,os
          sid=os.environ['BH_SCRIPT_ID']
          p={'status':'PASS','mode':'SOURCE_DRIVEN_DELTA_V1','deployment_match':True,'receiver_route_probe':'STAFF_BRIDGE_OAUTH_REQUIRED','gas_version':int(os.environ['GAS_VERSION']),'script_id_sha256':hashlib.sha256(sid.encode()).hexdigest(),'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('ops/bao-hang-receiver-deploy-proof.json','w').write(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bao-hang-receiver-deploy-proof.json
          git commit -m 'chore(gas): record Bao Hang receiver deployment proof'
          git pull --rebase origin main
          git push origin HEAD:main
