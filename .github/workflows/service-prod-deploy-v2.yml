name: Beta48 Signed Candidate Carrier

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/service-prod-deploy-v2-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta48-signed-candidate-carrier
  cancel-in-progress: false

jobs:
  beta48-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      BETA_NAME: 0.4.2-beta.48
      BETA_CODE: '54'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Lock Beta48 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('app/build.gradle.kts').read_text()
          b=re.search(r'create\("beta"\)\s*\{(.*?)\n\s*\}',t,re.S).group(1)
          s=re.search(r'create\("stable"\)\s*\{(.*?)\n\s*\}',t,re.S).group(1)
          one=lambda x,p:re.search(p,x).group(1)
          assert one(b,r'versionName\s*=\s*"([^"]+)"')=='0.4.2-beta.48'
          assert one(b,r'versionCode\s*=\s*(\d+)')=='54'
          assert one(s,r'versionName\s*=\s*"([^"]+)"')=='0.1.0-stable'
          assert one(s,r'versionCode\s*=\s*(\d+)')=='1'
          PY
          python3 -m py_compile tools/apply_s54_beta48_owner_10_fixes.py tools/apply_m2_android_transport_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Beta and Stable validation APKs
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease

      - name: Verify owner contracts and package identity
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          TR=app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          ST=app/src/main/java/vn/pickpack1291/app/beta/OperationalDataStore.kt
          grep -q 'S54_BETA48_OWNER_10_FIXES' "$OPS"
          grep -q 'Không dùng User hy1.outbound' "$OPS"
          ! grep -q 'Không dùng User Pick' "$OPS"
          ! grep -q 'Quản trị cao nhất có thể chọn nhiều lịch sử' "$OPS"
          grep -q 'SERI PDA ĐÃ CHỌN' "$OPS"
          grep -q 'Dung lượng cache' "$OPS"
          grep -q 'Tên thiết bị' "$OPS"
          grep -q 'LocalLogManager.summary' "$OPS"
          grep -q 'historyWindowDates' "$OPS"
          ! grep -q 'optString("shift")!=selectedShift' "$OPS"
          ! grep -q 'optString("shift")!=s.optString("shift")' "$OPS"
          grep -q '/v1/service/connections' "$TR"
          grep -q 'BUSINESS_DATE_OUTSIDE_PDA_7_DAY_WINDOW' "$ST"
          grep -q 'fun historyWindowDates' "$ST"
          grep -q 'fun storageBytes' "$ST"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$BT/aapt" dump badging "$BETA" | tee /tmp/beta-badging.txt
          "$BT/aapt" dump badging "$STABLE" | tee /tmp/stable-badging.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta-badging.txt
          grep -q "versionCode='54'" /tmp/beta-badging.txt
          grep -q "versionName='0.4.2-beta.48'" /tmp/beta-badging.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable-badging.txt
          grep -q "versionCode='1'" /tmp/stable-badging.txt
          grep -q "versionName='0.1.0-stable'" /tmp/stable-badging.txt

      - name: Sign Beta48 and verify locked signer
        id: sign
        shell: bash
        run: |
          set -euxo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta
          OUT="dist/beta/pick-pack-1291-public-beta-0.4.2-beta.48.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          sha=$(sha256sum "$OUT" | awk '{print $1}'); size=$(stat -c '%s' "$OUT"); file=$(basename "$OUT")
          printf '%s  %s\n' "$sha" "$file" > dist/beta/SHA256SUMS-0.4.2-beta.48.txt
          "$BT/aapt" dump badging "$OUT" > dist/beta/APK_BADGING-0.4.2-beta.48.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "size=$size" >> "$GITHUB_OUTPUT"; echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload exact signed Beta48 candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-0.4.2-beta.48-signed
          path: dist/beta/*
          retention-days: 14

      - name: Persist exact candidate receipt
        shell: bash
        env:
          APK_SHA: ${{ steps.sign.outputs.sha }}
          APK_SIZE: ${{ steps.sign.outputs.size }}
          APK_FILE: ${{ steps.sign.outputs.file }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p ops
          cat > ops/beta-release-candidate-result.txt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          beta_name=0.4.2-beta.48
          beta_code=54
          stable_name=0.1.0-stable
          stable_code=1
          build=success
          package=success
          sign=success
          artifact_id=$ARTIFACT_ID
          apk_file=$APK_FILE
          apk_sha256=$APK_SHA
          apk_size=$APK_SIZE
          signer_sha256=$EXPECTED_SIGNER_SHA256
          stable_publish=FORBIDDEN
          verdict=PASS
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta-release-candidate-result.txt
          git commit -m 'ops: record Beta48 exact signed candidate'
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
