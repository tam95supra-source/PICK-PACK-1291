name: Beta48 Signed Candidate Observable

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/service-prod-deploy-v2-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-prod-deploy-v2
  cancel-in-progress: false

jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          printf 'source_sha=%s\nrun_id=%s\nstatus=RUNNING\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > ops/beta48-candidate-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta48-candidate-run.txt
          git commit -m 'ops: observe Beta48 candidate run' || true
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2

  beta48-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Lock Beta48 metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          t=Path('app/build.gradle.kts').read_text()
          b=re.search(r'create\("beta"\)\s*\{(.*?)\n\s*\}',t,re.S).group(1)
          s=re.search(r'create\("stable"\)\s*\{(.*?)\n\s*\}',t,re.S).group(1)
          one=lambda x,p:re.search(p,x).group(1)
          bn=one(b,r'versionName\s*=\s*"([^"]+)"');bc=one(b,r'versionCode\s*=\s*(\d+)')
          sn=one(s,r'versionName\s*=\s*"([^"]+)"');sc=one(s,r'versionCode\s*=\s*(\d+)')
          assert (bn,bc)==('0.4.2-beta.48','54'),(bn,bc)
          assert (sn,sc)==('0.1.0-stable','1'),(sn,sc)
          print('beta_name='+bn);print('beta_code='+bc)
          PY
          python3 -m py_compile tools/apply_s54_beta48_owner_10_fixes.py tools/apply_s54b_beta48_settings_log_fix.py tools/apply_m2_android_transport_patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Resolve Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Materialize Beta48 chain including S54B
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:generateS10Operations
          python3 tools/apply_s54b_beta48_settings_log_fix.py
          grep -q 'S54B_BETA48_SETTINGS_LOG_FIX' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'LocalLogManager.summary(this)' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'body.addView(section("Thiết bị"))' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
      - name: Build Beta and Stable validation APKs
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel -x :app:generateS10Operations :app:assembleBetaRelease :app:assembleStableRelease
      - name: Verify named Beta48 contracts and package identity
        id: package
        shell: bash
        env:
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
          BETA_CODE: ${{ steps.meta.outputs.beta_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={
            'OPS':Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt').read_text(),
            'TR':Path('app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt').read_text(),
            'ST':Path('app/src/main/java/vn/pickpack1291/app/beta/OperationalDataStore.kt').read_text(),
            'LG':Path('app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt').read_text(),
          }
          required={
            's54_materialized':('OPS','S54_BETA48_OWNER_10_FIXES'),
            's54b_materialized':('OPS','S54B_BETA48_SETTINGS_LOG_FIX'),
            'pick_label':('OPS','Không dùng User hy1.outbound'),
            'selected_pda_panel':('OPS','SERI PDA ĐÃ CHỌN'),
            'cache_size_ui':('OPS','Dung lượng cache'),
            'device_name_app':('OPS','Tên thiết bị'),
            'log_summary_ui':('OPS','LocalLogManager.summary(this)'),
            'history_rolling_ui':('OPS','historyWindowDates'),
            'connections_route':('TR','/v1/service/connections'),
            'date_recovery':('ST','BUSINESS_DATE_OUTSIDE_PDA_7_DAY_WINDOW'),
            'history_window_store':('ST','fun historyWindowDates'),
            'storage_bytes_store':('ST','fun storageBytes'),
            'log_summary_store':('LG','fun summary'),
          }
          forbidden={
            'legacy_pick_label':('OPS','Không dùng User Pick'),
            'owner_explainer':('OPS','Quản trị cao nhất có thể chọn nhiều lịch sử'),
            'pack_shift_filter_1':('OPS','optString("shift")!=selectedShift'),
            'pack_shift_filter_2':('OPS','optString("shift")!=s.optString("shift")'),
            'settings_device_duplicate':('OPS','body.addView(section("Thiết bị"))'),
          }
          bad=[]
          for name,(f,v) in required.items():
            ok=v in files[f]; print(f'CONTRACT {name}={"PASS" if ok else "FAIL"}')
            if not ok: bad.append(name)
          for name,(f,v) in forbidden.items():
            ok=v not in files[f]; print(f'CONTRACT {name}={"PASS" if ok else "FAIL"}')
            if not ok: bad.append(name)
          if bad: raise SystemExit('CONTRACT_FAIL:'+','.join(bad))
          PY
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$BT/aapt" dump badging "$BETA" > /tmp/beta.txt
          "$BT/aapt" dump badging "$STABLE" > /tmp/stable.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='$BETA_CODE'" /tmp/beta.txt
          grep -q "versionName='$BETA_NAME'" /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.txt
          grep -q "versionCode='1'" /tmp/stable.txt
          grep -q "versionName='0.1.0-stable'" /tmp/stable.txt
      - name: Sign Beta48 and verify locked signer
        id: sign
        shell: bash
        env:
          BETA_NAME: ${{ steps.meta.outputs.beta_name }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta
          OUT="dist/beta/pick-pack-1291-public-beta-${BETA_NAME}.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          sha=$(sha256sum "$OUT"|awk '{print $1}'); size=$(stat -c '%s' "$OUT"); file=$(basename "$OUT")
          printf '%s  %s\n' "$sha" "$file" > "dist/beta/SHA256SUMS-${BETA_NAME}.txt"
          "$BT/aapt" dump badging "$OUT" > "dist/beta/APK_BADGING-${BETA_NAME}.txt"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "size=$size" >> "$GITHUB_OUTPUT"; echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload exact signed Beta48 candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-0.4.2-beta.48-signed
          path: dist/beta/*
          retention-days: 14
      - name: Persist candidate receipt
        if: always()
        shell: bash
        env:
          META: ${{ steps.meta.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          MATERIALIZE: ${{ steps.materialize.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SIGN: ${{ steps.sign.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          APK_SHA: ${{ steps.sign.outputs.sha }}
          APK_SIZE: ${{ steps.sign.outputs.size }}
          APK_FILE: ${{ steps.sign.outputs.file }}
        run: |
          set -euo pipefail
          verdict=FAIL
          [[ "$META" == success && "$SDK" == success && "$MATERIALIZE" == success && "$BUILD" == success && "$PACKAGE" == success && "$SIGN" == success && "$UPLOAD" == success && -n "${ARTIFACT_ID:-}" ]] && verdict=PASS
          git reset --hard "$GITHUB_SHA"
          mkdir -p ops
          cat > ops/beta-release-candidate-result.txt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          beta_name=0.4.2-beta.48
          beta_code=54
          stable_name=0.1.0-stable
          stable_code=1
          metadata=$META
          sdk=$SDK
          materialize=$MATERIALIZE
          build=$BUILD
          package=$PACKAGE
          sign=$SIGN
          upload=$UPLOAD
          artifact_id=${ARTIFACT_ID:-}
          apk_file=${APK_FILE:-}
          apk_sha256=${APK_SHA:-}
          apk_size=${APK_SIZE:-}
          signer_sha256=$EXPECTED_SIGNER_SHA256
          stable_publish=FORBIDDEN
          verdict=$verdict
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta-release-candidate-result.txt
          git commit -m "ops: record Beta48 candidate $verdict" || true
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2
          [[ "$verdict" == PASS ]]
      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
