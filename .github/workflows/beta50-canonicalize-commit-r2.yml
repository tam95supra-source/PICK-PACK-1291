name: Beta50 One-Time Canonical Commit R2

on:
  push:
    branches:
      - stabilization/beta48-golden-reset-beta50-20260822
    paths:
      - '.github/workflows/beta50-canonicalize-commit-r2.yml'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  canonical-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_MIGRATION_RUN start run=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Restore compile-proven Beta48 canonical source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical && mkdir -p /tmp/canonical
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/9474013298/zip" > /tmp/canonical.zip
          unzip -q /tmp/canonical.zip -d /tmp/canonical
          test -s /tmp/canonical/app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          cp -a /tmp/canonical/app/src/main/java/vn/pickpack1291/app/beta/. app/src/main/java/vn/pickpack1291/app/beta/
      - name: Apply OWNER five requests and remove build-time mutation
        run: python3 tools/beta50_migrate_once.py
      - name: Compile canonical Beta50 source
        run: gradle --no-daemon :app:compileBetaReleaseKotlin
      - name: Commit final canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app
          git rm tools/beta50_migrate_once.py .github/workflows/beta50-canonicalize-commit-r2.yml
          git commit -m 'refactor(beta50): canonicalize Beta48 source and apply OWNER five requests'
          git pull --rebase origin stabilization/beta48-golden-reset-beta50-20260822
          git push origin HEAD:stabilization/beta48-golden-reset-beta50-20260822
      - name: Report migration
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/52/comments" -f body="BETA50_MIGRATION_RUN finish run=${GITHUB_RUN_ID} source=${GITHUB_SHA} job=${{ job.status }}"
