name: Service M2 Beta20 Postpublish Verify

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-beta20-postpublish-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-beta20-ota:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
      EXPECTED_VERSION: 0.4.2-beta.20
      EXPECTED_CODE: '26'
      EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
      EXPECTED_SHA256: ed5b98afeaf962b1081faaab4c710afa00f2fc80981b76666a86d8bee856502e
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      EXPECTED_GENERATION: m2-prod-20260819-001
    steps:
      - name: Verify OTA metadata offered to Beta19
        shell: bash
        run: |
          set -euo pipefail
          OK=false
          for i in $(seq 1 20); do
            curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
              -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.19"}' >/tmp/beta.json
            cat /tmp/beta.json
            if [[ "$(jq -r '.ok // false' /tmp/beta.json)" == true ]] && \
               [[ "$(jq -r '.available // false' /tmp/beta.json)" == true ]] && \
               [[ "$(jq -r '.version_name // empty' /tmp/beta.json)" == "$EXPECTED_VERSION" ]] && \
               [[ "$(jq -r '.sha256 // empty' /tmp/beta.json)" == "$EXPECTED_SHA256" ]] && \
               [[ -n "$(jq -r '.apk_url // empty' /tmp/beta.json)" ]]; then OK=true; break; fi
            sleep 2
          done
          [[ "$OK" == true ]]
          jq -r '.apk_url' /tmp/beta.json > /tmp/apk-url.txt

      - name: Download OTA bytes and verify SHA package version and signer
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/apk-url.txt)
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$URL" -o /tmp/beta20-ota.apk
          echo "$EXPECTED_SHA256  /tmp/beta20-ota.apk" | sha256sum -c -
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/beta20-ota.apk >/tmp/badging.txt
          cat /tmp/badging.txt | head -n 3
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badging.txt
          grep -q "versionCode='$EXPECTED_CODE'" /tmp/badging.txt
          grep -q "versionName='$EXPECTED_VERSION'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/beta20-ota.apk >/tmp/signer.txt
          cat /tmp/signer.txt
          SIGNER=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/signer.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          [[ "$SIGNER" == "$EXPECTED_SIGNER_SHA256" ]]

      - name: Verify Beta20 self-check and Stable isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.20"}' >/tmp/self.json
          cat /tmp/self.json
          [[ "$(jq -r '.ok' /tmp/self.json)" == true ]]
          [[ "$(jq -r '.available' /tmp/self.json)" == false ]]
          [[ "$(jq -r '.version_name' /tmp/self.json)" == "$EXPECTED_VERSION" ]]
          curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"update_check","channel":"STABLE","current_version":"0.4.2-stable.0"}' >/tmp/stable.json
          cat /tmp/stable.json
          [[ "$(jq -r '.ok' /tmp/stable.json)" == true ]]
          [[ "$(jq -r '.available' /tmp/stable.json)" == false ]]

      - name: Verify Service and discovery unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 "$SERVICE_URL/health" >/tmp/health.json
          cat /tmp/health.json
          [[ "$(jq -r '.ok' /tmp/health.json)" == true ]]
          [[ "$(jq -r '.generation' /tmp/health.json)" == "$EXPECTED_GENERATION" ]]
          [[ "$(jq -r '.authority.mode' /tmp/health.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/health.json)" == 4 ]]
          [[ "$(jq -r '.replication.state' /tmp/health.json)" == HEALTHY ]]
          [[ "$(jq -r '.replication.pending_count' /tmp/health.json)" == 0 ]]
          curl -fsSL --retry 4 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}' >/tmp/discovery.json
          cat /tmp/discovery.json
          [[ "$(jq -r '.authority_mode' /tmp/discovery.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/discovery.json)" == 4 ]]
          [[ "$(jq -r '.service_url' /tmp/discovery.json)" == "$SERVICE_URL" ]]
          echo 'BETA20_OTA_POSTPUBLISH=PASS'
