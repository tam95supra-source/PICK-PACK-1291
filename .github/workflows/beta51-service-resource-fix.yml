name: Beta51 Service Resource Logic

on:
  push:
    branches: [agent/service-migration-m2]
    paths: ['.github/workflows/beta51-service-resource-fix.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: beta51-service-resource-fix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Patch canonical service source
        run: python3 tools/apply_beta51_service_resource_logic.py
      - name: Install and typecheck
        working-directory: service
        run: |
          npm ci
          npm run check
      - name: Contract gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'user_picks_reissue' service/src/mobile_hotfix.ts
          grep -q 'pack_tables_reissue' service/src/mobile_hotfix.ts
          grep -q 'ensureDailyUserReuseAllowed' service/src/core.ts
          grep -q 'INSERT OR IGNORE INTO resource_daily_consumption' service/src/core.ts
          grep -q 'duplicate_user:duplicateUser' service/src/session_hotfix.ts
          ! grep -q 'user_pack=?2 AND shift=?3' service/src/session_hotfix.ts
          grep -q 'pack_table=?1 AND user_pack=?2 AND available=1' service/src/core.ts
          grep -q 'pack_table=?1 AND user_pack=?2 AND available=1' service/src/session_hotfix.ts
      - name: Commit canonical source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_beta51_service_resource_logic.py .github/workflows/beta51-service-resource-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(beta51): explicit user reissue and cross-shift pack mapping'
          git push origin HEAD:agent/service-migration-m2
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="BETA51_SERVICE_RESOURCE_FIX run=${GITHUB_RUN_ID} status=${{ job.status }} trigger=${GITHUB_SHA}"
