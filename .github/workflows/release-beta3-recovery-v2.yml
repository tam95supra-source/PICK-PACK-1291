name: Release Beta3 From Recovery V2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-beta3-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      SIGNING_BACKUP_FILE_ID: 1LbUVBdmMxv-fga7YP_b0ThAHCxfGHgS2
      SIGNING_PRIVATE_PEM_FILE_ID: 1-EWWSj4jIbHTY95IJfuWOAuWbSwr2F77
      BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
      TOOLKIT_ARTIFACT_ID: 9292075341
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      APK_NAME: pick-pack-1291-public-beta-v0.4.2-beta.3.apk
    steps:
      - uses: actions/checkout@v4

      - name: OAuth and isolated bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          [[ -n "$SCRIPT_ID" && -n "$TOKEN" ]]; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$TOKEN"
          NONCE=$(python3 -c 'import secrets;print(secrets.token_urlsafe(40))'); export NONCE; echo "::add-mask::$NONCE"
          export SCRIPT_ID TOKEN
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')):files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/original-content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          src=(b/'PICK_PACK_API.gs').read_text(); needle="    if (action === 'login') return ppJson_(ppLogin_(body));"; assert needle in src
          n=os.environ['NONCE']; backup=os.environ['SIGNING_BACKUP_FILE_ID']; pem=os.environ['SIGNING_PRIVATE_PEM_FILE_ID']; folder=os.environ['BETA_FOLDER_ID']
          x=f'''\n    if (action === '__ci_signing_probe' && String(body._ci_nonce||'') === '{n}') {{ const a=DriveApp.getFileById('{backup}'), p=DriveApp.getFileById('{pem}'); const t=p.getBlob().getDataAsString(); return ppJson_({{ok:true,backup_size:a.getSize(),pem_ok:t.indexOf('BEGIN PRIVATE KEY')>=0,pem_len:t.length}}); }}\n    if (action === '__ci_signing_material' && String(body._ci_nonce||'') === '{n}') {{ const z=DriveApp.getFileById('{backup}').getBlob().getBytes(), t=DriveApp.getFileById('{pem}').getBlob().getDataAsString(); if(t.indexOf('BEGIN PRIVATE KEY')<0)return ppJson_({{ok:false,error:'PEM_INVALID'}}); return ppJson_({{ok:true,backup_b64:Utilities.base64Encode(z),private_pem:t}}); }}\n    if (action === '__ci_beta_upload' && String(body._ci_nonce||'') === '{n}') {{ const name=String(body.name||''),want=String(body.sha256||'').toLowerCase(),raw=Utilities.base64Decode(String(body.data_b64||'')); if(name!=='pick-pack-1291-public-beta-v0.4.2-beta.3.apk')return ppJson_({{ok:false,error:'NAME_REJECTED'}}); const got=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,raw).map(function(b){{return ('0'+((b+256)%256).toString(16)).slice(-2);}}).join(''); if(got!==want)return ppJson_({{ok:false,error:'SHA_MISMATCH'}}); const fldr=DriveApp.getFolderById('{folder}'), old=fldr.getFilesByName(name); while(old.hasNext())old.next().setTrashed(true); const f=fldr.createFile(Utilities.newBlob(raw,'application/vnd.android.package-archive',name)); f.setDescription('Beta 0.4.2-beta.3 | exact owner icon | persistent single-device session | SHA-256 '+got); return ppJson_({{ok:true,file_id:f.getId(),sha256:got,size:f.getSize()}}); }}'''
          temp=src.replace(needle,needle+x,1); out=[dict(q,source=temp) if q['name']=='PICK_PACK_API' else q for q in files]
          Path('/tmp/temp-content.json').write_text(json.dumps({'files':out},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/temp-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"temporary beta3 recovery v2"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" > /tmp/v.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/v.json"))["versionNumber"])')
          python3 - "$V" <<'PY'
          import json,sys
          open('/tmp/d.json','w').write(json.dumps({'versionNumber':int(sys.argv[1]),'manifestFileName':'appsscript','description':'temporary beta3 recovery v2'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/d.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > /tmp/dep.json
          DEP=$(python3 -c 'import json;print(json.load(open("/tmp/dep.json"))["deploymentId"])'); echo "::add-mask::$DEP"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEP" > /tmp/get.json
          URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/get.json')); w=[e['webApp']['url'] for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert w; print(w[0])
          PY
          ); echo "::add-mask::$URL"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"; echo "token=$TOKEN" >> "$GITHUB_OUTPUT"; echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"; echo "deployment=$DEP" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for bridge and recover signing bundle
        id: signing
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          NONCE: ${{ steps.bridge.outputs.nonce }}
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p /tmp/secret /tmp/recovery /tmp/signing
          OK=false
          for i in $(seq 1 30); do
            curl -fsSL -H 'content-type: application/json' "$BRIDGE_URL" -d "{\"action\":\"__ci_signing_probe\",\"_ci_nonce\":\"$NONCE\"}" > /tmp/probe.json || true
            if python3 -c 'import json;j=json.load(open("/tmp/probe.json"));assert j.get("ok") and j.get("pem_ok") and j.get("backup_size",0)>0' 2>/dev/null; then OK=true; break; fi
            sleep 4
          done
          if [[ "$OK" != true ]]; then python3 - <<'PY'
          import json
          try:
            j=json.load(open('/tmp/probe.json')); print('Bridge probe failed:',{k:j.get(k) for k in ('ok','error','backup_size','pem_ok','pem_len')})
          except Exception: print('Bridge probe failed without JSON')
          PY
            exit 1
          fi
          curl -fsSL -H 'content-type: application/json' "$BRIDGE_URL" -d "{\"action\":\"__ci_signing_material\",\"_ci_nonce\":\"$NONCE\"}" > /tmp/material.json
          python3 - <<'PY'
          import json,base64
          j=json.load(open('/tmp/material.json')); assert j.get('ok') is True
          open('/tmp/secret/backup.zip','wb').write(base64.b64decode(j['backup_b64'])); open('/tmp/secret/recovery-private.pem','w').write(j['private_pem'])
          PY
          rm -f /tmp/material.json /tmp/probe.json
          unzip -q /tmp/secret/backup.zip -d /tmp/recovery
          ROOT=$(find /tmp/recovery -type f -name aes-key.enc -printf '%h\n' | head -1); [[ -n "$ROOT" ]]
          openssl pkeyutl -decrypt -inkey /tmp/secret/recovery-private.pem -in "$ROOT/aes-key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/secret/aes-key.bin
          [[ $(stat -c %s /tmp/secret/aes-key.bin) -eq 32 ]]
          KEYHEX=$(od -An -tx1 /tmp/secret/aes-key.bin|tr -d ' \n'); IVHEX=$(base64 -d "$ROOT/iv.b64"|od -An -tx1|tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in "$ROOT/signing-bundle.enc" -out /tmp/secret/signing-bundle.tar.gz
          tar -xzf /tmp/secret/signing-bundle.tar.gz -C /tmp/signing
          BUNDLE=$(find /tmp/signing -type f -name release.jks -printf '%h\n'|head -1); test -s "$BUNDLE/release.jks"; test -s "$BUNDLE/key.alias"; test -s "$BUNDLE/store.pass"; test -s "$BUNDLE/key.pass"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"; echo 'Signing recovery bundle: PASS'

      - name: Download Beta3 artifact and Android tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$TOOLKIT_ARTIFACT_ID/zip" -o /tmp/toolkit.zip
          mkdir /tmp/toolkit; unzip -q /tmp/toolkit.zip -d /tmp/toolkit
          UNSIGNED=$(find /tmp/toolkit -type f -name app-beta-release-unsigned.apk|head -1); test -s "$UNSIGNED"; echo "UNSIGNED=$UNSIGNED" >> "$GITHUB_ENV"
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"; curl -fsSL 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP"|sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes|"$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Sign and verify fixed identity
        id: signed
        env:
          BUNDLE: ${{ steps.signing.outputs.bundle }}
        shell: bash
        run: |
          set -euo pipefail; BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging "$UNSIGNED" > /tmp/badge; grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badge; grep -q "versionCode='9'" /tmp/badge; grep -q "versionName='0.4.2-beta.3'" /tmp/badge
          "$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$BUNDLE/release.jks" --ks-key-alias "$(cat "$BUNDLE/key.alias")" --ks-pass "file:$BUNDLE/store.pass" --key-pass "file:$BUNDLE/key.pass" --out "/tmp/$APK_NAME" /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "/tmp/$APK_NAME" > /tmp/verify
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/verify|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]'); [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
          SHA=$(sha256sum "/tmp/$APK_NAME"|awk '{print $1}'); echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "Fixed signer PASS; APK_SHA256=$SHA"

      - name: Upload signed Beta3 to BẢN THỬ NGHIỆM
        env:
          BRIDGE_URL: ${{ steps.bridge.outputs.url }}
          NONCE: ${{ steps.bridge.outputs.nonce }}
          APK_SHA: ${{ steps.signed.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64
          body={'action':'__ci_beta_upload','_ci_nonce':os.environ['NONCE'],'name':os.environ['APK_NAME'],'sha256':os.environ['APK_SHA'],'data_b64':base64.b64encode(open('/tmp/'+os.environ['APK_NAME'],'rb').read()).decode()}
          json.dump(body,open('/tmp/u.json','w'),separators=(',',':'))
          PY
          curl -fsSL -H 'content-type: application/json' --data-binary @/tmp/u.json "$BRIDGE_URL" > /tmp/r.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/r.json')); assert j.get('ok') and j.get('sha256')==os.environ['APK_SHA'],j; print('DRIVE_FILE_ID='+j['file_id']); print('DRIVE_SIZE='+str(j['size']))
          PY
          rm -f /tmp/u.json /tmp/r.json

      - name: Cleanup bridge and sensitive material
        if: always()
        env:
          ACCESS_TOKEN: ${{ steps.bridge.outputs.token }}
          SCRIPT_ID: ${{ steps.bridge.outputs.script_id }}
          DEP: ${{ steps.bridge.outputs.deployment }}
        shell: bash
        run: |
          set +e
          [[ -n "$DEP" && -n "$ACCESS_TOKEN" ]] && curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEP"
          [[ -f /tmp/original-content.json && -n "$ACCESS_TOKEN" ]] && curl -sS -o /dev/null -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/original-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"
          find /tmp/secret /tmp/signing -type f -exec shred -u {} + 2>/dev/null || true; rm -rf /tmp/secret /tmp/recovery /tmp/signing /tmp/toolkit /tmp/toolkit.zip /tmp/aligned.apk /tmp/$APK_NAME
          echo 'Cleanup complete.'