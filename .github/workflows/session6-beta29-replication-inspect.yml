name: Session6 Beta29 Replication Inspect
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session6-beta29-replication-inspect-trigger.txt]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: pick-pack-1291-service-prod
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Read active replication rows
        shell: bash
        run: |
          set -euo pipefail
          cd service; npm install --no-audit --no-fund >/dev/null; npx wrangler d1 list --json >/tmp/list.json
          ID=$(node -e "const r=require('/tmp/list.json'),x=r.find(v=>v.name===process.env.D1_NAME);if(!x)process.exit(2);process.stdout.write(String(x.uuid||x.id||''))")
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));c.d1_databases[0].database_name=process.env.D1_NAME;c.d1_databases[0].database_id=process.argv[1];delete c.secrets;fs.writeFileSync('.wrangler-inspect.jsonc',JSON.stringify(c,null,2))" "$ID"
          npx wrangler d1 execute "$D1_NAME" --remote --config .wrangler-inspect.jsonc --command "SELECT o.outbox_id,o.event_id,e.event_type,e.entity_type,e.entity_id,e.business_date,o.status,o.attempt_count,o.claimed_at,o.next_attempt_at,o.last_error_class,o.last_error FROM sheet_replication_outbox o JOIN events e ON e.event_id=o.event_id WHERE o.status IN ('PENDING','RETRY','INFLIGHT') ORDER BY o.outbox_id" --json >/tmp/q.json
          cd ..
          node - <<'NODE' >/tmp/r
          const x=require('/tmp/q.json').flatMap(v=>v.results||[]);console.log('checked_at='+new Date().toISOString());console.log('active='+x.length);for(const r of x){const clean=v=>String(v??'').replace(/[\r\n|]/g,' ').slice(0,240);console.log(`row=${r.outbox_id}|${clean(r.event_type)}|${clean(r.entity_type)}|${clean(r.entity_id)}|${clean(r.business_date)}|${clean(r.status)}|attempt=${r.attempt_count}|claimed=${clean(r.claimed_at)}|next=${clean(r.next_attempt_at)}|class=${clean(r.last_error_class)}|error=${clean(r.last_error)}`)}console.log('verdict=PASS_READ_ONLY');
          NODE
      - name: Record
        if: always()
        shell: bash
        run: |
          test -f /tmp/r || printf 'checked_at=%s\nverdict=FAILED\n' "$(date -u +%FT%TZ)" >/tmp/r
          cp /tmp/r /tmp/c; git reset --hard HEAD >/dev/null; git pull --rebase origin agent/service-migration-m2 || true; cp /tmp/c ops/session6-beta29-replication-inspect-result.txt
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session6-beta29-replication-inspect-result.txt; git diff --cached --quiet || git commit -m 'ops: record Beta29 replication inspection'; git push origin HEAD:agent/service-migration-m2
