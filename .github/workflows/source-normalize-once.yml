name: Normalize Kotlin Source Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/source-normalize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize source and persist
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          if git diff --quiet -- app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt; then
            echo 'No normalization required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git commit -m 'fix: normalize Kotlin lexical whitespace'
          git push origin HEAD:main
