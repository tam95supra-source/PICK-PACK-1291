name: Verify Beta GitHub OTA

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/beta-ota-verify-trigger.txt'

permissions:
  contents: write

concurrency:
  group: beta-github-ota-verify
  cancel-in-progress: false

env:
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve expected Beta candidate
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-candidate-result.txt
          FROM_VERSION=$(sed -n 's/^from_version=//p' ops/beta-ota-verify-trigger.txt | tail -1)
          TARGET_VERSION=$(sed -n 's/^beta_name=//p' "$R")
          TARGET_CODE=$(sed -n 's/^beta_code=//p' "$R")
          EXPECTED_SHA=$(sed -n 's/^apk_sha256=//p' "$R")
          EXPECTED_SIZE=$(sed -n 's/^apk_size=//p' "$R")
          APK_NAME=$(sed -n 's/^apk_file=//p' "$R")
          for kv in FROM_VERSION TARGET_VERSION TARGET_CODE EXPECTED_SHA EXPECTED_SIZE APK_NAME; do echo "$kv=${!kv}" >> "$GITHUB_ENV"; done

      - name: Verify live discovery points to GitHub Release
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          good=false
          for n in $(seq 1 20); do
            code=$(curl -sSL --connect-timeout 20 --max-time 90 -o /tmp/update.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" || true)
            if [ "$code" = 200 ] && python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/update.json'))
          ok=(j.get('ok') is True and j.get('available',j.get('update_available')) is True and j.get('source')=='GITHUB_RELEASE' and str(j.get('channel'))=='BETA' and str(j.get('version_name',j.get('version','')))==os.environ['TARGET_VERSION'] and str(j.get('sha256','')).lower()==os.environ['EXPECTED_SHA'].lower() and str(j.get('apk_url','')).startswith('https://github.com/'))
          raise SystemExit(0 if ok else 1)
          PY
            then good=true; break; fi
            sleep 3
          done
          test "$good" = true
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/update.json')); open('/tmp/url','w').write(j['apk_url'])
          PY
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/url)" -o /tmp/ota.apk
          ACTUAL=$(sha256sum /tmp/ota.apk | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_SHA"
          test "$(stat -c '%s' /tmp/ota.apk)" = "$EXPECTED_SIZE"
          echo "download_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "download_size=$(stat -c '%s' /tmp/ota.apk)" >> "$GITHUB_OUTPUT"

      - name: Verify package version and production signer
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          "$BT/aapt" dump badging /tmp/ota.apk > /tmp/badge.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badge.txt
          grep -q "versionCode='$TARGET_CODE'" /tmp/badge.txt
          grep -q "versionName='$TARGET_VERSION'" /tmp/badge.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota.apk > /tmp/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_SIGNER_SHA256"

      - name: Verify self-update false Stable isolation and retention
        id: isolation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          post(){ curl -sSL --connect-timeout 20 --max-time 90 -H 'content-type: application/json' "$GAS_URL" -d "$1"; }
          post "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$TARGET_VERSION\"}" > /tmp/self.json
          post '{"action":"update_check","channel":"STABLE","current_version":"999.999.999"}' > /tmp/stable.json
          python3 - <<'PY'
          import json,os
          s=json.load(open('/tmp/self.json')); t=json.load(open('/tmp/stable.json'))
          assert s.get('ok') is True and s.get('source')=='GITHUB_RELEASE' and s.get('available',s.get('update_available')) is False, s
          assert t.get('ok') is True and t.get('source')=='GITHUB_RELEASE' and t.get('available',t.get('update_available')) is False, t
          assert str(t.get('version_name',t.get('version',''))) != os.environ['TARGET_VERSION'], t
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import json,re
          a=[r for r in json.load(open('/tmp/releases.json')) if re.fullmatch(r'v0\.4\.2-beta\.\d+-publicbeta',str(r.get('tag_name','')))]
          assert len(a)<=10, len(a)
          print('retained_beta_releases='+str(len(a)))
          PY

      - name: Persist OTA E2E receipt
        if: always()
        shell: bash
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          ISOLATION_OUTCOME: ${{ steps.isolation.outcome }}
          DOWNLOAD_SHA: ${{ steps.discovery.outputs.download_sha }}
          DOWNLOAD_SIZE: ${{ steps.discovery.outputs.download_size }}
        run: |
          set -euo pipefail
          verdict=FAIL
          if [ "$DISCOVERY_OUTCOME" = success ] && [ "$IDENTITY_OUTCOME" = success ] && [ "$ISOLATION_OUTCOME" = success ]; then verdict=PASS; fi
          cat > ops/beta-ota-verify-result.txt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          from_version=${FROM_VERSION:-}
          target_version=${TARGET_VERSION:-}
          target_code=${TARGET_CODE:-}
          ota_source=GITHUB_RELEASE
          expected_sha256=${EXPECTED_SHA:-}
          download_sha256=${DOWNLOAD_SHA:-}
          download_size=${DOWNLOAD_SIZE:-}
          discovery=$DISCOVERY_OUTCOME
          identity=$IDENTITY_OUTCOME
          isolation=$ISOLATION_OUTCOME
          beta_retention=10
          stable=UNTOUCHED
          pr38_merge=FORBIDDEN
          verdict=$verdict
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta-ota-verify-result.txt
          git commit -m 'ops: record GitHub OTA Beta E2E verification' || true
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2
          test "$verdict" = PASS
