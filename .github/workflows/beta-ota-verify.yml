name: Verify OTA - Beta and Stable

on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel
        required: true
        default: BETA
        type: choice
        options:
          - BETA
          - STABLE
      from_version:
        description: Previous version on the selected channel
        required: true
        type: string
      target_version:
        description: Published target version
        required: true
        type: string
      expected_sha256:
        description: Published APK SHA-256
        required: true
        type: string
  push:
    branches: [ main ]
    paths:
      - 'ops/beta-ota-verify-trigger.txt'
      - 'ops/stable-ota-verify-trigger.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'ops/beta-ota-verify-trigger.txt'
      - 'ops/stable-ota-verify-trigger.txt'

concurrency:
  group: ota-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL='${{ inputs.channel }}'
            FROM='${{ inputs.from_version }}'
            VERSION='${{ inputs.target_version }}'
            SHA='${{ inputs.expected_sha256 }}'
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD || true)
            BETA_CHANGED=false
            STABLE_CHANGED=false
            grep -qx 'ops/beta-ota-verify-trigger.txt' <<<"$CHANGED" && BETA_CHANGED=true || true
            grep -qx 'ops/stable-ota-verify-trigger.txt' <<<"$CHANGED" && STABLE_CHANGED=true || true
            if [[ "$BETA_CHANGED" == true && "$STABLE_CHANGED" == true ]]; then
              echo 'Exactly one OTA trigger file may change per verification commit.' >&2
              exit 1
            elif [[ "$STABLE_CHANGED" == true ]]; then
              CHANNEL=STABLE
              TRIGGER=ops/stable-ota-verify-trigger.txt
            else
              CHANNEL=BETA
              TRIGGER=ops/beta-ota-verify-trigger.txt
            fi
            test -f "$TRIGGER"
            FROM=$(sed -n 's/^from_version=//p' "$TRIGGER" | tail -1)
            VERSION=$(sed -n 's/^target_version=//p' "$TRIGGER" | tail -1)
            SHA=$(sed -n 's/^expected_sha256=//p' "$TRIGGER" | tail -1)
          fi
          [[ "$CHANNEL" == BETA || "$CHANNEL" == STABLE ]]
          [[ -n "$FROM" && -n "$VERSION" && "$SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          if [[ "$CHANNEL" == BETA ]]; then
            PACKAGE='vn.pickpack1291.app.beta.publicbeta'
            OTHER_CHANNEL=STABLE
          else
            PACKAGE='vn.pickpack1291.app.stable'
            OTHER_CHANNEL=BETA
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "other_channel=$OTHER_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(tr 'A-F' 'a-f' <<<"$SHA")" >> "$GITHUB_OUTPUT"

      - name: Verify live update discovery and download
        shell: bash
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          FROM_VERSION: ${{ steps.target.outputs.from }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" \
            -d "{\"action\":\"update_check\",\"channel\":\"$CHANNEL\",\"current_version\":\"$FROM_VERSION\"}" > /tmp/from.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/from.json'))
          available=j.get('available',j.get('update_available'))
          version=j.get('version_name',j.get('version',''))
          url=j.get('apk_url') or j.get('download_url') or j.get('url') or ''
          assert j.get('ok') is True, j
          assert available is True, j
          assert str(version) == os.environ['TARGET_VERSION'], j
          assert str(j.get('sha256','')).lower() == os.environ['EXPECTED_SHA'].lower(), j
          assert str(j.get('source','')) == 'GOOGLE_DRIVE', j
          assert str(j.get('channel','')) == os.environ['CHANNEL'], j
          assert url, j
          open('/tmp/url.txt','w').write(url)
          PY
          curl -fL --retry 4 --retry-delay 2 "$(cat /tmp/url.txt)" -o /tmp/ota.apk
          ACTUAL=$(sha256sum /tmp/ota.apk | awk '{print $1}')
          [[ "$ACTUAL" == "$EXPECTED_SHA" ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - name: Verify package version and fixed signer
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          EXPECTED_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/ota.apk > /tmp/badge.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badge.txt
          grep -q "versionName='$TARGET_VERSION'" /tmp/badge.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota.apk > /tmp/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]

      - name: Verify self-update false and opposite-channel isolation
        shell: bash
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          OTHER_CHANNEL: ${{ steps.target.outputs.other_channel }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          post_ota_contract() {
            local channel="$1" version="$2" out="$3"
            local attempt status
            for attempt in 1 2 3 4 5; do
              status=$(curl -sSL --connect-timeout 20 --max-time 90 -o "$out" -w '%{http_code}' \
                -H 'content-type: application/json' "$GSHEET_API_URL" \
                -d "{\"action\":\"update_check\",\"channel\":\"$channel\",\"current_version\":\"$version\"}" || true)
              if [[ "$status" == 200 ]] && python3 - "$out" "$channel" <<'PY'
          import json,sys
          try:
              j=json.load(open(sys.argv[1]))
              good=(j.get('ok') is True and str(j.get('channel',''))==sys.argv[2] and ('available' in j or 'update_available' in j))
              raise SystemExit(0 if good else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then
                return 0
              fi
              echo "OTA contract probe retry $attempt/5 for $channel (HTTP $status)" >&2
              sleep 2
            done
            echo "Did not receive OTA contract for $channel" >&2
            cat "$out" >&2 || true
            return 1
          }
          post_ota_contract "$CHANNEL" "$TARGET_VERSION" /tmp/self.json
          # Use a high-version sentinel for the unpublished opposite channel. It proves channel isolation
          # without requiring a nonexistent Stable APK to be installable.
          post_ota_contract "$OTHER_CHANNEL" '999.999.999' /tmp/other.json
          python3 - <<'PY'
          import json,os
          s=json.load(open('/tmp/self.json')); o=json.load(open('/tmp/other.json'))
          s_available=s.get('available',s.get('update_available'))
          o_available=o.get('available',o.get('update_available'))
          other_version=o.get('version_name',o.get('version',''))
          assert s.get('ok') is True and s_available is False, s
          assert str(s.get('channel','')) == os.environ['CHANNEL'], s
          assert o.get('ok') is True, o
          assert str(o.get('channel','')) == os.environ['OTHER_CHANNEL'], o
          assert o_available is False, o
          assert str(other_version) != os.environ['TARGET_VERSION'], o
          PY

      - name: OTA gate result
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          echo "PASS - $CHANNEL OTA discovery, live download SHA, package/version, fixed signer, self-update and opposite-channel isolation."
