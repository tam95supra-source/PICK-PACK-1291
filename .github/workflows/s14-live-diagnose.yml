name: S14 Live Diagnose

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s14-live-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
      GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      D1_NAME: pick-pack-1291-service-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sample Service and discovery repeatedly
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/samples.txt
          for i in $(seq 1 12); do
            H=$(curl -fsS --connect-timeout 5 --max-time 15 "$SERVICE_URL/health")
            D=$(curl -fsSL --connect-timeout 5 --max-time 15 -H 'content-type: application/json' "$GAS_WEB_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.20"}')
            HM=$(jq -r '.authority.mode // ""' <<<"$H"); HE=$(jq -r '.authority.authority_epoch // 0' <<<"$H")
            DM=$(jq -r '.authority_mode // ""' <<<"$D"); DE=$(jq -r '.authority.authority_epoch // 0' <<<"$D")
            SU=$(jq -r '.service_url // ""' <<<"$D")
            printf 'sample=%02d service=%s/%s discovery=%s/%s url=%s\n' "$i" "$HM" "$HE" "$DM" "$DE" "$SU" | tee -a /tmp/samples.txt
            sleep 2
          done
          test "$(grep -c 'service=SERVICE_PRIMARY/4 discovery=SERVICE_PRIMARY/4' /tmp/samples.txt)" -eq 12
          grep -q 'url=https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev' /tmp/samples.txt
          echo 'LIVE_ROUTE_STABLE=PASS'
      - name: Read production D1 account status only
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npm install --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"', '"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__', os.environ['ID'])
          Path('/tmp/wrangler.diag.jsonc').write_text(s)
          PY
        env:
          ID: ${{ env.PROD_D1_ID }}
      - name: Resolve D1 and query accounts
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$ID"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"', '"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__', os.environ['D1_ID'])
          Path('/tmp/wrangler.diag.jsonc').write_text(s)
          PY
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config /tmp/wrangler.diag.jsonc --command "SELECT login_id,role,position,status FROM accounts WHERE login_id IN ('admin','congdv','dienhx','tamnv2','dple','dpchan','dpchoxuat') ORDER BY login_id;" --json)
          node -e 'const j=JSON.parse(process.argv[1]); for(const r of (j?.[0]?.results||[])) console.log(`account=${r.login_id} role=${r.role} position=${r.position} status=${r.status}`)' "$OUT"
        env:
          D1_ID: ${{ env.D1_ID }}
