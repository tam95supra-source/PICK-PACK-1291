name: Service Replication Diagnostic

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths:
      - 'ops/service-replication-diagnostic-trigger.txt'

permissions:
  contents: write

concurrency:
  group: service-replication-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production D1 replication state
        id: diag
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          cat > wrangler.prod.diag.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "pick-pack-1291-service",
            "main": "src/entry_product.ts",
            "compatibility_date": "2026-08-08",
            "d1_databases": [{"binding":"DB","database_name":"pick-pack-1291-service-prod","database_id":"b619df89-528d-4126-a948-de0425037b11"}]
          }
          EOF
          runq(){ npx wrangler d1 execute pick-pack-1291-service-prod --remote --config wrangler.prod.diag.jsonc --command "$1" --json; }
          runq "SELECT status,COUNT(*) AS n,MIN(outbox_id) AS min_id,MAX(outbox_id) AS max_id FROM sheet_replication_outbox GROUP BY status ORDER BY status" > /tmp/counts.json
          runq "SELECT singleton_id,state,pending_count,retry_count,last_attempt_at,last_success_at,last_error_class,substr(COALESCE(last_error,''),1,400) AS last_error,updated_at FROM replication_status WHERE singleton_id=1" > /tmp/status.json
          runq "SELECT outbox_id,event_id,status,attempt_count,next_attempt_at,last_error_class,substr(COALESCE(last_error,''),1,400) AS last_error,replicated_at,created_at FROM sheet_replication_outbox WHERE event_id IN ('0d387d95-4012-4dc9-a46d-f757efe9f2b7','9ab91ee3-484c-444d-9eb2-de02e0649a48') OR status IN ('PENDING','RETRY','INFLIGHT','PAUSED_SCHEMA') ORDER BY outbox_id DESC LIMIT 60" > /tmp/recent.json
          runq "SELECT event_id,event_type,business_date,authority_seq,committed_at FROM events WHERE event_id IN ('0d387d95-4012-4dc9-a46d-f757efe9f2b7','9ab91ee3-484c-444d-9eb2-de02e0649a48') ORDER BY authority_seq" > /tmp/events.json
          python3 - <<'PY'
          import json
          def rows(p):
              j=json.load(open(p))
              if isinstance(j,list) and j:
                  return j[0].get('results',[]) or []
              return []
          counts=rows('/tmp/counts.json'); status=rows('/tmp/status.json'); recent=rows('/tmp/recent.json'); events=rows('/tmp/events.json')
          out=[]
          out.append('checked_at=__NOW__')
          out.append('source_sha=__SHA__')
          out.append('read_only=PASS')
          for r in counts: out.append('count_'+str(r.get('status','UNKNOWN'))+'='+str(r.get('n',0)))
          if status:
              r=status[0]
              for k in ('state','pending_count','retry_count','last_attempt_at','last_success_at','last_error_class','last_error','updated_at'):
                  out.append('replication_'+k+'='+str(r.get(k,'')).replace('\n',' ')[:500])
          for i,r in enumerate(recent):
              prefix=f'row{i}_'
              for k in ('outbox_id','event_id','status','attempt_count','next_attempt_at','last_error_class','last_error','replicated_at','created_at'):
                  out.append(prefix+k+'='+str(r.get(k,'')).replace('\n',' ')[:500])
          for i,r in enumerate(events):
              out.append(f'event{i}='+','.join(str(r.get(k,'')) for k in ('event_id','event_type','business_date','authority_seq','committed_at')))
          open('/tmp/receipt.txt','w').write('\n'.join(out)+'\n')
          PY
          sed -i "s/__NOW__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/;s/__SHA__/$GITHUB_SHA/" /tmp/receipt.txt
      - name: Persist diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          if [ -f /tmp/receipt.txt ]; then cp /tmp/receipt.txt ops/service-replication-diagnostic-result.txt; else printf 'checked_at=%s\nsource_sha=%s\nread_only=FAIL\nverdict=FAIL\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > ops/service-replication-diagnostic-result.txt; fi
          echo 'verdict=PASS' >> ops/service-replication-diagnostic-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/service-replication-diagnostic-result.txt
          git commit -m 'ops: record production replication diagnostic' || true
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2
