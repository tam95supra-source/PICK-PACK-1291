name: Temp discover current Bao Hang Apps Script project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-diagnose-google-oauth-scope.yml']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      BH_DEPLOYMENT_ID: AKfycbwb8Hcdg7tp0jqHLZU6kW5hkEclDC9d29DGvPuwcxvZbR9t9xnrWzaIYe8UZET-D_yI
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Query user Apps Script processes for live deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/g"
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP");test -n "$TOKEN";echo "::add-mask::$TOKEN"
          code=$(curl -sS -G -o "$RUNNER_TEMP/g/processes.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" --data-urlencode "userProcessFilter.deploymentId=$BH_DEPLOYMENT_ID" --data-urlencode 'pageSize=100' https://script.googleapis.com/v1/processes || true)
          python3 - "$code" <<'PY' > ops/temp-google-oauth-capability.txt
          import json,sys
          d={}
          try:d=json.load(open(__import__('os').environ['RUNNER_TEMP']+'/g/processes.json'))
          except:pass
          print('process_http='+sys.argv[1])
          if sys.argv[1]=='200':
            rows=d.get('processes') or []
            names=sorted({str(x.get('projectName') or '').strip() for x in rows if str(x.get('projectName') or '').strip()})
            funcs=sorted({str(x.get('functionName') or '').strip() for x in rows if str(x.get('functionName') or '').strip()})
            print('process_count='+str(len(rows)))
            print('project_names='+'|'.join(names)[:500])
            print('functions='+'|'.join(funcs)[:500])
          else:
            e=d.get('error',{}) if isinstance(d,dict) else {}
            print('error_class='+str(e.get('status') or 'UNKNOWN'))
            print('error_message='+str(e.get('message') or '')[:180].replace('\n',' '))
          PY
          cat ops/temp-google-oauth-capability.txt
      - name: Commit sanitized discovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/temp-google-oauth-capability.txt;git diff --cached --quiet || git commit -m 'chore(temp): record Bao Hang Apps Script project discovery';git pull --rebase origin main;git push origin HEAD:main
