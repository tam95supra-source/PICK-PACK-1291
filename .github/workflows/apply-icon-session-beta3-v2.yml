name: Apply Owner Icon + Persistent Session Beta3 V2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-icon-session-beta3-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      OWNER_ART_FILE_ID: 1Ml21naws1KVQkFJxm-O7hAE_F_uXh3TT
      OWNER_ART_SHA256: 371d0e5ad552e3cf63eef60a3da270896946458a506252a7fa132a67747c7a5d
    steps:
      - uses: actions/checkout@v4

      - name: Google OAuth
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          [[ -n "$TOKEN" && -n "$SCRIPT_ID" && -n "$DEPLOYMENT_ID" ]]
          echo "::add-mask::$TOKEN"; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"; echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"; echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Retrieve exact owner artwork using isolated temporary deployment
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
        run: |
          set -euo pipefail
          NONCE=$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))'); export NONCE; echo "::add-mask::$NONCE"
          TEMP_DEPLOYMENT=''; RESTORE_HEAD=true
          cleanup(){
            if [[ -n "$TEMP_DEPLOYMENT" ]]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$TEMP_DEPLOYMENT" || true; fi
            if [[ "$RESTORE_HEAD" == true && -f /tmp/original-content.json ]]; then curl -sS -o /dev/null -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/original-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" || true; fi
          }; trap cleanup EXIT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/original-content.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          src=(b/'PICK_PACK_API.gs').read_text(); needle="    if (action === 'login') return ppJson_(ppLogin_(body));"; assert needle in src
          n=os.environ['NONCE']; f=os.environ['OWNER_ART_FILE_ID']
          x=f'''\n    if (action === '__ci_owner_art_share' && String(body._ci_nonce||'') === '{n}') {{ const z=DriveApp.getFileById('{f}');z.setSharing(DriveApp.Access.ANYONE_WITH_LINK,DriveApp.Permission.VIEW);return ppJson_({{ok:true}}); }}\n    if (action === '__ci_owner_art_private' && String(body._ci_nonce||'') === '{n}') {{ const z=DriveApp.getFileById('{f}');z.setSharing(DriveApp.Access.PRIVATE,DriveApp.Permission.VIEW);return ppJson_({{ok:true}}); }}'''
          temp=src.replace(needle,needle+x,1); out=[]
          for q in files: out.append(dict(q,source=temp) if q['name']=='PICK_PACK_API' else q)
          Path('/tmp/temp-content.json').write_text(json.dumps({'files':out},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/temp-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"temporary owner artwork fetch"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" > /tmp/v.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/v.json"))["versionNumber"])')
          python3 - "$V" <<'PY'
          import json,sys
          open('/tmp/d.json','w').write(json.dumps({'versionNumber':int(sys.argv[1]),'manifestFileName':'appsscript','description':'temporary owner artwork fetch'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/d.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > /tmp/dep.json
          TEMP_DEPLOYMENT=$(python3 -c 'import json;print(json.load(open("/tmp/dep.json"))["deploymentId"])'); export TEMP_DEPLOYMENT; echo "::add-mask::$TEMP_DEPLOYMENT"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$TEMP_DEPLOYMENT" > /tmp/get.json
          URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/get.json')); w=[e['webApp']['url'] for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert w; print(w[0])
          PY
          )
          OK=false
          for i in $(seq 1 12); do curl -fsSL -H 'content-type: application/json' "$URL" -d "{\"action\":\"__ci_owner_art_share\",\"_ci_nonce\":\"$NONCE\"}" > /tmp/s.json || true; grep -q '"ok":true' /tmp/s.json && { OK=true; break; }; sleep 4; done
          [[ "$OK" == true ]]
          curl -fL --retry 3 "https://drive.usercontent.google.com/download?id=$OWNER_ART_FILE_ID&export=download&confirm=t" -o /tmp/owner_launcher.png
          echo "$OWNER_ART_SHA256  /tmp/owner_launcher.png" | sha256sum -c -
          file /tmp/owner_launcher.png | grep -q 'PNG image data'
          curl -fsSL -H 'content-type: application/json' "$URL" -d "{\"action\":\"__ci_owner_art_private\",\"_ci_nonce\":\"$NONCE\"}" | grep -q '"ok":true'
          curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$TEMP_DEPLOYMENT"; TEMP_DEPLOYMENT=''
          curl -fsS -o /dev/null -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/original-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"; RESTORE_HEAD=false
          echo 'Owner artwork exact SHA + private restore: PASS'

      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_beta3_patch.py
          mkdir -p app/src/main/res/drawable-nodpi
          cp /tmp/owner_launcher.png app/src/main/res/drawable-nodpi/owner_launcher.png
          rm -f app/src/main/res/drawable-nodpi/app_icon_owner.png app/src/main/res/drawable/app_icon.jpg app/src/main/res/drawable/app_icon_foreground.xml
          rm -f app/src/main/res/mipmap-anydpi/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 tools/apply_beta3_patch.py
          echo "$OWNER_ART_SHA256  app/src/main/res/drawable-nodpi/owner_launcher.png" | sha256sum -c -
          grep -q 'android:icon="@drawable/owner_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'restoredAccount' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          ! grep -q 'api.clearToken()' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'SINGLE_ACTIVE_DEVICE_V1' google-apps-script/PICK_PACK_API.gs
          grep -q 'versionName = "0.4.2-beta.3"' app/build.gradle.kts
          cp google-apps-script/PICK_PACK_API.gs /tmp/api.js; node --check /tmp/api.js
          echo 'Source patch static gates: PASS'

      - name: Deploy final GAS and verify session model
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); f=[]
          for p in sorted(b.glob('*.gs')):f.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          f.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/final.json').write_text(json.dumps({'files':f},ensure_ascii=False))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/final.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/dev/null
          curl -fsS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"0.4.2 persistent single-device session + exact icon release backend"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" > /tmp/fv.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/fv.json"))["versionNumber"])')
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/fd.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API 0.4.2 persistent session + Drive OTA'}}))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/fd.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/dev/null
          OK=false
          for i in $(seq 1 15); do curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"health"}' > /tmp/h.json || true; if grep -q '"sheet_read":true' /tmp/h.json && grep -q '"auth_session_model":"SINGLE_ACTIVE_DEVICE_V1"' /tmp/h.json; then OK=true; break; fi; sleep 4; done
          [[ "$OK" == true ]] || { cat /tmp/h.json; exit 1; }
          echo "Final GAS version $V session model: PASS"

      - name: Commit non-workflow verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'; git config user.email 'tam95.supra@gmail.com'
          git add app google-apps-script
          git diff --cached --quiet && { echo 'No source changes' >&2; exit 1; }
          git commit -m 'fix: exact owner icon and persistent single-device login beta3'
          git push origin main
          echo 'App + GAS source committed: PASS'