name: Deploy Current GAS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/gas-deploy-trigger.txt'

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate final staff bridge source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/install_staff_bridge_hmac.py ops/fix_staff_bridge_flush_live.py
          cp google-apps-script/PICK_PACK_API.gs /tmp/pp-api.js
          cp google-apps-script/BAO_HANG_STAFF_BRIDGE.gs /tmp/pp-bridge.js
          node --check /tmp/pp-api.js
          node --check /tmp/pp-bridge.js
          grep -q "SpreadsheetApp.flush();const bridge=ppBaoHangBridgeNotifyServiceStaffMutation_(eventId,row,oldCode,'UPSERT')" google-apps-script/PICK_PACK_API.gs
          grep -q "SpreadsheetApp.flush();const bridge=ppBaoHangBridgeNotifyServiceStaffMutation_(eventId,row,mnv,'DELETE')" google-apps-script/PICK_PACK_API.gs
          grep -q "HMAC_PROP: 'STAFF_BRIDGE_HMAC_SECRET'" google-apps-script/BAO_HANG_STAFF_BRIDGE.gs
          echo 'Final staff bridge source gates: PASS'

      - name: Deploy flush and run isolated runtime proof
        shell: bash
        run: python3 ops/fix_staff_bridge_flush_live.py

      - name: Commit sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ops/staff-bridge-hmac-live-proof.json ]]; then
            printf '%s\n' '{"status":"FAIL","stage":"FLUSH_RUNNER_PREPARE","verified_at":"unknown"}' > ops/staff-bridge-hmac-live-proof.json
          fi
          cat ops/staff-bridge-hmac-live-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staff-bridge-hmac-live-proof.json
          git diff --cached --quiet || git commit -m 'chore(staff): record final bridge runtime proof'
          git pull --rebase origin main
          git push origin HEAD:main
          jq -e '.status=="PASS" and .service_upsert_runtime=="PASS" and .restore_runtime=="PASS" and .source_restored==true and .temporary_deployments_cleanup=="PASS"' ops/staff-bridge-hmac-live-proof.json >/dev/null
