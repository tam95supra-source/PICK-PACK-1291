name: Deploy Current GAS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/gas-deploy-trigger.txt'

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run isolated service upsert bridge proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/install_staff_bridge_hmac.py ops/fix_staff_bridge_flush_live.py
          python3 ops/fix_staff_bridge_flush_live.py
      - name: Commit sanitized runtime proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/staff-bridge-hmac-live-proof.json || printf '%s\n' '{"status":"FAIL","stage":"POST_AUTH_SERVICE_PROBE_RUNNER","verified_at":"unknown"}' > ops/staff-bridge-hmac-live-proof.json
          cat ops/staff-bridge-hmac-live-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staff-bridge-hmac-live-proof.json
          git diff --cached --quiet || git commit -m 'chore(staff): record post-authorize service bridge proof'
          git pull --rebase origin main
          git push origin HEAD:main
          jq -e '.status=="PASS" and .service_upsert_runtime=="PASS" and .restore_runtime=="PASS" and .source_restored==true and .temporary_deployments_cleanup=="PASS"' ops/staff-bridge-hmac-live-proof.json >/dev/null
