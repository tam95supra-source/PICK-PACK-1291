name: Deploy Current GAS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/gas-deploy-trigger.txt'

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/tam95supra-source/bao-hang-1291.git /tmp/bao-hang >/dev/null 2>&1
          python3 -m py_compile ops/install_staff_bridge_hmac.py ops/run_install_staff_bridge_hmac.py
          cp google-apps-script/BAO_HANG_STAFF_BRIDGE.gs /tmp/pp-bridge.js
          cp /tmp/bao-hang/google-apps-script/STAFF_SOURCE_BRIDGE_RECEIVER.gs /tmp/bh-receiver.js
          node --check /tmp/pp-bridge.js
          node --check /tmp/bh-receiver.js
          grep -q "HMAC_PROP: 'STAFF_BRIDGE_HMAC_SECRET'" /tmp/pp-bridge.js
          grep -q "HMAC_PROP: 'STAFF_BRIDGE_HMAC_SECRET'" /tmp/bh-receiver.js
          echo 'HMAC source gates: PASS'

      - name: Bootstrap properties, deploy, probe and restore
        shell: bash
        run: python3 ops/run_install_staff_bridge_hmac.py

      - name: Commit sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ops/staff-bridge-hmac-live-proof.json ]]; then
            printf '%s\n' '{"status":"FAIL","stage":"PREPARE_CANONICAL_OR_RUNNER","verified_at":"unknown"}' > ops/staff-bridge-hmac-live-proof.json
          fi
          cat ops/staff-bridge-hmac-live-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staff-bridge-hmac-live-proof.json
          git diff --cached --quiet || git commit -m 'chore(staff): record signed bridge live proof'
          git pull --rebase origin main
          git push origin HEAD:main
          jq -e '.status=="PASS" and .service_upsert_runtime=="PASS" and .source_restored==true and .temporary_deployments_cleanup=="PASS"' ops/staff-bridge-hmac-live-proof.json >/dev/null
