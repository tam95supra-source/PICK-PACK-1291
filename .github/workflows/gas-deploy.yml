name: Deploy Current GAS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/gas-deploy-trigger.txt'

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize signed staff bridge and cleanup test residue
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/install_staff_bridge_hmac.py ops/finalize_staff_bridge_runtime.py
          python3 ops/finalize_staff_bridge_runtime.py
      - name: Commit sanitized final proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/staff-bridge-final-proof.json || printf '%s\n' '{"status":"FAIL","stage":"FINALIZE_RUNNER","verified_at":"unknown"}' > ops/staff-bridge-final-proof.json
          cat ops/staff-bridge-final-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staff-bridge-final-proof.json
          git diff --cached --quiet || git commit -m 'chore(staff): record final signed bridge proof'
          git pull --rebase origin main
          git push origin HEAD:main
          jq -e '.status=="PASS" and .service_restore_bridge=="PASS" and .pending_queue_cleared==true and .retry_trigger_cleared==true and .authorizer_helper_removed==true and .temporary_deployment_cleanup=="PASS"' ops/staff-bridge-final-proof.json >/dev/null
