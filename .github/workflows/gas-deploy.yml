name: Deploy Current GAS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ops/gas-deploy-trigger.txt'

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install owner authorization helper into live PICK PACK project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/install_staff_bridge_hmac.py ops/install_staff_bridge_authorizer.py
          python3 ops/install_staff_bridge_authorizer.py
      - name: Commit sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/staff-bridge-authorizer-proof.json || printf '%s\n' '{"status":"FAIL","stage":"AUTHORIZER_RUNNER","verified_at":"unknown"}' > ops/staff-bridge-authorizer-proof.json
          cat ops/staff-bridge-authorizer-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/staff-bridge-authorizer-proof.json
          git diff --cached --quiet || git commit -m 'chore(staff): record transport authorizer proof'
          git pull --rebase origin main
          git push origin HEAD:main
