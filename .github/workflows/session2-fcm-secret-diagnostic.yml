name: Session2 FCM Secret Diagnostic

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths: [ 'ops/session2-fcm-secret-diagnostic-trigger.txt' ]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production FCM secret binding by name only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/session2-fcm-secret-diagnostic-result.txt
          echo "checked_at=$(date -u +%FT%TZ)" > "$OUT"
          echo "head_sha=$GITHUB_SHA" >> "$OUT"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [[ -n "${!v:-}" ]] || { echo "cf_bindings=MISSING:$v" >> "$OUT"; exit 10; }
          done
          echo cf_bindings=READY >> "$OUT"
          HTTP=$(curl -sS -o /tmp/cf-secrets.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pick-pack-1291-service/secrets")
          echo "secret_list_http=$HTTP" >> "$OUT"
          [[ "$HTTP" == 200 ]]
          jq -e '.success==true' /tmp/cf-secrets.json >/dev/null
          COUNT=$(jq '[.result[]? | select(.name=="FCM_SERVICE_ACCOUNT_JSON" and .type=="secret_text")]|length' /tmp/cf-secrets.json)
          echo "fcm_service_account_secret_count=$COUNT" >> "$OUT"
          [[ "$COUNT" == 1 ]]
          grep -q 'FCM_SERVICE_ACCOUNT_JSON' service/src/push.ts
          echo source_support=PASS >> "$OUT"
          echo verdict=PASS >> "$OUT"
      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          test -f /tmp/session2-fcm-secret-diagnostic-result.txt || echo result_missing=true >/tmp/session2-fcm-secret-diagnostic-result.txt
          cp /tmp/session2-fcm-secret-diagnostic-result.txt ops/session2-fcm-secret-diagnostic-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session2-fcm-secret-diagnostic-result.txt
          git diff --cached --quiet && exit 0
          git commit -m 'ops: record sanitized production FCM secret diagnostic'
          git push
