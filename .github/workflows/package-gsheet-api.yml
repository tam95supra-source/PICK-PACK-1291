name: Package GSheet API Deploy Bundle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-gsheet-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment bundle
        run: |
          set -euo pipefail
          mkdir -p dist/pick-pack-1291-gsheet-api
          cp google-apps-script/PICK_PACK_API.gs dist/pick-pack-1291-gsheet-api/
          cp google-apps-script/appsscript.json dist/pick-pack-1291-gsheet-api/
          cp DEPLOY_GSHEET_API.md dist/pick-pack-1291-gsheet-api/
          (cd dist && zip -qr pick-pack-1291-gsheet-api-deploy.zip pick-pack-1291-gsheet-api)
          sha256sum dist/pick-pack-1291-gsheet-api-deploy.zip > dist/pick-pack-1291-gsheet-api-deploy.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-gsheet-api-deploy
          path: |
            dist/pick-pack-1291-gsheet-api-deploy.zip
            dist/pick-pack-1291-gsheet-api-deploy.zip.sha256
          retention-days: 1
