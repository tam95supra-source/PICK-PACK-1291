name: S09 Release Status Once
on:
  push:
    branches: [ main ]
    paths: ['ops/s09-release-status-trigger.txt']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Record release pipeline status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          workflows=['gas-deploy.yml','app-fast-check.yml','release-preflight.yml']
          out={}
          for wf in workflows:
              p=subprocess.run(['gh','run','list','--repo',__import__('os').environ['GITHUB_REPOSITORY'],'--workflow',wf,'--limit','3','--json','databaseId,status,conclusion,headSha,displayTitle,createdAt'],capture_output=True,text=True)
              out[wf]=json.loads(p.stdout or '[]') if p.returncode==0 else {'error':p.stderr.strip()}
          open('ops/s09-release-status.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/s09-release-status.json
          git commit -m 'ops: record S09 release status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
