name: Session1 Bounded Service Deploy
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session1-service-deploy-trigger.txt]
permissions:
  contents: read
concurrency:
  group: session1-bounded-service-deploy
  cancel-in-progress: false
env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_GENERATION: m2-prod-20260819-001
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI
  EXPECTED_SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety and source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'confirmation=OWNER_SESSION1_SERVICE_DEPLOY' ops/session1-service-deploy-trigger.txt
          grep -qx 'stable=FORBIDDEN' ops/session1-service-deploy-trigger.txt
          grep -qx 'merge_pr38=FORBIDDEN' ops/session1-service-deploy-trigger.txt
          grep -qx 'authority_change=FORBIDDEN_IN_THIS_RUN' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_service_epoch=6' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_fallback_epoch=7' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_fallback_pending=3' ops/session1-service-deploy-trigger.txt
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_STORE_PASSWORD; do [[ -n "${!v:-}" ]] || { echo "MISSING_REQUIRED_SECRET:$v"; exit 1; }; done
          cd service
          npm install --no-audit --no-fund
          npm run cf:types
          npm run typecheck
          node --check public/app.js
          node --check public/sw.js
          grep -Fq 'e.committed_at,e.idempotency_key,e.origin,e.schema_version,e.checksum,e.payload_json' src/replication.ts
          ! grep -Fq 'e.committed_at,e.payload_json,e.idempotency_key' src/replication.ts
          grep -Fq 'const writeWindow=auth.role==="SUPERADMIN"?7:2' src/core.ts
          cd ..
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          SERVICE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-service-token-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$SERVICE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "SERVICE_TOKEN_SECRET=$SERVICE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Build exact existing production D1 config
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          [[ -n "$ID" ]] || { echo PRODUCTION_D1_MISSING_STOP_OWNER; exit 1; }
          export PROD_D1_ID="$ID"
          node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.jsonc","utf8");s=s.replace("\"name\": \"pick-pack-1291-service-m1-staging\"",`\"name\": \"${process.env.WORKER_NAME}\"`).replace("\"SERVICE_GENERATION\": \"m2-precutover-20260819-001\"",`\"SERVICE_GENERATION\": \"${process.env.SERVICE_GENERATION}\"`).replace("\"database_name\": \"pick-pack-1291-m1-staging\"",`\"database_name\": \"${process.env.D1_NAME}\"`).replace("__M1_D1_DATABASE_ID__",process.env.PROD_D1_ID);if(s.includes("__M1_D1_DATABASE_ID__"))throw new Error("D1_PLACEHOLDER_REMAINS");fs.writeFileSync("wrangler.live.jsonc",s)'

      - name: Exchange Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS --max-time 25 https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP")
          [[ -n "$TOKEN" ]] || exit 1
          echo "::add-mask::$TOKEN"; echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Exact live predeploy checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$EXPECTED_SERVICE_URL/v1/authority" >/tmp/service-before.json
          node -e 'const j=require("/tmp/service-before.json"),a=j.authority||j;if(!j.ok||a.mode!=="SERVICE_PRIMARY"||Number(a.authority_epoch)!==6||a.scope!=="PRODUCTION"||a.service_generation!==process.env.SERVICE_GENERATION)throw new Error("SERVICE_TOPOLOGY_UNEXPECTED");console.log("SERVICE_BEFORE="+JSON.stringify({mode:a.mode,epoch:a.authority_epoch,seq:a.authority_seq,scope:a.scope,generation:a.service_generation}))'
          OK=0; for i in $(seq 1 8); do : >/tmp/gas-before.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/gas-before.json || true; if node -e 'try{const j=require("/tmp/gas-before.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&j.service_generation===process.env.SERVICE_GENERATION&&j.service_url===process.env.EXPECTED_SERVICE_URL?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 2; done; [[ "$OK" == 1 ]] || { echo GAS_DISCOVERY_NOT_STABLE_EXPECTED_TOPOLOGY; exit 1; }
          node -e 'const j=require("/tmp/gas-before.json"),a=j.authority||{};console.log("GAS_BEFORE="+JSON.stringify({mode:j.authority_mode,epoch:a.authority_epoch,seq:a.authority_seq,generation:j.service_generation,url:j.service_url,client_floor:j.client_floor||null}))'
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")')
          curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/fallback-before.json
          node -e 'const rows=(require("/tmp/fallback-before.json").values||[]).slice(1),p=rows.filter(r=>Number(r[1])===7&&String(r[12]||"")==="PENDING"),seq=p.map(r=>Number(r[2]));if(p.length!==3||JSON.stringify(seq)!==JSON.stringify([1,2,3]))throw new Error("FALLBACK_CHECKPOINT_UNEXPECTED:"+JSON.stringify({n:p.length,seq}));console.log("FALLBACK_BEFORE="+JSON.stringify({epoch:7,pending:p.length,seq}))'
          cd service
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT COALESCE((SELECT value FROM system_meta WHERE key='m2_reconciling'),'0') AS reconciling; SELECT COUNT(*) AS epoch7_inbox FROM fallback_event_inbox WHERE authority_epoch=7; SELECT state,pending_count,retry_count,last_error_class FROM replication_status WHERE singleton_id=1;" --json >/tmp/d1-before.json
          node -e 'const x=require("/tmp/d1-before.json"),r=x.flatMap(g=>g.results||[]),a=r.find(v=>v.mode),lock=r.find(v=>Object.hasOwn(v,"reconciling")),inbox=r.find(v=>Object.hasOwn(v,"epoch7_inbox")),rep=r.find(v=>Object.hasOwn(v,"pending_count"));if(!a||a.mode!=="SERVICE_PRIMARY"||Number(a.authority_epoch)!==6||a.scope!=="PRODUCTION"||a.service_generation!==process.env.SERVICE_GENERATION||String(lock?.reconciling||"0")==="1"||String(rep?.state||"").toUpperCase()==="FAILED")throw new Error("D1_PRECHECK_FAILED");console.log("D1_BEFORE="+JSON.stringify({authority:a,reconciling:lock?.reconciling,epoch7_inbox:inbox?.epoch7_inbox,replication:rep}))'

      - name: Patch future GAS fallback token leakage only
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/gas-live-before.json
          node scripts/session1_live_gas_patch.mjs
          if [[ "$(cat /tmp/gas-changed)" == 1 ]]; then
            [[ "$(curl -sS --max-time 25 -o /tmp/gas-put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-live-patched.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")" == 200 ]] || exit 1
            [[ "$(curl -sS --max-time 25 -o /tmp/gas-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Session1 security sanitizer"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")" == 200 ]] || exit 1
            V=$(node -e 'const j=require("/tmp/gas-version.json");process.stdout.write(String(j.versionNumber||""))'); [[ -n "$V" ]] || exit 1
            node -e 'const fs=require("fs");fs.writeFileSync("/tmp/gas-deploy.json",JSON.stringify({deploymentConfig:{scriptId:process.argv[1],versionNumber:Number(process.argv[2]),manifestFileName:"appsscript",description:"Session1 security sanitizer"}}))' "$SCRIPT_ID" "$V"
            [[ "$(curl -sS --max-time 25 -o /tmp/gas-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")" == 200 ]] || exit 1
          fi
          OK=0; for i in $(seq 1 12); do : >/tmp/gas-after-sanitizer.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/gas-after-sanitizer.json || true; if node -e 'try{const j=require("/tmp/gas-after-sanitizer.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&j.service_generation===process.env.SERVICE_GENERATION&&j.service_url===process.env.EXPECTED_SERVICE_URL?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 3; done; [[ "$OK" == 1 ]] || { echo GAS_SANITIZER_CHANGED_TOPOLOGY_STOP; exit 1; }
          echo GAS_SANITIZER_DEPLOY=PASS_AUTHORITY_UNCHANGED

      - name: Apply non-destructive D1 migration and deploy Worker
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.live.jsonc
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "SELECT name FROM d1_migrations ORDER BY id; SELECT COUNT(*) AS import_columns FROM pragma_table_info('import_batches'); SELECT COUNT(*) AS push_columns FROM pragma_table_info('push_devices'); SELECT COUNT(*) AS redact_columns FROM pragma_table_info('fallback_event_inbox') WHERE name IN ('source_checksum_verified','sanitized_checksum');" --json >/tmp/migrations.json
          node -e 'const x=require("/tmp/migrations.json"),r=x.flatMap(g=>g.results||[]),names=r.filter(v=>v.name).map(v=>v.name),ic=r.find(v=>Object.hasOwn(v,"import_columns")),pc=r.find(v=>Object.hasOwn(v,"push_columns")),rc=r.find(v=>Object.hasOwn(v,"redact_columns"));if(!names.includes("0004_session1_foundation.sql")||Number(ic?.import_columns||0)<10||Number(pc?.push_columns||0)<10||Number(rc?.redact_columns||0)!==2)throw new Error("SESSION1_MIGRATION_VERIFY_FAILED");console.log("MIGRATION_VERIFY="+JSON.stringify({names,import_columns:ic.import_columns,push_columns:pc.push_columns,redact_columns:rc.redact_columns}))'
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/session1-secrets.json",JSON.stringify({SERVICE_TOKEN_SECRET:process.env.SERVICE_TOKEN_SECRET,M1_ADMIN_TOKEN:process.env.M2_ADMIN_TOKEN,GAS_BRIDGE_SHARED_SECRET:process.env.GAS_BRIDGE_SHARED_SECRET,GOOGLE_OAUTH_CLIENT_ID:process.env.GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET:process.env.GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REFRESH_TOKEN:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,GOOGLE_STAGING_SHEET_ID:process.env.STAGING_SHEET_ID}))'
          chmod 600 /tmp/session1-secrets.json
          npx wrangler deploy --config wrangler.live.jsonc --secrets-file /tmp/session1-secrets.json 2>&1 | tee /tmp/deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true); [[ "$URL" == "$EXPECTED_SERVICE_URL" ]] || { echo "DEPLOY_URL_UNEXPECTED:$URL"; exit 1; }

      - name: Postdeploy verification and benchmark
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --max-time 25 "$EXPECTED_SERVICE_URL/health" >/tmp/health.json
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$EXPECTED_SERVICE_URL/v1/capabilities" >/tmp/caps.json
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$EXPECTED_SERVICE_URL/v1/authority" >/tmp/auth.json
          curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$EXPECTED_SERVICE_URL/" >/tmp/web.html
          node -e 'const h=require("/tmp/health.json"),c=require("/tmp/caps.json"),j=require("/tmp/auth.json"),a=j.authority||j;if(!h.ok||h.environment!=="production"||h.generation!==process.env.SERVICE_GENERATION||!c.ok||Number(c.business_window)!==7||!c.mutation_batch||!c.fcm_wake||!c.import_engine||c.realtime_protocol!=="INVALIDATION_V1"||!j.ok||a.mode!=="SERVICE_PRIMARY"||Number(a.authority_epoch)!==6||a.scope!=="PRODUCTION")throw new Error("POST_SERVICE_VERIFY_FAILED");console.log("POST_SERVICE="+JSON.stringify({health:{generation:h.generation,replication:h.replication},caps:{business_window:c.business_window,mutation_batch:c.mutation_batch,fcm_wake:c.fcm_wake,import_engine:c.import_engine,realtime_protocol:c.realtime_protocol},authority:a}))'
          grep -q 'PICK PACK 1291' /tmp/web.html
          : >/tmp/health-times.txt; for i in $(seq 1 10); do curl -fsS --max-time 10 -o /dev/null -w '%{time_total}\n' "$EXPECTED_SERVICE_URL/health" >>/tmp/health-times.txt; done
          node -e 'const fs=require("fs"),x=fs.readFileSync("/tmp/health-times.txt","utf8").trim().split(/\s+/).map(Number).sort((a,b)=>a-b),m=x[Math.floor(x.length/2)];console.log("HEALTH_BENCH="+JSON.stringify({samples:x.length,min_ms:+(x[0]*1000).toFixed(1),median_ms:+(m*1000).toFixed(1),max_ms:+(x.at(-1)*1000).toFixed(1),mean_ms:+(x.reduce((a,b)=>a+b,0)/x.length*1000).toFixed(1)}))'
          OK=0; for i in $(seq 1 8); do : >/tmp/gas-post.json; curl -sSL --max-time 25 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery"}' >/tmp/gas-post.json || true; if node -e 'try{const j=require("/tmp/gas-post.json"),a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&j.service_url===process.env.EXPECTED_SERVICE_URL?0:1)}catch{process.exit(1)}'; then OK=1; break; fi; sleep 2; done; [[ "$OK" == 1 ]] || exit 1
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")'); curl -fsS --max-time 25 -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/fallback-post.json
          node -e 'const rows=(require("/tmp/fallback-post.json").values||[]).slice(1),p=rows.filter(r=>Number(r[1])===7&&String(r[12]||"")==="PENDING");if(p.length!==3)throw new Error("POST_FALLBACK_CHANGED");const g=require("/tmp/gas-post.json"),a=g.authority||{};console.log("POST_GAS="+JSON.stringify({mode:g.authority_mode,epoch:a.authority_epoch,seq:a.authority_seq,client_floor:g.client_floor||null}));console.log("POST_FALLBACK="+JSON.stringify({epoch:7,pending:p.length,seq:p.map(r=>Number(r[2]))}))'
          echo SESSION1_SERVICE_DEPLOY=PASS_NO_AUTHORITY_CHANGE_NO_STABLE_NO_APK
