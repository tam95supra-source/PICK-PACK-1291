name: Session1 Bounded Service Deploy
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session1-service-deploy-trigger.txt]
permissions:
  contents: read
concurrency:
  group: session1-bounded-service-deploy
  cancel-in-progress: false
env:
  D1_NAME: pick-pack-1291-service-prod
  WORKER_NAME: pick-pack-1291-service
  SERVICE_GENERATION: m2-prod-20260819-001
  SOURCE_SHEET_ID: 1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78
  STAGING_SHEET_ID: 1naPzyMjjsGvzz1EqWIBk2aS4anYmJqNgEYDCmu5U5aI
  EXPECTED_SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  EXPECTED_SERVICE_EPOCH: '6'
  EXPECTED_FALLBACK_EPOCH: '7'
  EXPECTED_FALLBACK_PENDING: '3'
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 1

      - name: Owner-scope trigger and safety locks
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'confirmation=OWNER_SESSION1_SERVICE_DEPLOY' ops/session1-service-deploy-trigger.txt
          grep -qx 'stable=FORBIDDEN' ops/session1-service-deploy-trigger.txt
          grep -qx 'merge_pr38=FORBIDDEN' ops/session1-service-deploy-trigger.txt
          grep -qx 'authority_change=FORBIDDEN_IN_THIS_RUN' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_service_epoch=6' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_fallback_epoch=7' ops/session1-service-deploy-trigger.txt
          grep -qx 'expected_fallback_pending=3' ops/session1-service-deploy-trigger.txt
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID SIGNING_STORE_PASSWORD; do
            [[ -n "${!v:-}" ]] || { echo "MISSING_REQUIRED_SECRET:$v" >&2; exit 1; }
          done
          echo 'SESSION1_DEPLOY_TRIGGER=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source gates and runtime secret derivation
        shell: bash
        run: |
          set -euo pipefail
          cd service
          npm install --no-audit --no-fund
          npm run cf:types
          npm run typecheck
          node --check public/app.js
          node --check public/sw.js
          grep -Fq 'e.committed_at,e.idempotency_key,e.origin,e.schema_version,e.checksum,e.payload_json' src/replication.ts
          ! grep -Fq 'e.committed_at,e.payload_json,e.idempotency_key' src/replication.ts
          grep -Fq 'const writeWindow=auth.role==="SUPERADMIN"?7:2' src/core.ts
          grep -Fq 'ppM2SanitizePayload_' ../google-apps-script/SERVICE_MIGRATION_M2.gs
          cd ..
          BRIDGE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-bridge-v1" | sha256sum | awk '{print $1}')
          SERVICE=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$GOOGLE_OAUTH_CLIENT_SECRET|pick-pack-1291-m2-service-token-v1" | sha256sum | awk '{print $1}')
          ADMIN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID|$SIGNING_STORE_PASSWORD|pick-pack-1291-m2-admin-v1" | sha256sum | awk '{print $1}')
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$SERVICE"; echo "::add-mask::$ADMIN"
          echo "GAS_BRIDGE_SHARED_SECRET=$BRIDGE" >> "$GITHUB_ENV"
          echo "SERVICE_TOKEN_SECRET=$SERVICE" >> "$GITHUB_ENV"
          echo "M2_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Resolve existing production D1 only
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          [[ -n "$ID" ]] || { echo 'PRODUCTION_D1_MISSING_STOP_OWNER'; exit 1; }
          echo "PROD_D1_ID=$ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path('wrangler.jsonc').read_text()
          s=s.replace('"name": "pick-pack-1291-service-m1-staging"','"name": "'+os.environ['WORKER_NAME']+'"')
          s=s.replace('"SERVICE_GENERATION": "m2-precutover-20260819-001"','"SERVICE_GENERATION": "'+os.environ['SERVICE_GENERATION']+'"')
          s=s.replace('"database_name": "pick-pack-1291-m1-staging"','"database_name": "'+os.environ['D1_NAME']+'"')
          s=s.replace('__M1_D1_DATABASE_ID__',os.environ['PROD_D1_ID'])
          if '__M1_D1_DATABASE_ID__' in s: raise SystemExit('D1_PLACEHOLDER_REMAINS')
          Path('wrangler.live.jsonc').write_text(s)
          PY

      - name: Exchange Google OAuth token
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.access_token||"")' "$RESP")
          [[ -n "$TOKEN" ]] || { echo 'GOOGLE_OAUTH_TOKEN_MISSING'; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Live pre-deploy topology and fallback checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "$EXPECTED_SERVICE_URL/v1/authority" >/tmp/service-authority-before.json
          node - <<'NODE'
          const j=require('/tmp/service-authority-before.json'),a=j.authority||j;
          if(!j.ok||a.mode!=='SERVICE_PRIMARY'||Number(a.authority_epoch)!==Number(process.env.EXPECTED_SERVICE_EPOCH)||a.scope!=='PRODUCTION'||a.service_generation!==process.env.SERVICE_GENERATION) throw new Error('SERVICE_TOPOLOGY_UNEXPECTED:'+JSON.stringify({mode:a.mode,epoch:a.authority_epoch,scope:a.scope,generation:a.service_generation}));
          console.log('SERVICE_BEFORE='+JSON.stringify({mode:a.mode,epoch:a.authority_epoch,seq:a.authority_seq,scope:a.scope,generation:a.service_generation}));
          NODE
          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/gas-discovery-before.json
          node - <<'NODE'
          const j=require('/tmp/gas-discovery-before.json'),a=j.authority||{};
          if(!j.ok||j.authority_mode!=='GOOGLE_FALLBACK'||Number(a.authority_epoch)!==Number(process.env.EXPECTED_FALLBACK_EPOCH)||j.service_generation!==process.env.SERVICE_GENERATION||j.service_url!==process.env.EXPECTED_SERVICE_URL) throw new Error('GAS_TOPOLOGY_UNEXPECTED:'+JSON.stringify({mode:j.authority_mode,epoch:a.authority_epoch,generation:j.service_generation,url:j.service_url}));
          console.log('GAS_BEFORE='+JSON.stringify({mode:j.authority_mode,epoch:a.authority_epoch,seq:a.authority_seq,generation:j.service_generation,url:j.service_url}));
          NODE
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")')
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/fallback-before.json
          node - <<'NODE'
          const j=require('/tmp/fallback-before.json'),rows=j.values||[],body=rows.slice(1),epoch=Number(process.env.EXPECTED_FALLBACK_EPOCH);
          const p=body.filter(r=>Number(r[1])===epoch&&String(r[12]||'')==='PENDING');
          const seq=p.map(r=>Number(r[2]));
          if(p.length!==Number(process.env.EXPECTED_FALLBACK_PENDING)||JSON.stringify(seq)!==JSON.stringify([1,2,3])) throw new Error('FALLBACK_CHECKPOINT_UNEXPECTED:'+JSON.stringify({pending:p.length,seq}));
          console.log('FALLBACK_BEFORE='+JSON.stringify({epoch,pending:p.length,seq}));
          NODE
          cd service
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT COALESCE((SELECT value FROM system_meta WHERE key='m2_reconciling'),'0') AS reconciling; SELECT COUNT(*) AS epoch7_inbox FROM fallback_event_inbox WHERE authority_epoch=7; SELECT state,pending_count,retry_count,last_error_class FROM replication_status WHERE singleton_id=1;" --json)
          printf '%s' "$OUT" >/tmp/d1-before.json
          node - <<'NODE'
          const x=require('/tmp/d1-before.json'),groups=Array.isArray(x)?x:[];const rows=groups.flatMap(g=>g.results||[]),a=rows.find(r=>r.mode),lock=rows.find(r=>Object.hasOwn(r,'reconciling')),inbox=rows.find(r=>Object.hasOwn(r,'epoch7_inbox')),rep=rows.find(r=>Object.hasOwn(r,'pending_count'));
          if(!a||Number(a.authority_epoch)!==6||a.mode!=='SERVICE_PRIMARY'||a.scope!=='PRODUCTION'||a.service_generation!==process.env.SERVICE_GENERATION)throw new Error('D1_AUTHORITY_UNEXPECTED');
          if(String(lock?.reconciling||'0')==='1')throw new Error('D1_RECONCILIATION_LOCK_ACTIVE');
          if(rep&&String(rep.state||'').toUpperCase()==='FAILED')throw new Error('D1_REPLICATION_FAILED');
          console.log('D1_BEFORE='+JSON.stringify({authority:{epoch:a.authority_epoch,seq:a.authority_seq,mode:a.mode,scope:a.scope,generation:a.service_generation},reconciling:lock?.reconciling||'0',epoch7_inbox:Number(inbox?.epoch7_inbox||0),replication:rep||null}));
          NODE

      - name: Patch only GAS M2 sanitizer, preserving authority properties
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          [[ -n "$SCRIPT_ID" && -n "$DEPLOYMENT_ID" ]] || { echo 'GAS_IDENTIFIERS_MISSING'; exit 1; }
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/gas-live-before.json
          python3 - <<'PY'
          import json,hashlib
          src=json.load(open('/tmp/gas-live-before.json'))
          files=src.get('files') or []
          target=next((f for f in files if f.get('name')=='SERVICE_MIGRATION_M2' and f.get('type')=='SERVER_JS'),None)
          if not target: raise SystemExit('GAS_M2_SOURCE_MISSING_STOP_OWNER')
          s=target.get('source') or ''
          before=hashlib.sha256(s.encode()).hexdigest()
          sanitizer="function ppM2SanitizePayload_(value){if(Array.isArray(value))return value.map(ppM2SanitizePayload_);if(value&&typeof value==='object'){const out={};Object.keys(value).forEach(function(k){if(/(^|_)(token|password|verifier|secret|authorization|cookie|oauth)(_|$)/i.test(k))return;out[k]=ppM2SanitizePayload_(value[k]);});return out;}return value;}"
          changed=False
          if 'function ppM2SanitizePayload_' not in s:
            anchor="function ppM2BridgeActor_(auth,body){return {login_id:String(auth.login_id||auth.login||''),role:String(auth.role||'USER'),display_name:String(auth.display_name||auth.login_id||''),device_id:String((body||{})._device_id||'gas-legacy')};}"
            if anchor not in s: raise SystemExit('GAS_SANITIZER_INSERT_ANCHOR_MISSING_STOP_OWNER')
            s=s.replace(anchor,anchor+'\n'+sanitizer,1);changed=True
          if 'payload:ppM2SanitizePayload_(body)' not in s:
            if 'payload:body' not in s: raise SystemExit('GAS_BRIDGE_PAYLOAD_ANCHOR_MISSING_STOP_OWNER')
            s=s.replace('payload:body','payload:ppM2SanitizePayload_(body)',1);changed=True
          if 'JSON.stringify(ppM2SanitizePayload_(body||{}))' not in s:
            if 'JSON.stringify(body||{})' not in s: raise SystemExit('GAS_FALLBACK_PAYLOAD_ANCHOR_MISSING_STOP_OWNER')
            s=s.replace('JSON.stringify(body||{})','JSON.stringify(ppM2SanitizePayload_(body||{}))',1);changed=True
          for needle in ['function ppM2SanitizePayload_','payload:ppM2SanitizePayload_(body)','JSON.stringify(ppM2SanitizePayload_(body||{}))']:
            if needle not in s: raise SystemExit('GAS_SANITIZER_VERIFY_FAILED:'+needle)
          target['source']=s
          json.dump({'files':files},open('/tmp/gas-live-patched.json','w'),ensure_ascii=False,separators=(',',':'))
          after=hashlib.sha256(s.encode()).hexdigest()
          print('GAS_M2_SOURCE='+json.dumps({'before_sha256':before,'after_sha256':after,'changed':changed}))
          open('/tmp/gas-changed','w').write('1' if changed else '0')
          PY
          if [[ "$(cat /tmp/gas-changed)" == 1 ]]; then
            H=$(curl -sS -o /tmp/gas-put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-live-patched.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
            [[ "$H" == 200 ]] || { echo "GAS_SOURCE_UPDATE_HTTP_$H"; exit 1; }
            H=$(curl -sS -o /tmp/gas-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Session1 security: redact fallback and bridge secrets"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
            [[ "$H" == 200 ]] || { echo "GAS_VERSION_HTTP_$H"; exit 1; }
            V=$(node -e 'const j=require("/tmp/gas-version.json");process.stdout.write(String(j.versionNumber||""))')
            [[ -n "$V" ]] || exit 1
            node - <<'NODE' "$SCRIPT_ID" "$V"
            const fs=require('fs');fs.writeFileSync('/tmp/gas-deploy.json',JSON.stringify({deploymentConfig:{scriptId:process.argv[2],versionNumber:Number(process.argv[3]),manifestFileName:'appsscript',description:'Session1 security sanitizer'}}));
            NODE
            H=$(curl -sS -o /tmp/gas-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/gas-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
            [[ "$H" == 200 ]] || { echo "GAS_DEPLOY_HTTP_$H"; exit 1; }
          fi
          OK=false
          for i in $(seq 1 12); do
            curl -fsSL -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/gas-discovery-after-sanitizer.json || true
            if node -e 'const j=require("/tmp/gas-discovery-after-sanitizer.json");const a=j.authority||{};process.exit(j.ok&&j.authority_mode==="GOOGLE_FALLBACK"&&Number(a.authority_epoch)===7&&j.service_generation===process.env.SERVICE_GENERATION&&j.service_url===process.env.EXPECTED_SERVICE_URL?0:1)'; then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { echo 'GAS_SANITIZER_CHANGED_TOPOLOGY_STOP'; exit 1; }
          echo 'GAS_SANITIZER_DEPLOY=PASS authority unchanged GOOGLE_FALLBACK/7'

      - name: Apply non-destructive D1 migrations
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.live.jsonc
          OUT=$(npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "SELECT name FROM d1_migrations ORDER BY id; SELECT COUNT(*) AS import_columns FROM pragma_table_info('import_batches'); SELECT COUNT(*) AS push_columns FROM pragma_table_info('push_devices'); SELECT COUNT(*) AS redact_columns FROM pragma_table_info('fallback_event_inbox') WHERE name IN ('source_checksum_verified','sanitized_checksum');" --json)
          printf '%s' "$OUT" >/tmp/migrations-after.json
          node - <<'NODE'
          const x=require('/tmp/migrations-after.json'),rows=x.flatMap(g=>g.results||[]),names=rows.filter(r=>r.name).map(r=>r.name);const ic=rows.find(r=>Object.hasOwn(r,'import_columns')),pc=rows.find(r=>Object.hasOwn(r,'push_columns')),rc=rows.find(r=>Object.hasOwn(r,'redact_columns'));
          if(!names.includes('0004_session1_foundation.sql')||Number(ic?.import_columns||0)<10||Number(pc?.push_columns||0)<10||Number(rc?.redact_columns||0)!==2)throw new Error('SESSION1_MIGRATION_VERIFY_FAILED');
          console.log('MIGRATION_VERIFY='+JSON.stringify({names,import_columns:ic.import_columns,push_columns:pc.push_columns,redact_columns:rc.redact_columns}));
          NODE

      - name: Deploy Service Worker and Web shell only
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');fs.writeFileSync('/tmp/session1-worker-secrets.json',JSON.stringify({
            SERVICE_TOKEN_SECRET:process.env.SERVICE_TOKEN_SECRET,
            M1_ADMIN_TOKEN:process.env.M2_ADMIN_TOKEN,
            GAS_BRIDGE_SHARED_SECRET:process.env.GAS_BRIDGE_SHARED_SECRET,
            GOOGLE_OAUTH_CLIENT_ID:process.env.GOOGLE_OAUTH_CLIENT_ID,
            GOOGLE_OAUTH_CLIENT_SECRET:process.env.GOOGLE_OAUTH_CLIENT_SECRET,
            GOOGLE_OAUTH_REFRESH_TOKEN:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,
            GOOGLE_STAGING_SHEET_ID:process.env.STAGING_SHEET_ID
          }));
          NODE
          chmod 600 /tmp/session1-worker-secrets.json
          npx wrangler deploy --config wrangler.live.jsonc --secrets-file /tmp/session1-worker-secrets.json 2>&1 | tee /tmp/session1-deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/session1-deploy.log | tail -1 || true)
          [[ "$URL" == "$EXPECTED_SERVICE_URL" ]] || { echo "DEPLOY_URL_UNEXPECTED:$URL"; exit 1; }
          echo "DEPLOYED_SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Post-deploy health, capability, performance and topology verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 "$EXPECTED_SERVICE_URL/health" >/tmp/health-after.json
          curl -fsS --retry 5 --retry-delay 2 "$EXPECTED_SERVICE_URL/v1/capabilities" >/tmp/cap-after.json
          curl -fsS --retry 5 --retry-delay 2 "$EXPECTED_SERVICE_URL/v1/authority" >/tmp/authority-after.json
          curl -fsS --retry 5 --retry-delay 2 "$EXPECTED_SERVICE_URL/" >/tmp/web-after.html
          node - <<'NODE'
          const h=require('/tmp/health-after.json'),c=require('/tmp/cap-after.json'),j=require('/tmp/authority-after.json'),a=j.authority||j;
          if(!h.ok||h.environment!=='production'||h.generation!==process.env.SERVICE_GENERATION)throw new Error('POST_HEALTH_INVALID');
          if(!c.ok||Number(c.business_window)!==7||!c.mutation_batch||!c.fcm_wake||!c.import_engine||c.realtime_protocol!=='INVALIDATION_V1')throw new Error('POST_CAPABILITIES_INVALID');
          if(!j.ok||a.mode!=='SERVICE_PRIMARY'||Number(a.authority_epoch)!==6||a.scope!=='PRODUCTION'||a.service_generation!==process.env.SERVICE_GENERATION)throw new Error('POST_AUTHORITY_CHANGED');
          console.log('POST_SERVICE='+JSON.stringify({health:{environment:h.environment,generation:h.generation,authority:h.authority,replication:h.replication},capabilities:{business_window:c.business_window,mutation_batch:c.mutation_batch,fcm_wake:c.fcm_wake,import_engine:c.import_engine,realtime_protocol:c.realtime_protocol},authority:{epoch:a.authority_epoch,seq:a.authority_seq,mode:a.mode,scope:a.scope,generation:a.service_generation}}));
          NODE
          grep -q 'PICK PACK 1291' /tmp/web-after.html
          echo 'HEALTH_BENCHMARK_SECONDS'
          for i in $(seq 1 10); do curl -fsS -o /dev/null -w '%{time_total}\n' "$EXPECTED_SERVICE_URL/health"; done | tee /tmp/health-times.txt
          python3 - <<'PY'
          import statistics
          xs=[float(x) for x in open('/tmp/health-times.txt') if x.strip()]
          print('HEALTH_BENCH='+str({'samples':len(xs),'min_ms':round(min(xs)*1000,1),'median_ms':round(statistics.median(xs)*1000,1),'max_ms':round(max(xs)*1000,1),'mean_ms':round(statistics.mean(xs)*1000,1)}))
          PY
          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" -d '{"action":"service_discovery"}' >/tmp/gas-discovery-post.json
          node - <<'NODE'
          const j=require('/tmp/gas-discovery-post.json'),a=j.authority||{};if(!j.ok||j.authority_mode!=='GOOGLE_FALLBACK'||Number(a.authority_epoch)!==7||j.service_url!==process.env.EXPECTED_SERVICE_URL)throw new Error('POST_GAS_TOPOLOGY_CHANGED');console.log('POST_GAS='+JSON.stringify({mode:j.authority_mode,epoch:a.authority_epoch,seq:a.authority_seq,generation:j.service_generation,url:j.service_url}));
          NODE
          RANGE=$(node -p 'encodeURIComponent("__PP_M2_FALLBACK_EVENTS!A:M")')
          curl -fsS -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$SOURCE_SHEET_ID/values/$RANGE?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE" >/tmp/fallback-post.json
          node - <<'NODE'
          const rows=(require('/tmp/fallback-post.json').values||[]).slice(1),p=rows.filter(r=>Number(r[1])===7&&String(r[12]||'')==='PENDING');if(p.length!==3)throw new Error('POST_FALLBACK_COUNT_CHANGED:'+p.length);console.log('POST_FALLBACK='+JSON.stringify({epoch:7,pending:p.length,seq:p.map(r=>Number(r[2]))}));
          NODE
          echo 'SESSION1_SERVICE_DEPLOY=PASS_NO_AUTHORITY_CHANGE_NO_STABLE_NO_APK'
