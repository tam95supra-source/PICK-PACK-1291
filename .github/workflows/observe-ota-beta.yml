name: Observe Beta OTA Release

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/ota-beta-observe.txt'

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record OTA release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "${{ github.repository }}" --workflow ota-beta-release.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle > ops/ota-beta-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ota-beta-status.json
          git commit -m 'chore: record beta OTA release status' || true
          git push origin HEAD:main || true
