name: Diagnose BH staff transport live
on:
  push:
    branches: [main]
    paths:
      - 'ops/diagnose-bh-staff-transport-live.trigger'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prepare diagnostic route
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$TOKEN"; printf '%s' "$TOKEN" >/tmp/google-token; chmod 600 /tmp/google-token
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID"|tr -d '\r\n\t '); RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID"|tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          printf '%s' "$SCRIPT_ID" >/tmp/script-id; printf '%s' "$DEPLOYMENT_ID" >/tmp/deployment-id
          echo "::add-mask::$TOKEN"; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"
          PROBE_TOKEN=$(openssl rand -hex 24); echo "::add-mask::$PROBE_TOKEN"; printf '%s' "$PROBE_TOKEN" >/tmp/probe-token; chmod 600 /tmp/probe-token
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=Path('google-apps-script'); files=[]
          for p in sorted(b.glob('*.gs')): files.append({'name':p.stem,'type':'SERVER_JS','source':p.read_text()})
          files.append({'name':'appsscript','type':'JSON','source':(b/'appsscript.json').read_text()})
          Path('/tmp/canonical.json').write_text(json.dumps({'files':files},ensure_ascii=False))
          token=Path('/tmp/probe-token').read_text(); temp=json.loads(Path('/tmp/canonical.json').read_text())
          main=[f for f in temp['files'] if f.get('name')=='PICK_PACK_API' and f.get('type')=='SERVER_JS']; assert len(main)==1
          anchor="    const action = String(body.action || '').trim();\n"; assert anchor in main[0]['source']
          route=f'''\n    if (action === '__ci_bh_transport_probe__' && String(body.probe_token || '') === '{token}') {{\n      try {{\n        const out = ppBaoHangBridgePost_({{action:'staff-source-ping',event_id:'ci-transport-'+Utilities.getUuid(),source_id:PP_BH_STAFF_BRIDGE.SOURCE_ID,source_tab:PP_BH_STAFF_BRIDGE.SOURCE_TAB,change_type:'TRANSPORT_PROBE',row_start:404,row_end:404,col_start:1,col_end:6,old_codes:{{'404':'909090'}},at:new Date().toISOString()}});\n        return ppJson_({{ok:true,bridge:out}});\n      }} catch(err) {{ return ppJson_({{ok:false,error:String(err && err.message || err).slice(0,220)}}); }}\n    }}\n'''
          main[0]['source']=main[0]['source'].replace(anchor,anchor+route,1)
          Path('/tmp/diagnostic.json').write_text(json.dumps(temp,ensure_ascii=False))
          PY
      - name: Deploy diagnostic version
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/google-token); SCRIPT_ID=$(cat /tmp/script-id); DEPLOYMENT_ID=$(cat /tmp/deployment-id)
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/diagnostic.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" >/tmp/update.out
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Temporary staff bridge transport diagnostic"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" >/tmp/version.json
          V=$(python3 -c 'import json;print(json.load(open("/tmp/version.json"))["versionNumber"])'); printf '%s' "$V" >/tmp/diag-version
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack transport diagnostic'}}))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/tmp/deploy.out
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" >/tmp/deployment-live.json
          python3 - <<'PY' >/tmp/web-url
          import json
          j=json.load(open('/tmp/deployment-live.json')); web=[e.get('webApp',{}) for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert web and web[0].get('url'); print(web[0]['url'])
          PY
      - name: Call transport diagnostic
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat /tmp/web-url); P=$(cat /tmp/probe-token)
          : >/tmp/diag-response.json
          for i in $(seq 1 20); do
            curl -fsSL -H 'content-type: text/plain;charset=UTF-8' "$URL" -d "{\"action\":\"__ci_bh_transport_probe__\",\"probe_token\":\"$P\"}" >/tmp/diag-response.json || true
            if jq -e 'has("ok") and ((.error // "") != "UNKNOWN_ACTION")' /tmp/diag-response.json >/dev/null 2>&1; then break; fi
            sleep 3
          done
          jq -e 'has("ok")' /tmp/diag-response.json >/dev/null
      - name: Restore canonical source
        if: always()
        shell: bash
        run: |
          set +e
          TOKEN=$(cat /tmp/google-token 2>/dev/null); SCRIPT_ID=$(cat /tmp/script-id 2>/dev/null); DEPLOYMENT_ID=$(cat /tmp/deployment-id 2>/dev/null)
          [[ -n "$TOKEN" && -n "$SCRIPT_ID" && -n "$DEPLOYMENT_ID" && -s /tmp/canonical.json ]] || { echo SKIPPED >/tmp/restore-result; exit 0; }
          H=$(curl -sS -o /tmp/restore.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/canonical.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { echo SOURCE_FAIL >/tmp/restore-result; exit 0; }
          H=$(curl -sS -o /tmp/final-version.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"description":"Restore canonical source after staff transport diagnostic"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { echo VERSION_FAIL >/tmp/restore-result; exit 0; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/final-version.json"))["versionNumber"])'); printf '%s' "$V" >/tmp/final-version
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          open('/tmp/final-deploy.json','w').write(json.dumps({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API'}}))
          PY
          H=$(curl -sS -o /tmp/final-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/final-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          [[ "$H" == 200 ]] && echo PASS >/tmp/restore-result || echo DEPLOY_FAIL >/tmp/restore-result
      - name: Record sanitized diagnostic proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESTORE=$(cat /tmp/restore-result 2>/dev/null || echo UNKNOWN); DV=$(cat /tmp/diag-version 2>/dev/null || echo 0); FV=$(cat /tmp/final-version 2>/dev/null || echo 0)
          python3 - "$RESTORE" "$DV" "$FV" <<'PY'
          import datetime,json,sys
          try: r=json.load(open('/tmp/diag-response.json'))
          except: r={}
          raw=str(r.get('error',''))
          if r.get('ok') is True: outcome='PASS'
          elif 'STAFF_BRIDGE_OAUTH_REQUIRED' in raw: outcome='OAUTH_REQUIRED'
          elif 'STAFF_BRIDGE_SENDER_DENIED' in raw: outcome='SENDER_DENIED'
          elif 'BH_BRIDGE_HTTP_' in raw: outcome='BRIDGE_HTTP_ERROR'
          elif raw: outcome='OTHER_ERROR'
          else: outcome='NO_RESPONSE'
          bridge=r.get('bridge') if isinstance(r.get('bridge'),dict) else {}
          proof={'status':'PASS' if outcome=='PASS' and sys.argv[1]=='PASS' else 'DIAGNOSED','transport_outcome':outcome,'receiver_ok':bridge.get('ok') is True,'receiver_changed':bridge.get('changed'),'canonical_restore':sys.argv[1],'diagnostic_gas_version':int(sys.argv[2] or 0),'final_gas_version':int(sys.argv[3] or 0),'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open('ops/bh-staff-transport-diagnostic-proof.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
          cat ops/bh-staff-transport-diagnostic-proof.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bh-staff-transport-diagnostic-proof.json
          git diff --cached --quiet || git commit -m 'chore(gas): record staff bridge transport diagnostic'
          git pull --rebase origin main; git push origin HEAD:main
