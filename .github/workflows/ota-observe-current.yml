name: Temporary Beta OTA Observer

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/ota-beta-observe.txt'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record OTA and beta4 toolkit workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ota-beta-release.yml --limit 6 --json databaseId,status,conclusion,headSha,displayTitle > ops/ota-beta-status.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-beta4-final.yml --limit 10 --json databaseId,status,conclusion,headSha,displayTitle > ops/beta4-toolkit-runs.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ota-beta-status.json ops/beta4-toolkit-runs.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record beta OTA and beta4 toolkit status'
          git pull --rebase origin main
          git push origin HEAD:main
