name: Temporary Beta OTA Finalizer

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/ota-beta-observe.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize transport comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt')
          s=p.read_text(encoding='utf-8')
          old=' * the Android process: authentication uses PBKDF2 + challenge/HMAC proof.'
          new=' * Password plaintext never leaves the Android process: authentication uses PBKDF2 + challenge/HMAC proof.'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          git commit -m 'chore: finalize approved transport wording'
          git pull --rebase origin main
          git push origin HEAD:main
