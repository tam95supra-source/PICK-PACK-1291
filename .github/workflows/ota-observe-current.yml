name: Temporary Beta OTA Observer

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/ota-beta-observe.txt'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record OTA workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ota-beta-release.yml --limit 6 --json databaseId,status,conclusion,headSha,displayTitle > /tmp/status.json
          cp /tmp/status.json ops/ota-beta-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ota-beta-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record current beta OTA status'
          git pull --rebase origin main
          git push origin HEAD:main
