name: Build Beta4 Final Candidate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-beta4-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      OWNER_ART_SHA256: 371d0e5ad552e3cf63eef60a3da270896946458a506252a7fa132a67747c7a5d
    steps:
      - uses: actions/checkout@v4

      - name: Verify beta4 source gates
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/owner_launcher.png
          echo "$OWNER_ART_SHA256  app/src/main/res/drawable-nodpi/owner_launcher.png" | sha256sum -c -
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.4"' app/build.gradle.kts
          grep -q 'QUÊN MẬT KHẨU?' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'User Pick (tùy chọn)' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'PDA (nhập 5 số cuối seri)' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -q 'include_options", false' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          echo 'Beta4 Android source gates: PASS'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bootstrap verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile Beta4 and Stable
        shell: bash
        run: |
          set -euo pipefail
          # Legacy source contains a few minified `return"` tokens; keep the proven CI normalization until source cleanup.
          sed -i 's/return"/return "/g' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          gradle --no-daemon :app:assembleBetaRelease :app:assembleStableRelease
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$BETA" > /tmp/badge.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badge.txt
          grep -q "versionCode='10'" /tmp/badge.txt
          grep -q "versionName='0.4.2-beta.4'" /tmp/badge.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump resources "$BETA" > /tmp/resources.txt
          grep -q 'owner_launcher' /tmp/resources.txt
          echo 'Beta4 compile + package + launcher resource: PASS'

      - name: Upload Beta4 signing toolkit
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-beta-v0.4.2-beta.4-signing-toolkit
          path: |
            app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0/lib/apksigner.jar
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0/zipalign
          retention-days: 2
