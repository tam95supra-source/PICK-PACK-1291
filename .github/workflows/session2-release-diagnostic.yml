name: Session2 Release Diagnostic

on:
  push:
    branches: [ agent/service-migration-m2 ]
    paths: [ 'ops/session2-release-diagnostic-trigger.txt' ]

permissions:
  contents: write

concurrency:
  group: session2-release-diagnostic
  cancel-in-progress: true

env:
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  STABLE_FOLDER_ID: 1kxTd2rFfWutc2KWDwqgK8WYWDmSygIN4

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_GOOGLE_APP_ID: ${{ secrets.FIREBASE_GOOGLE_APP_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized diagnostic
        shell: bash
        run: |
          set +e
          OUT=/tmp/session2-release-diagnostic-result.txt
          : > "$OUT"
          echo "checked_at=$(date -u +%FT%TZ)" >> "$OUT"
          echo "head_sha=$GITHUB_SHA" >> "$OUT"

          missing=""
          for v in ANDROID_SIGNING_KEY_B64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN FIREBASE_PROJECT_ID FIREBASE_GOOGLE_APP_ID FIREBASE_API_KEY FIREBASE_GCM_SENDER_ID; do
            [[ -n "${!v:-}" ]] || missing="${missing}${missing:+,}${v}"
          done
          if [[ -n "$missing" ]]; then echo "release_bindings=MISSING:$missing" >> "$OUT"; else echo "release_bindings=READY" >> "$OUT"; fi

          curl -fsSL --max-time 15 "$SERVICE_URL/health" >/tmp/health.json
          if [[ $? -eq 0 ]] && jq -e '.ok==true and .environment=="production" and .generation=="m2-prod-20260819-001"' /tmp/health.json >/dev/null 2>&1; then
            echo "service_health=PASS" >> "$OUT"
            jq -r '"service_authority="+(.authority.mode//"UNKNOWN")+" epoch="+((.authority.authority_epoch//0)|tostring)+" seq="+((.authority.authority_seq//0)|tostring)' /tmp/health.json >> "$OUT"
          else echo "service_health=FAIL" >> "$OUT"; fi

          curl -fsSL --max-time 15 "$SERVICE_URL/v1/capabilities" >/tmp/cap.json
          if [[ $? -eq 0 ]] && jq -e '.ok==true and .business_window==7 and .mutation_batch==true and .fcm_wake==true and .import_engine==true and .realtime_protocol=="INVALIDATION_V1"' /tmp/cap.json >/dev/null 2>&1; then echo "capabilities=PASS" >> "$OUT"; else echo "capabilities=FAIL" >> "$OUT"; fi

          if curl -fsSL --max-time 15 "$SERVICE_URL/" | grep -q 'Import dữ liệu' && curl -fsSL --max-time 15 "$SERVICE_URL/history-admin.html" | grep -q 'Lịch sử toàn phần'; then echo "web_product=PASS" >> "$OUT"; else echo "web_product=FAIL" >> "$OUT"; fi

          if [[ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" && -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" && -n "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" ]]; then
            TOKEN=$(curl -fsSL --max-time 15 https://oauth2.googleapis.com/token --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token' | jq -r '.access_token // empty')
            if [[ -n "$TOKEN" ]]; then
              for pair in "beta:$BETA_FOLDER_ID" "stable:$STABLE_FOLDER_ID"; do
                name=${pair%%:*}; folder=${pair#*:}; q=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote("\"%s\" in parents and trashed=false"%sys.argv[1]))' "$folder")
                curl -fsSL --max-time 15 -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=$q&fields=files(id,name,size)&pageSize=1000" > "/tmp/$name.json"
              done
              if jq -e '[.files[]|select(.name|test("0\\.4\\.2-beta\\.23|beta23";"i"))]|length>0' /tmp/beta.json >/dev/null; then echo "beta23_drive=PRESENT" >> "$OUT"; else echo "beta23_drive=ABSENT" >> "$OUT"; fi
              if jq -e '.files|length==0' /tmp/stable.json >/dev/null; then echo "stable_drive=EMPTY" >> "$OUT"; else echo "stable_drive=NONEMPTY" >> "$OUT"; fi
            else echo "drive_oauth=FAIL" >> "$OUT"; fi
          else echo "drive_oauth=NOT_CHECKED_MISSING_BINDINGS" >> "$OUT"; fi

          cat "$OUT"
      - name: Commit sanitized diagnostic result
        shell: bash
        run: |
          cp /tmp/session2-release-diagnostic-result.txt ops/session2-release-diagnostic-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/session2-release-diagnostic-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: record sanitized Session2 release diagnostic'
          git push
