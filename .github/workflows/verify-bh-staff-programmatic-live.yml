name: Verify BH staff programmatic live
on:
  push:
    branches: [main]
    paths:
      - 'ops/verify-bh-staff-programmatic-live.trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify deployed GAS version and live health
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          RESP=$(curl -fsS https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          test -n "$SCRIPT_ID"; test -n "$DEPLOYMENT_ID"; test -n "$TOKEN"
          echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"; echo "::add-mask::$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/deploy.json
          V=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/deploy.json'))
          print(j.get('deploymentConfig',{}).get('versionNumber',''))
          PY
          )
          test -n "$V"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content?versionNumber=$V" > /tmp/content.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/content.json'))
          src='\n'.join(f.get('source','') for f in j.get('files',[]) if f.get('type')=='SERVER_JS')
          assert 'function ppBaoHangBridgeNotifyServiceStaffMutation_' in src, 'BRIDGE_HELPER_NOT_DEPLOYED'
          assert "ppBaoHangBridgeNotifyServiceStaffMutation_(eventId,row,oldCode,'UPSERT')" in src, 'UPSERT_BRIDGE_NOT_DEPLOYED'
          assert "ppBaoHangBridgeNotifyServiceStaffMutation_(eventId,row,mnv,'DELETE')" in src, 'DELETE_BRIDGE_NOT_DEPLOYED'
          print('DEPLOYED_SOURCE_MARKERS=PASS')
          PY
          WEB_URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/deploy.json'))
          eps=j.get('entryPoints',[])
          web=[e.get('webApp',{}) for e in eps if e.get('entryPointType')=='WEB_APP']
          assert web and web[0].get('url'), 'WEB_APP_MISSING'
          print(web[0]['url'])
          PY
          )
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 "$WEB_URL" -o /tmp/health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json'))
          assert j.get('ok') is True, j
          assert j.get('service')=='pick-pack-gsheet-api', j
          print('LIVE_HEALTH=PASS')
          PY
          python3 - "$V" <<'PY'
          import datetime,json,sys
          proof={
            'status':'PASS',
            'mode':'PROGRAMMATIC_STAFF_BRIDGE_V1',
            'gas_version':int(sys.argv[1]),
            'upsert_bridge':'PASS',
            'delete_bridge':'PASS',
            'live_health':'PASS',
            'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('ops/bh-staff-programmatic-live-proof.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
      - name: Commit sanitized proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/bh-staff-programmatic-live-proof.json
          git commit -m 'chore(gas): record programmatic staff bridge live proof'
          git pull --rebase origin main
          git push origin HEAD:main
