name: Session1 Apply Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-migration-m2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic source patches once
        run: |
          set -euo pipefail
          if grep -Fq 'e.committed_at,e.payload_json,e.idempotency_key' service/src/replication.ts; then
            python3 scripts/session1_apply.py
          else
            echo 'base session1 patch already present'
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('service/src/replication.ts');s=p.read_text()
          old='const [header,ids]=await batchGetValues(id,token,[["__M1_SERVICE_REPLICA","A1:T1"],["__M1_SERVICE_REPLICA","A2:A"]]);'
          new='const [header=[],ids=[]]=await batchGetValues(id,token,[["__M1_SERVICE_REPLICA","A1:T1"],["__M1_SERVICE_REPLICA","A2:A"]]);'
          if new in s: pass
          elif old in s: s=s.replace(old,new)
          else: raise SystemExit('replication strictness anchor missing')
          p.write_text(s)
          PY
          if ! grep -Fq 'importCommitAtomic' service/src/index.ts; then python3 scripts/session1_followup.py; else echo 'followup patch already present'; fi
          if grep -Fq 'req.client_source==="WEB"?0:7' service/src/core.ts; then python3 scripts/session1_policy_followup.py; else echo 'historical correction policy already bounded'; fi
          python3 scripts/session1_typefix.py
      - name: Verify source contract guards
        run: |
          set -euo pipefail
          grep -F 'e.committed_at,e.idempotency_key,e.origin,e.schema_version,e.checksum,e.payload_json' service/src/replication.ts
          ! grep -F 'e.committed_at,e.payload_json,e.idempotency_key' service/src/replication.ts
          grep -F 'const [header=[],ids=[]]' service/src/replication.ts
          grep -F 'replicateMasterProjection' service/src/replication.ts
          grep -F 'LIMIT 7' service/src/entry.ts
          ! grep -F 'ORDER BY sequence_no DESC LIMIT 45' service/src/index.ts
          grep -F 'const writeWindow=auth.role==="SUPERADMIN"?7:2' service/src/core.ts
          grep -F 'BUSINESS_DATE_OUTSIDE_VIEW_WINDOW' service/src/index.ts
          grep -F 'client_source?: "PDA" | "WEB" | "FILE_IMPORT"' service/src/domain.ts
          grep -F 'source_checksum_verified' service/src/recovery.ts
          grep -F 'ppM2SanitizePayload_' google-apps-script/SERVICE_MIGRATION_M2.gs
          grep -F 'importCommitAtomic' service/src/index.ts
          grep -F 'scope==="master"' service/src/index.ts
          ! grep -F 'for(let i=0;i<stmts.length;i+=100)await env.DB.batch' service/src/import_engine.ts
      - name: Typecheck Service
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run cf:types
          npm run typecheck
      - name: Empty database migration gate
        run: |
          set -euo pipefail
          rm -f /tmp/pp1291-session1.db
          for f in service/migrations/*.sql; do echo "APPLY $f"; sqlite3 /tmp/pp1291-session1.db < "$f"; done
          sqlite3 /tmp/pp1291-session1.db "PRAGMA integrity_check; SELECT COUNT(*) FROM pragma_table_info('import_batches'); SELECT COUNT(*) FROM pragma_table_info('push_devices'); SELECT COUNT(*) FROM pragma_table_info('fallback_event_inbox') WHERE name IN ('source_checksum_verified','sanitized_checksum');"
      - name: Architecture, permission and secret guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=Path('service/src/core.ts').read_text();entry=Path('service/src/entry.ts').read_text();gas=Path('google-apps-script/SERVICE_MIGRATION_M2.gs').read_text();idx=Path('service/src/index.ts').read_text();imp=Path('service/src/import_engine.ts').read_text();atomic=Path('service/src/import_atomic.ts').read_text();master=Path('service/src/master_replication.ts').read_text()
          assert core.count('const SENSITIVE_KEY=')==1
          assert idx.count('import { dayDeltaV2, masterDeltaV2, syncStatusV2 }')==1
          assert idx.count('const im=p.match(')==1
          assert 'BUSINESS_DATE_OUTSIDE_PDA_7_DAY_WINDOW' in core
          assert 'LABOR_ADMIN_REQUIRED' in core and 'SHADOW_PROBE_SUPERADMIN_REQUIRED' in core
          assert 'MUTATION_BATCH_INVALID' in idx
          assert 'HISTORICAL_CORRECTION' in Path('service/src/correction.ts').read_text()
          assert 'IMPORT_ROLLBACK_INSERT_REQUIRES_EXPLICIT_CORRECTION' in atomic
          assert 'await env.DB.batch(stmts)' in atomic and 'MAX_CHANGED_ROWS=4000' in atomic
          assert 'select_values' in imp and 'importRuleError' in imp
          assert 'GOOGLE_MASTER_BATCH_WRITE' in master
          assert 'FCM_WAKE_ONLY' in Path('service/src/push.ts').read_text()
          assert 'Firebase' not in Path('service/wrangler.jsonc').read_text()
          assert 'ppM2SanitizePayload_' in gas and 'source_checksum_verified' in entry
          print('SESSION1_ARCHITECTURE_GUARDS=PASS')
          PY
      - name: Commit tested source changes
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No patch changes to commit'; exit 0; fi
          git config user.name 'pp1291-session1-bot'
          git config user.email 'pp1291-session1-bot@users.noreply.github.com'
          git add service/src service/public/app.js google-apps-script/SERVICE_MIGRATION_M2.gs
          git commit -m 'feat: finalize session1 service import realtime contracts'
          git push origin HEAD:agent/service-migration-m2
