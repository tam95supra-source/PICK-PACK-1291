name: Session12 Drive OAuth Diagnostic
on:
  push:
    branches: [agent/service-migration-m2]
    paths: [ops/session12-drive-oauth-diagnostic-trigger.txt]
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      APK_ID: 11Pngzs7Sio4Xl2WW6kPjUbjsMXd2mEyc
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/service-migration-m2, fetch-depth: 0 }
      - name: Diagnose token and Drive read without exposing credentials
        shell: bash
        run: |
          set -u
          OUT=/tmp/r;echo "checked_at=$(date -u +%FT%TZ)" >"$OUT";echo "head_sha=$GITHUB_SHA" >>"$OUT"
          missing=0;for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN;do if [[ -z "${!v:-}" ]];then echo "missing_secret=$v" >>"$OUT";missing=1;fi;done
          if [[ "$missing" = 1 ]];then echo verdict=MISSING_SECRET >>"$OUT";exit 0;fi
          HTTP=$(curl -sS -o /tmp/token.json -w '%{http_code}' https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token' || true);echo "token_http=$HTTP" >>"$OUT"
          ERR=$(jq -r '.error // empty' /tmp/token.json 2>/dev/null);DESC=$(jq -r '.error_description // empty' /tmp/token.json 2>/dev/null|tr '\n\r' ' '|cut -c1-180);[[ -n "$ERR" ]]&&echo "token_error=$ERR" >>"$OUT";[[ -n "$DESC" ]]&&echo "token_error_description=$DESC" >>"$OUT"
          TOKEN=$(jq -r '.access_token // empty' /tmp/token.json 2>/dev/null);if [[ -z "$TOKEN" ]];then echo verdict=TOKEN_UNAVAILABLE >>"$OUT";exit 0;fi;echo '::add-mask::'$TOKEN
          FHTTP=$(curl -sS -o /tmp/file.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files/$APK_ID?fields=id,name,size,parents,shared&supportsAllDrives=true" || true);echo "file_http=$FHTTP" >>"$OUT";if [[ "$FHTTP" = 200 ]];then jq -r '"file_id="+.id,"file_name="+.name,"file_size="+(.size|tostring),"file_shared="+(.shared|tostring)' /tmp/file.json >>"$OUT";fi
          PHTTP=$(curl -sS -o /tmp/perms.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files/$APK_ID/permissions?fields=permissions(type,role,allowFileDiscovery)&supportsAllDrives=true" || true);echo "permissions_http=$PHTTP" >>"$OUT";if [[ "$PHTTP" = 200 ]];then jq -r '"anyone_reader_count="+([.permissions[]|select(.type=="anyone" and .role=="reader")]|length|tostring)' /tmp/perms.json >>"$OUT";fi
          if [[ "$FHTTP" = 200 && "$PHTTP" = 200 ]];then echo verdict=OAUTH_DRIVE_READ_PASS >>"$OUT";else echo verdict=OAUTH_DRIVE_READ_FAIL >>"$OUT";fi
      - name: Record diagnostic
        if: always()
        shell: bash
        run: |
          test -f /tmp/r || echo result_missing=true >/tmp/r;cp /tmp/r /tmp/c;git reset --hard HEAD >/dev/null;git pull --rebase origin agent/service-migration-m2 || true;cp /tmp/c ops/session12-drive-oauth-diagnostic-result.txt;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add ops/session12-drive-oauth-diagnostic-result.txt;git diff --cached --quiet || git commit -m 'ops: record Drive OAuth diagnostic';git push origin HEAD:agent/service-migration-m2
