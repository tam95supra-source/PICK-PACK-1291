name: Service M2 Beta20 OTA Observer

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/service-m2-beta20-ota-observer.yml'
      - 'ops/m2-beta20-ota-publish-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe-beta20:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/service-migration-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: 357f8eea2843451cfaa577f2680f57ef8cd17ae8
      GAS_WEB_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
      EXPECTED_VERSION: 0.4.2-beta.20
      EXPECTED_SHA256: ed5b98afeaf962b1081faaab4c710afa00f2fc80981b76666a86d8bee856502e
      EXPECTED_GENERATION: m2-prod-20260819-001
    steps:
      - name: Find and wait for exact Beta20 OTA publisher run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 60); do
            DATA=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/service-m2-beta20-ota-publish.yml/runs?branch=agent%2Fservice-migration-m2&per_page=20")
            RUN_ID=$(node -e 'const j=JSON.parse(process.argv[1]),sha=process.env.TARGET_HEAD_SHA,x=(j.workflow_runs||[]).find(r=>r.head_sha===sha&&r.event==="push");process.stdout.write(x?String(x.id):"")' "$DATA")
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo BETA20_PUBLISHER_RUN_NOT_FOUND >&2; exit 1; }
          echo "PUBLISHER_RUN_ID=$RUN_ID" | tee -a "$GITHUB_ENV"
          for i in $(seq 1 360); do
            R=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
            STATUS=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.status||"")' "$R")
            CONCLUSION=$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.conclusion||"")' "$R")
            echo "beta20 publisher status=$STATUS conclusion=$CONCLUSION"
            if [[ "$STATUS" == completed ]]; then
              if [[ "$CONCLUSION" != success ]]; then
                gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
                exit 1
              fi
              break
            fi
            sleep 5
          done
          R=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          [[ "$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.status||"")' "$R")" == completed ]]
          [[ "$(node -e 'const j=JSON.parse(process.argv[1]);process.stdout.write(j.conclusion||"")' "$R")" == success ]]

      - name: Verify Beta20 is offered to Beta19 and Stable remains untouched
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.19"}' >/tmp/beta.json
          cat /tmp/beta.json
          [[ "$(jq -r '.ok' /tmp/beta.json)" == true ]]
          [[ "$(jq -r '.available' /tmp/beta.json)" == true ]]
          [[ "$(jq -r '.version_name' /tmp/beta.json)" == "$EXPECTED_VERSION" ]]
          [[ "$(jq -r '.sha256' /tmp/beta.json)" == "$EXPECTED_SHA256" ]]
          [[ -n "$(jq -r '.apk_url // empty' /tmp/beta.json)" ]]

          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.20"}' >/tmp/self.json
          [[ "$(jq -r '.ok' /tmp/self.json)" == true ]]
          [[ "$(jq -r '.available' /tmp/self.json)" == false ]]
          [[ "$(jq -r '.version_name' /tmp/self.json)" == "$EXPECTED_VERSION" ]]

          curl -fsSL --retry 5 --retry-delay 2 -H 'content-type: application/json' "$GAS_WEB_URL" \
            -d '{"action":"update_check","channel":"STABLE","current_version":"0.4.2-stable.0"}' >/tmp/stable.json
          cat /tmp/stable.json
          [[ "$(jq -r '.ok' /tmp/stable.json)" == true ]]
          [[ "$(jq -r '.available' /tmp/stable.json)" == false ]]

      - name: Verify Service authority unchanged after OTA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "$SERVICE_URL/health" >/tmp/health.json
          cat /tmp/health.json
          [[ "$(jq -r '.ok' /tmp/health.json)" == true ]]
          [[ "$(jq -r '.generation' /tmp/health.json)" == "$EXPECTED_GENERATION" ]]
          [[ "$(jq -r '.authority.mode' /tmp/health.json)" == SERVICE_PRIMARY ]]
          [[ "$(jq -r '.authority.authority_epoch' /tmp/health.json)" == 4 ]]
          [[ "$(jq -r '.replication.state' /tmp/health.json)" == HEALTHY ]]
          [[ "$(jq -r '.replication.pending_count' /tmp/health.json)" == 0 ]]
          echo 'BETA20_OTA_OBSERVER=PASS'
