name: Beta Release Publish V2 GitHub

on:
  push:
    branches:
      - agent/service-migration-m2
    paths:
      - ops/beta-release-publish-v2-trigger.txt

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact candidate to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-candidate-result.txt
          grep -qx 'verdict=PASS' "$R"
          grep -qx 'stable_publish=FORBIDDEN' "$R"
          ARTIFACT_ID=$(sed -n 's/^artifact_id=//p' "$R")
          VERSION=$(sed -n 's/^beta_name=//p' "$R")
          CODE=$(sed -n 's/^beta_code=//p' "$R")
          APK_NAME=$(sed -n 's/^apk_file=//p' "$R")
          SHA=$(sed -n 's/^apk_sha256=//p' "$R")
          SIZE=$(sed -n 's/^apk_size=//p' "$R")
          SOURCE_SHA=$(sed -n 's/^source_sha=//p' "$R")
          TAG="v${VERSION}-publicbeta"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/a.zip
          mkdir /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
          APK=$(find /tmp/a -type f -name "$APK_NAME" -print -quit)
          test -n "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$SHA"
          test "$(stat -c '%s' "$APK")" = "$SIZE"
          SUM=$(find /tmp/a -type f -name 'SHA256SUMS*.txt' -print -quit)
          if [ -z "$SUM" ]; then SUM=/tmp/a/SHA256SUMS-beta.txt; printf '%s  %s\n' "$SHA" "$APK_NAME" > "$SUM"; fi
          cat > /tmp/notes.txt <<EOF
          Pick Pack 1291 Beta $VERSION
          PP_CHANNEL=BETA
          PP_VERSION=$VERSION
          PP_VERSION_CODE=$CODE
          PP_SHA256=$SHA
          PP_SIZE=$SIZE
          PP_APK_NAME=$APK_NAME
          PP_MANDATORY=false
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pick Pack 1291 $VERSION" --notes-file /tmp/notes.txt --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Pick Pack 1291 $VERSION" --notes-file /tmp/notes.txt --prerelease
          fi
          gh release upload "$TAG" "$APK#$APK_NAME" "$SUM#$(basename "$SUM")" --repo "$GITHUB_REPOSITORY" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o /tmp/live.apk
          test "$(sha256sum /tmp/live.apk | awk '{print $1}')" = "$SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY' > /tmp/old.tsv
          import json,re
          a=[]
          for r in json.load(open('/tmp/releases.json')):
            m=re.fullmatch(r'v0\.4\.2-beta\.(\d+)-publicbeta',r.get('tag_name',''))
            if m:a.append((int(m.group(1)),r['id'],r['tag_name']))
          a.sort(reverse=True)
          for _,i,t in a[10:]:print(str(i)+'\t'+t)
          PY
          while IFS=$'\t' read -r id tag; do
            [ -z "${id:-}" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done < /tmp/old.tsv
          COUNT=$(python3 - <<'PY'
          import json,re
          print(sum(1 for r in json.load(open('/tmp/releases.json')) if re.fullmatch(r'v0\.4\.2-beta\.\d+-publicbeta',r.get('tag_name',''))))
          PY
          )
          cat > /tmp/receipt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          version=$VERSION
          version_code=$CODE
          artifact_id=$ARTIFACT_ID
          apk_sha256=$SHA
          apk_size=$SIZE
          release_tag=$TAG
          release_url=$URL
          beta_retention=10
          beta_release_count=$COUNT
          stable=UNTOUCHED
          pr38_merge=FORBIDDEN
          verdict=PASS
          EOF
          cp /tmp/receipt ops/beta-release-publish-v2-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta-release-publish-v2-result.txt
          git commit -m 'ops: record GitHub Beta release publish' || true
          git pull --rebase origin agent/service-migration-m2
          git push origin HEAD:agent/service-migration-m2
