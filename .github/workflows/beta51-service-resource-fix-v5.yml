name: Beta51 Service Resource Logic V5
on:
  push:
    branches: [agent/service-migration-m2]
    paths: ['.github/workflows/beta51-service-resource-fix-v5.yml']
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/service-migration-m2, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch and source assertions
        id: patch
        run: python3 tools/apply_beta51_service_resource_logic_v3.py
      - name: Typecheck
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Canonical contract gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=Path('service/src/mobile_hotfix.ts').read_text(); c=Path('service/src/core.ts').read_text(); s=Path('service/src/session_hotfix.ts').read_text()
          assert 'user_picks_reissue' in m and 'pack_tables_reissue' in m
          assert 'ensureDailyUserReuseAllowed' in c and 'allowDailyReplay' in c
          assert 'duplicate_user:duplicateUser' in s
          assert 'WHERE pack_table=?1 AND user_pack=?2 AND shift=?3' not in s
          assert 'WHERE pack_table=?1 AND user_pack=?2 AND available=1' in s
          print('BETA51_SERVICE_CANONICAL_GATE=PASS')
          PY
      - name: Commit canonical service source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json
          rm -f service/worker-configuration.d.ts worker-configuration.d.ts
          rm -f tools/apply_beta51_service_resource_logic.py tools/apply_beta51_service_resource_logic_v3.py
          rm -f .github/workflows/beta51-service-resource-fix.yml .github/workflows/beta51-service-resource-fix-v2.yml .github/workflows/beta51-service-resource-fix-v3.yml .github/workflows/beta51-service-resource-fix-v4.yml .github/workflows/beta51-service-resource-fix-v5.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(beta51): explicit user reissue and cross-shift pack mapping'
          git push origin HEAD:agent/service-migration-m2
      - name: Report
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/38/comments" -f body="BETA51_SERVICE_RESOURCE_FIX_V5 run=${GITHUB_RUN_ID} status=${{ job.status }}"
