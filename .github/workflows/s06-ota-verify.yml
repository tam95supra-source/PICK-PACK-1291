name: S06 Beta6 OTA Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/s06-ota-verify-trigger.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_API: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      EXPECTED_SHA: ac6c537d3d0e6a85574233ad9031544befd3a282349e47c605e5cd05b0701860
      VERSION: 0.4.2-beta.6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Beta5 to Beta6, download SHA, self-update and Stable isolation
        shell: bash
        run: |
          set -euo pipefail
          post(){ curl -fsSL --retry 3 --retry-delay 2 -H 'content-type: application/json' "$LIVE_API" -d "$1"; }
          post '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.5"}' > /tmp/from5.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/from5.json'))
          assert j.get('ok') is True,j
          assert j.get('source')=='GOOGLE_DRIVE',j
          assert j.get('channel')=='BETA',j
          assert j.get('available') is True,j
          assert j.get('version_name')==os.environ['VERSION'],j
          assert j.get('sha256')==os.environ['EXPECTED_SHA'],j
          assert j.get('apk_url'),j
          open('/tmp/url.txt','w').write(j['apk_url'])
          PY
          URL=$(cat /tmp/url.txt)
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/beta6.apk
          GOT=$(sha256sum /tmp/beta6.apk | awk '{print $1}')
          [[ "$GOT" == "$EXPECTED_SHA" ]]
          post '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.6"}' > /tmp/self.json
          post '{"action":"update_check","channel":"STABLE","current_version":"0.0.0"}' > /tmp/stable.json
          python3 - <<'PY'
          import json,os
          selfj=json.load(open('/tmp/self.json')); stable=json.load(open('/tmp/stable.json'))
          assert selfj.get('ok') is True and selfj.get('channel')=='BETA',selfj
          assert selfj.get('version_name')==os.environ['VERSION'],selfj
          assert selfj.get('available') is False,selfj
          assert stable.get('ok') is True and stable.get('channel')=='STABLE',stable
          assert stable.get('version_name')!=os.environ['VERSION'],stable
          out={'ok':True,'version':os.environ['VERSION'],'sha256':os.environ['EXPECTED_SHA'],'beta5_to_beta6':True,'download_sha_match':True,'self_update':False,'stable_isolated':True,'source':'GOOGLE_DRIVE'}
          open('ops/s06-beta6-ota-verify.json','w').write(json.dumps(out,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/s06-beta6-ota-verify.json
          git commit -m 'chore: record beta6 OTA verification'
          git pull --rebase origin main
          git push origin HEAD:main
